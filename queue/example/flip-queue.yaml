# The queue's config for the flip. repository.uri is not here: the queue
# resource's source.uri gives it, the same repository the old queue uses.
# runner.url and runner.pipeline are filled in from the existing land pipeline
# before this file is baked; until then the runner cannot start a test.
apiVersion: jetbridge.dev/queue/v2

repository:
  main: main
  candidate: queue-next

admission:
  prefix: refs/mq/admit/
  control_prefix: refs/mq/control/
  legacy_refs: refs/queue/

batch:
  max: 1
  retry_none: 2
  strategy: serial
  order: proven-first

compose:
  committer:
    name: JetBridge queue
    email: jbq@invalid
  hook_script: ci/jb-compose-hook.sh

runner:
  kind: jetbridge
  url: FILL-IN-ATC-URL
  team: main
  pipeline: FILL-IN-LAND-PIPELINE
  job: test-candidate
  resource: mq-candidate
  credential: env:MQ_ATC_TOKEN
  wait_cap: 3h

lander:
  max_failures: 3
  lease_ref: refs/mq/lease
  scratch: /tmp/mq

notify: {kind: log, path: "-"}

store:
  ref: refs/mq/state

pause:
  cooldown: 5m
