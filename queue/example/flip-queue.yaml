# The queue's config for the flip, run by the queue resource with the git
# runner, which reads no runner section. The resource's source gives
# repository.uri, the same repository the old queue uses, and batch_max,
# which caps a batch below batch.max until the pipeline raises it.
apiVersion: jetbridge.dev/queue/v2

repository:
  main: main
  candidate: queue-next

admission:
  prefix: refs/mq/admit/
  control_prefix: refs/mq/control/
  legacy_refs: refs/queue/

batch:
  max: 8
  retry_none: 2
  strategy: serial
  order: proven-first

compose:
  committer:
    name: JetBridge queue
    email: jbq@invalid
  hook_script: ci/jb-compose-hook.sh

lander:
  max_failures: 3
  lease_ref: refs/mq/lease

notify: {kind: log, path: "-"}

store:
  ref: refs/mq/state

pause:
  cooldown: 5m
