# The landing queue's land template (ADR-0011). Install with
# fly set-pipeline -p landing-land -c deploy/landing-land-template.yml
# -v landing_image=<image with git> -v github-token=<token with push to the
# trunk>. The landing queue component admits a Run of it per candidate, with
# the compose Run's composition bound as a run input.
#
# land rebuilds every commit from the manifest's per-commit facts by the recipe
# both templates share (the queue never squashes: each commit of an entry lands
# as its own commit), refuses unless the manifest names exactly the entry's
# commits and the rebuild ends at compose's sha, and pushes it to the trunk
# with --force-with-lease on the base compose composed on. Its one result is
# the verdict: landed, moved (the trunk is no longer at the base, or the
# candidate was composed without per-commit facts by an older compose) or
# failed. The task succeeds on landed and moved; the component composes again
# on moved. Core persists no repository credential: the token reaches only
# this step, as a template var.
template: true
params:
  - name: repository
    type: string
    required: true
  - name: trunk
    type: string
    required: true
  - name: entries
    type: string
    required: true
jobs:
  - name: land
    plan:
      - task: land
        timeout: 10m
        task_id: 05cedfec-c786-4a73-aa18-433c8101d8d6
        run_inputs:
          - name: composition
            input: composition
        run_result:
          name: verdict
          output: verdict
        params:
          GITHUB_TOKEN: ((github-token))
        config:
          platform: linux
          rootfs_uri: docker:///((landing_image))
          inputs:
            - name: composition
          outputs:
            - name: verdict
          run:
            path: /bin/sh
            args:
              - -eu
              - -c
              - |
                # land: rebuild compose's commits and fast-forward the trunk to them.
                # $1 repository, $2 trunk; input composition/: manifest/ (compose's facts) and candidate/ (the tested tree)
                repo=$1 trunk=$2
                manifest=$PWD/composition/manifest verdict=$PWD/verdict/verdict.json
                val() { grep "^$1=" "$manifest/manifest.env" 2>/dev/null | head -1 | cut -d= -f2-; }
                esc() { printf '%s' "$1" | tr '\n' ' ' | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }
                say() { printf '{"outcome":"%s","sha":"%s","reason":"%s"}\n' "$1" "$2" "$(esc "$3")" > "$verdict"; echo "land: $1 $2 $3"; }
                base=$(val base) expected=$(val head) entries=$(val entries)
                for key in base head entries; do
                  [ -n "$(val "$key")" ] || { say failed "$expected" "manifest.env has no $key"; exit 1; }
                done
                say failed "$expected" "the rebuild did not finish"
                export GIT_COMMITTER_NAME=landing-queue GIT_COMMITTER_EMAIL=landing-queue@jetbridge
                export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
                if [ -n "${GITHUB_TOKEN:-}" ]; then
                  export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
                fi
                git init -q work && cd work
                git fetch -q --no-tags -- "$repo" "refs/heads/$trunk"
                current=$(git rev-parse FETCH_HEAD)
                if [ "$current" != "$base" ]; then say moved "$expected" "the trunk is at $current, not $base"; exit 0; fi
                git checkout -q -b candidate "$base"
                head=$base seen=$base
                for entry in $(printf '%s' "$entries" | tr ',' ' '); do
                  id=${entry%%=*} sha=${entry#*=}
                  git fetch -q --no-tags -- "$repo" "refs/queue/submit/$id"
                  [ "$(git rev-parse FETCH_HEAD)" = "$sha" ] || { say failed "$expected" "submit ref $id is not at $sha"; exit 1; }
                  facts=$manifest/entries/$id
                  # A candidate composed before compose kept every commit: compose it again.
                  [ -s "$facts/order" ] || { say moved "$expected" "entry $id was composed without per-commit facts; composing again"; exit 0; }
                  want=$(git rev-list --reverse "$sha" --not $seen | tr '\n' ' ')
                  got=$(for n in $(cat "$facts/order"); do cat "$facts/commits/$n/sha"; done | tr '\n' ' ')
                  [ "$got" = "$want" ] || { say failed "$expected" "the manifest's commits for $id are not the entry's commits"; exit 1; }
                  # recipe-begin: one entry's commits onto head in replay order, byte-identical in both templates
                  for n in $(cat "$facts/order"); do
                    commit=$facts/commits/$n original=$(cat "$facts/commits/$n/sha")
                    git cherry-pick --no-commit "$original" || { echo "rebuild: $id commit $original conflicts with the trunk" >&2; exit 1; }
                    tree=$(git write-tree)
                    head=$(GIT_AUTHOR_NAME="$(cat "$commit/author")" GIT_AUTHOR_EMAIL="$(cat "$commit/email")" GIT_AUTHOR_DATE="$(cat "$commit/date")" GIT_COMMITTER_DATE="$(cat "$commit/date")" git commit-tree "$tree" -p "$head" -F "$commit/message")
                    git reset -q --hard "$head"
                  done
                  # recipe-end
                  seen="$seen $sha"
                done
                [ "$head" = "$expected" ] || { say failed "$expected" "rebuilt $head, compose produced $expected"; exit 1; }
                if ! result=$(git push --quiet --porcelain --no-follow-tags "--force-with-lease=refs/heads/$trunk:$base" -- "$repo" "$head:refs/heads/$trunk" 2>&1); then
                  case "$result" in
                    *"stale info"*) say moved "$head" "the trunk moved during the push"; exit 0 ;;
                    *) say failed "$head" "push refused: $result"; exit 1 ;;
                  esac
                fi
                say landed "$head" "fast-forwarded $trunk from $base"
              - land
              - ((repository))
              - ((trunk))
