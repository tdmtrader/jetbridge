# Test-only infrastructure references, not deployment credentials or defaults.
artifactDaemon:
  tls:
    source: existingSecret
    existingSecret: test-daemon-tls
  resolveCapability:
    existingSecret: test-resolve-key
mcp:
  clients:
    - client_id: test-client
      client_name: Test client
      redirect_uris:
        - http://127.0.0.1:8964/callback
secrets:
  signingKeySecret: test-signing-key
# The dev profile: the local image, URL and test login these renders use.
# The K3s suites pass the same values themselves.
image:
  repository: concourse-local
web:
  externalUrl: http://localhost:8080
  localUsers: "test:test"
  mainTeamLocalUser: test
