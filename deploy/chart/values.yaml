## Concourse JetBridge Helm Chart — values.yaml
## All configurable parameters for deploying Concourse with the K8s-native runtime.

# -- Container image configuration
image:
  # -- Docker image repository
  repository: concourse-local
  # -- Image tag (defaults to appVersion from Chart.yaml)
  tag: ""
  # -- Image pull policy. Use "Never" for locally built images on k3s/kind.
  pullPolicy: IfNotPresent
  # -- Image pull secrets for private registries
  pullSecrets: []

# -- Concourse web node configuration
web:
  # -- Number of web node replicas
  replicas: 1

  # -- Concourse external URL (how users reach the UI)
  externalUrl: http://localhost:8080

  # -- Cluster name displayed in the UI
  clusterName: jetbridge

  # -- Log level: debug, info, error
  logLevel: info

  # -- Local user credentials. Comma-separated "user:password" pairs, e.g.
  # "admin:s3cret,ci:token". The chart emits one --add-local-user flag per
  # pair (Concourse's CLI flag does not itself split on commas).
  localUsers: "test:test"

  # -- Main team local user (granted admin on the main team)
  mainTeamLocalUser: test

  # -- Pod-level security context (applied to the pod spec)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security context for the web container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- API connection pool max connections (per replica).
  # For N replicas, ensure PostgreSQL max_connections >= N * (apiMaxConns + backendMaxConns + 7).
  apiMaxConns: 10

  # -- Backend connection pool max connections (per replica).
  # Backend pool is used by scheduler, build tracker, and other internal components.
  backendMaxConns: 50

  # -- Startup probe configuration. Allows extra time for DB migration on first boot.
  startupProbe:
    httpGet:
      path: /api/v1/info
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

  # -- Termination grace period (seconds). Set high enough for in-flight builds to drain.
  terminationGracePeriodSeconds: 120

  # -- Resource requests and limits for the web pod
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # -- TLS configuration for native HTTPS on the web container.
  # When enabled, the web binary serves HTTPS via --tls-bind-port, --tls-cert, --tls-key.
  tls:
    # -- Enable TLS on the web container
    enabled: false
    # -- HTTPS listen port inside the container
    bindPort: 443
    # -- Name of the Kubernetes Secret containing TLS cert and key
    secretName: concourse-web-tls
    # -- Mount path for the TLS secret inside the container
    mountPath: /concourse-tls
    # -- Key in the Secret for the TLS certificate
    certFilename: tls.crt
    # -- Key in the Secret for the TLS private key
    keyFilename: tls.key

  # -- Additional environment variables for the web container.
  # Supports both literal values and valueFrom (secretKeyRef, configMapKeyRef):
  #   - name: CONCOURSE_GITHUB_CLIENT_ID
  #     value: "my-client-id"
  #   - name: CONCOURSE_GITHUB_CLIENT_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: github-oauth
  #         key: client-secret
  env: []

  # -- Additional CLI args for the web command
  extraArgs: []

  # -- Admit public creation of durable pipeline runs. Creation is held by
  # default, and this committed value is the only supported way to enable it.
  # Honest caveat: it is not the only *possible* way. Every flag has a
  # CONCOURSE_-prefixed environment twin, and this chart accepts arbitrary
  # `web.env`, so a cluster can be put into the admitting state without this
  # value ever changing. That is unsupported, not prevented.
  enablePipelineRunCreation: false

  # -- Extra volume mounts for the web container (e.g. custom CA bundles, credential files)
  extraVolumeMounts: []
  # -- Extra volumes for the web pod
  extraVolumes: []

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /api/v1/info
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 5

  # -- Readiness probe configuration.
  # Uses /api/v1/health which checks DB connectivity and worker availability.
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

  # -- Node selector for the web pod
  nodeSelector: {}
  # -- Tolerations for the web pod
  tolerations: []
  # -- Affinity rules for the web pod
  affinity: {}

# -- Kubernetes runtime (JetBridge) configuration
kubernetes:
  # -- Namespace where task/check pods are created.
  # Defaults to the release namespace.
  namespace: ""

  # -- ServiceAccount for task pods (uses web SA if empty)
  serviceAccount: ""

  # -- Pod startup timeout
  podStartupTimeout: 5m

  # -- Image pull secrets for task pods.
  # In JetBridge's K8s-native runtime, these secrets are attached directly to
  # task pods, replacing the need for custom registry-image resources that
  # handled GCR/ECR/ACR authentication in the Garden runtime.
  # Example:
  #   imagePullSecrets:
  #     - name: gcr-json-key       # GCR: kubectl create secret docker-registry gcr-json-key ...
  #     - name: ecr-cred-secret    # ECR: managed by ecr-credential-helper or external-secrets
  imagePullSecrets: []

  # -- Artifact helper image (needs tar; used by init containers and sidecar)
  artifactHelperImage: "alpine:latest"

  # -- Image registry prefix for custom resource type images.
  # Applied as a prefix to resource type image references, e.g. "myregistry.io/"
  # combined with imagePullSecrets enables pulling custom resource type images
  # from private registries without a custom registry-image resource type.
  imageRegistryPrefix: ""
  # -- Image registry pull secret name for resource type image pulls.
  # When set, this secret is added to pods that pull resource type images.
  imageRegistrySecret: ""

  # -- Kubernetes credential manager.
  # Resolves pipeline ((vars)) from Kubernetes Secrets instead of static
  # set-pipeline vars (-v/-l), which are wiped on every `fly set-pipeline`
  # that omits them. Lookup namespace is "<namespacePrefix><team>"
  # (e.g. team "main" -> "concourse-main"); secret name is tried as
  # "<pipeline>.<var>" then "<var>"; the value is read from the secret's
  # "value" data key. Example for ((github-token)) on team main:
  #   kubectl create ns concourse-main
  #   kubectl -n concourse-main create secret generic github-token \
  #     --from-literal=value=<PAT>
  # The web ServiceAccount already has cluster-wide secrets:get via
  # rbac.yaml (requires rbac.create=true), so no extra RBAC is needed.
  credentialManager:
    # -- Enable the in-cluster Kubernetes credential manager
    # (passes --kubernetes-in-cluster to the web command).
    enabled: false
    # -- Namespace prefix for secret lookups. Lookup namespace is
    # "<namespacePrefix><team>". Default "concourse-".
    namespacePrefix: "concourse-"

# -- Explicit task cache backend selector.
# Valid values: hostpath, emptydir.
# The binary rejects anything else at startup (ValidCacheStores in
# atc/worker/jetbridge/config.go), so a value documented here that the code
# does not accept is a CrashLoopBackOff, not a warning.
# When empty (default), auto-detects: hostpath if cacheHostPath is set,
# otherwise emptydir.
cacheStore: ""

# -- Host path for node-local task cache persistence.
# Caches survive pod restarts on the same node.
# Set to "" to disable (falls back to ephemeral emptyDir).
cacheHostPath: ""

# -- PostgreSQL configuration
postgresql:
  # -- Deploy a PostgreSQL pod as part of this chart.
  # Set to false to use an external database.
  enabled: true

  # -- PostgreSQL image (only used when postgresql.enabled=true)
  image: postgres:16

  # -- Database name
  database: concourse
  # -- Database user
  user: concourse
  # -- Database password (plaintext; use existingSecret for production)
  password: concourse

  # -- Use an existing K8s Secret for the database password.
  # The Secret must contain a key matching passwordSecretKey.
  # When set, postgresql.password is ignored.
  existingSecret: ""
  # -- Key within the existing Secret that contains the password
  passwordSecretKey: postgresql-password

  # -- External database host (required when postgresql.enabled=false)
  host: ""
  # -- External database port
  port: 5432
  # -- Path to UNIX domain socket (alternative to host/port)
  socket: ""

  # -- SSL mode: disable, require, verify-ca, verify-full
  sslmode: disable
  # -- CA certificate for SSL connections.
  # Provide as a file path inside the pod (mount via web.extraVolumes).
  caCert: ""
  # -- Client certificate for mTLS connections
  clientCert: ""
  # -- Client key for mTLS connections
  clientKey: ""
  # -- Connection timeout (Go duration, e.g. "5m"). Empty = binary default (5m).
  connectTimeout: ""

  # -- Pod-level security context for the PostgreSQL pod
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security context for the PostgreSQL container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # -- Resource requests and limits (only used when postgresql.enabled=true)
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Persistence for database data (only used when postgresql.enabled=true)
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

# -- Service configuration
service:
  # -- Service type: ClusterIP, LoadBalancer, NodePort
  type: LoadBalancer
  # -- HTTP port
  httpPort: 8080
  # -- TSA port (for fly CLI worker registration — unused in JetBridge but kept for compatibility)
  tsaPort: 2222
  # -- Annotations to add to the service (e.g. cloud provider LB annotations)
  annotations: {}
  # -- Extra labels to add to the service
  labels: {}
  # -- Static IP for LoadBalancer-type services
  loadBalancerIP: ""
  # -- Restrict LoadBalancer traffic to these CIDRs
  loadBalancerSourceRanges: []

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hostname
  host: ""
  # -- TLS configuration
  tls: []

# -- RBAC configuration
rbac:
  # -- Create RBAC resources (Role, RoleBinding) for the web pod
  create: true

# -- ServiceAccount configuration
serviceAccount:
  # -- Create a ServiceAccount for the web pod
  create: true
  # -- Annotations to add to the ServiceAccount
  annotations: {}

# -- OpenTelemetry tracing configuration.
# When enabled, the web node emits traces and metrics via OTLP.
# Example for Grafana Tempo: otlpAddress: "tempo.monitoring.svc:4317"
tracing:
  # -- OTLP gRPC endpoint for traces (e.g., "tempo.monitoring.svc:4317")
  otlpAddress: ""
  # -- Additional OTLP headers (map of key:value)
  otlpHeaders: {}
  # -- Use TLS for the OTLP connection
  otlpUseTLS: false
  # -- Service name reported in traces (default: concourse-web)
  serviceName: ""

# -- OpenTelemetry metrics configuration.
# When enabled, the web node exports metrics via OTLP gRPC.
otelMetrics:
  # -- OTLP gRPC endpoint for metrics (e.g., "tempo.monitoring.svc:4317")
  otlpAddress: ""
  # -- Additional OTLP headers for metrics
  otlpHeaders: {}
  # -- Use TLS for the metrics OTLP connection
  otlpUseTLS: false

# -- Secrets configuration
secrets:
  # -- Auto-generate signing keys on install.
  # Set to false and provide signingKeySecret for multi-replica deployments.
  # Each replica MUST share the same signing keys — otherwise sessions will
  # fail when requests hit a different replica.
  create: true

  # -- Name of a pre-existing Secret containing signing keys.
  # Required when secrets.create is false. The Secret must contain:
  #   session_signing_key
  signingKeySecret: ""

# -- Pod Security Admission (PSA) recommendations.
# Concourse task pods may run as root (resource type images require it),
# so the namespace cannot use the "restricted" PSA level. Recommended labels:
#
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=baseline \
#     pod-security.kubernetes.io/warn=restricted \
#     pod-security.kubernetes.io/audit=restricted
#
# "baseline" enforcement blocks known-dangerous pod configurations while
# allowing root containers. "restricted" in warn/audit mode surfaces
# pods that don't meet the strictest standard without blocking them.

# -- Network policy configuration
networkPolicy:
  # -- Enable NetworkPolicy resources for the web pod and the bundled database.
  #
  # This switch no longer emits its OWN copy of the artifact daemon's policy. It
  # used to, and that copy carried the same name as the daemon's own template's,
  # so with both switches on one namespace held one object and apply order
  # decided which rules were in the cluster. There is now one template, with one
  # selector that covers one-off builds and checks as well as pipeline jobs --
  # and it renders under EITHER switch, so an install that has this one set
  # keeps its daemon policy across the upgrade. A pod selected by no
  # NetworkPolicy is not default-deny; it is unrestricted.
  enabled: false

  # -- Allow ingress from these pod selectors to the web pod.
  # Default allows all ingress when empty (only port restriction applies).
  ingressFrom: []
  # Example: restrict to ingress controller only:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: ingress-nginx

  # -- Additional egress destinations for task pods (applied only when non-empty).
  # When set, task pods are restricted to: DNS, artifact daemon, GKE metadata
  # server (169.254.169.254 — required for Workload Identity), plus these entries.
  # When empty (default), task pods have unrestricted egress.
  # IMPORTANT: On GKE with Workload Identity, the metadata server allowlist is
  # included automatically. Do NOT remove 169.254.169.254 from the template.
  taskEgressTo: []
  # Example: allow only internal network + Docker Hub:
  #   - ipBlock:
  #       cidr: 10.0.0.0/8
  #   - ipBlock:
  #       cidr: 104.16.0.0/12  # Docker Hub / Cloudflare

# -- Pod Disruption Budget configuration
pdb:
  # -- Enable PDB (only useful when web.replicas > 1)
  enabled: false
  # -- Minimum number of web pods that must be available during disruption
  minAvailable: 1

# -- Prometheus metrics endpoint on the web node.
#
# The ATC only registers its Prometheus emitter when BOTH a bind IP and a bind
# port are set, and it serves the metrics on that dedicated listener -- never on
# the 8080 web port. Leave this disabled and /metrics on 8080 returns the Elm
# SPA HTML, which is what a ServiceMonitor pointed there scrapes: the target
# fails with `unsupported Content-Type "text/html"` and every alerting rule in
# this chart silently has no data to evaluate.
metrics:
  # -- Expose Prometheus metrics on a dedicated port
  enabled: true
  # -- Port for the metrics listener
  port: 9391

# -- Prometheus ServiceMonitor configuration (requires prometheus-operator CRDs)
serviceMonitor:
  # -- Enable ServiceMonitor creation. Requires metrics.enabled; the render
  # fails otherwise rather than producing a target that scrapes HTML.
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for ServiceMonitor (e.g. for Prometheus discovery)
  labels: {}
  # -- Namespace for the ServiceMonitor (defaults to release namespace)
  namespace: ""

# -- Prometheus alerting rules (requires prometheus-operator CRDs)
alertingRules:
  # -- Enable PrometheusRule creation
  enabled: false
  # -- Additional labels for PrometheusRule
  labels: {}

# -- DaemonSet artifact cache configuration.
# When enabled, deploys a DaemonSet on each node with a local HTTP file server
# for artifact storage. Provides sub-second local reads and fast cross-node
# transfers, replacing the PVC-based artifact store for improved performance.
#
# REQUIRED when the Kubernetes runtime is enabled (worker.kubernetes.enabled
# or any mode that sets --kubernetes-namespace). The web deployment refuses to
# start with an unset artifact-daemon host path because every step-produced
# artifact must be read via HTTP from the DaemonSet rather than exec-ing into
# a reaped producer pod. See track
# route_artifact_reads_through_daemonset_remove_exec_backed_artifact_io_20260418.
artifactDaemon:
  # -- Enable the DaemonSet artifact cache.
  # MUST be true for K8s-runtime deployments; web startup fails otherwise.
  enabled: true
  # -- HTTP server port (must match --kubernetes-artifact-daemon-port on the web node)
  port: 7780
  # -- Host path for artifact storage on each node
  hostPath: /var/concourse/artifacts
  # -- TTL for automatic artifact cleanup (Go duration)
  ttl: "2h"

  # -- Strict, exact immutable tree storage for task inputs. Hangar is
  # fail-closed and therefore remains opt-in. It reuses the durable GCS
  # bucket, prefix, endpoint, timeout, and Workload Identity configuration.
  hangar:
    # -- Enable the GCS-only Hangar foundation. Requires daemon TLS and a
    # configured artifactDaemon.durable GCS bucket.
    enabled: false
    # -- Enable web emission/signing of strict inputs after every eligible
    # daemon node has advertised Hangar readiness. Requires enabled: true.
    webEnabled: false
    # -- Permit the chart to generate hangar.key in its managed TLS Secret.
    # Use only with live Helm install/upgrade, where lookup can preserve the
    # Secret. Offline/GitOps rendering must leave this false and provide
    # tls.existingSecret with all TLS keys plus an exact raw-32-byte hangar.key.
    allowGeneratedKey: false
    # -- Private transient canonicalization scratch. This must be an absolute
    # path disjoint from artifactDaemon.hostPath; the chart mounts a dedicated
    # emptyDir here only in the artifact-daemon Pod.
    scratchPath: /var/concourse/hangar-scratch
    # -- Size limit for the scratch emptyDir above. Kubernetes quantity syntax,
    # e.g. "32Gi"; empty leaves it unbounded.
    #
    # Unbounded means bounded by the NODE'S DISK: canonicalization spools a
    # whole tree here, and an emptyDir that fills the disk evicts every Pod on
    # the node rather than only this one. It defaults to empty because setting
    # a limit on an existing install is a behaviour change for trees that were
    # already fitting; the output daemon's equivalent value is REQUIRED, which
    # is the shape a new volume can afford.
    scratchSizeLimit: ""
    # -- Maximum regular-file content admitted in one immutable tree.
    maxContentBytes: 10737418240
    # -- Maximum filesystem entries admitted in one immutable tree.
    maxEntries: 100000
    # -- Lifetime of attenuated per-input materialization grants, expressed as
    # positive whole seconds. Maximum 900s (Hangar's core 15-minute bound).
    capabilityTTL: "900s"

  # -- Long-term store for resource caches.
  # The node-local copy above is a cache with a TTL; this is the copy that
  # outlives the sweeper, the node, and the cluster. Only resource caches go
  # here -- a step output is addressed by a per-build handle nobody will ask
  # for again, so storing one durably costs a bucket and buys nothing.
  #
  # Entirely optional. With store: "" the daemon behaves exactly as it did
  # before: a cache that is not on this node or a peer is simply a miss.
  #
  # Every failure degrades rather than propagating -- an unreachable bucket
  # costs a re-download, never a red build.
  durable:
    # -- Retention, as class: duration. JetBridge deletes expired objects
    # itself, on a periodic walk of the store, so this is the only place a
    # retention period is written.
    #
    # A class with no entry here is KEPT FOREVER. Silence has to mean keep,
    # because the alternative is that a typo in a class name empties a bucket.
    # Leaving this empty means nothing is ever reclaimed, which is a valid
    # choice but usually not the one you want -- you will discover it as a bill.
    #
    #   retention:
    #     resource-caches: 720h    # 30 days
    #
    # Objects are named "<class>/<identity>". "resource-caches" is the only
    # class today; a future kind of durable artifact gets its own.
    #
    # Age is measured from the object's last WRITE, not its last read: object
    # stores do not track reads, so there is no LRU here. Producing a cache
    # again rewrites it and resets its age, so this effectively expires caches
    # that have stopped being produced. An expired cache is re-derived by the
    # next get step; nothing fails.
    #
    # A bucket lifecycle rule still works as a backstop for when JetBridge is
    # not running. The two do not conflict -- both only ever delete what is
    # already past its age -- but remember a bucket rule must match the full
    # object name including `prefix` below.
    retention: {}
    # -- How often each daemon walks the store to reclaim and measure. Every
    # daemon runs its own enumeration and a List is billed per page, so this is
    # deliberately slow. Empty uses the binary's default (15m).
    maintenanceInterval: ""
    # -- Backend: "" (disabled), "gcs", "s3", or "filesystem".
    #
    # "gcs" is native Cloud Storage and authenticates with Application Default
    # Credentials -- on GKE that is Workload Identity, so no key exists to leak.
    # Cloud Storage also speaks S3, but only with an HMAC key, which is a
    # long-lived secret somebody has to mount and rotate. Prefer "gcs" on GCP.
    #
    # "s3" is S3-compatible, so it covers AWS, MinIO, Ceph, R2 and Backblaze.
    store: ""
    # -- Bucket name, for store: gcs or s3
    bucket: ""
    # -- Key prefix inside the bucket, so one bucket can serve several clusters
    # or several consumers. Reclaim only ever enumerates its own prefix.
    #
    # Setting this changes the object names, to "<prefix>/<class>/<identity>".
    # JetBridge's own reclaim handles that automatically; a backstop bucket
    # lifecycle rule would have to include the prefix to match anything.
    prefix: ""
    # -- Endpoint override. Set this for MinIO; leave empty for AWS or GCP.
    endpoint: ""
    # -- Region, for store: s3. Required by the SDK signer even when the
    # endpoint ignores it.
    region: "us-east-1"
    # -- Root directory, for store: filesystem. Must be a shared mount (NFS,
    # RWX PVC) to be durable across nodes -- a hostPath here is just a second
    # local copy.
    path: ""
    # -- Per-operation timeout (Go duration)
    timeout: "5m"
    # -- Largest single artifact to store durably. 0 disables the limit.
    maxBytes: 5368709120
    # -- Existing Secret supplying credentials as environment variables
    # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for s3). Leave empty on a
    # managed cluster and use IRSA or Workload Identity instead: nothing then
    # holds a long-lived key. Not needed at all for store: gcs on GKE.
    existingSecret: ""
  # -- Override the headless service name. When set, used verbatim.
  # Default (when empty): <release-fullname>-artifact-daemon
  serviceName: ""
  # -- Resource requests and limits for the DaemonSet pods
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # -- Node selector to restrict DaemonSet to specific node pools.
  # Example for GKE: {cloud.google.com/gke-nodepool: "ci-workers"}
  nodeSelector: {}
  # -- Affinity rules for DaemonSet scheduling
  affinity: {}
  # -- Tolerations for scheduling on tainted nodes (spot, GPU, etc.)
  tolerations: []
  # -- Spot preemption watcher (GCP only). When enabled, the daemon long-
  # polls metadata.google.internal/computeMetadata/v1/instance/preempted
  # and synchronously evacuates any unmirrored step outputs to live peers
  # within the budget when preemption is signaled.
  #
  # Closes the async-mirror window: graceful preempts get a flush instead
  # of forcing a rerun. Crashes (no warning) still fall back to rerun.
  preemption:
    # -- Enable the GCP preemption watcher. Set true on GCP spot fleets;
    # leave false elsewhere (the metadata endpoint will be unreachable
    # outside GCP and the watcher will log retries indefinitely).
    enabled: false
    # -- Total time budget for synchronous evacuation. GCP gives ~30s
    # preemption warning; default 25s leaves slack for daemon shutdown.
    budget: "25s"
  # -- Outbound mirror configuration. Each step output (and resource cache
  # alias) is asynchronously mirrored to peer daemons after it lands so the
  # artifact survives loss of the producing node (spot preemption, crash).
  mirror:
    # -- Replication factor.
    #   0     — mirroring disabled (default behavior is single-node)
    #   N     — mirror to up to (N-1) peers; if fewer peers exist than
    #           requested, mirrors to all available peers (no error)
    #   "all" — mirror to every live peer (translates to -1 on the daemon)
    # Default 2 = local + 1 peer copy. Suitable for 1-4 node fleets.
    replicas: 2
    # -- Max concurrent in-flight mirror jobs per daemon.
    concurrency: 4
    # -- Per-peer per-job mirror PUT timeout.
    timeout: "5m"
  # -- TLS/mTLS configuration for encrypted and authenticated daemon communication
  tls:
    # -- Enable TLS (HTTPS + mTLS) for the artifact daemon.
    # When enabled, cross-node traffic (ATC→daemon, daemon→daemon) requires
    # mutual TLS with client certificates. Init containers verify the daemon's
    # server cert via the mounted CA. Health probes use HTTPS without client cert.
    enabled: false
    # -- Name of an existing Secret containing TLS certs. Keys expected:
    # ca.crt, tls.crt, tls.key, client.crt, client.key; Hangar additionally
    # selects hangar.key, whose decoded value must be exactly 32 raw bytes.
    # When empty and tls.enabled=true, certs are auto-generated. That path is
    # nondeterministic under offline/GitOps rendering because Helm lookup has
    # no live Secret; use existingSecret for GitOps.
    existingSecret: ""
  # -- NetworkPolicy configuration for the artifact daemon
  resolveCapability:
    # -- Name of a Secret holding `resolve.key`, exactly 32 random bytes shared
    # by web and daemon. THIS VALUE IS THE SWITCH: set, both sides enforce
    # signed resolve capabilities; empty, neither does.
    #
    # Create it once, yourself:
    #
    #   head -c 32 /dev/urandom > resolve.key
    #   kubectl create secret generic concourse-resolve-capability \
    #     --from-file=resolve.key -n <namespace>
    #   rm resolve.key
    #
    # The chart deliberately does NOT generate this key, for the same reason it
    # does not generate the session signing key. Generating it needs Helm
    # `lookup` to carry the old value forward, `lookup` returns empty under
    # `helm template`, and `helm template` is how Argo CD renders — so a
    # generated key is fresh on EVERY reconcile. Argo sees a Secret diff every
    # time and rewrites it; both processes read the key once at startup, so
    # nothing breaks until the first asymmetric restart, after which each side
    # rejects the other's capabilities and every build's input fetch 403s until
    # web and every daemon pod have rolled. Argo CD has no chart-side
    # "create once, never update" for a rendered resource, so the key stays out
    # of the render entirely. (artifactDaemon.tls.existingSecret still carries
    # that hazard; set it too under Argo CD.)
    #
    # Both sides are gated on this ONE value so they cannot disagree: a daemon
    # given a key fails closed, so arming it while the web does not sign would
    # 403 every resolve on the node with no diagnostic.
    #
    # UPGRADE NOTE: on the first rollout after enabling this, an old web that
    # does not sign can meet a new daemon that requires — those resolves 403
    # and their builds fail until web has rolled. Brief, and self-healing.
    existingSecret: ""
    # -- Capability lifetime. Must exceed pod scheduling + startup + the init
    # container's retry budget, or a slow-to-schedule pod gets a 403 on a
    # perfectly legitimate request.
    ttl: 2h

  networkPolicy:
    # -- Enable NetworkPolicy restricting daemon ingress to Concourse pods and
    # egress to required services. Current GKE standard/Calico and Dataplane V2
    # metadata profiles are included; validate CNI-specific routing before use.
    enabled: false

# ---------------------------------------------------------------------------
# Hangar output plane
# ---------------------------------------------------------------------------
#
# Durable output capture and the exact-execution-control protocol it extends.
# Two facets, two switches, and OFF is the default for both: with the plane
# disabled this chart renders exactly what it rendered before, which is what
# requirement 59 asks for.
#
# WHAT THE CHART DOES NOT DO. It never creates a bucket, a bucket lifecycle
# rule, a cloud service account, a Workload Identity binding or an IAM policy.
# Those are an operator or Terraform concern, and activation is what proves they
# exist and are what they claim -- the chart renders identities and refuses
# configurations, it enforces nothing in the cloud.
#
# THE HONEST PERMISSION MATRIX. Four workloads, four Kubernetes service
# accounts, four cloud principals, because a Kubernetes service account is
# Pod-wide: a process that holds a role has that role for everything else it
# does. The minimum roles are
#
#   output daemon (publisher/materializer)
#     storage.objects.create, storage.objects.get
#   inventory
#     storage.objects.list, storage.objects.get
#   reclaimer
#     storage.objects.get, storage.objects.delete
#   policy attestor
#     storage.buckets.get, storage.buckets.getIamPolicy
#
# and two of those grants are weaker than they read, so they are written down
# here rather than discovered:
#
#   * storage.objects.get is BODY-CAPABLE. GCS has no metadata-only object
#     permission: a principal that can stat an object can download it. The
#     inventory and reclaim code paths perform metadata-only requests, but IAM
#     is not what makes that true -- code is, and the dedicated bucket is the
#     boundary.
#   * storage.objects.list is BUCKET-WIDE. There is no caller-visible prefix
#     boundary in list authority, so "inventory only lists its own prefix" is an
#     application-level property and not an IAM one. That is why inventory is
#     the only workload granted list at all, and why the output bucket contains
#     nothing but output-plane objects.
#
# PERMISSIONS NO RUNTIME PRINCIPAL HOLDS. An absent grant is a promise, and a
# promise nobody wrote down is one the next role addition breaks by accident.
# These are the ones whose absence the design leans on:
#
#   storage.objects.update
#     The permission that REWRITES an object's metadata, and therefore its
#     ownership marker. Requirement 22's "the publisher cannot update the
#     marker" is what the whole immutable-marker argument rests on: a marker
#     that can be rewritten is not evidence of who created an object. It is
#     forbidden to all four principals -- including the publisher, which is the
#     one that would want it -- and note that roles/storage.objectAdmin and
#     roles/storage.objectUser GRANT it, so "the reclaimer just has objectAdmin"
#     is not a compatible binding.
#   storage.objects.delete
#     Held by the reclaimer alone. It is the only destructive permission in the
#     plane and the entire reason the reclaimer is a separate Pod under a
#     separate identity.
#   storage.buckets.update, storage.buckets.setIamPolicy
#     Lifecycle rules and IAM policy. The attestor READS the policy and can
#     change nothing; a monitor that can rewrite what it monitors is not one.
#
# Policy administration stays an operator trust root, and requirement 53's
# residual boundary is exactly that: Hangar cannot attest every
# organization-level credential, and a cloud administrator can delete objects it
# manages. What it can do is notice, within the 15-minute attestation bound, and
# say so.
hangarOutput:
  # -- The BASE facet: exact execution control.
  #
  # A node whose daemon, runtime and control key are a homogeneous attested
  # cohort advertises concourse.dev/hangar-execution-control-v1. This is a real
  # deployment on its own -- durable output capture is an extension of it, never
  # a synonym for it.
  # A node whose daemon, runtime and control key are a homogeneous attested
  # cohort advertises `concourse.dev/hangar-execution-control-v1`. Once the
  # output facet passes as well, the same daemon adds
  # `concourse.dev/hangar-output-v1`. A capture-selected pod's affinity requires
  # BOTH, and neither alone admits it. Neither is authority -- the authenticated
  # daemon handshake and the activation epoch row are -- so a label buys only
  # that the pod does not land somewhere its hold could never be acknowledged.
  #
  # `concourse.dev/hangar-v1` is a THIRD label and is not this plane's: it
  # attests strict INPUTS and belongs to the existing artifact daemon.
  executionControl:
    enabled: false
    # -- Existing Secret holding control.key: a PKCS#8 PEM Ed25519 private key
    # the node signs execution and source ledger statements with. Required.
    # It is NOT the receipt key and NOT the read-grant key; an activation epoch
    # pins the three separately so rotating one does not rotate the others.
    keySecret: ""
    # -- Key id of the control key above, and the id every node in the cohort
    # reports over the attestation handshake. Required whenever enabled.
    #
    # It names KEY MATERIAL and not the Secret. This used to render the Secret
    # NAME, so two nodes holding different private keys under one Secret name
    # reported one id and a cohort half-way through a control-key rollout
    # attested as homogeneous on the base facet's only key material. Move this
    # value when you move the key, exactly as receipt.keyID is moved.
    keyID: ""

  # -- Existing Secret holding capability.key: the raw 32 bytes control
  # capabilities are minted and verified with, shared between the control plane
  # and this daemon and with nothing else.
  capabilityKeySecret: ""

  # -- The OUTPUT facet: durable capture, claims and reclamation.
  # Requires executionControl.enabled. Never the other way round.
  enabled: false
  # -- Enable web-side capture selection and checkpoint emission. Requires
  # enabled, and an activation epoch whose output facet is enabled.
  webEnabled: false

  # -- The dedicated output bucket. Externally provisioned, contains only
  # Hangar output-plane objects, and is never the durable cache bucket or the
  # caller-published strict-input bucket. Required when enabled.
  bucket: ""
  # -- Authenticated deployment key prefix inside that bucket. Server
  # configuration; no task, consumer, path parameter or receipt can select or
  # broaden it.
  prefix: ""
  # -- Authenticated deployment/tenant identity the opaque scope is derived
  # from. It is never rendered into an object key. Required when enabled.
  tenant: ""
  # -- The activation epoch every workload speaks for. Rotation creates a NEW
  # epoch rather than replacing a key in place. Required when enabled.
  activationEpoch: 0

  # -- The two buckets this plane may not be, named so the daemon can refuse to
  # be pointed at them. Empty means this deployment has no such bucket.
  cacheBucket: ""
  strictInputBucket: ""
  # -- Declare that trust domains are separated by key prefix inside one shared
  # bucket. It is REFUSED: object-level permission is not expressible in a
  # bucket policy, so prefix-only IAM is not an activation-compatible
  # substitute for a dedicated bucket.
  sharedBucketPrefixOnlyIsolation: false

  # -- Endpoint override for the OUTPUT bucket's store. Empty means real GCS;
  # set it for an emulator. This is NOT artifactDaemon.durable.endpoint, which
  # serves the durable CACHE bucket under a different identity: requirement 20
  # forbids the output plane sharing that bucket or its client, so the two
  # values are independent and a render test asserts that setting one never
  # populates the other.
  endpoint: ""

  # -- Deadlines, grace and leases. The chart enforces the relationships
  # between them, because a grace that does not exceed the maximum capture
  # deadline can collect an object a capture is still allowed to register.
  captureDeadline: "24h"     # 1h .. 168h
  sealDeadline: "5m"         # 30s .. 30m
  publicationGrace: "192h"   # >= captureDeadline + 1h, <= 720h
  leaseTerm: "15m"           # at least 15m
  leaseRenewInterval: "1m"   # at most 1m
  operationTimeout: "1m"

  receipt:
    # -- Key id of the ACTIVE Ed25519 receipt signing key. A receipt names it so
    # a verifier knows which activation-pinned public key can check it.
    keyID: ""
    # -- Existing Secret holding receipt.key: the PKCS#8 PEM Ed25519 PRIVATE
    # half. It is mounted in the output daemon Pod and nowhere else -- not web,
    # not the controllers, not the activation Jobs, not tasks.
    privateKeySecret: ""
    # -- The versioned PUBLIC verification ring the control plane holds. Each
    # entry is {id, epoch, key (base64), retired}. Rotation ADDS an entry under
    # a new epoch; a retired entry stays while any durable state still
    # references its epoch.
    publicKeys: []
    # -- Epochs that durable state still references, declared by the operator
    # (activation reports them). The chart refuses to render a ring that has
    # dropped the verification key for one of them.
    referencedEpochs: []

  # -- Existing Secret holding materialize.key: the exact raw 32 bytes output
  # READ GRANTS are signed with, under the hangar-output-materialize-v1 domain.
  # A third key: a read grant must not be signable by anything that can mint a
  # publication receipt, and it is never the foundation's strict-input
  # materialization key either.
  materializationKeySecret: ""
  # -- Key id for the above.
  materializationKeyID: "output-materialize-1"

  daemon:
    # -- Control API port.
    port: 7781
    # -- The control API's TLS, which is the OUTPUT plane's own trust domain.
    #
    # This daemon is TLS-only. Its listener is wrapped unconditionally and its
    # control routes refuse any operation whose request carries no VERIFIED
    # peer certificate, so there is no plaintext mode to fall back to and no
    # switch to turn it off. `artifactDaemon.tls.enabled` is a DIFFERENT
    # daemon's switch, on a different bucket under a different identity, and it
    # has nothing to say about this plane.
    #
    # WHAT AN OPERATOR MUST PROVISION, and the chart cannot check any of it:
    #
    #   * one certificate authority for the output plane. `existingSecret`'s
    #     ca.crt must verify `clientSecret`'s certificate and vice versa. Two
    #     independently-issued Secrets complete a handshake and are then
    #     refused by every control route, which looks like an authorization bug
    #     and is a trust-domain one;
    #   * the SERVER certificate in `existingSecret` must carry `serverName`
    #     below as a DNS SAN. The ATC dials this daemon at <node IP> -- there is
    #     no Service -- and a node IP cannot be a SAN in a certificate issued
    #     before the node existed, so the ATC verifies against that name
    #     instead;
    #   * the CLIENT certificate in `clientSecret` is what the ATC and the
    #     `attest` activation Job present. It is a separate Secret because
    #     `existingSecret` holds tls.key, the key this daemon SERVES with:
    #     whatever holds it can impersonate the daemon to the ATC.
    tls:
      # -- Existing Secret with tls.crt/tls.key/ca.crt: the certificate this
      # daemon SERVES with. Mounted in the output daemon Pod and nowhere else.
      # Required whenever executionControl.enabled is true.
      existingSecret: ""
      # -- Existing Secret with tls.crt/tls.key/ca.crt: the CLIENT certificate
      # the ATC and the attest Job present to this daemon. Issued by the same
      # CA as existingSecret, and never the same Secret. Required whenever
      # executionControl.enabled is true.
      clientSecret: ""
      # -- DNS name the server certificate above carries, and the name the ATC
      # verifies it against. Empty derives
      # <fullname>-hangar-output-daemon.<namespace>.svc; it need not resolve,
      # it only has to be in the certificate.
      serverName: ""
    # -- Private control directory, inside the managed artifact hostPath. It
    # holds the execution and source ledgers and is excluded from every sweep.
    controlPath: /var/concourse/artifacts/hangar-output-control
    # -- Managed steps directory holding source incarnations.
    stepsPath: /var/concourse/artifacts/hangar-output-steps
    scratch:
      # -- Absolute canonicalization scratch directory, disjoint from the
      # storage root.
      path: /var/concourse/hangar-output-scratch
      # -- REQUIRED whenever hangarOutput.executionControl.enabled is true --
      # that is, in base-control-only mode as well as with the output facet on.
      # The DaemonSet, this emptyDir and --scratch-dir all render under the BASE
      # switch, and an emptyDir with no sizeLimit is bounded only by the node's
      # disk: filling it evicts every Pod on the node, not only this one.
      # Use Kubernetes quantity syntax, e.g. "32Gi".
      sizeLimit: ""
      # -- Largest regular-file content admitted in one captured tree.
      maxContentBytes: 10737418240
      # -- Largest number of filesystem entries admitted in one captured tree.
      maxEntries: 100000
      # -- How many trees may be spooled to scratch at once. concurrency times
      # maxContentBytes must fit inside sizeLimit; the chart refuses a product
      # that does not.
      concurrency: 1
    serviceAccount:
      # -- Override the rendered name. Leave empty for
      # <fullname>-hangar-output-daemon.
      name: ""
      # -- Workload Identity annotation. REQUIRED for all four output roles
      # when the output facet is on:
      #
      #   annotations:
      #     iam.gke.io/gcp-service-account: publisher@project.iam.gserviceaccount.com
      #
      # The policy attestor compares the output bucket's IAM policy against
      # these four CLOUD members -- they are what --publisher-identity and its
      # three siblings carry. The chart cannot verify the binding; activation
      # does, and it can only do so if it is told what the binding is. An
      # undeclared one is refused rather than rendered, because an empty member
      # matches no binding and is indistinguishable from a principal that
      # genuinely holds nothing.
      annotations: {}
    resources: {}
    nodeSelector: {}
    tolerations: []

  inventory:
    # -- Disabling a controller while the output facet is on is refused: an
    # activation epoch attests recovery, inventory and reclaim workers, and a
    # plane with no reclaimer keeps every published object forever while
    # claiming it does not.
    enabled: true
    # -- Exactly one. There is one durable cursor and one renewable lease owner
    # per bucket and epoch; a second replica is a second cursor owner.
    replicas: 1
    interval: "1m"
    serviceAccount:
      name: ""
      annotations: {}
    resources: {}

  reclaimer:
    enabled: true
    replicas: 1
    interval: "1m"
    # -- How long one conditional delete may take. The lease term is derived
    # from it, and work begins only with the timeout plus two minutes of lease
    # remaining.
    deleteTimeout: "2m"
    # -- How many jobs one pass may admit or advance.
    batch: 10
    serviceAccount:
      name: ""
      annotations: {}
    resources: {}

  policyAttestor:
    enabled: true
    replicas: 1
    # -- Refresh interval for the whole-bucket lifecycle-policy read. Evidence
    # older than 15 minutes is stale and the plane goes at-risk, so this is a
    # third of that by default and the chart refuses anything above 15m: a
    # longer interval does not make detection slower, it makes the plane
    # at-risk between every pass.
    interval: "5m"
    serviceAccount:
      name: ""
      annotations: {}
    resources: {}

  # -- The activation/downgrade Jobs' own identity (decision F4). They do NOT
  # inherit the web pod's database credential: the architecture guard saying
  # only the activation command writes hangar_output_activation_epochs is
  # enforceable only while that command has a PostgreSQL role of its own.
  database:
    # -- Existing Secret with the activation role's connection string under the
    # key `dsn`. Required when the output facet is on.
    existingSecret: ""
  activation:
    serviceAccount:
      name: ""
      annotations: {}
    # -- Render one activation Job. Empty renders none. One of
    # begin|attest|enable|drain, with facet base|output. No single Helm boolean
    # and no single Job invocation enables a capability: the CAS row's
    # transition constraints are what do, and `enable` refuses without a fresh
    # attestation.
    job:
      mode: ""
      facet: ""
      # -- For mode: drain. Without it a drain stops new admission and reports
      # what is still live; with it the facet may reach the terminal disabled
      # state, and only if the live tables say it holds nothing.
      finalize: false
      # -- How long a completed activation Job is kept before Kubernetes
      # deletes it. The Job's name carries the mode AND the epoch, so a
      # rotation renders a NEW Job rather than colliding with the previous
      # epoch's immutable pod template -- which means they accumulate, one per
      # mode per epoch, without this. A day is long enough to read the logs.
      # Empty or 0 keeps them forever.
      ttlSecondsAfterFinished: 86400

  networkPolicy:
    # -- Enable NetworkPolicies for the four output workloads.
    enabled: false
