## Concourse JetBridge Helm Chart — values.yaml
## All configurable parameters for deploying Concourse with the K8s-native runtime.

# -- Container image configuration
image:
  # -- Required. Image repository, e.g. registry.example/concourse-jetbridge,
  # or concourse-local for an image built and loaded into a local cluster.
  repository: ""
  # -- Image tag (defaults to appVersion from Chart.yaml)
  tag: ""
  # -- Image pull policy. Use "Never" for locally built images on k3s/kind.
  pullPolicy: IfNotPresent
  # -- Image pull secrets for private registries
  pullSecrets: []

# -- Concourse web node configuration
web:
  # -- Number of web node replicas
  replicas: 1

  # -- Optional Deployment strategy. Use {type: Recreate} when first enabling
  # database encryption so a keyless web pod cannot overlap the encrypted one.
  strategy: {}

  # -- Required. The URL users reach the UI and API at, e.g.
  # https://ci.example.com (http://localhost:8080 behind a port-forward).
  externalUrl: ""

  # -- Cluster name displayed in the UI
  clusterName: jetbridge

  # -- Log level: debug, info, error
  logLevel: info

  # -- Required. Local user credentials. Comma-separated "user:password"
  # pairs, e.g. "admin:s3cret,ci:token". The chart emits one --add-local-user
  # flag per pair (Concourse's CLI flag does not itself split on commas).
  localUsers: ""

  # -- Required. Main team local user(s), granted admin on the main team,
  # e.g. admin. A comma-separated list renders one --main-team-local-user each.
  mainTeamLocalUser: ""

  # -- Pod-level security context (applied to the pod spec)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security context for the web container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # -- API connection pool max connections (per replica).
  # For N replicas, ensure PostgreSQL max_connections >= N * (apiMaxConns + backendMaxConns + 7).
  apiMaxConns: 10

  # -- Backend connection pool max connections (per replica).
  # Backend pool is used by scheduler, build tracker, and other internal components.
  backendMaxConns: 50

  # -- Startup probe configuration. Allows extra time for DB migration on first boot.
  startupProbe:
    httpGet:
      path: /api/v1/info
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

  # -- Termination grace period (seconds). Set high enough for in-flight builds to drain.
  terminationGracePeriodSeconds: 120

  # -- Resource requests and limits for the web pod
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi

  # -- TLS configuration for native HTTPS on the web container.
  # When enabled, the web binary serves HTTPS via --tls-bind-port, --tls-cert, --tls-key.
  tls:
    # -- Enable TLS on the web container
    enabled: false
    # -- HTTPS listen port inside the container
    bindPort: 443
    # -- Name of the Kubernetes Secret containing TLS cert and key
    secretName: concourse-web-tls
    # -- Mount path for the TLS secret inside the container
    mountPath: /concourse-tls
    # -- Key in the Secret for the TLS certificate
    certFilename: tls.crt
    # -- Key in the Secret for the TLS private key
    keyFilename: tls.key

  # -- Additional environment variables for the web container.
  # Supports both literal values and valueFrom (secretKeyRef, configMapKeyRef):
  #   - name: CONCOURSE_GITHUB_CLIENT_ID
  #     value: "my-client-id"
  #   - name: CONCOURSE_GITHUB_CLIENT_SECRET
  #     valueFrom:
  #       secretKeyRef:
  #         name: github-oauth
  #         key: client-secret
  env: []


  # -- The Run contract activation epoch every web node admits durable pipeline
  # runs under -- the v2 create route, the web UI and fly run-pipeline, and the
  # run_pipeline step. At startup each web node writes it into the durable Run
  # activation marker, so every deploy turns the Run contract on. It is the Run
  # contract's own epoch and nothing in the Hangar output plane shares it:
  # changing the plane's configuration leaves running Runs, their
  # finalization and invocation-key replay alone. The marker only moves forward, so raise this value, never
  # lower it; a web node configured below the recorded epoch refuses to start.
  # Zero renders no flag and stops admission on the next web start, keeping the
  # recorded epoch. A template that declares results (or a Run given inputs)
  # is still admitted only while hangarOutput.webEnabled puts the output plane
  # in service. Admission checks nothing more, but EXECUTING any Run, with or
  # without results, needs the output plane's execution control
  # (hangarOutput.executionControl.enabled) with the Hangar key
  # (artifactDaemon.hangar.keySecret, or hangar.key in the daemon TLS Secret)
  # configured: every step of a Run
  # build starts through the exact-execution check. Without them, Runs are
  # admitted and every step fails with "Run result execution is not
  # activated" -- set this to 0 on such a deploy to keep admission closed.
  pipelineRunActivationEpoch: 1

  # -- Existing web-only Secret containing input.key (exactly 32 raw random
  # bytes) for workload Run input grants. Requires hangarOutput.webEnabled.
  # Use a separate key and Secret from all node capability/materialization keys.
  # This is a service key, never a user's Codex auth.json.
  runInputSigningKeySecret: ""

  # -- Digest-qualified images (repository@sha256:<64 hex>) that a Run result
  # producer must run for the owner's session credentials to be delivered into
  # it, e.g. the review worker image the review template is installed with.
  # Requires runInputSigningKeySecret. EMPTY REFUSES EVERY CREDENTIAL HANDOFF:
  # the image comes from a template that any team member able to set it
  # controls, so an unpinned deployment would hand the owner's credentials to
  # whatever image that member names. Tags are refused; pin the digest.
  runCredentialWorkerImages: []

  # -- Run result downloads. Rendered only with hangarOutput.webEnabled.
  runResults:
    # -- sizeLimit of the disk-backed emptyDir web spools result downloads
    # into (mounted at /var/concourse/run-result-scratch). Each read holds the
    # fetched archive and its canonical copy, up to 256Mi each, until its
    # response is written, so this must be at least readConcurrency x 512Mi;
    # the chart refuses less. It counts against the Pod's ephemeral storage,
    # not its memory.
    scratchSizeLimit: "1536Mi"
    # -- Result downloads in flight at once. Readers beyond this get 503 with
    # Retry-After instead of queueing.
    readConcurrency: 2

  # -- Extra volume mounts for the web container (e.g. custom CA bundles, credential files)
  extraVolumeMounts: []
  # -- Extra volumes for the web pod
  extraVolumes: []

  # -- Liveness probe configuration
  livenessProbe:
    httpGet:
      path: /api/v1/info
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 5

  # -- Readiness probe configuration.
  # Uses /api/v1/health which checks DB connectivity and worker availability.
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

  # -- Node selector for the web pod
  nodeSelector: {}
  # -- Tolerations for the web pod
  tolerations: []
  # -- Affinity rules for the web pod
  affinity: {}

# -- Kubernetes runtime (JetBridge) configuration
kubernetes:
  # -- Namespace where task/check pods are created.
  # Defaults to the release namespace.
  namespace: ""

  # -- ServiceAccount for task pods. Empty means the pod spec names none and
  # Kubernetes assigns the namespace's `default` ServiceAccount (not the web
  # SA: the web command passes the value through as-is).
  serviceAccount: ""

  # -- Step pod grants: each maps a build's owner to the ServiceAccount its
  # step pods run under. owner is <team>/<pipeline>/<job> of a non-instanced
  # pipeline, or main/one-off for team main's one-off builds. Every other
  # build's pods run as serviceAccount above, the default step pod identity.
  # Only this configuration selects a grant; nothing in a pipeline can.
  # privileged: true lets the owner's step pods run privileged; such a grant
  # may leave serviceAccount out and keep the default identity's account.
  # e.g. [{name: brine-live, owner: main/one-off, serviceAccount: jetbridge-brine-live, privileged: true}]
  stepPodGrants: []

  # -- Pod startup timeout
  podStartupTimeout: 5m
  # -- How long a step pod may wait Pending for cluster resources before its
  # step fails (Go duration; the binary's default is 15m). A pod that does not
  # fit any node waits rather than failing at once, so raising this lets a
  # busy cluster queue work. Pod scheduling plus startup, plus the init
  # retry budget (31m) and a 5m margin, must stay under
  # artifactDaemon.resolveCapability.ttl, or web refuses to start.
  podSchedulingTimeout: ""
  # -- CPU request, in millicores, given to a task step that names none in
  # its own container_requests (0 = none, leaving such pods BestEffort).
  # Without a request the scheduler cannot see a task's CPU and admits every
  # pod onto the same node.
  defaultTaskCPURequest: 0
  # -- A node label, key=value, every step pod prefers but does not require,
  # e.g. a bigger node: kubernetes.io/hostname=ci-node. Pods that do not fit
  # there, or find it gone, schedule anywhere else. Step pods also tolerate the
  # taint key=value:NoSchedule, so tainting that node reserves it for builds.
  preferredStepNode: ""

  # -- Image pull secrets for task pods.
  # In JetBridge's K8s-native runtime, these secrets are attached directly to
  # task pods, replacing the need for custom registry-image resources that
  # handled GCR/ECR/ACR authentication in the Garden runtime.
  # Example:
  #   imagePullSecrets:
  #     - name: gcr-json-key       # GCR: kubectl create secret docker-registry gcr-json-key ...
  #     - name: ecr-cred-secret    # ECR: managed by ecr-credential-helper or external-secrets
  imagePullSecrets: []

  # -- Artifact helper image (needs tar; used by init containers and sidecar)
  artifactHelperImage: "alpine:latest"

  # -- Image registry prefix for custom resource type images.
  # Applied as a prefix to resource type image references, e.g. "myregistry.io/"
  # combined with imagePullSecrets enables pulling custom resource type images
  # from private registries without a custom registry-image resource type.
  imageRegistryPrefix: ""
  # -- Image registry pull secret name for resource type image pulls.
  # When set, this secret is added to pods that pull resource type images.
  imageRegistrySecret: ""

  # -- Kubernetes credential manager.
  # Resolves pipeline ((vars)) from Kubernetes Secrets instead of static
  # set-pipeline vars (-v/-l), which are wiped on every `fly set-pipeline`
  # that omits them. Lookup namespace is "<namespacePrefix><team>"
  # (e.g. team "main" -> "concourse-main"); secret name is tried as
  # "<pipeline>.<var>" then "<var>"; the value is read from the secret's
  # "value" data key. Example for ((github-token)) on team main:
  #   kubectl create ns concourse-main
  #   kubectl -n concourse-main create secret generic github-token \
  #     --from-literal=value=<PAT>
  # The web ServiceAccount already has cluster-wide secrets:get via
  # rbac.yaml (requires rbac.create=true), so no extra RBAC is needed.
  credentialManager:
    # -- Enable the in-cluster Kubernetes credential manager
    # (passes --kubernetes-in-cluster to the web command).
    enabled: false
    # -- Namespace prefix for secret lookups. Lookup namespace is
    # "<namespacePrefix><team>". Default "concourse-".
    namespacePrefix: "concourse-"

# -- Explicit task cache backend selector.
# Valid values: hostpath, emptydir.
# The binary rejects anything else at startup (ValidCacheStores in
# atc/worker/jetbridge/config.go), so a value documented here that the code
# does not accept is a CrashLoopBackOff, not a warning.
# When empty (default), auto-detects: hostpath if cacheHostPath is set,
# otherwise emptydir.
cacheStore: ""

# -- Host path for node-local task cache persistence.
# Caches survive pod restarts on the same node.
# Set to "" to disable (falls back to ephemeral emptyDir).
cacheHostPath: ""

# -- PostgreSQL configuration
postgresql:
  # -- Deploy a PostgreSQL pod as part of this chart.
  # Set to false to use an external database.
  enabled: true

  # -- PostgreSQL image (only used when postgresql.enabled=true)
  image: postgres:16

  # -- Database name
  database: concourse
  # -- Database user
  user: concourse
  # -- Database password (plaintext; use existingSecret for production)
  password: concourse

  # -- Use an existing K8s Secret for the database password.
  # The Secret must contain a key matching passwordSecretKey.
  # When set, postgresql.password is ignored.
  existingSecret: ""
  # -- Key within the existing Secret that contains the password
  passwordSecretKey: postgresql-password

  # -- External database host (required when postgresql.enabled=false)
  host: ""
  # -- External database port
  port: 5432
  # -- Path to UNIX domain socket (alternative to host/port)
  socket: ""

  # -- SSL mode: disable, require, verify-ca, verify-full
  sslmode: disable
  # -- CA certificate for SSL connections.
  # Provide as a file path inside the pod (mount via web.extraVolumes).
  caCert: ""
  # -- Client certificate for mTLS connections
  clientCert: ""
  # -- Client key for mTLS connections
  clientKey: ""
  # -- Connection timeout (Go duration, e.g. "5m"). Empty = binary default (5m).
  connectTimeout: ""

  # -- Pod-level security context for the PostgreSQL pod
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security context for the PostgreSQL container
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  # -- Resource requests and limits (only used when postgresql.enabled=true)
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Persistence for database data (only used when postgresql.enabled=true)
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

# -- Service configuration
service:
  # -- Service type: ClusterIP, LoadBalancer, NodePort
  type: LoadBalancer
  # -- HTTP port
  httpPort: 8080
  # -- TSA port (for fly CLI worker registration — unused in JetBridge but kept for compatibility)
  tsaPort: 2222
  # -- Annotations to add to the service (e.g. cloud provider LB annotations)
  annotations: {}
  # -- Extra labels to add to the service
  labels: {}
  # -- Static IP for LoadBalancer-type services
  loadBalancerIP: ""
  # -- Restrict LoadBalancer traffic to these CIDRs
  loadBalancerSourceRanges: []

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
  # -- Ingress hostname
  host: ""
  # -- TLS configuration
  tls: []

# -- RBAC configuration
rbac:
  # -- Create RBAC resources (Role, RoleBinding) for the web pod
  create: true

# -- ServiceAccount configuration
serviceAccount:
  # -- Create a ServiceAccount for the web pod
  create: true
  # -- Annotations to add to the ServiceAccount. With hangarOutput.enabled on
  # GCS, this is the output plane's RECLAIM identity -- the web runs reclaim
  # and the orphan sweep -- e.g. the GCS Workload Identity binding:
  #   iam.gke.io/gcp-service-account: reclaim@project.iam.gserviceaccount.com
  # It must not be the artifact daemon's (publisher) principal; the chart
  # refuses one principal on both.
  annotations: {}

# -- OpenTelemetry tracing configuration.
# When enabled, the web node emits traces and metrics via OTLP.
# Example for Grafana Tempo: otlpAddress: "tempo.monitoring.svc:4317"
tracing:
  # -- OTLP gRPC endpoint for traces (e.g., "tempo.monitoring.svc:4317")
  otlpAddress: ""
  # -- Additional OTLP headers (map of key:value)
  otlpHeaders: {}
  # -- Use TLS for the OTLP connection
  otlpUseTLS: false
  # -- Service name reported in traces (default: concourse-web)
  serviceName: ""

# -- OpenTelemetry metrics configuration.
# When enabled, the web node exports metrics via OTLP gRPC.
otelMetrics:
  # -- OTLP gRPC endpoint for metrics (e.g., "tempo.monitoring.svc:4317")
  otlpAddress: ""
  # -- Additional OTLP headers for metrics
  otlpHeaders: {}
  # -- Use TLS for the metrics OTLP connection
  otlpUseTLS: false

# -- Secrets configuration
secrets:
  # -- Required. Name of a pre-existing Secret holding the session signing
  # key, an RSA private key in PEM, under session_signing_key. Every web pod
  # mounts it at /keys, so all replicas sign and verify sessions with one key
  # and a restart logs no one out. Create it once:
  #   concourse generate-key -t rsa -f session_signing_key
  #   kubectl create secret generic jetbridge-session-signing-key \
  #     --from-file=session_signing_key
  # The chart never mints the key: Helm `lookup` returns nothing under
  # `helm template`, which is how Argo renders, so a generated key would be
  # re-minted on every sync and written into the manifest in cleartext.
  signingKeySecret: ""

# -- Pod Security Admission (PSA) recommendations.
# Concourse task pods may run as root (resource type images require it),
# so the namespace cannot use the "restricted" PSA level. Recommended labels:
#
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=baseline \
#     pod-security.kubernetes.io/warn=restricted \
#     pod-security.kubernetes.io/audit=restricted
#
# "baseline" enforcement blocks known-dangerous pod configurations while
# allowing root containers. "restricted" in warn/audit mode surfaces
# pods that don't meet the strictest standard without blocking them.

# -- Network policy configuration
networkPolicy:
  # -- Enable NetworkPolicy resources for the web pod and the bundled database.
  #
  # This switch no longer emits its OWN copy of the artifact daemon's policy. It
  # used to, and that copy carried the same name as the daemon's own template's,
  # so with both switches on one namespace held one object and apply order
  # decided which rules were in the cluster. There is now one template, with one
  # selector that covers one-off builds and checks as well as pipeline jobs --
  # and it renders under EITHER switch, so an install that has this one set
  # keeps its daemon policy across the upgrade. A pod selected by no
  # NetworkPolicy is not default-deny; it is unrestricted.
  enabled: false

  # -- Allow ingress from these pod selectors to the web pod.
  # Default allows all ingress when empty (only port restriction applies).
  ingressFrom: []
  # Example: restrict to ingress controller only:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: ingress-nginx

  # -- Additional egress destinations for task pods (applied only when non-empty).
  # When set, task pods are restricted to: DNS, artifact daemon, GKE metadata
  # server (169.254.169.254 — required for Workload Identity), plus these entries.
  # When empty (default), task pods have unrestricted egress.
  # IMPORTANT: On GKE with Workload Identity, the metadata server allowlist is
  # included automatically. Do NOT remove 169.254.169.254 from the template.
  taskEgressTo: []
  # Example: allow only internal network + Docker Hub:
  #   - ipBlock:
  #       cidr: 10.0.0.0/8
  #   - ipBlock:
  #       cidr: 104.16.0.0/12  # Docker Hub / Cloudflare

# -- Pod Disruption Budget configuration
pdb:
  # -- Enable PDB (only useful when web.replicas > 1)
  enabled: false
  # -- Minimum number of web pods that must be available during disruption
  minAvailable: 1

# -- Prometheus metrics endpoint on the web node.
#
# The ATC only registers its Prometheus emitter when BOTH a bind IP and a bind
# port are set, and it serves the metrics on that dedicated listener -- never on
# the 8080 web port. Leave this disabled and /metrics on 8080 returns the Elm
# SPA HTML, which is what a ServiceMonitor pointed there scrapes: the target
# fails with `unsupported Content-Type "text/html"` and every alerting rule in
# this chart silently has no data to evaluate.
metrics:
  # -- Expose Prometheus metrics on a dedicated port
  enabled: true
  # -- Port for the metrics listener
  port: 9391

# -- Prometheus ServiceMonitor configuration (requires prometheus-operator CRDs)
serviceMonitor:
  # -- Enable ServiceMonitor creation. Requires metrics.enabled; the render
  # fails otherwise rather than producing a target that scrapes HTML.
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for ServiceMonitor (e.g. for Prometheus discovery)
  labels: {}
  # -- Namespace for the ServiceMonitor (defaults to release namespace)
  namespace: ""

# -- Prometheus alerting rules (requires prometheus-operator CRDs)
alertingRules:
  # -- Enable PrometheusRule creation
  enabled: false
  # -- Additional labels for PrometheusRule
  labels: {}

# -- DaemonSet artifact cache configuration.
# Deploys a DaemonSet on each node with an authenticated HTTPS file server
# for artifact storage. Provides sub-second local reads and fast cross-node
# transfers, replacing the PVC-based artifact store for improved performance.
#
# Always deployed by this chart. The web deployment refuses to
# start with an unset artifact-daemon host path because every step-produced
# artifact must be read via HTTP from the DaemonSet rather than exec-ing into
# a reaped producer pod. See track
# route_artifact_reads_through_daemonset_remove_exec_backed_artifact_io_20260418.
artifactDaemon:
  # The artifact daemon is always deployed by this chart.
  # -- HTTP server port (must match --kubernetes-artifact-daemon-port on the web node)
  port: 7780
  # -- Host path for artifact storage on each node
  hostPath: /var/concourse/artifacts
  # -- TTL for automatic artifact cleanup (Go duration)
  ttl: "2h"

  # -- Prometheus metrics for the artifact daemon.
  #
  # The daemon's own port is mTLS, and a Prometheus scraper holds neither a
  # client certificate nor the daemon's CA, so /metrics there is unreachable to
  # it. Setting `port` opens a second, plain-HTTP listener that serves
  # /metrics and nothing else, names it `metrics` on the daemon's headless
  # Service, and -- with serviceMonitor.enabled -- scrapes it.
  #
  # Empty by default because it renders a flag (--metrics-port) that a daemon
  # image older than the flag exits on. A deployment whose image can lag its
  # chart (Argo ignoring the image field, `kubectl set image` upgrades) sets
  # this only once the image carrying the flag is running.
  metrics:
    # -- Port for the plain-HTTP metrics listener, e.g. 9392. Empty: no
    # listener, no Service port, no scrape.
    port: ""

  # -- The Hangar key. Every Run input reaches a task as a managed read of
  # the output namespace, and every warrant the web signs for that plane --
  # read and control -- is signed with this one key. It is needed with
  # hangarOutput.executionControl.enabled.
  hangar:
    # -- Permit the chart to generate hangar.key in its managed TLS Secret.
    # Use only with live Helm install/upgrade, where lookup can preserve the
    # Secret. Offline/GitOps rendering must leave this false and provide
    # tls.existingSecret with all TLS keys plus an exact raw-32-byte hangar.key.
    allowGeneratedKey: false
    # -- Secret holding hangar.key, the raw 32-byte Hangar key the web signs
    # every read and control warrant with and every artifact daemon verifies
    # against. Needed with hangarOutput.executionControl.enabled. When set,
    # web and the artifact daemon mount it from here instead of from
    # artifactDaemon.tls.existingSecret, and the Hangar bootstrap creates it
    # if it is absent.
    keySecret: ""
    # -- Lifetime of every warrant the web signs with the Hangar key, expressed
    # as positive whole seconds. Maximum 900s (Hangar's core 15-minute bound).
    capabilityTTL: "900s"

  # -- Override the headless service name. When set, used verbatim.
  # Default (when empty): <release-fullname>-artifact-daemon
  serviceName: ""
  serviceAccount:
    # -- Annotations on the daemon's service account. With the output facet
    # on, this is the output plane's PUBLISHER identity -- the daemon serves
    # the output plane -- e.g. the GCS Workload Identity binding:
    #   iam.gke.io/gcp-service-account: publisher@project.iam.gserviceaccount.com
    # Disk uses projected role credentials and needs no GCP identity.
    annotations: {}
  # -- The output plane's canonicalization scratch, mounted when
  # hangarOutput.executionControl.enabled is true. It is the ONE scratch and
  # the one set of tree limits: input publications, captures and managed
  # reads are all canonicalized here, and maxContentBytes/maxEntries bound
  # every tree the daemon admits (rendered as --output-max-content-bytes and
  # --output-max-entries).
  outputScratch:
    # -- Absolute canonicalization scratch directory, disjoint from the
    # storage root.
    path: /var/concourse/hangar-output-scratch
    # -- REQUIRED whenever hangarOutput.executionControl.enabled is true --
    # that is, in base-control-only mode as well as with the output facet on.
    # An emptyDir with no sizeLimit is bounded only by the node's disk:
    # filling it evicts every Pod on the node, not only this one.
    # Use Kubernetes quantity syntax, e.g. "32Gi".
    sizeLimit: ""
    # -- Largest regular-file content admitted in one tree (capture, input
    # publication or managed read).
    maxContentBytes: 10737418240
    # -- Largest number of filesystem entries admitted in one tree.
    maxEntries: 100000
    # -- How many trees may be spooled to scratch at once. concurrency times
    # maxContentBytes must fit inside sizeLimit; the chart refuses a product
    # that does not.
    concurrency: 1
  # -- Resource requests and limits for the DaemonSet pods. The limits cover
  # the output plane's canonicalization and read staging, which run in this
  # daemon when hangarOutput.executionControl.enabled is on.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- Node selector to restrict DaemonSet to specific node pools.
  # Example for GKE: {cloud.google.com/gke-nodepool: "ci-workers"}
  nodeSelector: {}
  # -- Affinity rules for DaemonSet scheduling
  affinity: {}
  # -- Tolerations for scheduling on tainted nodes (spot, GPU, etc.)
  tolerations: []
  # -- Outbound mirror configuration. Each step output (and resource cache
  # alias) is asynchronously mirrored to peer daemons after it lands so the
  # artifact survives loss of the producing node (spot preemption, crash).
  mirror:
    # -- Replication factor.
    #   0     — mirroring disabled (default behavior is single-node)
    #   N     — mirror to up to (N-1) peers; if fewer peers exist than
    #           requested, mirrors to all available peers (no error)
    #   "all" — mirror to every live peer (translates to -1 on the daemon)
    # Default 2 = local + 1 peer copy. Suitable for 1-4 node fleets.
    replicas: 2
    # -- Max concurrent in-flight mirror jobs per daemon.
    concurrency: 4
    # -- Per-peer per-job mirror PUT timeout.
    timeout: "5m"
  # -- TLS/mTLS configuration for encrypted and authenticated daemon communication
  tls:
    # -- Certificate ownership: existingSecret (recommended for GitOps) or generated.
    # mTLS is always required. generated uses live Helm lookup and must not be
    # used with offline/GitOps rendering, which cannot preserve key material.
    source: existingSecret
    # -- Secret containing ca.crt, tls.crt, tls.key, client.crt, client.key.
    # Required for source: existingSecret; must be empty for source: generated.
    # The output plane (hangarOutput.executionControl.enabled) additionally
    # requires hangar.key, the Hangar key, unless artifactDaemon.hangar.keySecret
    # names it.
    existingSecret: ""
  # -- NetworkPolicy configuration for the artifact daemon
  resolveCapability:
    # -- Required existing Secret holding resolve.key (exactly 32 random bytes).
    # Web always signs and the daemon always verifies resolve capabilities.
    # Provision this key outside Helm; rendering must never rotate it.
    existingSecret: ""
    # -- Capability lifetime. Must exceed pod scheduling + startup + the init
    # container's retry budget, or a slow-to-schedule pod gets a 403 on a
    # perfectly legitimate request.
    ttl: 2h

  networkPolicy:
    # -- Enable NetworkPolicy restricting daemon ingress to Concourse pods and
    # egress to required services. Current GKE standard/Calico and Dataplane V2
    # metadata profiles are included; validate CNI-specific routing before use.
    enabled: false

# ---------------------------------------------------------------------------
# Hangar output plane
# ---------------------------------------------------------------------------
#
# Durable output capture and the exact-execution-control protocol it extends.
# Two facets, two switches, and OFF is the default for both: with the plane
# disabled this chart renders exactly what it rendered before, which is what
# requirement 59 asks for.
#
# WHAT THE CHART DOES NOT DO. It never creates a bucket, a bucket lifecycle
# rule, a cloud service account, a Workload Identity binding or an IAM policy.
# Those are an operator or Terraform concern; a missing or wrong one surfaces as
# a recorded runtime integrity failure, never as a render error -- the chart
# renders identities and refuses configurations, it enforces nothing in the
# cloud.
#
# THE HONEST PERMISSION MATRIX. Two workloads, two Kubernetes service
# accounts, two cloud principals, because a Kubernetes service account is
# Pod-wide: a process that holds a role has that role for everything else it
# does. The minimum roles are
#
#   artifact daemon output plane (publisher/materializer)
#     storage.objects.create, storage.objects.get
#   web (reclaim and orphan sweep)
#     storage.objects.list, storage.objects.get, storage.objects.delete
#
# and three of those grants are weaker than they read, so they are written down
# here rather than discovered:
#
#   * storage.objects.get is BODY-CAPABLE. GCS has no metadata-only object
#     permission: a principal that can stat an object can download it. The
#     reclaim and sweep code paths perform metadata-only requests, but IAM is
#     not what makes that true -- code is, and the dedicated bucket is the
#     boundary.
#   * storage.objects.list is BUCKET-WIDE. There is no caller-visible prefix
#     boundary in list authority, so "the orphan sweep only lists its own
#     prefix" is an application-level property and not an IAM one. That is why
#     the web is the only workload granted list at all, and why the output
#     bucket contains nothing but output-plane objects.
#   * Replacing an existing object requires BOTH storage.objects.create and
#     storage.objects.delete. The publisher holds only create/get, and the web
#     holds no create: no one principal can overwrite. The publisher's
#     create-if-absent precondition additionally protects against overwrite.
#
# PERMISSIONS NO RUNTIME PRINCIPAL HOLDS. An absent grant is a promise, and a
# promise nobody wrote down is one the next role addition breaks by accident.
# These are the ones whose absence the design leans on:
#
#   storage.objects.update
#     The permission that REWRITES an object's metadata, and therefore its
#     ownership marker. Requirement 22's "the publisher cannot update the
#     marker" is what the whole immutable-marker argument rests on: a marker
#     that can be rewritten is not evidence of who created an object. It is
#     forbidden to all runtime principals -- including the publisher, which is the
#     one that would want it -- and note that roles/storage.objectAdmin and
#     roles/storage.objectUser GRANT it, so "the web just has objectAdmin"
#     is not a compatible binding.
#   storage.objects.delete
#     Held by the web alone, which deletes only an exact generation under a
#     precondition (reclaim) or an object whose marker names this store with no
#     lifecycle row (the orphan sweep). It is the only destructive permission
#     in the plane and the reason the web and the publisher are separate
#     identities.
#   storage.buckets.update, storage.buckets.setIamPolicy
#     Bucket lifecycle and IAM administration belong to operators.
#
# Hangar does not inspect IAM or lifecycle settings. Operators must provision
# dedicated buckets without external expiry or deletion of protected objects.
# Unexpected loss and corruption are recorded as runtime integrity failures.
# -- The Hangar bootstrap: a Job at the start of every Argo sync that creates
# the absent Secrets of the bootstrap inventory and never changes one.
# An entry joins the inventory once its values key names a Secret (for
# example artifactDaemon.hangar.keySecret, the Hangar key), so the operator
# turns each Secret on by naming it. Off renders nothing.
#
# Trusted readers (proposal amendments M-4 and M-5): the inventory's
# consumers, web, the cluster administrators the operator lists, and every
# step pod grant identity that holds privilege or may create pods. Nobody
# else may read an inventory Secret, create a pod that mounts one, or reach
# the node; the step pod grants and the privilege gate keep that set closed.
hangarBootstrap:
  enabled: false
  secretNames:
    # -- The Run input signing key. Default <fullname>-run-input-signing-key.
    # Set web.runInputSigningKeySecret to this name once
    # hangarOutput.webEnabled is on.
    runInputSigningKey: ""

hangarOutput:
  # -- Object storage profile: gcs or disk.
  store: gcs
  # -- The BASE facet: exact execution control.
  #
  # A node whose artifact daemon serves the exact-execution protocol advertises
  # `concourse.dev/hangar-execution-control-v1`. This is a real deployment on
  # its own -- durable output capture is an extension of it, never a synonym
  # for it. Once the output facet passes as well, the same daemon adds
  # `concourse.dev/hangar-output-v1`. A capture-selected pod's affinity requires
  # BOTH, and neither alone admits it. Neither is authority -- the warrant
  # the daemon verifies and the web's hangar_enabled row are -- so a label buys
  # only that the pod does not land somewhere its hold could never be
  # acknowledged. Every Run input is a managed read of this plane, so a pod
  # with a tree input requires both labels too; there is no other label.
  #
  # The daemon verifies every warrant with the one Hangar key
  # (artifactDaemon.hangar.keySecret, or hangar.key in the daemon TLS Secret),
  # which this switch requires. The node signs nothing: it is inside the
  # trusted computing base and is reached over mTLS, so its acknowledgement is
  # its answer on that channel. There is no node control key, no key id and no
  # verification ring.
  executionControl:
    enabled: false

  # -- The OUTPUT facet: durable capture, claims and reclamation.
  # Requires executionControl.enabled. Never the other way round.
  enabled: false
  # -- Whether the output plane is IN SERVICE. The web writes it into its
  # hangar_enabled row at startup; with it on, web selects captures and emits
  # checkpoints. Requires enabled. To drain: set it false, wait for
  # `fly hangar-status` to report zero residue, then turn the daemon's output
  # plane off. There is no activation step and nothing to rotate.
  webEnabled: false

  # -- The dedicated output bucket. Externally provisioned, contains only
  # Hangar output-plane objects (captures and Run input publications), and is
  # never the durable cache bucket. Required when enabled.
  bucket: ""
  # -- Authenticated deployment key prefix inside that bucket. Server
  # configuration; no task, consumer, path parameter or request can select or
  # broaden it.
  prefix: ""
  # -- Authenticated deployment/tenant identity the opaque scope is derived
  # from. It is never rendered into an object key. Required when enabled.
  tenant: ""

  # -- The bucket this plane may not be, named so the daemon can refuse to
  # be pointed at it. Empty means this deployment has no such bucket.
  cacheBucket: ""

  # -- Endpoint override for the OUTPUT bucket's store. Empty means real GCS;
  # set it for an emulator. It is the output plane's own: requirement 20
  # forbids the output plane sharing the cache bucket or its client, and a
  # render test asserts that this value reaches only --output-endpoint.
  endpoint: ""

  # -- Deadlines and grace. The chart enforces the relationship between
  # them, because a grace that does not exceed the maximum capture deadline
  # can reclaim an object a capture is still allowed to register. A
  # registered generation is reclaimable only once publicationGrace has
  # elapsed and nothing claims it.
  captureDeadline: "24h"     # 1h .. 168h
  publicationGrace: "192h"   # >= captureDeadline + 1h, <= 720h
  # Shared by the output plane, readers' claims (which last this plus five
  # minutes) and caller deadlines.
  operationTimeout: "1m"

  # -- The web's reclaim pass: a registered generation nothing claims is
  # deleted by its exact generation and stamped reclaimed. It runs in every
  # web node with the output plane enabled; a database lock keeps passes from
  # overlapping.
  reclaim:
    interval: "1m"
    # -- How long one conditional delete may take.
    deleteTimeout: "2m"
    # -- How many generations one pass reclaims.
    batch: 10

  # -- The web's orphan sweep. It lists the output namespace and deletes only
  # an object whose marker names this store, that has no lifecycle row, and
  # that is older than twice captureDeadline. Everything else is counted and
  # left alone.
  orphanSweep:
    interval: "1h"

  networkPolicy:
    # -- Enable the output plane's NetworkPolicies: the artifact daemon's and,
    # on the disk store, the store's.
    enabled: false

# -- Authenticated MCP is always available. Registration grants no user permissions;
# OAuth consent, team roles and operation restrictions still govern each request.
mcp:
  # -- Registered public clients with exact redirect URIs; at least one required.
  # Example: [{client_id: workstation, client_name: Workstation,
  #            redirect_uris: ["http://127.0.0.1:8964/callback"]}]
  clients: []
  # -- Operation IDs denied to every client, regardless of user consent.
  disabledOperations: []

# One durable disk owner. Provision TLS and fixed-role credentials separately.
hangarStorage:
  disk:
    enabled: false
    storeID: ""
    existingClaim: ""
    size: 100Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    # Explicit one-shot provisioning Job; never initialize automatically on restart.
    initialize: false
    tls:
      # tls.crt/tls.key for the storage Service DNS name; ca.crt for clients.
      existingSecret: ""
    credentials:
      # input and publisher (artifact daemon), inventory and reclaimer (the
      # web's list and delete tokens: orphan-sweep listing, and reclaim
      # deletes), server.json (role-to-token
      # JSON, the store's).
      existingSecret: ""
    maxObjectBytes: 17179869184
    maxConcurrent: 4
    resources: {}
