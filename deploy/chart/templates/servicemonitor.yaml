{{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.web.enabled }}
{{- if not .Values.web.metrics.enabled }}
{{- fail "serviceMonitor.web.enabled requires web.metrics.enabled: the ATC serves the Prometheus text format only from the dedicated --prometheus-bind-ip/--prometheus-bind-port listener, and the API port answers every unmatched path with the web UI (HTTP 200, text/html), so a scrape aimed at it yields a permanently failing target instead of an error. Set web.metrics.enabled=true, or serviceMonitor.web.enabled=false to scrape only the artifact daemon." }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "concourse.fullname" . }}
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # prometheus-operator defaults a ServiceMonitor's search space to its OWN
  # namespace, so a serviceMonitor.namespace elsewhere would silently match no
  # Service at all. The web Service always lives in the release namespace.
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "concourse.selectorLabels" . | nindent 6 }}
  endpoints:
    # `metrics`, not `http`: the ATC's Prometheus listener is a separate socket
    # from the API/UI port. Both the Service port and the container port of this
    # name render only under web.metrics.enabled, which the guard above requires.
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: /metrics
{{- end }}
