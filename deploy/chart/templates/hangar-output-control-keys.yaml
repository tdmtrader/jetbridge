{{/*
The control plane's public node-control verification ring.

A ConfigMap and not a Secret, deliberately: everything in it is public
verification material, and putting it in a Secret would suggest the private half
is somewhere nearby. The private half is an operator-provided Secret mounted in
the artifact daemon Pod alone.

Entries are keyed by control-key generation (hangarOutput.activationEpoch) and
retained while an execution started under their generation may still be
recovered, because dropping one makes those node statements
unverifiable forever rather than merely unusable. A new generation ADDS an
entry; it never replaces a key in place.
*/}}
{{- if and .Values.hangarOutput.enabled (not (include "concourse.hangarBootstrap.ringEnabled" .)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "concourse.hangarOutput.controlKeysName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-output
data:
  control-keys.json: |
    {
      "activation_epoch": {{ int .Values.hangarOutput.activationEpoch }},
      "keys": [
      {{- range $index, $entry := .Values.hangarOutput.executionControl.publicKeys }}
        {{ if $index }},{{ end }}{
          "epoch": {{ int $entry.epoch }},
          "public_key": {{ $entry.key | quote }}
        }
      {{- end }}
      ]
    }
{{- end }}
