{{- if and .Values.artifactDaemon.enabled (not .Values.artifactDaemon.resolveCapability.existingSecret) }}
{{- $secretName := printf "%s-artifact-daemon-resolve-capability" (include "concourse.fullname" .) }}
{{/*
  Reuse the signing key across `helm upgrade` via lookup, exactly like the
  daemon TLS Secret -- and with the same GitOps hazard. `lookup` is a no-op
  during a plain `helm template`, so Argo CD mints a new key on every manifest
  generation. Unlike the TLS material this Secret renders whenever
  artifactDaemon.enabled is set, which the Kubernetes runtime requires, so the
  churn reaches every GitOps deployment regardless of artifactDaemon.tls.

  Both the ATC (RunCommand.loadArtifactResolveCapabilityKey) and the daemon
  (artifactcap.LoadKeyFile) read the key once at process start. A re-applied
  Secret therefore disturbs nothing until the first asymmetric restart, after
  which every capability minted by the other side fails closed -- resolve
  init containers 403 and cannot fetch inputs -- until both sides have rolled.

  Set artifactDaemon.resolveCapability.existingSecret under GitOps.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := randAlphaNum 32 | b64enc }}
{{- if and $existing $existing.data (index $existing.data "resolve.key") }}
  {{- $key = index $existing.data "resolve.key" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # Survives `helm uninstall` so a reinstall's lookup finds the same key. It
    # does NOT stop an upgrade or an Argo CD sync from overwriting this Secret
    # with a freshly generated key -- only existingSecret does that.
    helm.sh/resource-policy: keep
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
type: Opaque
data:
  resolve.key: {{ $key }}
{{- end }}
