{{- if and .Values.artifactDaemon.enabled (not .Values.artifactDaemon.resolveCapability.existingSecret) }}
{{- $secretName := printf "%s-artifact-daemon-resolve-capability" (include "concourse.fullname" .) }}
{{/*
  Persist the key across helm upgrades by looking up the existing Secret, the
  same way the daemon TLS Secret persists its CA.

  GITOPS HAZARD, and it applies to the TLS Secret equally. `lookup` needs a live
  cluster, so it returns EMPTY during `helm template` — which is how Argo CD
  renders. A fresh key is therefore minted on every manifest generation, Argo CD
  sees a diff, and syncing rotates it.

  Both sides read the key once at process start, so a rotation disturbs nothing
  until the first asymmetric restart — after which every capability the other
  side minted fails closed. Resolve init containers 403 and no build can fetch
  inputs, until BOTH web and daemon have rolled.

  Two ways to avoid it, either is fine:
    - set artifactDaemon.resolveCapability.existingSecret to a Secret you create
      once yourself; or
    - tell Argo CD not to diff the generated one:

        ignoreDifferences:
          - group: ""
            kind: Secret
            name: <release>-artifact-daemon-resolve-capability
            jsonPointers: ["/data"]
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $key := "" }}
{{- if and $existing $existing.data }}
  {{- $key = index $existing.data "resolve.key" }}
{{- else }}
  {{- $key = randBytes 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
type: Opaque
data:
  resolve.key: {{ $key }}
{{- end }}
