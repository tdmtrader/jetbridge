{{/*
NetworkPolicies for the output plane's four workloads.

Every name here is distinct and distinct from every other policy this chart
renders: two NetworkPolicies with one name in one namespace are one object, and
which one survives is decided by apply order. tests/networkpolicy_test.go
asserts uniqueness over the whole render in every supported mode.

The three controllers accept NO ingress at all. They serve nothing -- each is a
bounded worker woken by a ticker and a NOTIFY -- so an ingress rule would be
permission for a connection nothing makes.
*/}}
{{- if and .Values.hangarOutput.executionControl.enabled .Values.hangarOutput.networkPolicy.enabled }}
{{- $output := .Values.hangarOutput }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.hangarOutput.daemonName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-output-daemon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: hangar-output-daemon
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # The ATC. Every control-plane operation on this API -- revalidating a hold,
    # taking a writer ticket, recording a start and an outcome, sealing,
    # publishing -- comes from the web pod on another node.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: {{ $output.daemon.port }}
    # The capture control init container, in a task pod on this node. It holds
    # no client certificate and requirement 24 will not give it one; its one
    # route is the node-local capture hold, and its warrant is a signed,
    # facet-scoped, single-use authorization.
    - from:
        - podSelector:
            matchExpressions:
              - key: concourse.ci/worker
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ $output.daemon.port }}
  egress:
    {{- if .Values.web.tls.enabled }}
    # The signed read-lease callback to the web API's native HTTPS listener.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: {{ .Values.web.tls.bindPort }}
    {{- end }}
    # DNS.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Kubernetes API server, to advertise and withdraw its two ready
    # labels, and Cloud Storage. Both are 443; a policy cannot tell them apart
    # without an ipBlock nobody can maintain.
    - ports:
        - protocol: TCP
          port: 443
    # GKE standard/Calico metadata server, for Workload Identity token refresh.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    # GKE Dataplane V2 metadata server. Both profiles, because Helm cannot infer
    # the cluster's network policy provider.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
{{- if $output.enabled }}
{{/*
Name AND component, carried together.

The component used to be re-derived by trimming the fullname prefix off the
object's name -- and the name is truncated, so once truncation bit the label
disagreed with the literal the Deployments set and the podSelector matched
nothing. A NetworkPolicy that selects no pod is not an error and is not a deny:
the three controllers simply had no policy, silently, from a render that reads
correctly. The literal is now the same value in the selector, in the label and
in the workload.
*/}}
{{- range $controller := list
  (dict "name" (include "concourse.hangarOutput.inventoryName" .) "component" "hangar-output-inventory")
  (dict "name" (include "concourse.hangarOutput.reclaimerName" .) "component" "hangar-output-reclaimer")
  (dict "name" (include "concourse.hangarOutput.attestorName" .) "component" "hangar-output-policy-attestor") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $controller.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- /*
      commonLabels, not labels: `concourse.labels` appends
      `app.kubernetes.io/component: web`, and these three NetworkPolicies are
      the inventory, reclaimer and policy-attestor controllers. The label is
      inert at the API server -- nothing selects a NetworkPolicy -- but an
      operator filtering `component=web` to see what governs the web pod would
      be shown three policies that govern the output controllers, which is the
      one thing this chart's labels are read for.
    */}}
    {{- include "concourse.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $controller.component }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" $ }}
      app.kubernetes.io/component: {{ $controller.component }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules at all: these workloads serve nothing.
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL and Cloud Storage.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
{{- end }}
