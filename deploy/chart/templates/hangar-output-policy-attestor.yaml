{{/*
The policy attestor: bucket lifecycle and IAM, and no object permission at all.

Its compromise costs the ASSESSMENT rather than the data, which is the whole
reason it is a fourth identity. It reads the bucket's policy and has no
namespace inside it, so it takes the bucket and the epoch and not the derived
prefix or tenant.

It cannot prevent a policy change. It detects one within the refresh bound, and
Req 52 says exactly that: a functioning monitor notices inside 15 minutes; it
does not stop a deletion inside the window.
*/}}
{{/*
The validation runs here as well as in hangar-output-daemon.yaml, and
unconditionally, because this template can FAIL on its own: cloudIdentity below
refuses a role with no Workload Identity annotation. Helm gives no guarantee
about which template it evaluates first, so without this the operator could be
shown "no iam.gke.io/gcp-service-account" for a configuration whose real fault
is something validate would have named better -- output enabled without base,
say. An include is idempotent; a misleading first error is not.
*/}}
{{- include "concourse.hangarOutput.validate" . }}
{{- if .Values.hangarOutput.enabled }}
{{- $values := .Values.hangarOutput.policyAttestor }}
{{- include "concourse.hangarOutput.controllerHead" (dict
      "root" .
      "component" "hangar-output-policy-attestor"
      "name" (include "concourse.hangarOutput.attestorName" .)
      "account" (include "concourse.hangarOutput.attestorServiceAccount" .)
      "values" $values) }}
          command:
            - /usr/local/concourse/bin/hangar-output-policy-attestor
            - --output-bucket={{ .Values.hangarOutput.bucket }}
            - --activation-epoch={{ int .Values.hangarOutput.activationEpoch }}
            {{- if .Values.hangarOutput.endpoint }}
            - --output-endpoint={{ .Values.hangarOutput.endpoint }}
            {{- end }}
            # CLOUD identities, off each role's Workload Identity annotation,
            # and never the Kubernetes service account names. These four are
            # compared against the bucket's IAM policy: a Kubernetes name
            # matches no member there, so every role would attest
            # insufficient_role and every real principal would be a stranger.
            - --publisher-identity={{ include "concourse.hangarOutput.cloudIdentity" (dict "path" "hangarOutput.daemon" "annotations" .Values.hangarOutput.daemon.serviceAccount.annotations) }}
            - --inventory-identity={{ include "concourse.hangarOutput.cloudIdentity" (dict "path" "hangarOutput.inventory" "annotations" .Values.hangarOutput.inventory.serviceAccount.annotations) }}
            - --reclaimer-identity={{ include "concourse.hangarOutput.cloudIdentity" (dict "path" "hangarOutput.reclaimer" "annotations" .Values.hangarOutput.reclaimer.serviceAccount.annotations) }}
            - --attestor-identity={{ include "concourse.hangarOutput.cloudIdentity" (dict "path" "hangarOutput.policyAttestor" "annotations" .Values.hangarOutput.policyAttestor.serviceAccount.annotations) }}
            - --interval={{ $values.interval }}
{{- include "concourse.hangarOutput.controllerTail" (dict "root" . "values" $values) }}
{{- end }}
