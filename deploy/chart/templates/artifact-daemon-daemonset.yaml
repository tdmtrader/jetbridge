{{- $hangarEnabled := .Values.artifactDaemon.hangar.enabled | default false }}
{{- $hangarWebEnabled := .Values.artifactDaemon.hangar.webEnabled | default false }}
{{- if and $hangarWebEnabled (not $hangarEnabled) }}
  {{- fail "artifactDaemon.hangar.webEnabled requires artifactDaemon.hangar.enabled" }}
{{- end }}
{{- if $hangarEnabled }}
  {{- if not (has .Values.artifactDaemon.hangar.store (list "gcs" "disk")) }}
    {{- fail "artifactDaemon.hangar.store is required when Hangar is enabled and must be gcs or disk" }}
  {{- end }}
  {{- if empty .Values.artifactDaemon.hangar.bucket }}
    {{- fail "artifactDaemon.hangar.bucket is required when Hangar is enabled" }}
  {{- end }}
  {{- if and (empty .Values.artifactDaemon.tls.existingSecret) (empty .Values.artifactDaemon.hangar.keySecret) (not (.Values.artifactDaemon.hangar.allowGeneratedKey | default false)) }}
    {{- fail "artifactDaemon.hangar.allowGeneratedKey=true is required to generate hangar.key; offline/GitOps rendering must use artifactDaemon.tls.existingSecret" }}
  {{- end }}
  {{- $scratch := clean .Values.artifactDaemon.hangar.scratchPath }}
  {{- $storage := clean (.Values.artifactDaemon.hostPath | default "/var/concourse/artifacts") }}
  {{- if or (not (hasPrefix "/" $scratch)) (eq $scratch "/") }}
    {{- fail "artifactDaemon.hangar.scratchPath must be an absolute non-root path" }}
  {{- end }}
  {{- if or (eq $storage "/") (eq $scratch $storage) (hasPrefix (printf "%s/" $storage) $scratch) (hasPrefix (printf "%s/" $scratch) $storage) }}
    {{- fail "artifactDaemon.hangar.scratchPath and artifactDaemon.hostPath must be disjoint" }}
  {{- end }}
  {{- if or (le (int64 .Values.artifactDaemon.hangar.maxContentBytes) 0) (le (int64 .Values.artifactDaemon.hangar.maxEntries) 0) }}
    {{- fail "artifactDaemon.hangar content and entry limits must be positive" }}
  {{- end }}
  {{- $ttl := toString .Values.artifactDaemon.hangar.capabilityTTL }}
  {{- if not (regexMatch "^[1-9][0-9]*s$" $ttl) }}
    {{- fail "artifactDaemon.hangar.capabilityTTL must use positive whole seconds (for example 900s)" }}
  {{- end }}
  {{- $ttlDigits := trimSuffix "s" $ttl }}
  {{- if gt (len $ttlDigits) 3 }}
    {{- fail "artifactDaemon.hangar.capabilityTTL must be no greater than 900s" }}
  {{- end }}
  {{- $ttlSeconds := atoi $ttlDigits }}
  {{- if gt $ttlSeconds 900 }}
    {{- fail "artifactDaemon.hangar.capabilityTTL must be no greater than 900s" }}
  {{- end }}
{{- end }}
{{- /*
The output plane is mounted in this daemon when exact execution control is on:
its control ledger is this daemon's storage root, its steps are steps/ beneath
it, and it is served on this daemon's port under this daemon's TLS. The
validation runs unconditionally, because the refusal an operator most needs is
the one for a configuration that renders nothing.
*/}}
{{- include "concourse.hangarOutput.validate" . }}
{{- $output := .Values.hangarOutput }}
{{- $base := $output.executionControl.enabled | default false }}
{{- $capture := and $base ($output.enabled | default false) }}
{{- $outputDisk := and $capture (eq $output.store "disk") }}
{{- $tlsSecretName := .Values.artifactDaemon.tls.existingSecret | default (printf "%s-artifact-daemon-tls" (include "concourse.fullname" .)) }}
{{- /*
   Resolve mirror.replicas: numbers pass through (including the explicit
   value 0 = disabled); the literal "all" maps to -1 (the daemon's flag
   value for "every live peer"). _validate.tpl refuses any other string.
   Note: we read the value directly rather than using `default` because
   `default` treats Go's zero-value (int 0) as "unset" and would silently
   override an operator's intentional `replicas: 0` with the chart default.
*/ -}}
{{- $mirrorReplicasRaw := .Values.artifactDaemon.mirror.replicas }}
{{- if eq $mirrorReplicasRaw nil }}
  {{- $mirrorReplicasRaw = 2 }}
{{- end }}
{{- $mirrorReplicas := $mirrorReplicasRaw }}
{{- if and (kindIs "string" $mirrorReplicasRaw) (eq $mirrorReplicasRaw "all") }}
  {{- $mirrorReplicas = -1 }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: artifact-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "concourse.name" . }}
        app.kubernetes.io/component: artifact-daemon
    spec:
      serviceAccountName: {{ include "concourse.fullname" . }}-artifact-daemon
      subdomain: {{ include "concourse.artifactDaemonServiceName" . }}
      # Longer with the output plane mounted: long enough for its facet labels
      # to come off and the in-flight publish to finish.
      terminationGracePeriodSeconds: {{ if $base }}60{{ else }}30{{ end }}
      # NOTE: Daemon runs as root — it manages a shared hostPath volume where task
      # containers (running as arbitrary UIDs) write artifacts with varying permissions.
      # K8s does not apply fsGroup to hostPath, so non-root cannot reliably read/clean
      # task-created files. CAP_DAC_OVERRIDE is the sole capability added back (out of
      # ~40) to bypass permission checks on those files. Everything else is dropped.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artifact-daemon
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/concourse/bin/artifact-daemon
            - --port={{ .Values.artifactDaemon.port | default 7780 }}
            - --storage-path={{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - --ttl={{ .Values.artifactDaemon.ttl | default "2h" }}
            - --node-name=$(NODE_NAME)
            # The daemon's OWN namespace, not kubernetes.namespace (where step
            # pods run): its headless Service, EndpointSlices and TLS
            # certificate all live in the release namespace, and it verifies
            # peers against <service-name>.<namespace>.svc.
            - --namespace={{ .Release.Namespace }}
            - --service-name={{ include "concourse.artifactDaemonServiceName" . }}
            - --label-key=concourse.dev/artifact-cache
            - --resolve-capability-key=/etc/concourse/resolve-capability/resolve.key
            - --tls-cert=/etc/concourse/daemon-tls/tls.crt
            - --tls-key=/etc/concourse/daemon-tls/tls.key
            - --tls-ca-cert=/etc/concourse/daemon-tls/ca.crt
            {{- with .Values.artifactDaemon.metrics.port }}
            - --metrics-port={{ . }}
            {{- end }}
            {{- if $hangarEnabled }}
            # The daemon adds concourse.dev/hangar-v1=ready to its node only
            # after strict GCS, key, TLS, and scratch validation succeeds.
            - --hangar-enabled
            - --hangar-store={{ .Values.artifactDaemon.hangar.store }}
            - --hangar-bucket={{ .Values.artifactDaemon.hangar.bucket }}
            - --hangar-prefix={{ .Values.artifactDaemon.hangar.prefix }}
            {{- if eq .Values.artifactDaemon.hangar.store "disk" }}
            - --hangar-endpoint={{ include "concourse.hangarStorage.endpoint" . }}
            - --hangar-store-id={{ .Values.hangarStorage.disk.storeID }}
            - --hangar-token-file=/etc/concourse/hangar-disk/token
            - --hangar-ca-cert=/etc/concourse/hangar-disk/ca.crt
            {{- else if .Values.artifactDaemon.hangar.endpoint }}
            - --hangar-endpoint={{ .Values.artifactDaemon.hangar.endpoint }}
            {{- end }}
            - --hangar-scratch-dir={{ .Values.artifactDaemon.hangar.scratchPath }}
            {{- if .Values.artifactDaemon.hangar.keySecret }}
            - --hangar-warrant-key=/etc/concourse/hangar-warrant-key/hangar.key
            {{- else }}
            - --hangar-warrant-key=/etc/concourse/daemon-tls/hangar.key
            {{- end }}
            - --hangar-warrant-ttl={{ .Values.artifactDaemon.hangar.capabilityTTL }}
            - --hangar-max-content-bytes={{ .Values.artifactDaemon.hangar.maxContentBytes | int64 }}
            - --hangar-max-entries={{ .Values.artifactDaemon.hangar.maxEntries | int64 }}
            {{- end }}
            - --mirror-replicas={{ $mirrorReplicas }}
            - --mirror-concurrency={{ .Values.artifactDaemon.mirror.concurrency | default 4 }}
            - --mirror-timeout={{ .Values.artifactDaemon.mirror.timeout | default "5m" }}
            {{- if $base }}
            # The output plane: exact execution control, and with the output
            # facet the durable-capture extension.
            # The key's id, not its Secret's name. Two nodes holding
            # different material under one Secret name reported one id, and
            # base attestation compares ids.
            - --control-key-id={{ $output.executionControl.keyID }}
            - --control-key-file=/etc/concourse/hangar-output/control/control.key
            - --capability-key=/etc/concourse/hangar-output/capability/capability.key
            - --activation-epoch={{ int $output.activationEpoch }}
            - --output-timeout={{ $output.operationTimeout }}
            - --output-scratch-dir={{ .Values.artifactDaemon.outputScratch.path }}
            - --publish-concurrency={{ int .Values.artifactDaemon.outputScratch.concurrency }}
            {{- if $capture }}
            {{- include "concourse.hangarOutput.namespaceFlagsAt" (dict "root" . "disk" "/etc/concourse/hangar-output-disk") | nindent 12 }}
            {{- if $output.cacheBucket }}
            - --cache-bucket={{ $output.cacheBucket }}
            {{- end }}
            {{- if $output.strictInputBucket }}
            - --strict-input-bucket={{ $output.strictInputBucket }}
            {{- end }}
            - --receipt-key-id={{ $output.receipt.keyID }}
            - --receipt-key-file=/etc/concourse/hangar-output/receipt/receipt.key
            - --materialization-key-id={{ $output.materializationKeyID }}
            - --materialization-key-file=/etc/concourse/hangar-output/materialize/materialize.key
            {{- end }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: {{ .Values.artifactDaemon.port | default 7780 }}
              hostPort: {{ .Values.artifactDaemon.port | default 7780 }}
              protocol: TCP
            {{- with .Values.artifactDaemon.metrics.port }}
            # No hostPort: only Prometheus dials this, by pod IP.
            - name: metrics
              containerPort: {{ . }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # Readiness is not liveness. A daemon whose output control ledger
            # is quarantined is alive and must STAY alive so an operator can
            # read the quarantine; /readyz is what says it is not ready.
            httpGet:
              path: /readyz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.artifactDaemon.resources | nindent 12 }}
          volumeMounts:
            {{- if and $hangarEnabled (eq .Values.artifactDaemon.hangar.store "disk") }}
            {{- include "concourse.hangarStorage.clientMount" . | nindent 12 }}
            {{- end }}
            - name: artifact-storage
              mountPath: {{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - name: daemon-tls
              mountPath: /etc/concourse/daemon-tls
              readOnly: true
            {{- if and $hangarEnabled .Values.artifactDaemon.hangar.keySecret }}
            - name: hangar-warrant-key
              mountPath: /etc/concourse/hangar-warrant-key
              readOnly: true
            {{- end }}
            - name: resolve-capability
              mountPath: /etc/concourse/resolve-capability
              readOnly: true
            {{- if $hangarEnabled }}
            - name: hangar-scratch
              mountPath: {{ .Values.artifactDaemon.hangar.scratchPath }}
            {{- end }}
            {{- if $base }}
            {{- if $outputDisk }}
            {{- include "concourse.hangarStorage.outputClientMount" . | nindent 12 }}
            {{- end }}
            - name: output-scratch
              mountPath: {{ .Values.artifactDaemon.outputScratch.path }}
            - name: output-control-key
              mountPath: /etc/concourse/hangar-output/control
              readOnly: true
            - name: output-capability-key
              mountPath: /etc/concourse/hangar-output/capability
              readOnly: true
            {{- if $capture }}
            - name: output-receipt-key
              mountPath: /etc/concourse/hangar-output/receipt
              readOnly: true
            - name: output-materialize-key
              mountPath: /etc/concourse/hangar-output/materialize
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        {{- if and $hangarEnabled (eq .Values.artifactDaemon.hangar.store "disk") }}
        {{- include "concourse.hangarStorage.clientVolume" (dict "root" . "role" "input") | nindent 8 }}
        {{- end }}
        - name: artifact-storage
          hostPath:
            path: {{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            type: DirectoryOrCreate
        - name: daemon-tls
          secret:
            secretName: {{ $tlsSecretName }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
              {{- if and $hangarEnabled (not .Values.artifactDaemon.hangar.keySecret) }}
              - key: hangar.key
                path: hangar.key
              {{- end }}
        {{- if and $hangarEnabled .Values.artifactDaemon.hangar.keySecret }}
        - name: hangar-warrant-key
          secret:
            secretName: {{ .Values.artifactDaemon.hangar.keySecret }}
            items:
              - key: hangar.key
                path: hangar.key
        {{- end }}
        {{- if $hangarEnabled }}
        - name: hangar-scratch
          {{- if .Values.artifactDaemon.hangar.scratchSizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.artifactDaemon.hangar.scratchSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.artifactDaemon.resolveCapability.existingSecret }}
        - name: resolve-capability
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- if $base }}
        {{- if $outputDisk }}
        {{- include "concourse.hangarStorage.clientVolume" (dict "root" . "role" "publisher" "name" "hangar-output-disk-client") | nindent 8 }}
        {{- end }}
        - name: output-scratch
          emptyDir:
            # REQUIRED, and validated against the content limit and the publish
            # concurrency. An emptyDir with no sizeLimit is bounded by the
            # node's disk: filling it evicts every Pod on the node.
            sizeLimit: {{ .Values.artifactDaemon.outputScratch.sizeLimit }}
        - name: output-control-key
          secret:
            secretName: {{ $output.executionControl.keySecret }}
        - name: output-capability-key
          secret:
            secretName: {{ $output.capabilityKeySecret }}
        {{- if $capture }}
        - name: output-receipt-key
          secret:
            # The private half of the receipt key, mounted HERE and nowhere
            # else. Web, the controllers, the activation Jobs, the control init
            # container, the task and the sidecar hold the public key and the
            # key id.
            secretName: {{ $output.receipt.privateKeySecret }}
        - name: output-materialize-key
          secret:
            secretName: {{ $output.materializationKeySecret }}
        {{- end }}
        {{- end }}
      {{- with .Values.artifactDaemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifactDaemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifactDaemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $base }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
spec:
  # A node's source incarnations live on that node's disk and nowhere else, so
  # evicting a daemon that serves the output plane is taking the only
  # authority for its holds away. One at a time.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: artifact-daemon
{{- end }}
