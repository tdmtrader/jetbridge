{{- if .Values.artifactDaemon.enabled }}
{{- $tlsEnabled := .Values.artifactDaemon.tls.enabled | default false }}
{{- $tlsSecretName := .Values.artifactDaemon.tls.existingSecret | default (printf "%s-artifact-daemon-tls" (include "concourse.fullname" .)) }}
{{- $resolveCapabilitySecretName := .Values.artifactDaemon.resolveCapability.existingSecret | default (printf "%s-artifact-daemon-resolve-capability" (include "concourse.fullname" .)) }}
{{- if and .Values.agentSnapshots.enabled (empty .Values.artifactDaemon.hangar.bucket) }}
{{- fail "artifactDaemon.hangar.bucket is required when agentSnapshots.enabled is true" }}
{{- end }}
{{- /*
   Resolve mirror.replicas: numbers pass through (including the explicit
   value 0 = disabled); the literal "all" maps to -1 (the daemon's flag
   value for "every live peer"). Anything else is a misconfiguration and
   we let Helm fail loudly.

   Note: we read the value directly rather than using `default` because
   `default` treats Go's zero-value (int 0) as "unset" and would silently
   override an operator's intentional `replicas: 0` with the chart default.
*/ -}}
{{- $mirrorReplicasRaw := .Values.artifactDaemon.mirror.replicas }}
{{- if eq $mirrorReplicasRaw nil }}
  {{- $mirrorReplicasRaw = 2 }}
{{- end }}
{{- $mirrorReplicas := $mirrorReplicasRaw }}
{{- if kindIs "string" $mirrorReplicasRaw }}
  {{- if eq $mirrorReplicasRaw "all" }}
    {{- $mirrorReplicas = -1 }}
  {{- else }}
    {{- fail (printf "artifactDaemon.mirror.replicas must be an integer or the string \"all\", got %q" $mirrorReplicasRaw) }}
  {{- end }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
  {{- if .Values.image.digest }}
  annotations:
    {{- include "concourse.imageProvenanceAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: artifact-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "concourse.name" . }}
        app.kubernetes.io/component: artifact-daemon
      {{- if .Values.image.digest }}
      annotations:
        {{- include "concourse.imageProvenanceAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "concourse.fullname" . }}-artifact-daemon
      subdomain: {{ include "concourse.artifactDaemonServiceName" . }}
      terminationGracePeriodSeconds: 30
      # NOTE: Daemon runs as root — it manages a shared hostPath volume where task
      # containers (running as arbitrary UIDs) write artifacts with varying permissions.
      # K8s does not apply fsGroup to hostPath, so non-root cannot reliably read/clean
      # task-created files. CAP_DAC_OVERRIDE bypasses permission checks and CAP_CHOWN
      # assigns restored private session state to gid 65534. Everything else is dropped.
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artifact-daemon
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/concourse/bin/artifact-daemon
            - --port={{ .Values.artifactDaemon.port | default 7780 }}
            - --storage-path={{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - --ttl={{ .Values.artifactDaemon.ttl | default "2h" }}
            - --node-name=$(NODE_NAME)
            - --namespace={{ include "concourse.kubernetesNamespace" . }}
            - --service-name={{ include "concourse.artifactDaemonServiceName" . }}
            - --label-key=concourse.dev/artifact-cache
            - --resolve-capability-key=/etc/concourse/resolve-capability/resolve.key
            - --resolve-max-concurrent={{ .Values.artifactDaemon.resolve.maxConcurrent | default 32 }}
            - --resolve-timeout={{ .Values.artifactDaemon.resolve.timeout | default "30m" }}
            {{- if $tlsEnabled }}
            - --tls-cert=/etc/concourse/daemon-tls/tls.crt
            - --tls-key=/etc/concourse/daemon-tls/tls.key
            - --tls-ca-cert=/etc/concourse/daemon-tls/ca.crt
            {{- end }}
            - --mirror-replicas={{ $mirrorReplicas }}
            - --mirror-concurrency={{ .Values.artifactDaemon.mirror.concurrency | default 4 }}
            - --mirror-timeout={{ .Values.artifactDaemon.mirror.timeout | default "5m" }}
            {{- if .Values.agentSnapshots.enabled }}
            - --hangar-gcs-bucket={{ .Values.artifactDaemon.hangar.bucket }}
            - --hangar-scratch-dir={{ .Values.artifactDaemon.hangar.scratchPath | default (printf "%s/.hangar-scratch" (.Values.artifactDaemon.hostPath | default "/var/concourse/artifacts")) }}
            - --hangar-read-timeout={{ .Values.artifactDaemon.hangar.readTimeout | default "5m" }}
            - --hangar-write-timeout={{ .Values.artifactDaemon.hangar.writeTimeout | default "5m" }}
            {{- /*
              Rendered only when explicitly configured. An image predating these
              flags exits on an unknown flag, so emitting them unconditionally
              CrashLoopBackOffs every daemon the moment the chart syncs ahead of
              the image — which is exactly what happened on 2026-08-03. Left
              unset, the binary applies its own defaults (5m/2m), so the sweep
              still runs on an image that has it and an older image still boots.
            */}}
            {{- with .Values.artifactDaemon.hangar.inventoryInterval }}
            - --hangar-inventory-interval={{ . }}
            {{- end }}
            {{- with .Values.artifactDaemon.hangar.inventoryTimeout }}
            - --hangar-inventory-timeout={{ . }}
            {{- end }}
            {{- if .Values.artifactDaemon.hangar.endpoint }}
            - --hangar-gcs-endpoint={{ .Values.artifactDaemon.hangar.endpoint }}
            {{- end }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: {{ .Values.artifactDaemon.port | default 7780 }}
              hostPort: {{ .Values.artifactDaemon.port | default 7780 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tlsEnabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tlsEnabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
                - CHOWN
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.artifactDaemon.resources | nindent 12 }}
          volumeMounts:
            - name: artifact-storage
              mountPath: {{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - name: resolve-capability
              mountPath: /etc/concourse/resolve-capability
              readOnly: true
            {{- if $tlsEnabled }}
            - name: daemon-tls
              mountPath: /etc/concourse/daemon-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: artifact-storage
          hostPath:
            path: {{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            type: DirectoryOrCreate
        - name: resolve-capability
          secret:
            secretName: {{ $resolveCapabilitySecretName }}
        {{- if $tlsEnabled }}
        - name: daemon-tls
          secret:
            secretName: {{ $tlsSecretName }}
        {{- end }}
      {{- with .Values.artifactDaemon.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifactDaemon.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.artifactDaemon.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
