{{- if .Values.rbac.create }}
---
# ClusterRole for cluster-scoped resources (nodes, and secrets when the
# Kubernetes credential manager is on).
# The web SA needs node/get to resolve node names to IPs for artifact
# daemon communication (RegisterResourceCache, RecordOutputs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "concourse.fullname" . }}-web
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
rules:
  {{- if include "concourse.web.readsSecrets" . }}
  # Read pipeline credential secrets from the cluster. Limited to get
  # (no list/watch) to prevent enumerating all secrets in the cluster.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  # Resolve node names to IPs for artifact daemon communication
  # (DaemonClient uses node IP to reach the local daemon pod).
  #
  # Execution control adds list: web selects a Run execution's node, and the
  # node serving a result read or input upload, by listing nodes on their
  # readiness labels. Without it every Run start is a 403. Nodes carry no secrets; list is
  # granted only where that code is wired.
  - apiGroups: [""]
    resources: ["nodes"]
    {{- if .Values.hangarOutput.executionControl.enabled }}
    verbs: ["get", "list"]
    {{- else }}
    verbs: ["get"]
    {{- end }}
  {{- if eq .Values.kubernetes.stepRuntime "job" }}
  # The web validates a step pod's projected ServiceAccount token when the
  # pod fetches its step envelope.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "concourse.fullname" . }}-web
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "concourse.fullname" . }}-web
  apiGroup: rbac.authorization.k8s.io
---
# The step namespace (kubernetes.namespace, default the release namespace) is
# where web creates, execs into, watches and deletes step pods, step Jobs and
# their params Secrets, so this Role is rendered there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "concourse.fullname" . }}-pod-manager
  namespace: {{ include "concourse.kubernetesNamespace" . }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
rules:
  # Task and check pod lifecycle management.
  # Concourse creates pods with label concourse.ci/* — future RBAC tightening
  # can use resourceNames or admission webhooks to restrict to labeled pods only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # pods/exec stays granted in both step runtimes: a Run-owned exact
  # execution still uses exec in this release even under stepRuntime=job.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- if eq .Values.kubernetes.stepRuntime "job" }}
  # stepRuntime=job: one suspended batch/v1 Job per step, which the web
  # creates, unsuspends, watches and deletes.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- else }}
  # stepRuntime=exec creates no step Jobs, but the reaper still collects the
  # ones a web left behind under job: a deployment switched back to exec has
  # nothing else that removes them.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
  {{- end }}
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # One Secret per task step, step-env-<handle>, holding the task's params:
  # the step pod reads each param through a secretKeyRef rather than a
  # literal value in its spec. create makes it, patch points its
  # ownerReference at the pause pod, delete replaces a stale one and lets the
  # reaper collect one a web left behind. Granted under both step runtimes: a
  # Run-owned exact execution runs on exec under either. No get, list or
  # watch: web writes these Secrets and never reads one back, and a Role that
  # could list them could read every Secret in the step namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  # Read-only PVC access for cache and artifact volume discovery.
  # No create/delete — PVCs are pre-provisioned by operators or hostPath-backed.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  # No apps/deployments or apps/daemonsets: web calls neither API. The
  # self-upgrade pipeline's `kubectl rollout` runs as its own step pod grant's
  # ServiceAccount, never as this one.
  {{- if eq (include "concourse.kubernetesNamespace" .) .Release.Namespace }}
  {{- include "concourse.web.releaseNamespaceRules" . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "concourse.fullname" . }}-pod-manager
  namespace: {{ include "concourse.kubernetesNamespace" . }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "concourse.fullname" . }}-pod-manager
  apiGroup: rbac.authorization.k8s.io
{{- if ne (include "concourse.kubernetesNamespace" .) .Release.Namespace }}
---
# With step pods in their own namespace, what web still reads in the release
# namespace -- the artifact daemon's EndpointSlices, and under the job step
# runtime its own pod -- is granted here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "concourse.fullname" . }}-web-release
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
rules:
  {{- include "concourse.web.releaseNamespaceRules" . | nindent 2 }}
  {{- if eq .Values.kubernetes.stepRuntime "job" }}
  # The job step runtime reads this web's own pod for the image it runs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "concourse.fullname" . }}-web-release
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "concourse.fullname" . }}-web-release
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}

{{/*
What web reads in the release namespace, where the artifact daemon runs.
*/}}
{{- define "concourse.web.releaseNamespaceRules" -}}
# EndpointSlice discovery for artifact daemon peer resolution.
# DaemonClient uses this to find daemon pod IPs for cross-node
# artifact streaming and resource cache probing. Read-only.
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
{{- end }}
