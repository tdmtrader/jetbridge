{{- if .Values.rbac.create }}
---
# ClusterRole for cluster-scoped resources (nodes, secrets).
# The web SA needs node/get to resolve node names to IPs for artifact
# daemon communication (RegisterResourceCache, RecordOutputs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "concourse.fullname" . }}-web
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
rules:
  # Read pipeline credential secrets from the cluster. Limited to get
  # (no list/watch) to prevent enumerating all secrets in the cluster.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Resolve node names to IPs for artifact daemon communication
  # (DaemonClient uses node IP to reach the local daemon pod).
  #
  # Execution control adds list: web selects a Run execution's node, and the
  # node serving a result read or input upload, by listing nodes on their
  # readiness labels. Without it every Run start is a 403. Nodes carry no secrets; list is
  # granted only where that code is wired.
  - apiGroups: [""]
    resources: ["nodes"]
    {{- if .Values.hangarOutput.executionControl.enabled }}
    verbs: ["get", "list"]
    {{- else }}
    verbs: ["get"]
    {{- end }}
  {{- if eq .Values.kubernetes.stepRuntime "job" }}
  # The web validates a step pod's projected ServiceAccount token when the
  # pod fetches its step envelope.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "concourse.fullname" . }}-web
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "concourse.fullname" . }}-web
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "concourse.fullname" . }}-pod-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
rules:
  # Task and check pod lifecycle management.
  # Concourse creates pods with label concourse.ci/* — future RBAC tightening
  # can use resourceNames or admission webhooks to restrict to labeled pods only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # pods/exec stays granted in both step runtimes: a Run-owned exact
  # execution still uses exec in this release even under stepRuntime=job.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- if eq .Values.kubernetes.stepRuntime "job" }}
  # stepRuntime=job: one suspended batch/v1 Job per step, which the web
  # creates, unsuspends, watches and deletes.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read-only PVC access for cache and artifact volume discovery.
  # No create/delete — PVCs are pre-provisioned by operators or hostPath-backed.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
  # Worker registrar updates the web deployment's annotations to
  # record worker state and heartbeat timestamps.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Self-upgrade/verify-upgrade pipeline runs `kubectl rollout status/restart`
  # against the artifact-daemon DaemonSet. rollout status needs list/watch;
  # without them the check hangs until timeout and the job errors.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # EndpointSlice discovery for artifact daemon peer resolution.
  # DaemonClient uses this to find daemon pod IPs for cross-node
  # artifact streaming and resource cache probing. Read-only.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "concourse.fullname" . }}-pod-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "concourse.fullname" . }}-pod-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
