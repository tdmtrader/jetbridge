{{/*
The activation walk Job, and the identity it runs under.

The Job runs `hangar-output-activate --mode=walk --target=<target>`, which moves
the configured epoch's row toward hangarOutput.activation.target: it reads the
row first, makes only the transitions still needed, and never advances a
draining or disabled facet. A walk repeated at its target writes nothing.

Why it is now a hook. The step Jobs this replaces each made one one-way
transition, so they were deliberately not hooks: re-running `enable` on a plane
an operator took down was the surprise to avoid. A walk re-run is a no-op
instead, so it can run on every sync, and it has to run after the bootstrap
database Job has created the activation role and its Secret. It is an Argo
PostSync hook in a wave after that Job, and a Helm post-install/post-upgrade
hook for a plain `helm upgrade`, weighted after the database Job's hook. Helm
waits for each hook Job to finish within --timeout, and the walk can wait up
to its readiness timeout (10m) for the output DaemonSet before each attest, so
a plain Helm install or upgrade needs a --timeout above that; Helm's default
is 5m. BeforeHookCreation deletes the previous run before the next, which is
what the per-mode, per-epoch Job name used to do: a Job's pod template is
immutable, and an image bump or a new epoch would otherwise fail the apply.

No single Helm value enables a capability. The walk still attests through the
cohort handshake, enables through the facet's preconditions, refuses a mixed
cohort, and output can never be enabled while base is not -- all of which live
in the command and the schema, not in this template.

The Job mounts the database Secret and the output plane's CLIENT certificate --
hangarOutput.daemon.tls.clientSecret, and never the daemon's own server Secret,
which holds the key the daemon SERVES with: an exploit of this Job would
otherwise obtain the material to impersonate the output daemon to the ATC. It
mounts NO receipt private key either: the activation identity signs nothing,
and a key in a Pod that cannot need it is a key an exploit of that Pod gets for
free.
*/}}
{{- $target := .Values.hangarOutput.activation.target | default "off" }}
{{- if not (has $target (list "off" "base" "output")) }}
{{- fail (printf "hangarOutput.activation.target is %q; it is off, base or output" $target) }}
{{- end }}
{{- if and (ne $target "off") (not .Values.hangarOutput.executionControl.enabled) }}
{{- fail (printf "hangarOutput.activation.target is %q, which needs hangarOutput.executionControl.enabled: the walk attests the base facet's cohort, and without execution control there is no cohort and no walk Job. Set hangarOutput.activation.target=off, or turn execution control on." $target) }}
{{- end }}
{{- if and (eq $target "output") (not .Values.hangarOutput.enabled) }}
{{- fail "hangarOutput.activation.target is \"output\", which needs hangarOutput.enabled: the output facet attests the capture plane's cohort, and without hangarOutput.enabled nothing serves it. Set hangarOutput.activation.target=base, or turn the output plane on." }}
{{- end }}
{{- if .Values.hangarOutput.executionControl.enabled }}
{{- $name := include "concourse.hangarOutput.qualifiedName" (dict "root" . "suffix" "hangar-output-walk") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "concourse.hangarOutput.activationServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-output-activation
  {{- with .Values.hangarOutput.activation.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "concourse.hangarOutput.activationName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-output-activation
rules:
  # Attestation enumerates the daemon cohort from the API rather than from node
  # labels: a label is a hint the daemon itself wrote, and attesting from it
  # would be asking the cohort whether it is homogeneous. Read-only, in one
  # namespace.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # The walk waits on the output DaemonSet's rollout before each attestation.
  # One verb on one name: the DaemonSet is read through a namespaced get, and
  # this Role reads no other workload.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    resourceNames: [{{ include "concourse.hangarOutput.daemonName" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "concourse.hangarOutput.activationName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-output-activation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "concourse.hangarOutput.activationName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.hangarOutput.activationServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: hangar-output-activation
  annotations:
    # A wave after the bootstrap database Job (wave 0), which creates the
    # activation role and the Secret this Job reads its DSN from.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  {{- with .Values.hangarOutput.activation.job.ttlSecondsAfterFinished }}
  # A finished walk is deleted after this, and the next sync recreates it.
  ttlSecondsAfterFinished: {{ int . }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "concourse.name" . }}
        app.kubernetes.io/component: hangar-output-activation
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "concourse.hangarOutput.activationServiceAccount" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hangar-output-activate
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/concourse/bin/hangar-output-activate
            - --mode=walk
            - --target={{ $target }}
            - --epoch={{ int .Values.hangarOutput.activationEpoch }}
            - --namespace={{ .Release.Namespace }}
            - --daemon-port={{ .Values.hangarOutput.daemon.port }}
            - --daemonset-name={{ include "concourse.hangarOutput.daemonName" . }}
            - --tls-cert=/etc/concourse/hangar-output/tls/tls.crt
            - --tls-key=/etc/concourse/hangar-output/tls/tls.key
            - --tls-ca-cert=/etc/concourse/hangar-output/tls/ca.crt
            # The cohort is dialed by pod IP; the certificate names the
            # daemon's DNS name, so verification is against that.
            - --tls-server-name={{ include "concourse.hangarOutput.daemonTLSServerName" . }}
            - --receipt-key-lifetime={{ .Values.hangarOutput.activation.receiptKeyLifetime }}
            {{- if .Values.hangarOutput.activation.job.finalize }}
            - --finalize
            {{- end }}
          env:
            - name: HANGAR_OUTPUT_DSN
              valueFrom:
                secretKeyRef:
                  # The ACTIVATION role's credential, not the web pod's. The web
                  # pod's is what the migrate-db init container uses; sharing it
                  # would make "only the activation command writes this table"
                  # a statement about code that any web process could contradict.
                  name: {{ required "hangarOutput.database.existingSecret is required with hangarOutput.executionControl.enabled: the activation walk Job runs on every sync as the activation database role, and this Secret holds its connection string" .Values.hangarOutput.database.existingSecret }}
                  key: dsn
          volumeMounts:
            - name: daemon-tls
              mountPath: /etc/concourse/hangar-output/tls
              readOnly: true
          {{- include "concourse.hangarOutput.controllerSecurityContext" . | nindent 10 }}
      volumes:
        - name: daemon-tls
          secret:
            secretName: {{ .Values.hangarOutput.daemon.tls.clientSecret }}
{{- end }}
