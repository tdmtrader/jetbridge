{{- if and .Values.secrets.create (not .Values.secrets.signingKeySecret) }}
{{- $secretName := printf "%s-keys" (include "concourse.fullname" .) }}
{{/*
  Mint the session signing key once and reuse it on every later render, so a
  helm upgrade does not invalidate live sessions. genPrivateKey "rsa" emits a
  PKCS#1 "RSA PRIVATE KEY" PEM, which is what the web command's
  --session-signing-key loader (jwt.ParseRSAPrivateKeyFromPEM) expects.
  `lookup` returns nothing during `helm template`, so a template-only render
  both mints a throwaway key and prints that private key in cleartext base64
  below. Never commit rendered output; set secrets.signingKeySecret in
  pipelines that never talk to the cluster (see the chart README).
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $signingKey := "" }}
{{- if and $existing $existing.data (index $existing.data "session_signing_key") }}
  {{- $signingKey = index $existing.data "session_signing_key" }}
{{- else }}
  {{- $signingKey = genPrivateKey "rsa" | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  session_signing_key: {{ $signingKey }}
{{- end }}
