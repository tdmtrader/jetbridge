{{- if .Values.alertingRules.enabled }}
{{/*
  Every expression below must select a series some exporter actually emits.
  Three independent pipelines feed this rule group, and an expression written
  against the wrong one evaluates over an empty vector forever — Prometheus
  reports no error, so the operator sees a green alert that is structurally
  incapable of firing.

    concourse_k8s_*, concourse_db_*, concourse_workers_*
      atc/metric/emitter/prometheus.go, scraped from the web node's dedicated
      Prometheus listener. Requires web.metrics.enabled (see values.yaml).

    concourse_agent_*
      OTel instruments pushed over OTLP.
      Requires otelMetrics.otlpAddress, or an equivalent collector configured
      outside the chart. Names carry the unit suffix the OTLP-to-Prometheus
      translation appends: a Float64Histogram WithUnit("s") becomes
      ..._seconds_bucket/_sum/_count, while a unit-less Int64Counter becomes
      ..._total.

    artifact_daemon_*
      cmd/artifact-daemon/metrics.go, scraped by the artifact-daemon
      ServiceMonitor.
*/}}
{{- $apiMaxConns := int (.Values.web.apiMaxConns | default 10) }}
{{- $backendMaxConns := int (.Values.web.backendMaxConns | default 50) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "concourse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    {{- with .Values.alertingRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: concourse.rules
      rules:
        - alert: ConcourseImagePullFailureRateHigh
          expr: increase(concourse_k8s_image_pull_failures_total[5m]) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High image pull failure rate"
            description: "More than 5 image pull failures in the last 5 minutes."
        # The Prometheus histogram is registered as
        # pod_startup_duration_milliseconds with buckets up to 120000, so both
        # the series name and the millisecond threshold follow the instrument.
        - alert: ConcoursePodStartupSlow
          expr: histogram_quantile(0.95, rate(concourse_k8s_pod_startup_duration_milliseconds_bucket[5m])) > 60000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Slow pod startup (p95 > 60s)"
            description: "95th percentile pod startup duration exceeds 60 seconds."
        # No exporter publishes a pool maximum, so the limit is taken from the
        # same values that render --api-max-conns/--backend-max-conns onto the
        # web container (falling back to the binary's own defaults when those
        # values are unset, exactly as the Deployment does). The emitted gauge
        # is concourse_db_connections{dbname=...}; the api and backend pools
        # are the two an operator can size and the two that stall the ATC.
        - alert: ConcourseDBConnectionPoolExhausted
          expr: concourse_db_connections{dbname="api"} >= {{ $apiMaxConns }} or concourse_db_connections{dbname="backend"} >= {{ $backendMaxConns }}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database connection pool exhausted"
            description: "Active DB connections have reached the configured maximum pool size (api {{ $apiMaxConns }}, backend {{ $backendMaxConns }})."
        # Replaces an alert on concourse_worker_heartbeat_age: that OTel gauge
        # is declared but never recorded by any production call site, so it is
        # emitted under no name at all. A worker that stops heartbeating past
        # its TTL is moved to the `stalled` state by the worker collector,
        # which does publish concourse_workers_registered{state=...}.
        - alert: ConcourseWorkerStalled
          expr: concourse_workers_registered{state="stalled"} > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Worker stalled"
            description: "A worker stopped re-registering and was marked stalled (heartbeat TTL is 30s); it may be unhealthy or partitioned."
        - alert: ConcourseHangarSnapshotFailures
          expr: increase(artifact_daemon_snapshot_operations_total{operation=~"put|get",status="error"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hangar-backed snapshot operation failures"
            description: "Artifact daemons are unable to commit or restore durable agent snapshots. This is a trailing signal: by the time it fires, snapshot reads or writes are already failing. ConcourseHangarStoreNearCapacity and ConcourseHangarStoreWillFill are the leading indicators for the full-store cause."
{{- if .Values.agentSnapshots.enabled }}
        # Residency alerts. artifact_daemon_hangar_bytes describes the whole
        # store, and the daemon is a DaemonSet, so every node reports the same
        # total. Deduplicate with `max by (kind)` and only then sum across
        # kinds; sum() over the raw series would multiply the store by the node
        # count and make a healthy store look full.
        - alert: ConcourseHangarResidencyStale
          expr: time() - max(artifact_daemon_hangar_inventory_timestamp_seconds > 0) > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hangar residency has not been observed for over an hour"
            description: "The residency gauges are cached between sweeps, so they hold their last values when refreshes stop. Every capacity and growth alert below is therefore evaluating stale numbers and cannot be trusted to fire. Check daemon logs for hangar-inventory-refresh-failed and confirm the daemons can still list the bucket."
        - alert: ConcourseHangarResidencyRefreshFailing
          expr: increase(artifact_daemon_hangar_inventory_refreshes_total{status="error"}[30m]) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Hangar residency enumeration is failing"
            description: "Daemons cannot enumerate the Hangar bucket. This also covers the case where no sweep has ever succeeded, which ConcourseHangarResidencyStale cannot see because it has no successful timestamp to age."
        - alert: ConcourseHangarStoreGrowthAbnormal
          expr: |-
            sum(max by (kind) (artifact_daemon_hangar_bytes))
              / sum(max by (kind) (artifact_daemon_hangar_bytes offset 24h)) > 2
            and sum(max by (kind) (artifact_daemon_hangar_bytes offset 24h)) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Hangar store has more than doubled in 24h"
            description: "Durable storage is growing far faster than workload alone explains. Unreferenced objects accumulate silently when a snapshot upload or commit fails, and nothing bounds them. Compare artifact_daemon_hangar_objects against live snapshot rows, and consider the orphan sweep in report mode. This alert needs no configured capacity, which is why it is the only growth signal available when artifactDaemon.hangar.capacityBytes is unset."
{{- $capacity := int64 (.Values.artifactDaemon.hangar.capacityBytes | default 0) }}
{{- if gt $capacity 0 }}
        - alert: ConcourseHangarStoreNearCapacity
          expr: sum(max by (kind) (artifact_daemon_hangar_bytes)) / {{ $capacity }} > 0.75
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hangar store is over 75% full"
            description: "Durable snapshot storage is filling. A full store fails every snapshot write and then every snapshot read that misses local cache. Reclaim unreferenced objects or raise the provisioned capacity before it is exhausted."
        - alert: ConcourseHangarStoreCriticallyFull
          expr: sum(max by (kind) (artifact_daemon_hangar_bytes)) / {{ $capacity }} > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Hangar store is over 90% full"
            description: "Durable snapshot storage is nearly exhausted and agent snapshot writes are about to start failing. Reclaim space now."
        - alert: ConcourseHangarStoreWillFill
          expr: predict_linear(sum(max by (kind) (artifact_daemon_hangar_bytes))[6h:10m], 24 * 3600) > {{ $capacity }}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Hangar store is projected to fill within 24h"
            description: "Extrapolating the last 6 hours of growth, durable snapshot storage reaches its configured capacity of {{ $capacity }} bytes within a day. This is the earliest warning available: it fires while the store still has room, unlike ConcourseHangarSnapshotFailures which only reports after writes have already failed."
{{- end }}
{{- end }}
{{- end }}
