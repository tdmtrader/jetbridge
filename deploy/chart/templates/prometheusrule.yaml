{{- if .Values.alertingRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "concourse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    {{- with .Values.alertingRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: concourse.rules
      rules:
        - alert: ConcourseImagePullFailureRateHigh
          expr: increase(concourse_k8s_image_pull_failures_total[5m]) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High image pull failure rate"
            description: "More than 5 image pull failures in the last 5 minutes."
        - alert: ConcoursePodStartupSlow
          # The histogram is named ..._duration_milliseconds; the bucket series
          # therefore ends _milliseconds_bucket. Summing by le first is what
          # makes the quantile correct across replicas.
          expr: histogram_quantile(0.95, sum by (le) (rate(concourse_k8s_pod_startup_duration_milliseconds_bucket[5m]))) > 60000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Slow pod startup (p95 > 60s)"
            description: "95th percentile pod startup duration exceeds 60 seconds."
        - alert: ConcourseDBConnectionPoolExhausted
          # The ATC emits one gauge per pool, concourse_db_connections{dbname},
          # and no maximum -- so the ceiling has to come from the same values
          # this chart passes as --api-max-conns/--backend-max-conns. Naming a
          # literal here instead would go stale the moment either is tuned.
          expr: concourse_db_connections{dbname="api"} >= {{ .Values.web.apiMaxConns }} or concourse_db_connections{dbname="backend"} >= {{ .Values.web.backendMaxConns }}
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database connection pool exhausted"
            description: "A pool has reached its configured maximum (api={{ .Values.web.apiMaxConns }}, backend={{ .Values.web.backendMaxConns }}); requests now queue for a connection."
        - alert: ConcourseWorkerStalled
          # There is no heartbeat-age metric. The database's own view of worker
          # state is what is published, and `stalled` is precisely the state a
          # worker lands in when it stops re-registering.
          expr: concourse_workers_registered{state="stalled"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A worker is stalled"
            description: "{{ `{{ $value }}` }} worker(s) have stopped re-registering and are marked stalled; steps scheduled to them will not run."
{{- /*
The artifact daemon. Its rules render only with artifactDaemon.metrics.port,
which is what makes the daemon scrapeable at all: without it every one of these
would evaluate against no data and sit Inactive looking like coverage.

The rules this chart once carried for the daemon watched the old Hangar store's
residency (artifact_daemon_hangar_*). That instrumentation is gone and those
series no longer exist, so the rules are not coming back as they were; these
watch what the daemon publishes now. tests/alert_metric_drift_test.go resolves
every artifact_daemon_ name here against cmd/artifact-daemon/metrics.go.
*/}}
{{- if .Values.artifactDaemon.metrics.port }}
{{- $daemonTarget := printf "namespace=\"%s\", service=\"%s\"" .Release.Namespace (include "concourse.artifactDaemonServiceName" .) }}
{{- if .Values.serviceMonitor.enabled }}
        - alert: ArtifactDaemonNotScraped
          # absent(), because an unscraped target has no `up` series to be 0.
          # This is the state the daemon's metrics were in for their whole life
          # before the metrics listener: every series published, none collected,
          # nothing able to fire. It is also what an unselected ServiceMonitor
          # looks like from here.
          expr: absent(up{ {{- $daemonTarget -}} })
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus is not scraping the artifact daemon"
            description: "No artifact daemon target exists. The ServiceMonitor is missing, not selected by this Prometheus, or names a port the daemon's Service does not have; every artifact daemon alert is blind until it is fixed."
        - alert: ArtifactDaemonScrapeFailing
          expr: up{ {{- $daemonTarget -}} } == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "An artifact daemon is not answering its metrics scrape"
            description: "The daemon on {{ `{{ $labels.node }}` }} ({{ `{{ $labels.pod }}` }}) has failed every scrape for ten minutes: the listener is configured but not answering, so look for a NetworkPolicy dropping the scrape or a daemon that keeps restarting."
{{- end }}
        - alert: ArtifactDaemonRefusingForLoad
          # `overloaded` is the one refusal reason that is the daemon's own
          # state rather than a caller's mistake. Only Hangar materialization
          # records it today (hangar_handlers.go, when every hangarSem slot is
          # taken), so where Hangar is off this rule loads but cannot fire.
          # Every other reason names what the caller did wrong and is
          # answered by fixing the caller.
          expr: sum by (namespace, pod, node) (increase(artifact_daemon_refusals_total{reason="overloaded"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "An artifact daemon is refusing work for load"
            description: "The daemon on {{ `{{ $labels.node }}` }} has refused {{ `{{ $value }}` }} Hangar materialization(s) as overloaded in the last ten minutes, for ten minutes running. Each is a step whose strict inputs could not be materialized on that node."
{{- end }}
{{- if .Values.hangarOutput.enabled }}
        # The Hangar output plane. Requirement 52 asks the plane to ALERT when
        # its lifetime-policy trust cannot be proved safe, and these are that
        # alert: the ATC publishes the plane's operational state on the existing
        # scrape path every minute, and these rules make an at-risk plane, a
        # stuck capture, a stalled reclaim or sweep, and drain residue visible
        # without reading the database.
        - alert: HangarOutputPlaneAtRisk
          # `for` is deliberately short. At-risk is FAIL-CLOSED: from detection
          # onward the plane blocks new captures, claim acquires, managed-output
          # warrants and reclaim admission. Waiting five minutes to say so would
          # be five minutes of refused builds with no alert.
          expr: concourse_hangar_output_at_risk > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "The Hangar output plane is at risk and has stopped admitting new work"
            description: "The output plane has unresolved runtime integrity failures ({{ `{{ $labels.reasons }}` }}). New captures, claim acquisitions, managed-output warrants and reclaim admission are all blocked; releases and diagnosis still work. Reconcile missing objects or denied runtime operations before explicitly resolving the recorded findings."
        - alert: HangarOutputCapturesStuckPublishing
          # A capture is publishing from the moment its daemon starts the upload
          # until the web records the published generation. That is minutes,
          # not half an hour; one still publishing is a daemon that stopped
          # answering or a publication the web never heard about.
          expr: concourse_hangar_output_plane_inventory{kind="publishing_captures"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Hangar output captures are stuck publishing"
            description: "{{ `{{ $value }}` }} capture(s) have been publishing for at least thirty minutes. Each pins its generation and its node's scratch until the capture deadline terminalises it."
        - alert: HangarOutputCapturesUnreleased
          # A terminal capture whose generation was never released holds back
          # reclamation of everything it pinned.
          expr: concourse_hangar_output_plane_inventory{kind="unreleased_captures"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Hangar output captures are not being released"
            description: "{{ `{{ $value }}` }} terminal capture(s) have not been released for an hour; nothing they hold can be reclaimed until they are."
        - alert: HangarOutputReclaimBacklog
          expr: concourse_hangar_output_plane_inventory{kind="unfinalized_reclaim_jobs"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Hangar output reclaim jobs are not finalizing"
            description: "{{ `{{ $value }}` }} admitted conditional delete(s) have no outcome after an hour. Every one of them is an object whose disposition is unknown: the delete may have happened and the answer may have been lost. The web runs the reclaim pass; look at its logs."
        - alert: HangarOutputOrphanSweepStalled
          # The web's orphan sweep counts every pass that judged a page and did
          # not fail; a failed pass and one that found the lock held elsewhere
          # are not counted. A counter that has not moved in three hours --
          # three times the default interval -- while the plane is in service
          # is a sweep that is not running or not succeeding.
          expr: changes(concourse_hangar_output_orphan_sweep_passes_total[3h]) == 0 and on() concourse_hangar_output_enabled == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The Hangar output orphan sweep has stopped completing passes"
            description: "No orphan sweep pass has completed in three hours while the output plane is in service. Objects no capture registered are not being removed from the output namespace."
        - alert: HangarOutputOrphanSweepFailing
          # A pass that stopped on an error -- the list, a judgement or a
          # delete -- is counted here and NOT as a completed pass, so a sweep
          # that fails every time also trips the stalled alert above; this one
          # says why, sooner.
          expr: increase(concourse_hangar_output_orphan_sweep_failures_total[1h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hangar output orphan sweep passes are failing"
            description: "{{ `{{ $value }}` }} orphan sweep pass(es) failed in the last hour. The web's log line hangar-output-orphan-sweep-failed names the error; until it stops, orphans in the output namespace are not removed."
        - alert: HangarOutputDrainResidue
          # Drain is: set hangarOutput.webEnabled false, wait for residue to
          # reach zero (`fly hangar-status`), then remove the daemon. Residue
          # that sits for a day out of service is a drain that is not
          # finishing, and removing the daemon now would strand it.
          expr: concourse_hangar_output_plane_inventory{kind="residue"} > 0 and on() concourse_hangar_output_enabled == 0
          for: 24h
          labels:
            severity: info
          annotations:
            summary: "The drained Hangar output plane still holds residue"
            description: "The output plane has been out of service for a day and still holds {{ `{{ $value }}` }} live item(s). Do not remove the artifact daemon's output plane until `fly hangar-status` reports zero residue."
{{- end }}
{{- end }}
