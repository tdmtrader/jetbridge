{{- if .Values.alertingRules.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "concourse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    {{- with .Values.alertingRules.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: concourse.rules
      rules:
        - alert: ConcourseImagePullFailureRateHigh
          expr: increase(concourse_k8s_image_pull_failures_total[5m]) > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High image pull failure rate"
            description: "More than 5 image pull failures in the last 5 minutes."
        - alert: ConcoursePodStartupSlow
          expr: histogram_quantile(0.95, rate(concourse_k8s_pod_startup_duration_bucket[5m])) > 60000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Slow pod startup (p95 > 60s)"
            description: "95th percentile pod startup duration exceeds 60 seconds."
        - alert: ConcourseDBConnectionPoolExhausted
          expr: concourse_db_connections_open >= concourse_db_connections_max
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database connection pool exhausted"
            description: "Active DB connections have reached the maximum pool size."
        - alert: ConcourseWorkerHeartbeatStale
          expr: concourse_worker_heartbeat_age > 60
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Worker heartbeat stale (>60s)"
            description: "A worker has not re-registered in over 60 seconds (heartbeat TTL is 30s); it may be unhealthy or partitioned."
        - alert: ConcourseHangarSnapshotFailures
          expr: increase(artifact_daemon_snapshot_operations_total{operation=~"put|get",status="error"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hangar-backed snapshot operation failures"
            description: "Artifact daemons are unable to commit or restore durable agent snapshots."
        - alert: ConcourseAgentCheckpointCaptureFailures
          expr: increase(concourse_agent_checkpoint_captures_total{outcome="failed"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Agent checkpoint capture failures"
            description: "Inspect agent checkpoint capture errors and durable snapshot storage before retrying the affected run."
        - alert: ConcourseAgentRecoveryManualReviewRequired
          expr: increase(concourse_agent_recovery_attempts_total{outcome="manual_review_required"}[5m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Agent recovery requires manual review"
            description: "Review the interrupted agent run for ambiguous effects or an unusable checkpoint before resuming it."
        - alert: ConcourseAgentCheckpointRestoreFailures
          expr: increase(concourse_agent_recovery_restore_duration_count{outcome="failed"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Agent checkpoint restore failures"
            description: "Inspect the checkpoint object and recovery logs before retrying restore for the affected run."
{{- end }}
