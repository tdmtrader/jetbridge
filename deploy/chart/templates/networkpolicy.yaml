# Hermetic task/agent pods are isolated by default, independently of the
# broader networkPolicy.enabled switch. Jetbridge adds this selector from the
# server-side runtime.ContainerSpec; pipeline-supplied labels cannot forge it.
#
# Kubernetes NetworkPolicy always permits traffic to the pod's own node. The
# artifact bootstrap intentionally uses that exception to reach the node-local
# artifact-daemon hostPort without opening DNS, metadata, or general cluster
# egress. See the chart README for the residual same-node reachability.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-hermetic-egress
  namespace: {{ include "concourse.kubernetesNamespace" . }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
  {{- if and (include "concourse.agentStepConfigured" .) (not .Values.networkPolicy.hermeticEgressTo) }}
  annotations:
    concourse.ci/hermetic-egress-warning: >-
      agent: steps are configured (agentSnapshots.enabled, --agent-step-image,
      or CONCOURSE_AGENT_STEP_IMAGE) but networkPolicy.hermeticEgressTo is
      empty: an agent: node cannot reach a model endpoint and fails with only
      a client-side timeout, unless agentBroker.networkPolicy.egress is
      configured instead. See values.yaml networkPolicy.hermeticEgressTo.
  {{- end }}
spec:
  podSelector:
    matchLabels:
      concourse.ci/hermetic: "true"
  policyTypes:
    - Ingress
    - Egress
  # NetworkPolicy does not govern loopback traffic between containers in this
  # pod, so the task and its sidecars retain their same-pod communication.
  ingress: []
{{- if .Values.networkPolicy.hermeticEgressTo }}
  egress:
    {{- toYaml .Values.networkPolicy.hermeticEgressTo | nindent 4 }}
{{- else }}
  egress: []
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "concourse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 2222
          protocol: TCP
        {{- if .Values.web.tls.enabled }}
        - port: {{ .Values.web.tls.bindPort }}
          protocol: TCP
        {{- end }}
        {{- if .Values.web.metrics.enabled }}
        # Unlike the daemon port, this one serves only the Prometheus
        # exposition format, so it follows the same peers as the API.
        - port: {{ .Values.web.metrics.port }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and .Values.web.metrics.enabled .Values.networkPolicy.ingressFrom }}
    {{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.web.enabled }}
    {{- with .Values.serviceMonitor.scrapeFrom }}
    # networkPolicy.ingressFrom narrows the rule above to named peers, which
    # normally excludes the Prometheus namespace. Without this the scrape is
    # dropped with no error anywhere: the target simply never succeeds.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.web.metrics.port }}
          protocol: TCP
    {{- else }}
    {{- fail "serviceMonitor.scrapeFrom must list the Prometheus NetworkPolicyPeers when networkPolicy.ingressFrom restricts web ingress and the web ServiceMonitor is enabled — otherwise every scrape of the web metrics port is silently dropped." }}
    {{- end }}
    {{- end }}
    {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "concourse.selectorLabels" . | nindent 14 }}
{{- end }}
{{- if .Values.networkPolicy.taskEgressTo }}
---
# Task pod egress: restrict outbound traffic from CI task pods.
# Always allows DNS, artifact daemon, and GKE metadata server
# (required for Workload Identity token refresh at 169.254.169.254).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-task-egress
  namespace: {{ include "concourse.kubernetesNamespace" . }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: concourse.ci/worker
        operator: Exists
      # NetworkPolicy allowlists are additive. Never let this broader policy's
      # DNS, metadata, artifact, or operator rules widen a hermetic pod.
      - key: concourse.ci/hermetic
        operator: NotIn
        values:
          - "true"
  policyTypes:
    - Egress
  egress:
    # DNS resolution (kube-dns / CoreDNS)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # GKE metadata server — required for Workload Identity token refresh.
    # Without this, pods lose GCP credentials when egress is restricted.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
          protocol: TCP
        - port: 988
          protocol: TCP
    {{- if .Values.artifactDaemon.enabled }}
    # Artifact daemon on each node
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: artifact-daemon
      ports:
        - port: {{ .Values.artifactDaemon.port | default 7780 }}
          protocol: TCP
    {{- end }}
    # Operator-configured additional egress targets
    {{- range .Values.networkPolicy.taskEgressTo }}
    - to:
        {{- toYaml (list .) | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.agentBroker.enabled }}
---
# This selector applies to the complete managed task pod. Kubernetes
# NetworkPolicy cannot isolate one sidecar inside a shared network namespace;
# operators must include every destination required by both the parent agent
# and broker. Same-pod loopback remains outside NetworkPolicy enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-agent-broker-egress
  namespace: {{ include "concourse.kubernetesNamespace" . }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      concourse.ci/agent-broker: "true"
  policyTypes:
    - Egress
  {{- with .Values.agentBroker.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
