{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "concourse.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 2222
          protocol: TCP
        {{- if .Values.web.tls.enabled }}
        - port: {{ .Values.web.tls.bindPort }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 5432
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "concourse.selectorLabels" . | nindent 14 }}
{{- end }}
{{/*
The artifact daemon's NetworkPolicy is NOT rendered here.

It used to be, and it rendered `<fullname>-artifact-daemon` -- the same name
templates/artifact-daemon-networkpolicy.yaml renders. Two NetworkPolicies with
one name in one namespace are one object: whichever Helm sent last won, with no
error and no event, so which pods could reach the daemon was decided by apply
order. The two copies disagreed, which made that a correctness fork and not
only untidiness -- this copy selected task pods by `concourse.ci/pipeline
Exists`, and a one-off build's pod carries no pipeline, so under this copy a
one-off build could not fetch an artifact at all.

The daemon's policy therefore lives in exactly one template, selects
`concourse.ci/worker Exists` (which the K8s runtime puts on every task and check
pod it builds) and is switched by `artifactDaemon.networkPolicy.enabled`.
`networkPolicy.enabled` covers web and the bundled database; it no longer emits
a daemon policy, so a deployment that wants the daemon isolated sets the
daemon's own switch. tests/networkpolicy_test.go holds both halves.
*/}}
{{- if .Values.networkPolicy.taskEgressTo }}
---
# Task pod egress: restrict outbound traffic from CI task pods.
# Always allows DNS, artifact daemon, and GKE metadata server
# (required for Workload Identity token refresh at 169.254.169.254).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-task-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: concourse.ci/pipeline
        operator: Exists
  policyTypes:
    - Egress
  egress:
    # DNS resolution (kube-dns / CoreDNS)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # GKE metadata server — required for Workload Identity token refresh.
    # Without this, pods lose GCP credentials when egress is restricted.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - port: 80
          protocol: TCP
        - port: 988
          protocol: TCP
    {{- if .Values.artifactDaemon.enabled }}
    # Artifact daemon on each node
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: artifact-daemon
      ports:
        - port: {{ .Values.artifactDaemon.port | default 7780 }}
          protocol: TCP
    {{- end }}
    # Operator-configured additional egress targets
    {{- range .Values.networkPolicy.taskEgressTo }}
    - to:
        {{- toYaml (list .) | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
