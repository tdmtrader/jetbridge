apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
  {{- with .Values.artifactDaemon.serviceAccount.annotations }}
  # The output plane's publisher identity, when the output facet is on: GCS
  # Workload Identity is bound to this service account.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
rules:
  # Get node info for self-identification; patch to annotate the node
  # with the daemon's readiness status (concourse.dev/artifact-cache label).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  # Discover other daemon pods for cross-node artifact routing.
  # Read-only — daemons never modify endpoint data.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  {{- if and (.Values.hangarOutput.executionControl.enabled | default false) (.Values.hangarOutput.enabled | default false) }}
  # The output facet's capture seal waits for EVERY container of the producing
  # Pod -- init, regular and ephemeral -- to terminate before it reads the
  # tree, so no writer is still writing. It lists this node's own Pods
  # (fieldSelector spec.nodeName) to see that. Read-only: a seal waits for
  # writers to stop and never deletes or changes a Pod to get there.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "concourse.fullname" . }}-artifact-daemon
subjects:
  - kind: ServiceAccount
    name: {{ include "concourse.fullname" . }}-artifact-daemon
    namespace: {{ .Release.Namespace }}
