{{- include "concourse.validate" . }}
{{- $credentials := include "concourse.web.credentials" . | fromJson }}
{{- $argCredentials := include "concourse.web.argCredentials" . | fromJsonArray }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "concourse.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  {{- with .Values.web.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "concourse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/mcp-clients: {{ toJson .Values.mcp.clients | sha256sum }}
        {{- if $credentials }}
        # A changed password or local user rolls the pods, as it did when
        # these were args. The checksum is unsalted: whoever may get the pod
        # can test guesses at the Secret's whole content against it, which
        # is far less than the plaintext args gave them.
        checksum/web-credentials: {{ toJson $credentials | sha256sum }}
        {{- end }}
      labels:
        {{- include "concourse.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "concourse.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate-db
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - --migrate-to-latest-version
            - --postgres-host={{ include "concourse.postgresHost" . }}
            - --postgres-port={{ include "concourse.postgresPort" . }}
            {{- if .Values.postgresql.socket }}
            - --postgres-socket={{ .Values.postgresql.socket }}
            {{- end }}
            - --postgres-user={{ .Values.postgresql.user }}
            {{- if and (not .Values.postgresql.existingSecret) (not (hasKey $credentials "postgres-password")) }}
            - --postgres-password={{ .Values.postgresql.password }}
            {{- end }}
            - --postgres-database={{ .Values.postgresql.database }}
            {{- if ne .Values.postgresql.sslmode "disable" }}
            - --postgres-sslmode={{ .Values.postgresql.sslmode }}
            {{- end }}
            {{- if .Values.postgresql.caCert }}
            - --postgres-ca-cert={{ .Values.postgresql.caCert }}
            {{- end }}
            {{- if .Values.postgresql.clientCert }}
            - --postgres-client-cert={{ .Values.postgresql.clientCert }}
            {{- end }}
            {{- if .Values.postgresql.clientKey }}
            - --postgres-client-key={{ .Values.postgresql.clientKey }}
            {{- end }}
            {{- if .Values.postgresql.connectTimeout }}
            - --postgres-connect-timeout={{ .Values.postgresql.connectTimeout }}
            {{- end }}
          env:
            {{- include "concourse.encryptionKeyEnv" . | nindent 12 }}
            {{- if .Values.postgresql.existingSecret }}
            - name: CONCOURSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.passwordSecretKey }}
            {{- else if hasKey $credentials "postgres-password" }}
            {{- include "concourse.web.credentialEnv" (dict "root" . "name" "CONCOURSE_POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- end }}
          {{- if or .Values.web.tls.enabled .Values.web.extraVolumeMounts }}
          volumeMounts:
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      containers:
        - name: concourse-web
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            # PostgreSQL
            - --postgres-host={{ include "concourse.postgresHost" . }}
            - --postgres-port={{ include "concourse.postgresPort" . }}
            {{- if .Values.postgresql.socket }}
            - --postgres-socket={{ .Values.postgresql.socket }}
            {{- end }}
            - --postgres-user={{ .Values.postgresql.user }}
            {{- if and (not .Values.postgresql.existingSecret) (or (not (hasKey $credentials "postgres-password")) (has "CONCOURSE_POSTGRES_PASSWORD" $argCredentials)) }}
            - --postgres-password={{ .Values.postgresql.password }}
            {{- end }}
            - --postgres-database={{ .Values.postgresql.database }}
            {{- if ne .Values.postgresql.sslmode "disable" }}
            - --postgres-sslmode={{ .Values.postgresql.sslmode }}
            {{- end }}
            {{- if .Values.postgresql.caCert }}
            - --postgres-ca-cert={{ .Values.postgresql.caCert }}
            {{- end }}
            {{- if .Values.postgresql.clientCert }}
            - --postgres-client-cert={{ .Values.postgresql.clientCert }}
            {{- end }}
            {{- if .Values.postgresql.clientKey }}
            - --postgres-client-key={{ .Values.postgresql.clientKey }}
            {{- end }}
            {{- if .Values.postgresql.connectTimeout }}
            - --postgres-connect-timeout={{ .Values.postgresql.connectTimeout }}
            {{- end }}
            # Web
            - --external-url={{ .Values.web.externalUrl }}
            - --cluster-name={{ .Values.web.clusterName }}
            - --log-level={{ .Values.web.logLevel }}
            # Authenticated MCP
            - --enable-mcp
            - --mcp-client-config=/etc/concourse/mcp-clients/clients.json
            {{- range .Values.mcp.disabledOperations }}
            - {{ printf "--mcp-disable-operation=%s" . | quote }}
            {{- end }}
            # Auth
            # The local users reach the web as CONCOURSE_ADD_LOCAL_USER from
            # <fullname>-web-credentials (env, below), out of the pod's args.
            # They stay here only when a web.env entry names that variable
            # (the flag beat it, and still does) or when an entry holds what a
            # Secret cannot reproduce, such as a $(VAR) the kubelet resolves
            # (concourse.web.argValue). The map flag splits only on the first
            # colon and not on commas, so it is one --add-local-user per user.
            {{- if not (hasKey $credentials "add-local-user") }}
            {{- range splitList "," .Values.web.localUsers }}
            {{- if trim . }}
            - --add-local-user={{ trim . }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range splitList "," .Values.web.mainTeamLocalUser }}
            {{- if trim . }}
            - --main-team-local-user={{ trim . }}
            {{- end }}
            {{- end }}
            {{- if .Values.web.tls.enabled }}
            # TLS
            - --tls-bind-port={{ .Values.web.tls.bindPort }}
            - --tls-cert={{ .Values.web.tls.mountPath }}/{{ .Values.web.tls.certFilename }}
            - --tls-key={{ .Values.web.tls.mountPath }}/{{ .Values.web.tls.keyFilename }}
            {{- end }}
            # Kubernetes runtime
            - --kubernetes-namespace={{ include "concourse.kubernetesNamespace" . }}
            {{- if .Values.kubernetes.serviceAccount }}
            - --kubernetes-service-account={{ .Values.kubernetes.serviceAccount }}
            {{- end }}
            {{- range $grant := .Values.kubernetes.stepPodGrants }}
            {{- $privileged := eq (toString ($grant.privileged | default false)) "true" }}
            {{- $grantFlag := printf "name=%s,owner=%s" $grant.name $grant.owner }}
            {{- with $grant.serviceAccount }}{{ $grantFlag = printf "%s,service-account=%s" $grantFlag . }}{{ end }}
            {{- if $privileged }}{{ $grantFlag = printf "%s,privileged=true" $grantFlag }}{{ end }}
            - {{ printf "--kubernetes-step-pod-grant=%s" $grantFlag | quote }}
            {{- end }}
            {{- if .Values.kubernetes.podStartupTimeout }}
            - --kubernetes-pod-startup-timeout={{ .Values.kubernetes.podStartupTimeout }}
            {{- end }}
            {{- with .Values.kubernetes.podSchedulingTimeout }}
            - --kubernetes-pod-scheduling-timeout={{ . }}
            {{- end }}
            {{- with .Values.kubernetes.defaultTaskCPURequest }}
            - --default-task-cpu-request={{ . }}
            {{- end }}
            {{- with .Values.kubernetes.preferredStepNode }}
            - --kubernetes-preferred-step-node={{ . }}
            {{- end }}
            {{- range $name, $image := .Values.kubernetes.baseResourceTypes }}
            - --kubernetes-base-resource-type={{ $name }}={{ $image }}
            {{- end }}
            {{- if .Values.kubernetes.artifactHelperImage }}
            - --kubernetes-artifact-helper-image={{ .Values.kubernetes.artifactHelperImage }}
            {{- end }}
            {{- if eq .Values.kubernetes.stepRuntime "job" }}
            # Rendered only for job: exec is the binary's default, and a chart
            # that passed the flag for it would refuse to start a web built
            # before the flag existed (the chart tracks core; the image lags it
            # by one pipeline run).
            - --kubernetes-step-runtime=job
            # The launcher init container copies jb-launcher from the web's own
            # image, which the web reads from its own pod (the downward-API env
            # below) so the launcher is always the web's own build, whatever
            # the pipeline's self-upgrade has set the image to. A step pod
            # fetches its envelope from the web's in-cluster Service, presenting
            # its projected token. Always the plain HTTP port: the route is
            # served there with web TLS on too, and a step pod trusts no CA the
            # web's certificate might need.
            - --kubernetes-step-envelope-url=http://{{ include "concourse.fullname" . }}-web.{{ .Release.Namespace }}.svc:{{ .Values.service.httpPort }}/runtime/v1/step-envelope
            {{- end }}
            {{- if .Values.kubernetes.imageRegistrySecret }}
            - --kubernetes-image-registry-secret={{ .Values.kubernetes.imageRegistrySecret }}
            {{- end }}
            {{- range .Values.kubernetes.imagePullSecrets }}
            - --kubernetes-image-pull-secret={{ . }}
            {{- end }}
            # Cache configuration
            {{- if .Values.cacheStore }}
            - --kubernetes-cache-store={{ .Values.cacheStore }}
            {{- end }}
            {{- if .Values.cacheHostPath }}
            - --kubernetes-cache-host-path={{ .Values.cacheHostPath }}
            {{- end }}
            - --kubernetes-artifact-daemon-port={{ .Values.artifactDaemon.port | default 7780 }}
            - --kubernetes-artifact-daemon-host-path={{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - --kubernetes-artifact-daemon-service={{ include "concourse.artifactDaemonServiceName" . }}
            # The daemon's OWN namespace, not kubernetes.namespace (where step
            # pods run): its Service, EndpointSlices and TLS certificate live
            # in the release namespace, and the web discovers daemons there
            # and verifies them against <service>.<namespace>.svc.
            - --kubernetes-artifact-daemon-namespace={{ .Release.Namespace }}
            # The one artifact daemon key (secrets.artifactDaemonKeySecret):
            # the web signs every resolve capability with it and, with the
            # output plane, every Hangar warrant -- read and control. Every
            # Run input is a managed read of the output plane.
            - --kubernetes-artifact-daemon-resolve-capability-key=/etc/concourse/artifact-daemon-key/artifact-daemon.key
            - --kubernetes-artifact-daemon-tls-cert=/etc/concourse/daemon-tls/client.crt
            - --kubernetes-artifact-daemon-tls-key=/etc/concourse/daemon-tls/client.key
            - --kubernetes-artifact-daemon-tls-ca-cert=/etc/concourse/daemon-tls/ca.crt
            {{- if .Values.hangarOutput.executionControl.enabled }}
            - --kubernetes-hangar-key=/etc/concourse/artifact-daemon-key/artifact-daemon.key
            - --kubernetes-hangar-warrant-ttl={{ include "concourse.artifactDaemon.hangarCapabilityTTL" . }}
            {{- end }}
            {{- if .Values.hangarOutput.executionControl.enabled }}
            # The output plane's control-plane half. The web node signs control
            # warrants with the Hangar key; it verifies nothing the daemon says
            # and holds no public key for it. A capture is one database row:
            # the daemon's word reaches web over mTLS and nothing signs it.
            # With the capture facet on (below) the web is also the plane's
            # reclaimer, the one principal that may list and delete in the
            # output namespace.
            - --kubernetes-hangar-output-enabled
            # The output plane is served by the artifact daemon on its one
            # port, over its one TLS configuration: the web reaches it with the
            # artifact daemon's client certificate above.
            - --kubernetes-hangar-output-operation-timeout={{ .Values.hangarOutput.operationTimeout }}
            - --kubernetes-hangar-output-capture-deadline={{ .Values.hangarOutput.captureDeadline }}
            {{- if .Values.hangarOutput.enabled }}
            # The output namespace. Server configuration and never a request
            # field: no task, consumer, path parameter or request can select or
            # broaden it. The web is the plane's only reclaimer: its reclaim
            # pass (an unclaimed generation is deleted and stamped reclaimed) and its orphan
            # sweep reach this namespace, and node daemons publish into it and
            # never delete.
            - --kubernetes-hangar-output-bucket={{ .Values.hangarOutput.bucket }}
            - --kubernetes-hangar-output-tenant={{ .Values.hangarOutput.tenant }}
            - --kubernetes-hangar-output-store={{ .Values.hangarOutput.store }}
            - --kubernetes-hangar-output-prefix={{ .Values.hangarOutput.prefix }}
            - --kubernetes-hangar-output-publication-grace={{ .Values.hangarOutput.publicationGrace }}
            - --kubernetes-hangar-output-reclaim-interval={{ .Values.hangarOutput.reclaim.interval }}
            - --kubernetes-hangar-output-reclaim-batch={{ int .Values.hangarOutput.reclaim.batch }}
            - --kubernetes-hangar-output-delete-timeout={{ .Values.hangarOutput.reclaim.deleteTimeout }}
            - --kubernetes-hangar-output-orphan-sweep-interval={{ .Values.hangarOutput.orphanSweep.interval }}
            {{- if eq .Values.hangarOutput.store "disk" }}
            # The disk store holds one token per role. The web holds two, each
            # in its own volume: the list-and-stat one the orphan sweep lists
            # with, and the stat-and-delete one reclaim and the sweep delete
            # with. Neither can create.
            - --kubernetes-hangar-output-endpoint={{ include "concourse.hangarStorage.endpoint" . }}
            - --kubernetes-hangar-output-store-id={{ .Values.hangarStorage.disk.storeID }}
            - --kubernetes-hangar-output-store-ca-cert=/etc/concourse/hangar-output-list/ca.crt
            - --kubernetes-hangar-output-list-token-file=/etc/concourse/hangar-output-list/token
            - --kubernetes-hangar-output-delete-token-file=/etc/concourse/hangar-output-delete/token
            {{- else if .Values.hangarOutput.endpoint }}
            - --kubernetes-hangar-output-endpoint={{ .Values.hangarOutput.endpoint }}
            {{- end }}
            {{- if .Values.hangarOutput.webEnabled }}
            - --kubernetes-hangar-output-capture-enabled
            {{- end }}
            {{- end }}
            {{- end }}
            {{- include "concourse.web.validateRunCredentialWorkerImages" . }}
            {{- if .Values.web.runInputSigningKeySecret }}
            - --run-input-signing-key=/etc/concourse/run-input-signing/input.key
            # Credential handoff delivers only into these digest-pinned
            # images. None pinned refuses every handoff.
            {{- range .Values.web.runCredentialWorkerImages }}
            - --run-credential-worker-image={{ . }}
            {{- end }}
            {{- end }}
            # Kubernetes credential manager (resolve ((vars)) from k8s Secrets)
            {{- if .Values.kubernetes.credentialManager.enabled }}
            - --kubernetes-in-cluster
            {{- if .Values.kubernetes.credentialManager.namespacePrefix }}
            - --kubernetes-namespace-prefix={{ .Values.kubernetes.credentialManager.namespacePrefix }}
            {{- end }}
            {{- end }}
            # Tracing
            {{- if .Values.tracing.otlpAddress }}
            - --tracing-otlp-address={{ .Values.tracing.otlpAddress }}
            {{- end }}
            {{- if .Values.tracing.otlpUseTLS }}
            - --tracing-otlp-use-tls
            {{- end }}
            {{- if .Values.tracing.serviceName }}
            - --tracing-service-name={{ .Values.tracing.serviceName }}
            {{- end }}
            {{- range $key, $val := .Values.tracing.otlpHeaders }}
            - --tracing-otlp-header={{ $key }}:{{ $val }}
            {{- end }}
            # OTel Metrics
            {{- if .Values.otelMetrics.otlpAddress }}
            - --otel-metrics-otlp-address={{ .Values.otelMetrics.otlpAddress }}
            {{- end }}
            {{- if .Values.otelMetrics.otlpUseTLS }}
            - --otel-metrics-otlp-use-tls
            {{- end }}
            {{- range $key, $val := .Values.otelMetrics.otlpHeaders }}
            - --otel-metrics-otlp-header={{ $key }}:{{ $val }}
            {{- end }}
            # Connection pool sizing
            {{- if .Values.web.apiMaxConns }}
            - --api-max-conns={{ .Values.web.apiMaxConns }}
            {{- end }}
            {{- if .Values.web.backendMaxConns }}
            - --backend-max-conns={{ .Values.web.backendMaxConns }}
            {{- end }}
            # Extra args
          env:
            - name: CONCOURSE_SESSION_SIGNING_KEY
              value: /keys/session_signing_key
            {{- if eq .Values.kubernetes.stepRuntime "job" }}
            # The web's own pod, so it can read the image it runs and copy the
            # launcher from the same build (see the Kubernetes runtime args).
            - name: CONCOURSE_KUBERNETES_WEB_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONCOURSE_KUBERNETES_WEB_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
            {{- if .Values.secrets.encryptionKeySecret }}
            {{- include "concourse.encryptionKeyEnv" . | nindent 12 }}
            {{- end }}
            {{- if .Values.postgresql.existingSecret }}
            - name: CONCOURSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.passwordSecretKey }}
            {{- else if and (hasKey $credentials "postgres-password") (not (has "CONCOURSE_POSTGRES_PASSWORD" $argCredentials)) }}
            {{- include "concourse.web.credentialEnv" (dict "root" . "name" "CONCOURSE_POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- end }}
            {{- if hasKey $credentials "add-local-user" }}
            {{- include "concourse.web.credentialEnv" (dict "root" . "name" "CONCOURSE_ADD_LOCAL_USER" "key" "add-local-user") | nindent 12 }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: CONCOURSE_PROMETHEUS_BIND_IP
              value: "0.0.0.0"
            - name: CONCOURSE_PROMETHEUS_BIND_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            {{- range include "concourse.web.settingsEnv" . | fromJsonArray }}
            {{- if index . 2 }}
            - name: {{ index . 0 }}
              value: {{ index . 2 | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.web.env }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
            {{- if .Values.metrics.enabled }}
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
            {{- end }}
            {{- if .Values.web.tls.enabled }}
            - containerPort: {{ .Values.web.tls.bindPort }}
              name: https
            {{- end }}
            - containerPort: 2222
              name: tsa
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: mcp-clients
              mountPath: /etc/concourse/mcp-clients
              readOnly: true
            - name: keys
              mountPath: /keys
              readOnly: true
            {{- if .Values.web.tls.enabled }}
            - name: web-tls
              mountPath: {{ .Values.web.tls.mountPath }}
              readOnly: true
            {{- end }}
            - name: daemon-tls
              mountPath: /etc/concourse/daemon-tls
              readOnly: true
            - name: artifact-daemon-key
              mountPath: /etc/concourse/artifact-daemon-key
              readOnly: true
            {{- if .Values.hangarOutput.executionControl.enabled }}
            {{- if .Values.hangarOutput.enabled }}
            {{- if eq .Values.hangarOutput.store "disk" }}
            - name: hangar-output-list
              mountPath: /etc/concourse/hangar-output-list
              readOnly: true
            - name: hangar-output-delete
              mountPath: /etc/concourse/hangar-output-delete
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.web.runInputSigningKeySecret }}
            - name: run-input-signing
              mountPath: /etc/concourse/run-input-signing
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if include "concourse.web.runResultReads" . }}
            - name: run-result-scratch
              mountPath: /var/concourse/run-result-scratch
            {{- end }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds | default 120 }}
      volumes:
        - name: mcp-clients
          configMap:
            name: {{ include "concourse.fullname" . }}-mcp-clients
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if include "concourse.web.runResultReads" . }}
        - name: run-result-scratch
          emptyDir:
            # Two concurrent reads, each with a 256Mi archive and canonical copy.
            sizeLimit: 1Gi
        {{- end }}
        - name: keys
          secret:
            secretName: {{ .Values.secrets.signingKeySecret }}
        {{- if .Values.web.tls.enabled }}
        - name: web-tls
          secret:
            secretName: {{ .Values.web.tls.secretName }}
        {{- end }}
        - name: daemon-tls
          secret:
            secretName: {{ .Values.artifactDaemon.tls.existingSecret | default (printf "%s-artifact-daemon-tls" (include "concourse.fullname" .)) }}
            items:
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
              - key: ca.crt
                path: ca.crt
        - name: artifact-daemon-key
          secret:
            secretName: {{ .Values.secrets.artifactDaemonKeySecret }}
            items:
              - key: artifact-daemon.key
                path: artifact-daemon.key
        {{- if .Values.hangarOutput.executionControl.enabled }}
        {{- if .Values.hangarOutput.enabled }}
        {{- if eq .Values.hangarOutput.store "disk" }}
        {{- include "concourse.hangarStorage.clientVolume" (dict "root" . "role" "inventory" "name" "hangar-output-list") | nindent 8 }}
        {{- include "concourse.hangarStorage.clientVolume" (dict "root" . "role" "reclaimer" "name" "hangar-output-delete") | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.web.runInputSigningKeySecret }}
        - name: run-input-signing
          secret:
            secretName: {{ .Values.web.runInputSigningKeySecret }}
            items:
              - key: input.key
                path: input.key
        {{- end }}
        {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
