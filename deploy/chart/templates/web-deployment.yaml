{{- if not .Values.artifactDaemon.enabled }}
{{- fail "artifactDaemon.enabled must be true: the Kubernetes runtime requires the per-node artifact daemon" }}
{{- end }}
{{- $artifactHelperImage := .Values.kubernetes.artifactHelperImage | default "" }}
{{- if empty $artifactHelperImage }}
{{- fail "kubernetes.artifactHelperImage is required and must identify a tar-capable image by digest" }}
{{- end }}
{{- if not (regexMatch "^[^@[:space:]]+@sha256:[a-f0-9]{64}$" $artifactHelperImage) }}
{{- fail "kubernetes.artifactHelperImage must be an exact @sha256 image reference" }}
{{- end }}
{{- if and .Values.agentSnapshots.enabled (not .Values.artifactDaemon.enabled) }}
{{- fail "agentSnapshots.enabled requires artifactDaemon.enabled" }}
{{- end }}
{{- if and .Values.agentSnapshots.enabled (not .Values.artifactDaemon.tls.enabled) }}
{{- fail "agentSnapshots.enabled requires artifactDaemon.tls.enabled" }}
{{- end }}
{{- if and .Values.agentExperiments.runnerEnabled (not .Values.agentSnapshots.enabled) }}
{{- fail "agentExperiments.runnerEnabled requires agentSnapshots.enabled" }}
{{- end }}
{{- if and .Values.agentPublisherGateway.enabled (not .Values.agentSnapshots.enabled) }}
{{- fail "agentPublisherGateway.enabled requires agentSnapshots.enabled" }}
{{- end }}
{{- if and .Values.agentPublisherGateway.enabled (not (hasPrefix "https://" .Values.agentPublisherGateway.endpoint)) }}
{{- fail "agentPublisherGateway.endpoint must be an HTTPS origin" }}
{{- end }}
{{- if and .Values.agentPublisherGateway.enabled (or (empty .Values.agentPublisherGateway.policyFile) (empty .Values.agentPublisherGateway.tokenFile)) }}
{{- fail "agentPublisherGateway.policyFile and tokenFile are required" }}
{{- end }}
{{- if and .Values.agentPublisherGateway.enabled (or (empty .Values.agentPublisherGateway.volumes) (empty .Values.agentPublisherGateway.volumeMounts)) }}
{{- fail "agentPublisherGateway.enabled requires agentPublisherGateway.volumes and volumeMounts for mounted policy and token files" }}
{{- end }}
{{- if and .Values.agentSnapshots.enabled (empty .Values.agentSnapshots.scratch.existingClaim) (empty .Values.agentSnapshots.scratch.sizeLimit) }}
{{- fail "agentSnapshots.scratch.sizeLimit is required when existingClaim is empty" }}
{{- end }}
{{- range $mount := .Values.web.extraVolumeMounts }}
{{- if eq ($mount.name | default "") "web-kubernetes-api-access" }}
{{- fail "web.extraVolumeMounts may not use reserved volume web-kubernetes-api-access" }}
{{- end }}
{{- if eq ($mount.name | default "") "snapshot-scratch" }}
{{- fail "web.extraVolumeMounts may not use reserved volume snapshot-scratch" }}
{{- end }}
{{- end }}
{{- range $argument := .Values.web.extraArgs }}
{{- if hasPrefix "--kubernetes-artifact-helper-image" $argument }}
{{- fail "web.extraArgs may not override kubernetes.artifactHelperImage" }}
{{- end }}
{{- if and $.Values.agentSnapshots.enabled (hasPrefix "--agent-snapshot-temp-dir" $argument) }}
{{- fail "web.extraArgs may not override the chart-managed agent snapshot temp directory" }}
{{- end }}
{{- end }}
{{- if .Values.agentSnapshots.enabled }}
{{- range $environment := .Values.web.env }}
{{- if eq ($environment.name | default "") "TMPDIR" }}
{{- fail "web.env may not override TMPDIR while agentSnapshots.enabled is true" }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.agentPublisherGateway.enabled }}
{{- $publisherVolumeNames := dict }}
{{- range $volume := .Values.agentPublisherGateway.volumes }}
{{- $volumeName := $volume.name | default "" }}
{{- if empty $volumeName }}
{{- fail "agentPublisherGateway.volumes entries require a name" }}
{{- end }}
{{- if hasKey $publisherVolumeNames $volumeName }}
{{- fail (printf "agentPublisherGateway.volumes contains duplicate name %q" $volumeName) }}
{{- end }}
{{- $_ := set $publisherVolumeNames $volumeName true }}
{{- end }}
{{- $publisherMountNames := dict }}
{{- $publisherMountPaths := dict }}
{{- range $mount := .Values.agentPublisherGateway.volumeMounts }}
{{- $mountName := $mount.name | default "" }}
{{- $mountPath := $mount.mountPath | default "" }}
{{- if empty $mountName }}
{{- fail "agentPublisherGateway.volumeMounts entries require a name" }}
{{- end }}
{{- if hasKey $publisherMountNames $mountName }}
{{- fail (printf "agentPublisherGateway.volumeMounts contains duplicate name %q" $mountName) }}
{{- end }}
{{- if not (kindIs "bool" $mount.readOnly) }}
{{- fail "agentPublisherGateway.volumeMounts must all set readOnly=true" }}
{{- end }}
{{- if not $mount.readOnly }}
{{- fail "agentPublisherGateway.volumeMounts must all set readOnly=true" }}
{{- end }}
{{- if not (hasKey $publisherVolumeNames $mountName) }}
{{- fail (printf "agentPublisherGateway.volumeMount %q has no matching volume" $mountName) }}
{{- end }}
{{- if or (empty $mountPath) (not (hasPrefix "/" $mountPath)) (ne (clean $mountPath) $mountPath) (eq $mountPath "/") }}
{{- fail (printf "agentPublisherGateway.volumeMount %q mountPath must be an absolute clean non-root path" $mountName) }}
{{- end }}
{{- $_ := set $publisherMountNames $mountName true }}
{{- $_ := set $publisherMountPaths $mountName $mountPath }}
{{- end }}
{{- range $volumeName, $_ := $publisherVolumeNames }}
{{- if not (hasKey $publisherMountNames $volumeName) }}
{{- fail (printf "agentPublisherGateway.volume %q has no matching volumeMount" $volumeName) }}
{{- end }}
{{- end }}
{{- $publisherFiles := dict
      "agentPublisherGateway.policyFile" .Values.agentPublisherGateway.policyFile
      "agentPublisherGateway.tokenFile" .Values.agentPublisherGateway.tokenFile
      "agentPublisherGateway.caCertificateFile" .Values.agentPublisherGateway.caCertificateFile }}
{{- range $fileName, $filePath := $publisherFiles }}
{{- if not (empty $filePath) }}
{{- if or (not (hasPrefix "/" $filePath)) (ne (clean $filePath) $filePath) }}
{{- fail (printf "%s must be an absolute clean path" $fileName) }}
{{- end }}
{{- $covered := dict "value" false }}
{{- range $_, $mountPath := $publisherMountPaths }}
{{- if hasPrefix (printf "%s/" (trimSuffix "/" $mountPath)) $filePath }}
{{- $_ := set $covered "value" true }}
{{- end }}
{{- end }}
{{- if not $covered.value }}
{{- fail (printf "%s must lie beneath an agentPublisherGateway.volumeMounts mountPath" $fileName) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
   Session signing key source. An operator-supplied Secret always wins; when
   secrets.create is on, the chart's own Secret (see secrets.yaml, which reuses
   any existing key rather than reminting it) is mounted so the key is stable
   across pod restarts and identical on every replica. Only when neither is
   configured do we fall back to a per-pod emptyDir key, which invalidates
   sessions on restart and cannot be used with more than one replica.
*/ -}}
{{- $signingKeySecretName := "" }}
{{- if .Values.secrets.signingKeySecret }}
{{- $signingKeySecretName = .Values.secrets.signingKeySecret }}
{{- else if .Values.secrets.create }}
{{- $signingKeySecretName = printf "%s-keys" (include "concourse.fullname" .) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "concourse.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "concourse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concourse.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "concourse.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if not $signingKeySecretName }}
        - name: generate-keys
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # Only generate keys if they don't already exist
              if [ ! -f /keys/session_signing_key ]; then
                concourse generate-key -t rsa -f /keys/session_signing_key
              fi
          volumeMounts:
            - name: keys
              mountPath: /keys
        {{- end }}
        {{- if .Values.agentSnapshots.enabled }}
        - name: prepare-snapshot-scratch
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - mkdir -p /var/concourse/snapshot-scratch/web && chmod 0700 /var/concourse/snapshot-scratch/web
          volumeMounts:
            - name: snapshot-scratch
              mountPath: /var/concourse/snapshot-scratch
        {{- end }}
        - name: migrate-db
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - --migrate-to-latest-version
            - --postgres-host={{ include "concourse.postgresHost" . }}
            - --postgres-port={{ include "concourse.postgresPort" . }}
            {{- if .Values.postgresql.socket }}
            - --postgres-socket={{ .Values.postgresql.socket }}
            {{- end }}
            - --postgres-user={{ .Values.postgresql.user }}
            {{- if not .Values.postgresql.existingSecret }}
            - --postgres-password={{ .Values.postgresql.password }}
            {{- end }}
            - --postgres-database={{ .Values.postgresql.database }}
            {{- if ne .Values.postgresql.sslmode "disable" }}
            - --postgres-sslmode={{ .Values.postgresql.sslmode }}
            {{- end }}
            {{- if .Values.postgresql.caCert }}
            - --postgres-ca-cert={{ .Values.postgresql.caCert }}
            {{- end }}
            {{- if .Values.postgresql.clientCert }}
            - --postgres-client-cert={{ .Values.postgresql.clientCert }}
            {{- end }}
            {{- if .Values.postgresql.clientKey }}
            - --postgres-client-key={{ .Values.postgresql.clientKey }}
            {{- end }}
            {{- if .Values.postgresql.connectTimeout }}
            - --postgres-connect-timeout={{ .Values.postgresql.connectTimeout }}
            {{- end }}
          {{- if .Values.postgresql.existingSecret }}
          env:
            - name: CONCOURSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.passwordSecretKey }}
          {{- end }}
          {{- if or .Values.web.tls.enabled .Values.web.extraVolumeMounts }}
          volumeMounts:
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      containers:
        - name: concourse-web
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            # PostgreSQL
            - --postgres-host={{ include "concourse.postgresHost" . }}
            - --postgres-port={{ include "concourse.postgresPort" . }}
            {{- if .Values.postgresql.socket }}
            - --postgres-socket={{ .Values.postgresql.socket }}
            {{- end }}
            - --postgres-user={{ .Values.postgresql.user }}
            {{- if not .Values.postgresql.existingSecret }}
            - --postgres-password={{ .Values.postgresql.password }}
            {{- end }}
            - --postgres-database={{ .Values.postgresql.database }}
            {{- if ne .Values.postgresql.sslmode "disable" }}
            - --postgres-sslmode={{ .Values.postgresql.sslmode }}
            {{- end }}
            {{- if .Values.postgresql.caCert }}
            - --postgres-ca-cert={{ .Values.postgresql.caCert }}
            {{- end }}
            {{- if .Values.postgresql.clientCert }}
            - --postgres-client-cert={{ .Values.postgresql.clientCert }}
            {{- end }}
            {{- if .Values.postgresql.clientKey }}
            - --postgres-client-key={{ .Values.postgresql.clientKey }}
            {{- end }}
            {{- if .Values.postgresql.connectTimeout }}
            - --postgres-connect-timeout={{ .Values.postgresql.connectTimeout }}
            {{- end }}
            # Web
            - --external-url={{ .Values.web.externalUrl }}
            - --cluster-name={{ .Values.web.clusterName }}
            - --log-level={{ .Values.web.logLevel }}
            # Auth
            # localUsers is a comma-separated "user:pass,user2:pass2" list, but
            # Concourse's CLI map flag splits only on the first colon and does
            # NOT split on commas — so emit one --add-local-user per user.
            {{- range splitList "," .Values.web.localUsers }}
            {{- if trim . }}
            - --add-local-user={{ trim . }}
            {{- end }}
            {{- end }}
            - --main-team-local-user={{ .Values.web.mainTeamLocalUser }}
            {{- if .Values.web.tls.enabled }}
            # TLS
            - --tls-bind-port={{ .Values.web.tls.bindPort }}
            - --tls-cert={{ .Values.web.tls.mountPath }}/{{ .Values.web.tls.certFilename }}
            - --tls-key={{ .Values.web.tls.mountPath }}/{{ .Values.web.tls.keyFilename }}
            {{- end }}
            # Kubernetes runtime
            - --kubernetes-namespace={{ include "concourse.kubernetesNamespace" . }}
            {{- if .Values.kubernetes.serviceAccount }}
            - --kubernetes-service-account={{ .Values.kubernetes.serviceAccount }}
            {{- end }}
            {{- if .Values.kubernetes.podStartupTimeout }}
            - --kubernetes-pod-startup-timeout={{ .Values.kubernetes.podStartupTimeout }}
            {{- end }}
            - --kubernetes-artifact-helper-image={{ $artifactHelperImage }}
            {{- if .Values.kubernetes.imageRegistryPrefix }}
            - --kubernetes-image-registry-prefix={{ .Values.kubernetes.imageRegistryPrefix }}
            {{- end }}
            {{- if .Values.kubernetes.imageRegistrySecret }}
            - --kubernetes-image-registry-secret={{ .Values.kubernetes.imageRegistrySecret }}
            {{- end }}
            {{- range .Values.kubernetes.imagePullSecrets }}
            - --kubernetes-image-pull-secret={{ . }}
            {{- end }}
            # Cache configuration
            {{- if .Values.cacheStore }}
            - --kubernetes-cache-store={{ .Values.cacheStore }}
            {{- end }}
            {{- if .Values.cacheHostPath }}
            - --kubernetes-cache-host-path={{ .Values.cacheHostPath }}
            {{- end }}
            {{- if .Values.artifactDaemon.enabled }}
            - --kubernetes-artifact-daemon-port={{ .Values.artifactDaemon.port | default 7780 }}
            - --kubernetes-artifact-daemon-host-path={{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - --kubernetes-artifact-daemon-service={{ include "concourse.artifactDaemonServiceName" . }}
            - --kubernetes-artifact-daemon-resolve-capability-key=/etc/concourse/resolve-capability/resolve.key
            - --kubernetes-artifact-daemon-resolve-capability-ttl={{ .Values.artifactDaemon.resolveCapability.ttl | default "2h" }}
            {{- if .Values.artifactDaemon.tls.enabled }}
            - --kubernetes-artifact-daemon-tls-cert=/etc/concourse/daemon-tls/client.crt
            - --kubernetes-artifact-daemon-tls-key=/etc/concourse/daemon-tls/client.key
            - --kubernetes-artifact-daemon-tls-ca-cert=/etc/concourse/daemon-tls/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.agentSnapshots.enabled }}
            - --agent-snapshot-enabled
            - --agent-snapshot-replication-factor={{ .Values.agentSnapshots.replicationFactor }}
            - --agent-snapshot-max-bytes={{ int64 .Values.agentSnapshots.maxBytes }}
            - --agent-snapshot-max-files={{ .Values.agentSnapshots.maxFiles }}
            - --agent-snapshot-binding-retention={{ .Values.agentSnapshots.bindingRetention }}
            - --agent-snapshot-orphan-grace-period={{ .Values.agentSnapshots.orphanGracePeriod }}
            - --agent-snapshot-gc-interval={{ .Values.agentSnapshots.gcInterval }}
            - --agent-snapshot-repair-interval={{ .Values.agentSnapshots.repairInterval }}
            - --agent-snapshot-temp-dir=/var/concourse/snapshot-scratch/web
            {{- end }}
            {{- if .Values.agentExperiments.runnerEnabled }}
            - --agent-experiment-runner-enabled
            - --agent-experiment-runner-interval={{ .Values.agentExperiments.runnerInterval }}
            - --agent-experiment-runner-max-concurrency={{ .Values.agentExperiments.runnerMaxConcurrency }}
            {{- end }}
            {{- if .Values.agentPublisherGateway.enabled }}
            - --agent-publisher-gateway-enabled
            - --agent-publisher-gateway-endpoint={{ .Values.agentPublisherGateway.endpoint }}
            - --agent-publisher-gateway-policy-file={{ .Values.agentPublisherGateway.policyFile }}
            - --agent-publisher-gateway-token-file={{ .Values.agentPublisherGateway.tokenFile }}
            {{- if .Values.agentPublisherGateway.caCertificateFile }}
            - --agent-publisher-gateway-ca-certificate-file={{ .Values.agentPublisherGateway.caCertificateFile }}
            {{- end }}
            - --agent-publisher-gateway-request-timeout={{ .Values.agentPublisherGateway.requestTimeout }}
            - --agent-publisher-gateway-lease-duration={{ .Values.agentPublisherGateway.leaseDuration }}
            - --agent-publisher-gateway-max-response-bytes={{ int64 .Values.agentPublisherGateway.maxResponseBytes }}
            {{- end }}
            # Kubernetes credential manager (resolve ((vars)) from k8s Secrets)
            {{- if .Values.kubernetes.credentialManager.enabled }}
            - --kubernetes-in-cluster
            {{- if .Values.kubernetes.credentialManager.namespacePrefix }}
            - --kubernetes-namespace-prefix={{ .Values.kubernetes.credentialManager.namespacePrefix }}
            {{- end }}
            {{- end }}
            # Tracing
            {{- if .Values.tracing.otlpAddress }}
            - --tracing-otlp-address={{ .Values.tracing.otlpAddress }}
            {{- end }}
            {{- if .Values.tracing.otlpUseTLS }}
            - --tracing-otlp-use-tls
            {{- end }}
            {{- if .Values.tracing.serviceName }}
            - --tracing-service-name={{ .Values.tracing.serviceName }}
            {{- end }}
            {{- range $key, $val := .Values.tracing.otlpHeaders }}
            - --tracing-otlp-header={{ $key }}:{{ $val }}
            {{- end }}
            # OTel Metrics
            {{- if .Values.otelMetrics.otlpAddress }}
            - --otel-metrics-otlp-address={{ .Values.otelMetrics.otlpAddress }}
            {{- end }}
            {{- if .Values.otelMetrics.otlpUseTLS }}
            - --otel-metrics-otlp-use-tls
            {{- end }}
            {{- range $key, $val := .Values.otelMetrics.otlpHeaders }}
            - --otel-metrics-otlp-header={{ $key }}:{{ $val }}
            {{- end }}
            # Connection pool sizing
            {{- if .Values.web.apiMaxConns }}
            - --api-max-conns={{ .Values.web.apiMaxConns }}
            {{- end }}
            {{- if .Values.web.backendMaxConns }}
            - --backend-max-conns={{ .Values.web.backendMaxConns }}
            {{- end }}
            # Extra args
            {{- range .Values.web.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: CONCOURSE_SESSION_SIGNING_KEY
              value: /keys/session_signing_key
            {{- if .Values.agentSnapshots.enabled }}
            - name: TMPDIR
              value: /var/concourse/snapshot-scratch/web
            {{- end }}
            {{- if .Values.postgresql.existingSecret }}
            - name: CONCOURSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.passwordSecretKey }}
            {{- end }}
            {{- range .Values.web.env }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
            {{- if .Values.web.tls.enabled }}
            - containerPort: {{ .Values.web.tls.bindPort }}
              name: https
            {{- end }}
            - containerPort: 2222
              name: tsa
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: web-kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- if .Values.web.tls.enabled }}
            - name: web-tls
              mountPath: {{ .Values.web.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.artifactDaemon.enabled (.Values.artifactDaemon.tls.enabled | default false) }}
            - name: daemon-tls
              mountPath: /etc/concourse/daemon-tls
              readOnly: true
            {{- end }}
            {{- if .Values.artifactDaemon.enabled }}
            - name: resolve-capability
              mountPath: /etc/concourse/resolve-capability
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.agentSnapshots.enabled }}
            - name: snapshot-scratch
              mountPath: /var/concourse/snapshot-scratch
            {{- end }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.agentPublisherGateway.enabled }}
            {{- with .Values.agentPublisherGateway.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds | default 120 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: web-kubernetes-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- if .Values.agentSnapshots.enabled }}
        - name: snapshot-scratch
          {{- if .Values.agentSnapshots.scratch.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.agentSnapshots.scratch.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.agentSnapshots.scratch.sizeLimit }}
          {{- end }}
        {{- end }}
        {{- if $signingKeySecretName }}
        - name: keys
          secret:
            secretName: {{ $signingKeySecretName }}
        {{- else }}
        - name: keys
          emptyDir: {}
        {{- end }}
        {{- if .Values.web.tls.enabled }}
        - name: web-tls
          secret:
            secretName: {{ .Values.web.tls.secretName }}
        {{- end }}
        {{- if and .Values.artifactDaemon.enabled (.Values.artifactDaemon.tls.enabled | default false) }}
        - name: daemon-tls
          secret:
            secretName: {{ .Values.artifactDaemon.tls.existingSecret | default (printf "%s-artifact-daemon-tls" (include "concourse.fullname" .)) }}
        {{- end }}
        {{- if .Values.artifactDaemon.enabled }}
        - name: resolve-capability
          secret:
            secretName: {{ .Values.artifactDaemon.resolveCapability.existingSecret | default (printf "%s-artifact-daemon-resolve-capability" (include "concourse.fullname" .)) }}
        {{- end }}
        {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.agentPublisherGateway.enabled }}
        {{- with .Values.agentPublisherGateway.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
