apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "concourse.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  {{- with .Values.web.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "concourse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "concourse.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "concourse.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.secrets.create }}
        - name: generate-keys
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              # Only generate keys if they don't already exist
              if [ ! -f /keys/session_signing_key ]; then
                concourse generate-key -t rsa -f /keys/session_signing_key
              fi
          volumeMounts:
            - name: keys
              mountPath: /keys
        {{- end }}
        - name: migrate-db
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - migrate
            - --migrate-to-latest-version
            - --postgres-host={{ include "concourse.postgresHost" . }}
            - --postgres-port={{ include "concourse.postgresPort" . }}
            {{- if .Values.postgresql.socket }}
            - --postgres-socket={{ .Values.postgresql.socket }}
            {{- end }}
            - --postgres-user={{ .Values.postgresql.user }}
            {{- if not .Values.postgresql.existingSecret }}
            - --postgres-password={{ .Values.postgresql.password }}
            {{- end }}
            - --postgres-database={{ .Values.postgresql.database }}
            {{- if ne .Values.postgresql.sslmode "disable" }}
            - --postgres-sslmode={{ .Values.postgresql.sslmode }}
            {{- end }}
            {{- if .Values.postgresql.caCert }}
            - --postgres-ca-cert={{ .Values.postgresql.caCert }}
            {{- end }}
            {{- if .Values.postgresql.clientCert }}
            - --postgres-client-cert={{ .Values.postgresql.clientCert }}
            {{- end }}
            {{- if .Values.postgresql.clientKey }}
            - --postgres-client-key={{ .Values.postgresql.clientKey }}
            {{- end }}
            {{- if .Values.postgresql.connectTimeout }}
            - --postgres-connect-timeout={{ .Values.postgresql.connectTimeout }}
            {{- end }}
          {{- if .Values.postgresql.existingSecret }}
          env:
            - name: CONCOURSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.passwordSecretKey }}
          {{- end }}
          {{- if or .Values.web.tls.enabled .Values.web.extraVolumeMounts }}
          volumeMounts:
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      containers:
        - name: concourse-web
          image: {{ include "concourse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - web
            # PostgreSQL
            - --postgres-host={{ include "concourse.postgresHost" . }}
            - --postgres-port={{ include "concourse.postgresPort" . }}
            {{- if .Values.postgresql.socket }}
            - --postgres-socket={{ .Values.postgresql.socket }}
            {{- end }}
            - --postgres-user={{ .Values.postgresql.user }}
            {{- if not .Values.postgresql.existingSecret }}
            - --postgres-password={{ .Values.postgresql.password }}
            {{- end }}
            - --postgres-database={{ .Values.postgresql.database }}
            {{- if ne .Values.postgresql.sslmode "disable" }}
            - --postgres-sslmode={{ .Values.postgresql.sslmode }}
            {{- end }}
            {{- if .Values.postgresql.caCert }}
            - --postgres-ca-cert={{ .Values.postgresql.caCert }}
            {{- end }}
            {{- if .Values.postgresql.clientCert }}
            - --postgres-client-cert={{ .Values.postgresql.clientCert }}
            {{- end }}
            {{- if .Values.postgresql.clientKey }}
            - --postgres-client-key={{ .Values.postgresql.clientKey }}
            {{- end }}
            {{- if .Values.postgresql.connectTimeout }}
            - --postgres-connect-timeout={{ .Values.postgresql.connectTimeout }}
            {{- end }}
            # Web
            - --external-url={{ .Values.web.externalUrl }}
            - --cluster-name={{ .Values.web.clusterName }}
            - --log-level={{ .Values.web.logLevel }}
            {{- if .Values.web.enablePipelineRunCreation }}
            - --enable-pipeline-run-creation
            {{- end }}
            # Auth
            # localUsers is a comma-separated "user:pass,user2:pass2" list, but
            # Concourse's CLI map flag splits only on the first colon and does
            # NOT split on commas — so emit one --add-local-user per user.
            {{- range splitList "," .Values.web.localUsers }}
            {{- if trim . }}
            - --add-local-user={{ trim . }}
            {{- end }}
            {{- end }}
            - --main-team-local-user={{ .Values.web.mainTeamLocalUser }}
            {{- if .Values.web.tls.enabled }}
            # TLS
            - --tls-bind-port={{ .Values.web.tls.bindPort }}
            - --tls-cert={{ .Values.web.tls.mountPath }}/{{ .Values.web.tls.certFilename }}
            - --tls-key={{ .Values.web.tls.mountPath }}/{{ .Values.web.tls.keyFilename }}
            {{- end }}
            # Kubernetes runtime
            - --kubernetes-namespace={{ include "concourse.kubernetesNamespace" . }}
            {{- if .Values.kubernetes.serviceAccount }}
            - --kubernetes-service-account={{ .Values.kubernetes.serviceAccount }}
            {{- end }}
            {{- if .Values.kubernetes.podStartupTimeout }}
            - --kubernetes-pod-startup-timeout={{ .Values.kubernetes.podStartupTimeout }}
            {{- end }}
            {{- if .Values.kubernetes.artifactHelperImage }}
            - --kubernetes-artifact-helper-image={{ .Values.kubernetes.artifactHelperImage }}
            {{- end }}
            {{- if .Values.kubernetes.imageRegistryPrefix }}
            - --kubernetes-image-registry-prefix={{ .Values.kubernetes.imageRegistryPrefix }}
            {{- end }}
            {{- if .Values.kubernetes.imageRegistrySecret }}
            - --kubernetes-image-registry-secret={{ .Values.kubernetes.imageRegistrySecret }}
            {{- end }}
            {{- range .Values.kubernetes.imagePullSecrets }}
            - --kubernetes-image-pull-secret={{ . }}
            {{- end }}
            # Cache configuration
            {{- if .Values.cacheStore }}
            - --kubernetes-cache-store={{ .Values.cacheStore }}
            {{- end }}
            {{- if .Values.cacheHostPath }}
            - --kubernetes-cache-host-path={{ .Values.cacheHostPath }}
            {{- end }}
            {{- if .Values.artifactDaemon.enabled }}
            - --kubernetes-artifact-daemon-port={{ .Values.artifactDaemon.port | default 7780 }}
            - --kubernetes-artifact-daemon-host-path={{ .Values.artifactDaemon.hostPath | default "/var/concourse/artifacts" }}
            - --kubernetes-artifact-daemon-service={{ include "concourse.artifactDaemonServiceName" . }}
            {{- if .Values.artifactDaemon.resolveCapability.existingSecret }}
            - --kubernetes-artifact-daemon-resolve-capability-key=/etc/concourse/resolve-capability/resolve.key
            - --kubernetes-artifact-daemon-resolve-capability-ttl={{ .Values.artifactDaemon.resolveCapability.ttl | default "2h" }}
            {{- end }}
            {{- if .Values.artifactDaemon.tls.enabled }}
            - --kubernetes-artifact-daemon-tls-cert=/etc/concourse/daemon-tls/client.crt
            - --kubernetes-artifact-daemon-tls-key=/etc/concourse/daemon-tls/client.key
            - --kubernetes-artifact-daemon-tls-ca-cert=/etc/concourse/daemon-tls/ca.crt
            {{- end }}
            {{- if .Values.artifactDaemon.hangar.webEnabled }}
            - --kubernetes-hangar-enabled
            - --kubernetes-hangar-warrant-key=/etc/concourse/daemon-tls/hangar.key
            - --kubernetes-hangar-warrant-ttl={{ .Values.artifactDaemon.hangar.capabilityTTL }}
            {{- end }}
            {{- end }}
            {{- if .Values.hangarOutput.executionControl.enabled }}
            # The output plane's control-plane half. The web node mints control
            # capabilities and verifies receipts; it holds NO receipt private
            # key, no GCS credential and no role on the output bucket.
            - --kubernetes-hangar-output-enabled
            - --kubernetes-hangar-output-daemon-port={{ .Values.hangarOutput.daemon.port }}
            - --kubernetes-hangar-output-warrant-key=/etc/concourse/hangar-output/capability/capability.key
            # The OUTPUT plane's client certificate, its CA and the name the
            # daemon's server certificate carries. Unconditional, because the
            # output daemon is TLS-only: it has no plaintext branch and its
            # control routes refuse every operation whose request carries no
            # verified peer certificate. This used to be derived from
            # artifactDaemon.tls.enabled -- a different daemon's switch, false
            # by default -- so the ATC dialed http:// at an HTTPS listener, and
            # when that switch was on it presented the artifact daemon's
            # certificate to a daemon that trusts a different CA.
            - --kubernetes-hangar-output-tls-cert=/etc/concourse/hangar-output/tls/tls.crt
            - --kubernetes-hangar-output-tls-key=/etc/concourse/hangar-output/tls/tls.key
            - --kubernetes-hangar-output-tls-ca-cert=/etc/concourse/hangar-output/tls/ca.crt
            - --kubernetes-hangar-output-tls-server-name={{ include "concourse.hangarOutput.daemonTLSServerName" . }}
            - --kubernetes-hangar-output-operation-timeout={{ .Values.hangarOutput.operationTimeout }}
            - --kubernetes-hangar-output-seal-deadline={{ .Values.hangarOutput.sealDeadline }}
            - --kubernetes-hangar-output-capture-deadline={{ .Values.hangarOutput.captureDeadline }}
            - --kubernetes-hangar-output-lease-term={{ .Values.hangarOutput.leaseTerm }}
            - --kubernetes-hangar-output-lease-renew-interval={{ .Values.hangarOutput.leaseRenewInterval }}
            # THE EPOCH BELONGS TO THE BASE FACET, and it used to render only
            # under the capture one. Every capability this node mints -- base
            # or capture -- carries the activation epoch in its claims, and a
            # capability claiming epoch zero is refused before it is signed. So
            # a base-only deployment rendered a control plane whose every call
            # would fail at mint time, while this chart's own validation
            # already required hangarOutput.activationEpoch under the base
            # switch: the value was demanded and then not passed on.
            - --kubernetes-hangar-output-activation-epoch={{ int .Values.hangarOutput.activationEpoch }}
            {{- if .Values.hangarOutput.enabled }}
            - --kubernetes-hangar-output-receipt-keys=/etc/concourse/hangar-output/receipt-keys/receipt-keys.json
            - --kubernetes-hangar-output-control-keys=/etc/concourse/hangar-output/receipt-keys/control-keys.json
            - --kubernetes-hangar-output-materialization-key=/etc/concourse/hangar-output/materialize/materialize.key
            # The bucket and tenant reach web so the operator STATUS surface can
            # key a cursor by the same bucket the sweep does. They are server
            # configuration and never a request field: no task, consumer, path
            # parameter or receipt can select or broaden them.
            - --kubernetes-hangar-output-bucket={{ .Values.hangarOutput.bucket }}
            - --kubernetes-hangar-output-tenant={{ .Values.hangarOutput.tenant }}
            {{- if .Values.hangarOutput.webEnabled }}
            - --kubernetes-hangar-output-capture-enabled
            {{- include "concourse.web.validateRunResults" . }}
            # Result downloads spool into a disk-backed volume, not the 64Mi
            # in-memory /tmp that is charged to this container's memory.
            - --run-result-scratch-dir=/var/concourse/run-result-scratch
            - --run-result-read-concurrency={{ int .Values.web.runResults.readConcurrency }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- include "concourse.web.validateRunCredentialWorkerImages" . }}
            {{- if .Values.web.runInputSigningKeySecret }}
            - --run-input-signing-key=/etc/concourse/run-input-signing/input.key
            # Credential handoff delivers only into these digest-pinned
            # images. None pinned refuses every handoff.
            {{- range .Values.web.runCredentialWorkerImages }}
            - --run-credential-worker-image={{ . }}
            {{- end }}
            {{- end }}
            # Kubernetes credential manager (resolve ((vars)) from k8s Secrets)
            {{- if .Values.kubernetes.credentialManager.enabled }}
            - --kubernetes-in-cluster
            {{- if .Values.kubernetes.credentialManager.namespacePrefix }}
            - --kubernetes-namespace-prefix={{ .Values.kubernetes.credentialManager.namespacePrefix }}
            {{- end }}
            {{- end }}
            # Tracing
            {{- if .Values.tracing.otlpAddress }}
            - --tracing-otlp-address={{ .Values.tracing.otlpAddress }}
            {{- end }}
            {{- if .Values.tracing.otlpUseTLS }}
            - --tracing-otlp-use-tls
            {{- end }}
            {{- if .Values.tracing.serviceName }}
            - --tracing-service-name={{ .Values.tracing.serviceName }}
            {{- end }}
            {{- range $key, $val := .Values.tracing.otlpHeaders }}
            - --tracing-otlp-header={{ $key }}:{{ $val }}
            {{- end }}
            # OTel Metrics
            {{- if .Values.otelMetrics.otlpAddress }}
            - --otel-metrics-otlp-address={{ .Values.otelMetrics.otlpAddress }}
            {{- end }}
            {{- if .Values.otelMetrics.otlpUseTLS }}
            - --otel-metrics-otlp-use-tls
            {{- end }}
            {{- range $key, $val := .Values.otelMetrics.otlpHeaders }}
            - --otel-metrics-otlp-header={{ $key }}:{{ $val }}
            {{- end }}
            # Connection pool sizing
            {{- if .Values.web.apiMaxConns }}
            - --api-max-conns={{ .Values.web.apiMaxConns }}
            {{- end }}
            {{- if .Values.web.backendMaxConns }}
            - --backend-max-conns={{ .Values.web.backendMaxConns }}
            {{- end }}
            # Extra args
            {{- range .Values.web.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: CONCOURSE_SESSION_SIGNING_KEY
              value: /keys/session_signing_key
            {{- if .Values.postgresql.existingSecret }}
            - name: CONCOURSE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.passwordSecretKey }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: CONCOURSE_PROMETHEUS_BIND_IP
              value: "0.0.0.0"
            - name: CONCOURSE_PROMETHEUS_BIND_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            {{- range .Values.web.env }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          ports:
            - containerPort: 8080
              name: http
            {{- if .Values.metrics.enabled }}
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
            {{- end }}
            {{- if .Values.web.tls.enabled }}
            - containerPort: {{ .Values.web.tls.bindPort }}
              name: https
            {{- end }}
            - containerPort: 2222
              name: tsa
          {{- with .Values.web.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            {{- if .Values.web.tls.enabled }}
            - name: web-tls
              mountPath: {{ .Values.web.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.artifactDaemon.enabled (.Values.artifactDaemon.tls.enabled | default false) }}
            - name: daemon-tls
              mountPath: /etc/concourse/daemon-tls
              readOnly: true
            {{- end }}
            {{- if and .Values.artifactDaemon.enabled .Values.artifactDaemon.resolveCapability.existingSecret }}
            - name: resolve-capability
              mountPath: /etc/concourse/resolve-capability
              readOnly: true
            {{- end }}
            {{- if .Values.hangarOutput.executionControl.enabled }}
            - name: hangar-output-capability
              mountPath: /etc/concourse/hangar-output/capability
              readOnly: true
            - name: hangar-output-client-tls
              mountPath: /etc/concourse/hangar-output/tls
              readOnly: true
            {{- if .Values.hangarOutput.enabled }}
            - name: hangar-output-receipt-keys
              mountPath: /etc/concourse/hangar-output/receipt-keys
              readOnly: true
            - name: hangar-output-materialize
              mountPath: /etc/concourse/hangar-output/materialize
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if .Values.web.runInputSigningKeySecret }}
            - name: run-input-signing
              mountPath: /etc/concourse/run-input-signing
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if include "concourse.web.runResultReads" . }}
            - name: run-result-scratch
              mountPath: /var/concourse/run-result-scratch
            {{- end }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds | default 120 }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if include "concourse.web.runResultReads" . }}
        - name: run-result-scratch
          emptyDir:
            sizeLimit: {{ .Values.web.runResults.scratchSizeLimit }}
        {{- end }}
        {{- /*
  secrets.create mints the session signing key into an emptyDir, so each pod
  gets its own: a restart invalidates every session, and two replicas reject
  each other's tokens outright. That is survivable for a single-replica dev
  install and broken for anything else, so an explicit request for both is a
  contradiction and fails the render rather than deploying something that
  half-works.

  Deliberately NOT solved with Helm `lookup` + genPrivateKey: `lookup` returns
  nothing under `helm template`, which is ArgoCD's render mode, so every sync
  would mint a fresh key AND write the private key into the rendered manifest
  in cleartext. Pre-create the Secret and set secrets.create=false with
  secrets.signingKeySecret instead.
*/}}
{{- if and .Values.secrets.create (gt (int .Values.web.replicas) 1) }}
{{- fail "secrets.create=true generates a per-pod session signing key, which cannot work with web.replicas > 1. Pre-create a Secret and set secrets.create=false with secrets.signingKeySecret." }}
{{- end }}
{{- if and (not .Values.secrets.create) .Values.secrets.signingKeySecret }}
        - name: keys
          secret:
            secretName: {{ .Values.secrets.signingKeySecret }}
        {{- else }}
        - name: keys
          emptyDir: {}
        {{- end }}
        {{- if .Values.web.tls.enabled }}
        - name: web-tls
          secret:
            secretName: {{ .Values.web.tls.secretName }}
        {{- end }}
        {{- if and .Values.artifactDaemon.enabled (.Values.artifactDaemon.tls.enabled | default false) }}
        - name: daemon-tls
          secret:
            secretName: {{ .Values.artifactDaemon.tls.existingSecret | default (printf "%s-artifact-daemon-tls" (include "concourse.fullname" .)) }}
            items:
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
              - key: ca.crt
                path: ca.crt
              {{- if .Values.artifactDaemon.hangar.webEnabled }}
              - key: hangar.key
                path: hangar.key
              {{- end }}
        {{- end }}
        {{- if and .Values.artifactDaemon.enabled .Values.artifactDaemon.resolveCapability.existingSecret }}
        - name: resolve-capability
          secret:
            secretName: {{ .Values.artifactDaemon.resolveCapability.existingSecret }}
        {{- end }}
        {{- if .Values.hangarOutput.executionControl.enabled }}
        - name: hangar-output-capability
          secret:
            secretName: {{ .Values.hangarOutput.capabilityKeySecret }}
        - name: hangar-output-client-tls
          secret:
            # The CLIENT certificate, and never the daemon's server Secret:
            # that one holds the key the daemon serves with, and a web pod
            # holding it could impersonate the output daemon to itself.
            secretName: {{ .Values.hangarOutput.daemon.tls.clientSecret }}
        {{- if .Values.hangarOutput.enabled }}
        - name: hangar-output-receipt-keys
          configMap:
            # PUBLIC verification material only. The private half is mounted in
            # the output daemon Pod and nowhere else; a public key cannot sign,
            # which is what makes this a ConfigMap rather than a Secret.
            name: {{ include "concourse.hangarOutput.receiptKeysName" . }}
        - name: hangar-output-materialize
          secret:
            # The read-warrant key. The control plane MINTS warrants, so it holds
            # this one -- and it is a different key and a different domain from
            # the receipt key, so holding it does not let web sign a receipt.
            secretName: {{ .Values.hangarOutput.materializationKeySecret }}
        {{- end }}
        {{- end }}
        {{- if .Values.web.runInputSigningKeySecret }}
        - name: run-input-signing
          secret:
            secretName: {{ .Values.web.runInputSigningKeySecret }}
            items:
              - key: input.key
                path: input.key
        {{- end }}
        {{- with .Values.web.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
