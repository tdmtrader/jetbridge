{{- if and .Values.artifactDaemon.enabled .Values.artifactDaemon.tls.enabled (not .Values.artifactDaemon.tls.existingSecret) }}
{{- $fullName := include "concourse.fullname" . }}
{{- $secretName := printf "%s-artifact-daemon-tls" $fullName }}
{{- $namespace := .Release.Namespace }}
{{- $serviceName := include "concourse.artifactDaemonServiceName" . }}
{{/*
  Reuse the CA across `helm upgrade` by looking up the existing Secret, and
  generate a fresh one only when none exists.

  This works ONLY when the chart is rendered with a live cluster connection.
  `lookup` returns an empty map during a plain `helm template`, which is the
  path Argo CD takes by default -- so under GitOps this mints a brand-new CA,
  server cert, and client cert on every manifest generation. Neither side
  hot-reloads (both read their TLS material once at process start), so the
  re-applied Secret plants a latent split: the next pod to restart for any
  unrelated reason comes up trusting the new CA and fails every mTLS handshake
  against pods still holding the old one, until both the web Deployment and the
  whole DaemonSet have rolled.

  Set artifactDaemon.tls.existingSecret and manage the material outside the
  chart in any pipeline that renders without a cluster. See the GitOps caveat
  in the chart README.
*/}}
{{- $existingSecret := (lookup "v1" "Secret" $namespace $secretName) }}
{{- $ca := "" }}
{{- if and $existingSecret $existingSecret.data }}
  {{- $ca = buildCustomCert (index $existingSecret.data "ca.crt") (index $existingSecret.data "ca.key") }}
{{- else }}
  {{- $ca = genCA "concourse-artifact-daemon-ca" 3650 }}
{{- end }}
{{- $serverAltNames := list
      (printf "%s.%s.svc" $serviceName $namespace)
      (printf "*.%s.%s.svc" $serviceName $namespace)
      (printf "%s.%s.svc.cluster.local" $serviceName $namespace)
      "localhost"
}}
{{- $serverCert := genSignedCert "artifact-daemon" (list "127.0.0.1") $serverAltNames 3650 $ca }}
{{- $clientCert := genSignedCert "concourse-client" nil nil 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # Survives `helm uninstall` so a reinstall's lookup finds the same CA
    # instead of minting one the running daemons do not trust. It does NOT
    # stop an upgrade or an Argo CD sync from overwriting this Secret with
    # freshly generated material -- only existingSecret does that.
    helm.sh/resource-policy: keep
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
  tls.crt: {{ $serverCert.Cert | b64enc }}
  tls.key: {{ $serverCert.Key | b64enc }}
  client.crt: {{ $clientCert.Cert | b64enc }}
  client.key: {{ $clientCert.Key | b64enc }}
{{- end }}
