{{- if and .Values.artifactDaemon.enabled (or .Values.networkPolicy.enabled (.Values.artifactDaemon.networkPolicy.enabled | default false)) }}
{{- if .Values.artifactDaemon.networkPolicy.enabled }}
{{- range $destinationName := list "dnsEgressTo" "kubernetesAPIEgressTo" "hangarEgressTo" }}
{{- $destinations := index $.Values.artifactDaemon.networkPolicy $destinationName | default (list) }}
{{- range $index, $destination := $destinations }}
{{- $valid := false }}
{{- $invalid := false }}
{{- if kindIs "map" $destination }}
  {{- if hasKey $destination "ipBlock" }}
    {{- $ipBlock := index $destination "ipBlock" }}
    {{- if and (kindIs "map" $ipBlock) (hasKey $ipBlock "cidr") }}
      {{- $cidr := index $ipBlock "cidr" | toString }}
      {{- if and $cidr (not (regexMatch "/0+$" $cidr)) }}
        {{- $valid = true }}
      {{- else }}
        {{- $invalid = true }}
      {{- end }}
    {{- else }}
      {{- $invalid = true }}
    {{- end }}
  {{- end }}
  {{- range $selectorName := list "podSelector" "namespaceSelector" }}
    {{- if hasKey $destination $selectorName }}
      {{- $selector := index $destination $selectorName }}
      {{- $selectorValid := false }}
      {{- if kindIs "map" $selector }}
        {{- $matchLabels := index $selector "matchLabels" | default (dict) }}
        {{- $matchExpressions := index $selector "matchExpressions" | default (list) }}
        {{- if or (and (kindIs "map" $matchLabels) (gt (len $matchLabels) 0)) (and (kindIs "slice" $matchExpressions) (gt (len $matchExpressions) 0)) }}
          {{- $selectorValid = true }}
          {{- $valid = true }}
        {{- end }}
      {{- end }}
      {{- if not $selectorValid }}
        {{- $invalid = true }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if or $invalid (not $valid) }}
  {{- fail (printf "artifactDaemon.networkPolicy.%s[%d] must contain a destination-specific ipBlock, podSelector, or namespaceSelector (0.0.0.0/0, ::/0, and empty selectors are rejected)" $destinationName $index) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.agentSnapshots.enabled .Values.artifactDaemon.networkPolicy.enabled (empty .Values.artifactDaemon.networkPolicy.hangarEgressTo) }}
{{- fail "artifactDaemon.networkPolicy.hangarEgressTo is required when agentSnapshots.enabled is true and daemon egress policy is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: artifact-daemon
  policyTypes:
    - Ingress
    {{- if .Values.artifactDaemon.networkPolicy.enabled }}
    - Egress
    {{- end }}
  ingress:
    # Web pods register caches, stream artifacts, and manage snapshots.
    - from:
        - podSelector:
            matchLabels:
              {{- include "concourse.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    # Every runtime pod has concourse.ci/worker. This includes one-off and
    # hermetic executions that do not carry pipeline metadata.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "concourse.kubernetesNamespace" . }}
          podSelector:
            matchExpressions:
              - key: concourse.ci/worker
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    # Peer daemons resolve replicas across nodes.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: artifact-daemon
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    {{- if and .Values.serviceMonitor.enabled .Values.serviceMonitor.artifactDaemon.enabled }}
    # Prometheus scrapes /metrics on the daemon port (see the artifact-daemon
    # ServiceMonitor). The scrape sources must be named explicitly: the daemon
    # port also serves the artifact API, so this policy never opens it to all
    # peers the way the web policy's metrics ingress does.
    {{- with .Values.serviceMonitor.scrapeFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.artifactDaemon.port | default 7780 }}
    {{- else }}
      {{- fail "serviceMonitor.scrapeFrom must list the Prometheus NetworkPolicyPeers (e.g. a namespaceSelector) when a NetworkPolicy and the artifact-daemon ServiceMonitor are both enabled — otherwise every scrape of the daemon port is silently dropped. Alternatively set serviceMonitor.artifactDaemon.enabled=false." }}
    {{- end }}
    {{- end }}
  {{- if .Values.artifactDaemon.networkPolicy.enabled }}
  egress:
    {{- with .Values.artifactDaemon.networkPolicy.dnsEgressTo }}
    # DNS resolution through operator-selected resolvers only.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Peer daemon communication.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: artifact-daemon
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    {{- with .Values.artifactDaemon.networkPolicy.kubernetesAPIEgressTo }}
    # Kubernetes API server through operator-selected destinations only.
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.agentSnapshots.enabled }}
    # Durable snapshot authority: only operator-selected GCS/emulator peers.
    - to:
        {{- toYaml .Values.artifactDaemon.networkPolicy.hangarEgressTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
  {{- end }}
{{- end }}
