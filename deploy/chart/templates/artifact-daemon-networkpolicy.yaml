{{/*
ANY switch renders it, and that is not redundancy. The third is the output
plane's: the artifact daemon serves it, so an install that asked for the output
workloads' policies gets this one.

`networkPolicy.enabled` used to render a SECOND copy of this object out of
networkpolicy.yaml -- same name, different task selector -- and de-duplicating
that was right. Gating the survivor on the new switch alone was not: an install
that sets networkPolicy.enabled and has never heard of
artifactDaemon.networkPolicy.enabled (default false) LOST the policy on
upgrade, and a pod selected by no NetworkPolicy is not default-deny, it is
unrestricted.
*/}}
{{- $outputPolicies := and .Values.hangarOutput.executionControl.enabled .Values.hangarOutput.networkPolicy.enabled }}
{{- if or .Values.networkPolicy.enabled (.Values.artifactDaemon.networkPolicy.enabled | default false) $outputPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concourse.fullname" . }}-artifact-daemon
  labels:
    {{- include "concourse.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-daemon
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" . }}
      app.kubernetes.io/component: artifact-daemon
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Concourse web pods
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    # Allow traffic from Concourse task/check pods (labeled by the K8s runtime)
    - from:
        - podSelector:
            matchExpressions:
              - key: concourse.ci/worker
                operator: Exists
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    # Allow traffic from peer daemon pods (cross-node resolution). The output
    # plane is served on this same port, so a policy cannot admit peers to the
    # artifact routes alone; the plane's off-node routes refuse the daemons'
    # own serving certificate instead, which is the one a peer presents.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: artifact-daemon
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    {{- with .Values.artifactDaemon.metrics.port }}
    # Prometheus, from whatever namespace it runs in. No source selector: the
    # listener answers /metrics and nothing else, and a selector here would
    # have to guess the monitoring stack's labels -- and guess wrong silently,
    # as a target that is merely down.
    - ports:
        - protocol: TCP
          port: {{ . }}
    {{- end }}
  egress:
    {{- if $.Values.hangarStorage.disk.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: hangar-store
      ports:
        - protocol: TCP
          port: 7783
    {{- end }}
    # DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Peer daemon communication (cross-node artifact fetching)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "concourse.name" . }}
              app.kubernetes.io/component: artifact-daemon
      ports:
        - protocol: TCP
          port: {{ .Values.artifactDaemon.port | default 7780 }}
    # Kubernetes API server (for EndpointSlice discovery and node labeling)
    - ports:
        - protocol: TCP
          port: 443
    # GKE standard/Calico (GKE 1.21+) metadata server — required for
    # Workload Identity token refresh.
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    # GKE Dataplane V2 metadata server. Both current profiles are included
    # because Helm cannot infer the cluster's network policy provider.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
{{- end }}
{{- if and $outputPolicies .Values.hangarOutput.enabled }}
{{/*
The output plane's two controllers. They accept NO ingress at all: they serve
nothing -- each is a bounded worker woken by a ticker and a NOTIFY -- so an
ingress rule would be permission for a connection nothing makes.
*/}}
{{/*
Name AND component, carried together.

The component used to be re-derived by trimming the fullname prefix off the
object's name -- and the name is truncated, so once truncation bit the label
disagreed with the literal the Deployments set and the podSelector matched
nothing. A NetworkPolicy that selects no pod is not an error and is not a deny:
the two controllers simply had no policy, silently, from a render that reads
correctly. The literal is now the same value in the selector, in the label and
in the workload.
*/}}
{{- range $controller := list
  (dict "name" (include "concourse.hangarOutput.inventoryName" .) "component" "hangar-output-inventory")
  (dict "name" (include "concourse.hangarOutput.reclaimerName" .) "component" "hangar-output-reclaimer")
 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $controller.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- /*
      commonLabels, not labels: `concourse.labels` appends
      `app.kubernetes.io/component: web`, and these three NetworkPolicies are
      the inventory and reclaimer controllers. The label is
      inert at the API server -- nothing selects a NetworkPolicy -- but an
      operator filtering `component=web` to see what governs the web pod would
      be shown three policies that govern the output controllers, which is the
      one thing this chart's labels are read for.
    */}}
    {{- include "concourse.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $controller.component }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "concourse.name" $ }}
      app.kubernetes.io/component: {{ $controller.component }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules at all: these workloads serve nothing.
  ingress: []
  egress:
    {{- if $.Values.hangarStorage.disk.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: hangar-store
      ports:
        - protocol: TCP
          port: 7783
    {{- end }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL and Cloud Storage.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 987
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
