{{- /*
The web's secret flag values (concourse.web.credentials in _helpers.tpl):
the inline database password and the local users. The web container and
migrate-db read them as environment variables, so they stay out of the pod's
args.
*/ -}}
{{- $data := include "concourse.web.credentials" . | fromJson }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "concourse.fullname" . }}-web-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concourse.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
