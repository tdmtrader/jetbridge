resources:
- name: repo
  type: git
  source:
    uri: https://github.com/tdmtrader/jetbridge.git
    branch: core
jobs:
- name: build-and-vet
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
  - task: build-and-vet
    # Retry transient k8s-runtime pod disruptions (single-node contention);
    # this task errors (not fails) when its pod is lost mid-run.
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Verifying full build ==="
          go build ./cmd/concourse
          go build ./cmd/artifact-daemon
          echo "=== Build successful ==="
          echo ""
          echo "=== Running go vet ==="
          go vet ./atc/worker/jetbridge/... ./vars/... ./tracing/... \
                 ./fly/commands/... ./fly/rc/... ./fly/eventstream/... \
                 ./atc/engine/... ./atc/resource/... \
                 ./atc/scheduler/... ./atc/metric/... ./atc/creds/... \
                 ./skymarshal/token/... ./skymarshal/skyserver/...
          echo "=== Vet passed ==="


- name: unit-tests
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [build-and-vet]
  - task: unit-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running unit tests across the full codebase ==="
          echo "Excluding packages that require external infrastructure"
          echo ""
          # testhelpers/otel talks to tempo.home and loki.home. It is excluded
          # from `make test-unit` for that reason but was never excluded here,
          # so this job spent ~260s of its 10m budget retrying them whenever
          # those hosts were unreachable. The exclusion lists now agree.

          # Most of the suites below now run against a real postmaster that
          # atc/postgresrunner starts itself (no sidecar, no service). It
          # shells out to these three, and a missing one fails deep inside a
          # BeforeSuite where the cause is not obvious -- so say it here.
          for tool in initdb postgres psql; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "ERROR: '$tool' is not on PATH."
              echo "The test-runner image must carry the PostgreSQL server and"
              echo "client binaries; 24 packages start their own postmaster."
              exit 1
            }
          done

          PACKAGES=$(go list ./... \
            | grep -v /integration \
            | grep -v /testflight \
            | grep -v /topgun \
            | grep -v /fly/integration \
            | grep -v /atc/db \
            | grep -v /atc/gc \
            | grep -v /atc/postgresrunner \
            | grep -v /atc/scheduler/algorithm \
            | grep -v '/atc/worker$' \
            | grep -v /skymarshal/dexserver \
            | grep -v /testhelpers/otel \
            | grep -v /cmd)
          echo "Testing packages:"
          echo "$PACKAGES" | head -20
          echo "... ($(echo "$PACKAGES" | wc -l | tr -d ' ') packages total)"
          echo ""
          go test -count=1 -timeout 10m $PACKAGES
          echo "=== All unit tests passed ==="

- name: k8s-runtime-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [unit-tests]
  - task: k8s-runtime-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running jetbridge full test suite ==="
          go test -v -count=1 -timeout 5m ./atc/worker/jetbridge/...
          echo "=== All jetbridge tests passed ==="

- name: tag-rc
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-runtime-tests]
  - task: create-rc-tag
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          # This job builds nothing -- it validates the declared version and
          # names the candidate. The frontend assets belong to the job that
          # actually compiles a binary (build-image/build-and-push-local),
          # which is where that block lives.

          # Version is DECLARED in the VERSION file, never derived from tags.
          # Deriving "latest tag + 1" made every green push a release and tied
          # the number to a tag namespace shared with 399 upstream Concourse
          # tags. One declaration, five consumers.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "FATAL: VERSION must be MAJOR.MINOR.PATCH, got '${VERSION}'" >&2
            exit 1
          }

          SHORT_SHA=$(git rev-parse --short HEAD)
          RC_TAG="jb-${VERSION}-rc"
          echo "=== Tagging ${RC_TAG} at ${SHORT_SHA} ==="

          # RC tags are no longer pushed. A force-pushed, moving tag is not a
          # record of anything, and this task carried attempts: 2 -- a RETRIED
          # force-push. The RC identity moves to an immutable per-commit image
          # tag when the release chain is redesigned; until then the tag is
          # local to the task and dies with the container.
          git tag -f "${RC_TAG}"
          echo "=== Release candidate: ${RC_TAG} (${SHORT_SHA}) -- tagged locally, not pushed ==="

- name: build-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [tag-rc]
  # web/handler.go embeds web/public with //go:embed, so a bare `go build`
  # ships whatever elm.min.js was last COMMITTED. That is how v0.2.164-rc went
  # out with a stale UI on 2026-07-17, and the committed bundle had already sat
  # unrebuilt for 3.5 months before that. Regenerate from source here so a
  # stale commit can never reach the image.
  #
  # This mirrors Dockerfile.build's `frontend` stage; keep the two in sync.
  # Dockerfile.build is not reused wholesale because its Go stage stamps only
  # concourse.Version -- this chain also stamps JetBridgeVersion -- and would
  # re-download a module graph the test-runner image already has warm.
  - task: build-frontend
    attempts: 2
    config:
      platform: linux
      # Same image as Dockerfile.build stage 1. The elm npm package ships
      # x86_64 binaries only, so this must land on an amd64 node.
      rootfs_uri: docker:///node:22-bookworm-slim
      inputs:
      - name: repo
      outputs:
      - name: web-public
      # npm and the elm package registry are external egress, historically the
      # flakiest part of any frontend build here: the caches keep repeat runs
      # mostly offline and attempts: 2 absorbs a single bad fetch.
      caches:
      - path: yarn-global
      - path: elm-home
      run:
        path: sh
        args:
        - -exc
        - |
          # Keep every download inside cached task dirs (yarn 4 puts its cache
          # under globalFolder/cache; elm under ELM_HOME/0.19.1).
          export YARN_GLOBAL_FOLDER="$(pwd)/yarn-global"
          export ELM_HOME="$(pwd)/elm-home"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          # puppeteer is a wats-only devDependency whose postinstall pulls a
          # ~150MB Chrome build that `yarn run build` never touches.
          export PUPPETEER_SKIP_DOWNLOAD=1

          # Elm's built-in TLS needs system CA certificates to fetch package
          # metadata; the node slim images autoremove them.
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            rm -rf /var/lib/apt/lists/*
          fi

          cd repo
          # `corepack prepare` with no spec activates the version in the
          # checkout's package.json "packageManager" field, so the yarn pin
          # lives in exactly one place.
          corepack enable
          corepack prepare --activate
          yarn --version

          echo "=== Committed bundle (what a bare go build would have shipped) ==="
          sha256sum web/public/elm.min.js || true

          echo "=== Installing node dependencies ==="
          yarn install --immutable || yarn install

          # This is the only task in the pipeline with elm-test available, so
          # it is where the frontend tier runs. `yarn run build` below already
          # fails on a frontend that does not compile; this catches the tier
          # above that. It had rotted to two non-compiling suites by the time
          # anyone ran it, precisely because nothing here ran it.
          echo "=== Running Elm tests ==="
          yarn run test

          echo "=== Building frontend (LESS -> css, Elm -> js, webpack) ==="
          yarn run build

          echo "=== Rebuilt frontend assets ==="
          sha256sum web/public/elm.min.js web/public/main.css web/public/bundle.js

          # Ship the whole merged directory: `yarn run build` regenerates
          # elm.js/elm.min.js/main.css/*bundle.js and the rest (images, fonts,
          # mdi-svg.min.js, graphviz) is committed source.
          cp -a web/public/. ../web-public/
  - task: build-and-push-local
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: web-public
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          # //go:embed in web/handler.go bakes web/public into the binary, so
          # the freshly built assets MUST land before `go build` -- otherwise
          # the committed bundle ships (2026-07-17).
          echo "=== Installing freshly built frontend assets over web/public ==="
          if [ ! -s ../web-public/elm.min.js ]; then
            echo "FATAL: build-frontend produced no elm.min.js -- refusing to ship a possibly stale bundle" >&2
            exit 1
          fi
          cp -a ../web-public/. web/public/
          sha256sum web/public/elm.min.js

          # Version is DECLARED in the VERSION file, never derived from tags.
          # Deriving "latest tag + 1" made every green push a release and tied
          # the number to a tag namespace shared with 399 upstream Concourse
          # tags. One declaration, five consumers.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "FATAL: VERSION must be MAJOR.MINOR.PATCH, got '${VERSION}'" >&2
            exit 1
          }

          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version: ${VERSION}-rc (${SHORT_SHA})"

          LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${VERSION}-rc -X github.com/concourse/concourse.JetBridgeVersion=${VERSION}-rc"

          echo "=== Building concourse binary (linux/amd64 only — fly cross-compiles deferred to release) ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o concourse-linux-amd64 ./cmd/concourse
          ls -lh concourse-linux-amd64
          echo "=== Building artifact-daemon binary ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o artifact-daemon-linux-amd64 ./cmd/artifact-daemon
          ls -lh artifact-daemon-linux-amd64

          # Every platform, in the RC image -- not deferred to release.
          #
          # fly/rc/target.go hard-errors on a MAJOR.MINOR mismatch against the
          # ATC (a patch difference only warns). 0.2 -> 0.3 is this fork's first
          # minor bump, so every existing fly is locked out the moment a 0.3 web
          # is deployed. The in-band remedy is `fly sync`, which serves these
          # archives from --cli-artifacts-dir -- and the cluster tracks RC
          # images, so an archive that only exists in the release image never
          # reaches a running web. Building linux/amd64 only here meant
          # `fly sync` 404s on exactly the upgrade that needs it.
          echo "=== Building fly CLI for every published platform ==="
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${VERSION}-rc"
          mkdir -p fly-assets
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin=fly; [ "$os" = "windows" ] && bin=fly.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags "${FLY_LDFLAGS}" -o "/tmp/$bin" ./fly
            tar czf "fly-assets/fly-${os}-${arch}.tgz" -C /tmp "$bin"
            rm -f "/tmp/$bin"
          done
          ls -lh fly-assets/

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          BUILDER_POD="image-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=image-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: image-builder
          spec:
            containers:
            - name: dind
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying binaries to builder pod ==="
          kubectl cp concourse-linux-amd64 cicd/${BUILDER_POD}:/tmp/concourse-linux-amd64
          kubectl cp artifact-daemon-linux-amd64 cicd/${BUILDER_POD}:/tmp/artifact-daemon-linux-amd64
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Copying Dockerfile to builder pod ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile
          FROM ubuntu:22.04
          RUN apt-get update && \
              apt-get install -y ca-certificates dumb-init && \
              rm -rf /var/lib/apt/lists/*
          COPY concourse-linux-amd64 /usr/local/concourse/bin/concourse
          COPY artifact-daemon-linux-amd64 /usr/local/concourse/bin/artifact-daemon
          COPY fly-assets /usr/local/concourse/fly-assets
          RUN chmod +x /usr/local/concourse/bin/concourse /usr/local/concourse/bin/artifact-daemon
          ENV PATH="/usr/local/concourse/bin:${PATH}"
          ENTRYPOINT ["dumb-init", "concourse"]
          DOCKERFILE
          kubectl cp /tmp/Dockerfile cicd/${BUILDER_POD}:/tmp/Dockerfile

          echo "=== Building Docker image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/jetbridge:latest \
              -t registry.home/jetbridge:${VERSION}-rc \
              -t ${REGISTRY}/jetbridge:latest \
              -t ${REGISTRY}/jetbridge:${VERSION}-rc \
              -f /tmp/Dockerfile /tmp/

          echo "=== Pushing to local registries ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:${VERSION}-rc
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:${VERSION}-rc

          echo "=== Image built and pushed to local registries: ${VERSION}-rc (${SHORT_SHA}) ==="

- name: self-upgrade
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [build-image]
  - task: trigger-rollout
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          # Version is DECLARED in the VERSION file, never derived from tags.
          # Deriving "latest tag + 1" made every green push a release and tied
          # the number to a tag namespace shared with 399 upstream Concourse
          # tags. One declaration, five consumers.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "FATAL: VERSION must be MAJOR.MINOR.PATCH, got '${VERSION}'" >&2
            exit 1
          }

          IMAGE="registry.home/jetbridge:${VERSION}-rc"
          echo "=== Self-upgrade: deploying ${IMAGE} ==="
          echo "Triggering rollout and exiting immediately."
          echo ""

          kubectl set image deployment/concourse-web concourse-web=${IMAGE} -n cicd
          kubectl rollout restart deployment/concourse-web -n cicd
          kubectl rollout restart daemonset/concourse-artifact-daemon -n cicd

          echo "=== Rollout triggered. ==="

- name: verify-upgrade
  serial_groups: [pipeline]
  plan:
  # Triggered once per upgraded commit. No settle timer: in-flight builds
  # survive the self-upgrade web rollout (engine drain releases job builds
  # and the task supervisor resumes them — build_survival track), and a
  # timer trigger re-fires forever, failing after every release because
  # "latest tag + 1"-rc only exists once the NEXT commit builds it.
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [self-upgrade]
  - task: check-running-version
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          # Version is DECLARED in the VERSION file, never derived from tags.
          # Deriving "latest tag + 1" made every green push a release and tied
          # the number to a tag namespace shared with 399 upstream Concourse
          # tags. One declaration, five consumers.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "FATAL: VERSION must be MAJOR.MINOR.PATCH, got '${VERSION}'" >&2
            exit 1
          }
          EXPECTED="${VERSION}-rc"

          echo "=== Waiting for rollout to complete ==="
          kubectl rollout status deployment/concourse-web -n cicd --timeout=180s
          kubectl rollout status daemonset/concourse-artifact-daemon -n cicd --timeout=180s

          echo "=== Waiting for pods to be ready ==="
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=web -n cicd --timeout=120s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=artifact-daemon -n cicd --timeout=120s

          echo "=== Letting service endpoints settle (15s) ==="
          sleep 15

          CONCOURSE_URL="http://concourse-web.cicd.svc.cluster.local:8080"
          echo "=== Waiting for Concourse to report version ${EXPECTED} ==="
          echo ""

          for i in $(seq 1 60); do
            RUNNING=$(curl -sf "${CONCOURSE_URL}/api/v1/info" 2>/dev/null \
              | grep -o '"version":"[^"]*"' \
              | cut -d'"' -f4) || RUNNING="(unreachable)"
            echo "  attempt ${i}: running=${RUNNING} expected=${EXPECTED}"
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo ""
              echo "=== Verified: Concourse is running v${EXPECTED} ==="
              exit 0
            fi
            sleep 5
          done

          echo ""
          echo "=== FAILED: Concourse did not reach v${EXPECTED} within 5 minutes ==="
          echo "  Last seen version: ${RUNNING}"
          exit 1

- name: k8s-live-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [verify-upgrade]
  - task: k8s-live-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          echo "=== Setting up kubeconfig for Go test client ==="
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          SA_TOKEN=$(cat "$SA_DIR/token")
          kubectl config set-cluster local --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" --certificate-authority="$SA_DIR/ca.crt" --embed-certs=true
          kubectl config set-credentials local --token="$SA_TOKEN"
          kubectl config set-context local --cluster=local --user=local --namespace=concourse
          kubectl config use-context local
          echo "Kubeconfig created, testing: $(kubectl get pods -n concourse --no-headers 2>&1 | wc -l) pods visible"

          export K8S_TEST_NAMESPACE=concourse
          echo "K8S_TEST_NAMESPACE=$K8S_TEST_NAMESPACE"

          echo "=== Cleaning up stale test pods from previous runs ==="
          for NS in concourse concourse-test; do
            kubectl get pods -n $NS --no-headers -o custom-columns=":metadata.name" 2>/dev/null \
              | { grep -E '^(live-|e2e-)' || true; } \
              | xargs -r kubectl delete pods -n $NS --grace-period=0 --force 2>/dev/null || true
          done
          echo ""

          export ARTIFACT_DAEMON_HOST_PATH=/var/concourse/artifacts
          export ARTIFACT_DAEMON_PORT=7780
          export ARTIFACT_DAEMON_SERVICE=artifact-daemon

          cd repo
          echo "=== Running jetbridge live integration tests ==="
          echo "These tests create real K8s pods against the live cluster."
          echo "Artifact daemon: hostPath=$ARTIFACT_DAEMON_HOST_PATH port=$ARTIFACT_DAEMON_PORT"
          echo ""
          go test -tags live -v -count=1 -timeout 5m ./atc/worker/jetbridge/...
          echo "=== Live integration tests passed ==="

- name: release
  serial_groups: [pipeline]
  plan:
  # The ONLY manually triggered job in the pipeline. Everything upstream of here
  # runs on every green push, which is what keeps the branch deployable; cutting
  # a release is a decision, and a decision needs someone to make it.
  #
  # Before this, `trigger: true` meant a green push WAS a release: eight jobs
  # would go green and the ninth would tag, publish to GHCR, and redeploy,
  # without anyone choosing to. TestReleaseJobIsManuallyTriggered keeps this
  # false.
  - get: repo
    trigger: false
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-live-tests]
  - task: acceptance-gate
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          fail() { echo "FATAL: $*" >&2; exit 1; }

          # Read-only. Nothing here mutates anything, which is the point: every
          # reason to refuse a release should be found before the release task
          # starts pushing images.

          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || fail "VERSION must be MAJOR.MINOR.PATCH, got '${VERSION}'"

          # The same invariant TestVersionDeclarationsAgree asserts, re-checked
          # here so a release cannot rest on a test having run in some earlier
          # job against some earlier commit.
          GO_VERSION=$(grep -E '^var JetBridgeVersion = ' versions.go | cut -d'"' -f2)
          CHART_VERSION=$(grep -E '^appVersion:' deploy/chart/Chart.yaml \
            | awk '{print $2}' | tr -d '"')

          [ "${GO_VERSION}" = "${VERSION}" ] \
            || fail "versions.go JetBridgeVersion=${GO_VERSION} but VERSION=${VERSION}"
          [ "${CHART_VERSION}" = "${VERSION}" ] \
            || fail "Chart.yaml appVersion=${CHART_VERSION} but VERSION=${VERSION}"

          echo "=== Accepted: jb-${VERSION} at $(git rev-parse --short HEAD) ==="
  - task: tag-push-release
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          # Version is DECLARED in the VERSION file, never derived from tags.
          # Deriving "latest tag + 1" made every green push a release and tied
          # the number to a tag namespace shared with 399 upstream Concourse
          # tags. One declaration, five consumers.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "FATAL: VERSION must be MAJOR.MINOR.PATCH, got '${VERSION}'" >&2
            exit 1
          }
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "Releasing: ${VERSION} (${SHORT_SHA})"

          git config --global user.email "ci@concourse.home"
          git config --global user.name "Concourse CI"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/tdmtrader/jetbridge.git"
          # --- 0. Already released? Refuse BEFORE touching any registry. ---
          #
          # This check used to sit down at the tagging step, which is after
          # `docker push registry.home/jetbridge:${VERSION}` and after all three
          # GHCR pushes. Re-running the release of an already-cut version
          # therefore did the damage first and complained second: :VERSION and
          # :latest were republished from an unreleased commit, and only then
          # did the job go red. The deployment references :VERSION by tag, so
          # the next reschedule could pull the rewritten image.
          #
          # The remote is the authority -- a local clone can be missing a tag
          # that origin already holds.
          if git ls-remote --exit-code --tags origin "refs/tags/jb-${VERSION}" >/dev/null 2>&1; then
            echo "FATAL: tag jb-${VERSION} already exists on origin." >&2
            echo "Refusing to republish a version that has already been cut." >&2
            echo "Bump VERSION, versions.go and Chart.yaml, then re-run." >&2
            exit 1
          fi

          # NOTE: the git tag and the force-push to main are DEFERRED to the end
          # of this task, after the RC image is verified and the release image is
          # built and pushed. Previously they ran first, so a missing RC image
          # (or any image/build failure) left behind a phantom vX tag pointing at
          # an unbuilt version and force-moved main to an unreleased commit.

          # --- 1. Build multi-platform fly + push to GHCR ---
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/jetbridge"
          BUILDER_POD="release-push-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=release-push --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD pod for GHCR push ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: release-push
          spec:
            containers:
            - name: dind
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for push pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "=== Building fly CLI for all platforms ==="
          LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${VERSION} -X github.com/concourse/concourse.JetBridgeVersion=${VERSION}"
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${VERSION}"
          mkdir -p fly-assets fly-bin
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${pair%%/*}"
            ARCH="${pair##*/}"
            echo "  fly-${OS}-${ARCH}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags "${FLY_LDFLAGS}" -o fly-bin/fly ./fly
            tar czf fly-assets/fly-${OS}-${ARCH}.tgz -C fly-bin fly
            rm -f fly-bin/fly
          done
          rm -rf fly-bin
          ls -lh fly-assets/

          # --- 2. Verify the RC image exists BEFORE any git mutation ---
          echo "=== Verifying RC image registry.home/jetbridge:${VERSION}-rc exists ==="
          if ! kubectl exec -n cicd ${BUILDER_POD} -- docker pull registry.home/jetbridge:${VERSION}-rc; then
            echo "FATAL: RC image ${VERSION}-rc not found."
            echo "The RC pipeline (tag-rc/build-image) has not produced it — refusing"
            echo "to tag jb-${VERSION}. Fix the RC build, then re-run."
            exit 1
          fi

          echo "=== Copying fly assets into builder pod ==="
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Rebuilding image with all fly platform assets ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile.release
          FROM registry.home/jetbridge:__VERSION__-rc
          COPY fly-assets /usr/local/concourse/fly-assets
          DOCKERFILE
          sed -i "s/__VERSION__/${VERSION}/g" /tmp/Dockerfile.release
          kubectl cp /tmp/Dockerfile.release cicd/${BUILDER_POD}:/tmp/Dockerfile.release
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/jetbridge:${VERSION} \
              -t ${GHCR}:${SHORT_SHA} \
              -t ${GHCR}:${VERSION} \
              -t ${GHCR}:latest \
              -f /tmp/Dockerfile.release /tmp/

          echo "=== Pushing release to local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:${VERSION}

          echo "=== Logging into GHCR ==="
          echo "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin

          echo "=== Pushing to GHCR ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:${SHORT_SHA}
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:${VERSION}
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:latest

          # --- 3. Image published — NOW create the release tag ---
          # (Deferred from the top: only tag/push once the image actually exists.)
          #
          # The predecessor of this block tested `git rev-parse` and, when the
          # tag already existed, printed "skipping" and FELL THROUGH to the
          # force-push and the redeploy below. It read as a guard and was not
          # one.
          #
          # This is now a RACE re-check, not the guard. The guard is step 0
          # above, which runs before any registry is touched; several minutes of
          # image building sit between the two, and this closes the window where
          # someone else cut the same version in between.
          echo "=== Tagging jb-${VERSION} ==="
          if git ls-remote --exit-code --tags origin "refs/tags/jb-${VERSION}" >/dev/null 2>&1; then
            echo "FATAL: tag jb-${VERSION} appeared on origin during this build." >&2
            echo "Someone else cut it after step 0 passed. The images above have" >&2
            echo "already been published; reconcile before re-running." >&2
            exit 1
          fi
          git tag -a "jb-${VERSION}" -m "Release jb-${VERSION}"
          git push origin "jb-${VERSION}"
          echo "=== Tagged jb-${VERSION} ==="

          # --- 4. Redeploy with final release version (includes all fly assets) ---
          #
          # No push to main. `git push --force origin HEAD:refs/heads/main` used
          # to run here and would silently discard any commit on main that was
          # not an ancestor of the release commit. This branch IS the line; there
          # is nothing to promote to.
          #
          # The RC tag is no longer deleted either -- CI does not delete remote
          # refs.
          echo "=== Redeploying with release image ==="
          IMAGE="registry.home/jetbridge:${VERSION}"
          kubectl set image deployment/concourse-web concourse-web=${IMAGE} -n cicd
          kubectl rollout restart deployment/concourse-web -n cicd

          echo "=== Release complete: ${VERSION} (${SHORT_SHA}) ==="
          echo "  Tagged: jb-${VERSION}"
          echo "  GHCR:   ${GHCR}:${VERSION}"
          echo "  Local:  ${IMAGE}"
