resources:
- name: repo
  type: git
  source:
    uri: https://github.com/tdmtrader/jetbridge.git
    branch: jetbridge
    # Docs-only churn must not trigger the self-release chain (every push
    # restarts web ~10-12 min later and double-spends in-flight dogfood
    # builds — see ci/dogfood/FINDINGS.md "Pushing to jetbridge mid-run").
    # Deliberately narrow: ci/** and deploy/** still trigger.
    ignore_paths:
    - docs/**
    - ci/dogfood/FINDINGS.md
    - notes/**
    - forge/**
jobs:
- name: build-and-vet
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
  - task: build-and-vet
    # Retry transient k8s-runtime pod disruptions (single-node contention);
    # this task errors (not fails) when its pod is lost mid-run.
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Verifying full build ==="
          go build ./cmd/concourse
          go build ./cmd/artifact-daemon
          echo "=== Build successful ==="
          echo ""
          echo "=== Running go vet ==="
          go vet ./atc/worker/jetbridge/... ./vars/... ./tracing/... \
                 ./fly/commands/... ./fly/rc/... ./fly/eventstream/... \
                 ./atc/engine/... ./atc/resource/... \
                 ./atc/scheduler/... ./atc/metric/... ./atc/creds/... \
                 ./skymarshal/token/... ./skymarshal/skyserver/...
          echo "=== Vet passed ==="

# Native agent-review job (Task 19, cut over 2026-07-17): the review phase
# through the first-class `agent:` step. Replaced the build-from-source
# ci-agent shell job after the dual-run campaign proved mechanism parity
# (run/review/publish/metering all green in agent-review-native #6; the
# retired job's history holds the dual-run record).
# Token path: pure-CI platform secret (web --agent-platform-token-secret →
# secretKeyRef agent-platform-token/anthropic-token in the cicd namespace).
# Agent env is static-only by contract — no credentials ride env.
- name: agent-review-native
  plan:
  - get: repo
    trigger: false
    params: {depth: 25}
  - agent: review
    prompt: |
      You are a code review agent. Analyze the repository at repo for real defects (not style issues).

      Only review files changed in diff against base ref: main
      Use `git diff main...HEAD --name-only` to determine changed files.

      For each concern:
      1. Write a failing Go test that proves the defect
      2. Classify severity by what the test demonstrates

      Write a JSON object to the file review.json inside the directory named by the
      AGENT_OUTPUT_REVIEW environment variable (an absolute path — resolve it with
      `echo "$AGENT_OUTPUT_REVIEW"` first; do NOT write it under repo/ or any
      cwd-relative path). The JSON structure:
      {
        "schema_version": "1.0.0",
        "proven_issues": [
          {
            "id": "ISS-001",
            "severity": "critical|high|medium|low",
            "title": "short description",
            "description": "detailed explanation",
            "file": "path/to/file.go",
            "line": 42,
            "category": "security|correctness|performance|maintainability|testing",
            "test_code": "package ...\n\nimport \"testing\"\n\nfunc TestXxx(t *testing.T) { ... }",
            "test_file": "path/to/file_test.go",
            "test_name": "TestXxx"
          }
        ],
        "observations": [
          {
            "id": "OBS-001",
            "title": "short description",
            "file": "path/to/file.go",
            "line": 42,
            "category": "security|correctness|performance|maintainability|testing"
          }
        ],
        "score": {
          "value": 8.5,
          "max": 10.0,
          "pass": true,
          "threshold": 7.0
        },
        "metadata": {
          "repo": "<the clone URL from `git -C repo config --get remote.origin.url`>",
          "commit": "<the full SHA from `git -C repo rev-parse HEAD`>"
        }
      }

      The metadata object is REQUIRED — the publish API rejects a review without
      metadata.repo and metadata.commit. Fill metadata.commit with the actual
      HEAD SHA of the repo input. Fill metadata.repo with the full remote URL
      (not a bare name): the web UI builds clickable file:line links from it.

      If a concern cannot be proven with a test, include it in observations, not proven_issues.
      Run any generated tests to verify they actually fail against the current code before reporting.
    # Inline, not ((agent-model)): agent-step fields are plan-static by
    # contract — ((vars)) resolve at dispatch/materialization time (wave-4),
    # and a plain CI job has no materializer, so a var ref reaches the API
    # literally (dual-run #1 failed exactly this way). Model names are not
    # secrets; keep in lockstep with the agent-model secret used by dispatch.
    model: claude-sonnet-5
    # The successful dual-run #2 review needed 141 turns; 50 (the plan
    # template's guess) hit error_max_turns before review.json was written.
    # The 30m step timeout and per-run cost visibility are the real bounds.
    max_turns: 200
    inputs: [repo]
    outputs: [review]
    env:
      BASE_REF: main
      REVIEW_DIFF_ONLY: "true"
    timeout: 30m
  - task: publish-review
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: review
      params:
        AGENT_REVIEW_PRINCIPAL_TOKEN: ((agent-review-principal-token))
      run:
        path: sh
        args:
        - -ec
        - |
          echo "=== Publishing review to ATC ==="
          # -sS without -f: print the response body on failure instead of
          # swallowing it (a silent -f hid a 400 for two dual-runs).
          code=$(curl -sS -o /tmp/publish-resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${AGENT_REVIEW_PRINCIPAL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"build_id\": ${BUILD_ID}, \"review\": $(cat review/review.json)}" \
            "http://concourse-web.cicd.svc.cluster.local:8080/api/v1/agent/reviews")
          cat /tmp/publish-resp; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "publish failed with HTTP ${code}"; exit 1; }
          echo "Published for build ${BUILD_ID}"

- name: unit-tests
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [build-and-vet]
  - task: unit-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running unit tests across the full codebase ==="
          echo "Excluding packages that require external infrastructure"
          echo ""
          PACKAGES=$(go list ./... \
            | grep -v /integration \
            | grep -v /testflight \
            | grep -v /topgun \
            | grep -v /fly/integration \
            | grep -v /atc/db \
            | grep -v /atc/gc \
            | grep -v /atc/postgresrunner \
            | grep -v /atc/scheduler/algorithm \
            | grep -v '/atc/worker$' \
            | grep -v /skymarshal/dexserver \
            | grep -v /cmd)
          echo "Testing packages:"
          echo "$PACKAGES" | head -20
          echo "... ($(echo "$PACKAGES" | wc -l | tr -d ' ') packages total)"
          echo ""
          go test -count=1 -timeout 10m $PACKAGES
          echo "=== All unit tests passed ==="

- name: k8s-runtime-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [unit-tests]
  - task: k8s-runtime-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running jetbridge full test suite ==="
          go test -v -count=1 -timeout 5m ./atc/worker/jetbridge/...
          echo "=== All jetbridge tests passed ==="

- name: tag-rc
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-runtime-tests]
  - task: create-rc-tag
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing next version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tags found, starting at v0.1.0"
            NEXT_VERSION="0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Latest release: ${LATEST_TAG} -> next: v${NEXT_VERSION}"
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          RC_TAG="v${NEXT_VERSION}-rc"
          echo "=== Tagging ${RC_TAG} at ${SHORT_SHA} ==="

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/tdmtrader/jetbridge.git"
          git tag -f "${RC_TAG}"
          git push -f origin "${RC_TAG}"
          echo "=== Release candidate tagged: ${RC_TAG} (${SHORT_SHA}) ==="

- name: build-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [tag-rc]
  - task: build-and-push-local
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version: ${NEXT_VERSION}-rc (${SHORT_SHA})"

          LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}-rc -X github.com/concourse/concourse.JetBridgeVersion=${NEXT_VERSION}-rc"

          echo "=== Building concourse binary (linux/amd64 only — fly cross-compiles deferred to release) ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o concourse-linux-amd64 ./cmd/concourse
          ls -lh concourse-linux-amd64
          echo "=== Building artifact-daemon binary ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o artifact-daemon-linux-amd64 ./cmd/artifact-daemon
          ls -lh artifact-daemon-linux-amd64

          echo "=== Building fly CLI (linux/amd64 only for local deploy) ==="
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}-rc"
          mkdir -p fly-assets
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${FLY_LDFLAGS}" -o /tmp/fly ./fly
          tar czf fly-assets/fly-linux-amd64.tgz -C /tmp fly
          rm -f /tmp/fly
          ls -lh fly-assets/

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          BUILDER_POD="image-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=image-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: image-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying binaries to builder pod ==="
          kubectl cp concourse-linux-amd64 cicd/${BUILDER_POD}:/tmp/concourse-linux-amd64
          kubectl cp artifact-daemon-linux-amd64 cicd/${BUILDER_POD}:/tmp/artifact-daemon-linux-amd64
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Copying Dockerfile to builder pod ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile
          FROM ubuntu:22.04
          RUN apt-get update && \
              apt-get install -y ca-certificates dumb-init && \
              rm -rf /var/lib/apt/lists/*
          COPY concourse-linux-amd64 /usr/local/concourse/bin/concourse
          COPY artifact-daemon-linux-amd64 /usr/local/concourse/bin/artifact-daemon
          COPY fly-assets /usr/local/concourse/fly-assets
          RUN chmod +x /usr/local/concourse/bin/concourse /usr/local/concourse/bin/artifact-daemon
          ENV PATH="/usr/local/concourse/bin:${PATH}"
          ENTRYPOINT ["dumb-init", "concourse"]
          DOCKERFILE
          kubectl cp /tmp/Dockerfile cicd/${BUILDER_POD}:/tmp/Dockerfile

          echo "=== Building Docker image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/jetbridge:latest \
              -t registry.home/jetbridge:v${NEXT_VERSION}-rc \
              -t ${REGISTRY}/jetbridge:latest \
              -t ${REGISTRY}/jetbridge:v${NEXT_VERSION}-rc \
              -f /tmp/Dockerfile /tmp/

          echo "=== Pushing to local registries ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:v${NEXT_VERSION}-rc
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:v${NEXT_VERSION}-rc

          echo "=== Image built and pushed to local registries: v${NEXT_VERSION}-rc (${SHORT_SHA}) ==="

# Builds the agent: step runner image (claude CLI + agent-runner supervisor)
# from deploy/agent-runner/Dockerfile with the repo as build context.
# Manual trigger: the image changes rarely (claude-code pin bumps, agent-runner
# changes) and must not ride the per-commit release chain.
- name: build-agent-runner-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: false
    params: {depth: 0, fetch_tags: true}
    passed: [unit-tests]
  - task: build-and-push-agent-runner
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version: ${NEXT_VERSION} (${SHORT_SHA})"

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/agent-runner"
          BUILDER_POD="agent-runner-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=agent-runner-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: agent-runner-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying build context (repo, sans .git) to builder pod ==="
          tar czf /tmp/agent-runner-src.tgz --exclude=.git .
          kubectl exec -n cicd ${BUILDER_POD} -- mkdir -p /tmp/src
          kubectl cp /tmp/agent-runner-src.tgz cicd/${BUILDER_POD}:/tmp/agent-runner-src.tgz
          kubectl exec -n cicd ${BUILDER_POD} -- tar xzf /tmp/agent-runner-src.tgz -C /tmp/src

          echo "=== Building agent-runner image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/agent-runner:latest \
              -t registry.home/agent-runner:v${NEXT_VERSION} \
              -t ${GHCR}:latest \
              -t ${GHCR}:v${NEXT_VERSION} \
              -f /tmp/src/deploy/agent-runner/Dockerfile /tmp/src

          echo "=== Pushing to local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/agent-runner:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/agent-runner:v${NEXT_VERSION}

          echo "=== Logging into GHCR ==="
          echo "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin

          echo "=== Pushing to GHCR ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:v${NEXT_VERSION}

          echo "=== agent-runner image built and pushed: v${NEXT_VERSION} (${SHORT_SHA}) ==="

# Builds the CI task rootfs image (deploy/Dockerfile.test-runner) used by
# every job's rootfs_uri in this pipeline. Manual trigger, like
# build-agent-runner-image: this image changes rarely and must not ride the
# per-commit chain. Whenever Dockerfile.test-runner changes again, bump the
# tag below AND every rootfs_uri that should pick up the change.
- name: build-test-runner-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: false
    params: {depth: 1}
    passed: [unit-tests]
  - task: build-and-push-test-runner
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          BUILDER_POD="test-runner-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=test-runner-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: test-runner-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x) — same reason as build-image's
              # identical pin: the rolling docker:dind tag's runc >=1.2 /proc
              # masking breaks on theborg's 5.4 kernel.
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying build context (repo, sans .git) to builder pod ==="
          tar czf /tmp/test-runner-src.tgz --exclude=.git .
          kubectl exec -n cicd ${BUILDER_POD} -- mkdir -p /tmp/src
          kubectl cp /tmp/test-runner-src.tgz cicd/${BUILDER_POD}:/tmp/test-runner-src.tgz
          kubectl exec -n cicd ${BUILDER_POD} -- tar xzf /tmp/test-runner-src.tgz -C /tmp/src

          echo "=== Building concourse-test-runner:v6 (adds PostgreSQL) ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/concourse-test-runner:v6 \
              -f /tmp/src/deploy/Dockerfile.test-runner /tmp/src

          echo "=== Pushing to local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/concourse-test-runner:v6

          echo "=== concourse-test-runner:v6 built and pushed ==="

- name: self-upgrade
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [build-image]
  - task: trigger-rollout
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          IMAGE="registry.home/jetbridge:v${NEXT_VERSION}-rc"
          echo "=== Self-upgrade: deploying ${IMAGE} ==="
          echo "Triggering rollout and exiting immediately."
          echo ""

          kubectl set image deployment/concourse-web concourse-web=${IMAGE} -n cicd
          kubectl rollout restart deployment/concourse-web -n cicd
          kubectl rollout restart daemonset/concourse-artifact-daemon -n cicd

          echo "=== Rollout triggered. ==="

- name: verify-upgrade
  serial_groups: [pipeline]
  plan:
  # Triggered once per upgraded commit. No settle timer: in-flight builds
  # survive the self-upgrade web rollout (engine drain releases job builds
  # and the task supervisor resumes them — build_survival track), and a
  # timer trigger re-fires forever, failing after every release because
  # "latest tag + 1"-rc only exists once the NEXT commit builds it.
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [self-upgrade]
  - task: check-running-version
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          EXPECTED="${MAJOR}.${MINOR}.$((PATCH + 1))-rc"

          echo "=== Waiting for rollout to complete ==="
          kubectl rollout status deployment/concourse-web -n cicd --timeout=180s
          kubectl rollout status daemonset/concourse-artifact-daemon -n cicd --timeout=180s

          echo "=== Waiting for pods to be ready ==="
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=web -n cicd --timeout=120s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=artifact-daemon -n cicd --timeout=120s

          echo "=== Letting service endpoints settle (15s) ==="
          sleep 15

          CONCOURSE_URL="http://concourse-web.cicd.svc.cluster.local:8080"
          echo "=== Waiting for Concourse to report version ${EXPECTED} ==="
          echo ""

          for i in $(seq 1 60); do
            RUNNING=$(curl -sf "${CONCOURSE_URL}/api/v1/info" 2>/dev/null \
              | grep -o '"version":"[^"]*"' \
              | cut -d'"' -f4) || RUNNING="(unreachable)"
            echo "  attempt ${i}: running=${RUNNING} expected=${EXPECTED}"
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo ""
              echo "=== Verified: Concourse is running v${EXPECTED} ==="
              exit 0
            fi
            sleep 5
          done

          echo ""
          echo "=== FAILED: Concourse did not reach v${EXPECTED} within 5 minutes ==="
          echo "  Last seen version: ${RUNNING}"
          exit 1

- name: k8s-live-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [verify-upgrade]
  - task: k8s-live-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          echo "=== Setting up kubeconfig for Go test client ==="
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          SA_TOKEN=$(cat "$SA_DIR/token")
          kubectl config set-cluster local --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" --certificate-authority="$SA_DIR/ca.crt" --embed-certs=true
          kubectl config set-credentials local --token="$SA_TOKEN"
          kubectl config set-context local --cluster=local --user=local --namespace=concourse
          kubectl config use-context local
          echo "Kubeconfig created, testing: $(kubectl get pods -n concourse --no-headers 2>&1 | wc -l) pods visible"

          export K8S_TEST_NAMESPACE=concourse
          echo "K8S_TEST_NAMESPACE=$K8S_TEST_NAMESPACE"

          echo "=== Cleaning up stale test pods from previous runs ==="
          for NS in concourse concourse-test; do
            kubectl get pods -n $NS --no-headers -o custom-columns=":metadata.name" 2>/dev/null \
              | { grep -E '^(live-|e2e-)' || true; } \
              | xargs -r kubectl delete pods -n $NS --grace-period=0 --force 2>/dev/null || true
          done
          echo ""

          export ARTIFACT_DAEMON_HOST_PATH=/var/concourse/artifacts
          export ARTIFACT_DAEMON_PORT=7780
          export ARTIFACT_DAEMON_SERVICE=artifact-daemon

          cd repo
          echo "=== Running jetbridge live integration tests ==="
          echo "These tests create real K8s pods against the live cluster."
          echo "Artifact daemon: hostPath=$ARTIFACT_DAEMON_HOST_PATH port=$ARTIFACT_DAEMON_PORT"
          echo ""
          go test -tags live -v -count=1 -timeout 5m ./atc/worker/jetbridge/...
          echo "=== Live integration tests passed ==="

- name: release
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-live-tests]
  - task: tag-push-release
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing release version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "Releasing: v${NEXT_VERSION} (${SHORT_SHA})"

          git config --global user.email "ci@concourse.home"
          git config --global user.name "Concourse CI"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/tdmtrader/jetbridge.git"

          # NOTE: the git tag and the force-push to main are DEFERRED to the end
          # of this task, after the RC image is verified and the release image is
          # built and pushed. Previously they ran first, so a missing RC image
          # (or any image/build failure) left behind a phantom vX tag pointing at
          # an unbuilt version and force-moved main to an unreleased commit.

          # --- 1. Build multi-platform fly + push to GHCR ---
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/jetbridge"
          BUILDER_POD="release-push-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=release-push --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD pod for GHCR push ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: release-push
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for push pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "=== Building fly CLI for all platforms ==="
          LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION} -X github.com/concourse/concourse.JetBridgeVersion=${NEXT_VERSION}"
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}"
          mkdir -p fly-assets fly-bin
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${pair%%/*}"
            ARCH="${pair##*/}"
            echo "  fly-${OS}-${ARCH}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags "${FLY_LDFLAGS}" -o fly-bin/fly ./fly
            tar czf fly-assets/fly-${OS}-${ARCH}.tgz -C fly-bin fly
            rm -f fly-bin/fly
          done
          rm -rf fly-bin
          ls -lh fly-assets/

          # --- 2. Verify the RC image exists BEFORE any git mutation ---
          echo "=== Verifying RC image registry.home/jetbridge:v${NEXT_VERSION}-rc exists ==="
          if ! kubectl exec -n cicd ${BUILDER_POD} -- docker pull registry.home/jetbridge:v${NEXT_VERSION}-rc; then
            echo "FATAL: RC image v${NEXT_VERSION}-rc not found."
            echo "The RC pipeline (tag-rc/build-image) has not produced it — refusing"
            echo "to tag v${NEXT_VERSION} or push main. Fix the RC build, then re-run."
            exit 1
          fi

          echo "=== Copying fly assets into builder pod ==="
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Rebuilding image with all fly platform assets ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile.release
          FROM registry.home/jetbridge:v__VERSION__-rc
          COPY fly-assets /usr/local/concourse/fly-assets
          DOCKERFILE
          sed -i "s/__VERSION__/${NEXT_VERSION}/g" /tmp/Dockerfile.release
          kubectl cp /tmp/Dockerfile.release cicd/${BUILDER_POD}:/tmp/Dockerfile.release
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/jetbridge:v${NEXT_VERSION} \
              -t ${GHCR}:${SHORT_SHA} \
              -t ${GHCR}:v${NEXT_VERSION} \
              -t ${GHCR}:latest \
              -f /tmp/Dockerfile.release /tmp/

          echo "=== Pushing release to local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:v${NEXT_VERSION}

          echo "=== Logging into GHCR ==="
          echo "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin

          echo "=== Pushing to GHCR ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:${SHORT_SHA}
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:v${NEXT_VERSION}
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:latest

          # --- 3. Image published — NOW create the release tag ---
          # (Deferred from the top: only tag/push once the image actually exists.)
          echo "=== Tagging v${NEXT_VERSION} ==="
          if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEXT_VERSION} already exists — skipping"
          else
            git tag -a "v${NEXT_VERSION}" -m "Release v${NEXT_VERSION}"
            git push origin "v${NEXT_VERSION}"
            echo "=== Tagged v${NEXT_VERSION} ==="
          fi

          # --- 4. Push to main (only after the release image + tag succeeded) ---
          echo "=== Pushing to main ==="
          git push --force origin HEAD:refs/heads/main
          echo "=== Pushed ${SHORT_SHA} to main ==="

          # --- 5. Redeploy with final release version (includes all fly assets) ---
          echo "=== Redeploying with release image ==="
          IMAGE="registry.home/jetbridge:v${NEXT_VERSION}"
          kubectl set image deployment/concourse-web concourse-web=${IMAGE} -n cicd
          kubectl rollout restart deployment/concourse-web -n cicd

          # Clean up the RC tag
          git push origin --delete "v${NEXT_VERSION}-rc" 2>/dev/null || true

          echo "=== Release complete: v${NEXT_VERSION} (${SHORT_SHA}) ==="
          echo "  Tagged: v${NEXT_VERSION}"
          echo "  Main:   pushed"
          echo "  GHCR:   ${GHCR}:v${NEXT_VERSION}"
          echo "  Local:  ${IMAGE}"
