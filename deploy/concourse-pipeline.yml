resources:
- name: repo
  type: git
  source:
    uri: https://github.com/tdmtrader/jetbridge.git
    branch: jetbridge
    # Docs-only churn must not trigger the self-release chain (every push
    # restarts web ~10-12 min later and double-spends in-flight dogfood
    # builds — see ci/dogfood/FINDINGS.md "Pushing to jetbridge mid-run").
    # Deliberately narrow: ci/** and deploy/** still trigger.
    ignore_paths:
    - docs/**
    - notes/**
    - forge/**
    - JETBRIDGE_FIRST_USER_FINDINGS.md
- name: home-infra
  type: git
  source:
    uri: https://github.com/tdmtrader/home-infra.git
    branch: main
    username: x-access-token
    password: ((github-token))
    disable_ci_skip: true
jobs:
# Apply this file to the live pipeline whenever it changes.
#
# Without this, deploy/concourse-pipeline.yml is inert until someone remembers
# `fly set-pipeline`, and the gap is silent: a job conversion sat committed and
# unapplied for a day while the old definition kept running, and pipeline-side
# edits (params, env) took effect immediately while the repo-side code they
# paired with waited on `passed:` gates, so half-applied fixes looked like
# partial progress.
#
# Deliberately outside serial_groups: [pipeline] and free of `passed:`
# constraints, so a definition change lands even while the release chain is
# busy or red — which is exactly when a fix to it is most likely.
#
# Note this does not make the chain use new code any sooner: jobs gated on
# `passed:` still only see repo versions that cleared those gates. It removes
# the manual step, not the gating.
- name: set-self
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
  - set_pipeline: self
    file: repo/deploy/concourse-pipeline.yml

- name: build-and-vet
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
  - task: build-and-vet
    # Retry transient k8s-runtime pod disruptions (single-node contention);
    # this task errors (not fails) when its pod is lost mid-run.
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Verifying full build ==="
          go build ./cmd/concourse
          go build ./cmd/artifact-daemon
          echo "=== Build successful ==="
          echo ""
          echo "=== Running go vet ==="
          go vet ./atc/worker/jetbridge/... ./vars/... ./tracing/... \
                 ./fly/commands/... ./fly/rc/... ./fly/eventstream/... \
                 ./atc/engine/... ./atc/resource/... \
                 ./atc/scheduler/... ./atc/metric/... ./atc/creds/... \
                 ./skymarshal/token/... ./skymarshal/skyserver/...
          echo "=== Vet passed ==="

# Native agent-review job — v3 durable workflow run (converted 2026-07-26).
# Replaces the retired v1 path (an untyped `agent: review` step writing
# review.json plus a curl POST to /api/v1/agent/reviews with a principal
# bearer token); both the untyped step and that endpoint are being deleted.
#
# The job now captures two immutable `repository/v1` snapshots of THIS
# pipeline's `repo` resource — the commit under review and its nearest
# ancestor that is itself a known resource version — and runs the
# `code-review` workflow function (agent/workflow/seeds/code-review-v3) over
# them. Nothing is published back into the build: the review is durable,
# typed evidence hanging off the workflow run, reachable from the UI.
#
# PREREQUISITES (see docs/agentic/V3_CUTOVER_DEPLOY.md for the runbook):
#   0. The web node must run with durable snapshots enabled and the agent
#      runtime pinned by digest (--agent-snapshot-enabled plus
#      --agent-step-image=...@sha256:...). Schema-v3 workflows and resource
#      captures fail closed without them.
#   1. The `code-review` workflow must be imported AND promoted live:
#        fly -t <target> agent workflows import agent/workflow/seeds/code-review-v3
#        fly -t <target> agent workflows set-live code-review <version>
#      This job binds the LIVE version (no --version pin), so promoting a new
#      version changes what the next build runs.
#   2. A platform Anthropic credential must be vaulted (admin):
#        fly -t <target> agent auth --platform
#      Workflow-run admission resolves the creating user's own credential
#      first and falls back to the platform credential, so the CI login user
#      below needs no personal token of its own.
#   3. Pipeline vars ((concourse-username)) / ((concourse-password)): a LOCAL
#      basic-auth user on this Concourse that belongs to this pipeline's team.
#      The v1 ((agent-review-principal-token)) secret is no longer used here.
- name: agent-review-native
  plan:
  - get: repo
    trigger: false
    # Deep enough to walk back to the previous *resource version*: docs-only
    # commits are filtered out by the resource's ignore_paths and never become
    # versions, so the nearest reviewed ancestor can be several commits back.
    params: {depth: 50}
  - task: run-code-review-workflow
    # Retry transient k8s-runtime pod disruptions. The idempotency key below
    # is stable across attempts, so a retry re-attaches to the SAME durable
    # workflow run instead of spending a second review.
    attempts: 2
    timeout: 45m
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        CONCOURSE_USERNAME: ((concourse-username))
        CONCOURSE_PASSWORD: ((concourse-password))
      run:
        path: sh
        args:
        - -ec
        - |
          # fly is built from the commit under review rather than downloaded:
          # it keeps the CLI in lockstep with the API it talks to (workflow
          # import/run flags are validated client-side), and an unstamped
          # build reports a dev version, which skips fly's major/minor
          # target-version gate.
          echo "=== Building fly from the repo input ==="
          ( cd repo && go build -o /usr/local/bin/fly ./fly )

          # Same in-cluster address the verify-upgrade job uses.
          CONCOURSE_URL="http://concourse-web.cicd.svc.cluster.local:8080"
          WORKFLOW="code-review"
          # Deterministic, writable fly config dir (HOME is not guaranteed).
          export FLY_HOME=/tmp/fly-home
          mkdir -p "$FLY_HOME"

          echo "=== fly login (team ${BUILD_TEAM_NAME}) ==="
          fly -t self login -c "$CONCOURSE_URL" -n "$BUILD_TEAM_NAME" \
            -u "$CONCOURSE_USERNAME" -p "$CONCOURSE_PASSWORD" >/dev/null

          HEAD_SHA=$(git -C repo rev-parse HEAD)
          echo "head: ${HEAD_SHA}"

          echo "=== Resolving the base commit ==="
          # capture-resource only accepts an already-known resource version,
          # so the base must be a version the resource actually produced —
          # not merely HEAD~1. Take the nearest ancestor of HEAD that is one.
          fly -t self resource-versions -r "${BUILD_PIPELINE_NAME}/repo" \
            --count 100 --json > /tmp/versions.json
          jq -r '.[] | select(.enabled) | .version.ref // empty' /tmp/versions.json \
            | sort -u > /tmp/known-refs
          git -C repo rev-list --max-count=50 "$HEAD_SHA" | tail -n +2 > /tmp/ancestors

          BASE_SHA=""
          while read -r candidate; do
            if grep -qx "$candidate" /tmp/known-refs; then
              BASE_SHA="$candidate"
              break
            fi
          done < /tmp/ancestors

          if [ -z "$BASE_SHA" ]; then
            echo "No ancestor of ${HEAD_SHA} is a known version of ${BUILD_PIPELINE_NAME}/repo"
            echo "(first build, or history older than the retained version window)."
            echo "Nothing to compare against — skipping the review."
            exit 0
          fi
          echo "base: ${BASE_SHA}"

          # capture-resource is idempotent per (resource, version, type): a
          # repeat call returns the same durable snapshot, it does not refetch.
          capture_snapshot() {
            fly -t self agent snapshots capture-resource \
              --pipeline="$BUILD_PIPELINE_NAME" \
              --resource=repo \
              --version="ref:$1" \
              --type=repository/v1 \
              --json > "$2"
            captured=$(jq -r '.snapshot.id // empty' "$2")
            if [ -z "$captured" ]; then
              { echo "capture of $1 returned no snapshot:"; cat "$2"; } >&2
              return 1
            fi
            echo "$captured"
          }

          echo "=== Capturing repository/v1 snapshots ==="
          BEFORE_ID=$(capture_snapshot "$BASE_SHA" /tmp/before.json)
          AFTER_ID=$(capture_snapshot "$HEAD_SHA" /tmp/after.json)
          echo "before=${BEFORE_ID} after=${AFTER_ID}"

          # One durable run per build. The key is stable across `attempts:`
          # retries of this task, so a lost pod re-attaches to the existing
          # run; it changes when a human re-triggers the job.
          IDEMPOTENCY_KEY="pipeline-review-build-${BUILD_ID}"

          echo "=== Creating the ${WORKFLOW} workflow run ==="
          fly -t self agent workflows run "$WORKFLOW" \
            --input=before="$BEFORE_ID" \
            --input=after="$AFTER_ID" \
            --idempotency-key="$IDEMPOTENCY_KEY" \
            --json > /tmp/run.json
          RUN_ID=$(jq -r '.workflow_run_id // empty' /tmp/run.json)
          if [ -z "$RUN_ID" ]; then
            echo "workflow run creation returned no run id:"; cat /tmp/run.json; exit 1
          fi
          RUN_URL="${ATC_EXTERNAL_URL}/agent/workflows/${WORKFLOW}/runs/${RUN_ID}"
          echo "workflow run ${RUN_ID}: ${RUN_URL}"

          # --follow streams status transitions but dies on the first HTTP
          # error, and a concurrent self-upgrade restarts web mid-wait. Treat
          # it as best effort; the poll below is the authority on the
          # terminal state.
          echo "=== Following run ${RUN_ID} ==="
          fly -t self agent workflows show-run "$WORKFLOW" "$RUN_ID" --follow \
            || echo "follow dropped (web restart?) — re-checking the run state"

          STATUS=""
          for _ in $(seq 1 180); do
            if fly -t self agent workflows show-run "$WORKFLOW" "$RUN_ID" --json \
                 > /tmp/detail.json 2>/tmp/detail.err; then
              STATUS=$(jq -r '.status // empty' /tmp/detail.json)
              case "$STATUS" in
                succeeded|failed|errored|aborted) break ;;
              esac
            else
              STATUS=""
              echo "transient: could not read run ${RUN_ID} — $(tail -1 /tmp/detail.err)"
            fi
            sleep 10
          done

          echo "=== Run ${RUN_ID} status: ${STATUS:-unknown} ==="
          if [ "$STATUS" != "succeeded" ]; then
            echo "The ${WORKFLOW} workflow run did not complete successfully."
            echo "  ${RUN_URL}"
            exit 1
          fi

          # Advisory only. The review's own conclusion (accept /
          # changes-required / inconclusive) NEVER fails this job: the sealed
          # review snapshot is the record and a human dispositions it. Every
          # command below is inside a failure-tolerant group.
          echo "=== Review verdict (advisory) ==="
          {
            REVIEW_ID=$(fly -t self agent workflows show-run "$WORKFLOW" "$RUN_ID" \
              --outputs --json | jq -r '.outputs[] | select(.port == "review") | .snapshot.id')
            if [ -n "$REVIEW_ID" ]; then
              echo "review snapshot ${REVIEW_ID}: ${ATC_EXTERNAL_URL}/agent/snapshots/${REVIEW_ID}"
              fly -t self agent snapshots download "$REVIEW_ID" --to /tmp/review.tar
              mkdir -p /tmp/review
              tar xf /tmp/review.tar -C /tmp/review
              RECORD=$(find /tmp/review -name record.json | head -1)
              if [ -n "$RECORD" ]; then
                jq -r '"conclusion: \(.body.conclusion)",
                       "summary: \(.body.summary)",
                       "findings: \((.body.findings // []) | length) (\((.body.findings // []) | map(select(.blocking)) | length) blocking)",
                       ((.body.findings // [])[] | "  [\(.severity)] \(.id): \(.title)")' "$RECORD"
              fi
            fi
          } || echo "(could not render the review body; the durable snapshot is authoritative)"

          echo "=== Review complete: ${RUN_URL} ==="

- name: unit-tests
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [build-and-vet]
  - task: unit-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running unit tests across the full codebase ==="
          echo "Excluding packages that require external infrastructure"
          echo ""
          PACKAGES=$(go list ./... \
            | grep -v /integration \
            | grep -v /testflight \
            | grep -v /topgun \
            | grep -v /fly/integration \
            | grep -v /atc/db \
            | grep -v /atc/gc \
            | grep -v /atc/postgresrunner \
            | grep -v /atc/scheduler/algorithm \
            | grep -v '/atc/worker$' \
            | grep -v /skymarshal/dexserver \
            | grep -v /cmd)
          echo "Testing packages:"
          echo "$PACKAGES" | head -20
          echo "... ($(echo "$PACKAGES" | wc -l | tr -d ' ') packages total)"
          echo ""
          go test -count=1 -timeout 10m $PACKAGES
          echo "=== All unit tests passed ==="

- name: k8s-runtime-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [unit-tests]
  - task: k8s-runtime-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running jetbridge full test suite ==="
          go test -v -count=1 -timeout 5m ./atc/worker/jetbridge/...
          echo "=== All jetbridge tests passed ==="

- name: tag-rc
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-runtime-tests]
  - task: create-rc-tag
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -ec
        - |
          cd repo
          SOURCE_COMMIT=$(git rev-parse HEAD)
          ASKPASS=$(mktemp)
          cleanup_askpass() {
            rm -f "${ASKPASS}"
          }
          trap cleanup_askpass EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          set +x
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git fetch --tags --force --prune --prune-tags origin

          SOURCE_STABLE_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          SOURCE_RC_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*-rc' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc$' || true)
          SOURCE_STABLE_COUNT=$(printf '%s\n' "${SOURCE_STABLE_TAGS}" | grep -c . || true)
          SOURCE_RC_COUNT=$(printf '%s\n' "${SOURCE_RC_TAGS}" | grep -c . || true)
          test "${SOURCE_STABLE_COUNT}" -le 1
          test "${SOURCE_RC_COUNT}" -le 1
          if test "${SOURCE_STABLE_COUNT}" = 1; then
            if test "${SOURCE_RC_COUNT}" = 1; then
              STABLE_VERSION=${SOURCE_STABLE_TAGS#v}
              RC_VERSION=${SOURCE_RC_TAGS#v}
              RC_VERSION=${RC_VERSION%-rc}
              test "${STABLE_VERSION}" = "${RC_VERSION}"
            fi
            echo "FATAL: source ${SOURCE_COMMIT} is already released as ${SOURCE_STABLE_TAGS}" >&2
            exit 1
          fi

          if test "${SOURCE_RC_COUNT}" = 1; then
            RC_TAG=${SOURCE_RC_TAGS}
            NEXT_VERSION=${RC_TAG#v}
            NEXT_VERSION=${NEXT_VERSION%-rc}
            echo "Reusing source-bound RC reservation ${RC_TAG}"
          else
            echo "=== Reserving the next unused version across stable and RC tags ==="
            LATEST_RESERVED_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-rc)?$' | head -1 || true)
            if [ -z "${LATEST_RESERVED_TAG}" ]; then
              echo "No release tags found, starting at v0.2.0"
              NEXT_VERSION="0.2.0"
            else
              VERSION="${LATEST_RESERVED_TAG#v}"
              VERSION="${VERSION%-rc}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "Latest reserved version: ${LATEST_RESERVED_TAG} -> next: v${NEXT_VERSION}"
            fi
            RC_TAG="v${NEXT_VERSION}-rc"
            git tag "${RC_TAG}" "${SOURCE_COMMIT}"
          fi

          printf '%s\n' "${NEXT_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "=== Tagging ${RC_TAG} at ${SHORT_SHA} ==="

          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git push origin "refs/tags/${RC_TAG}:refs/tags/${RC_TAG}"
          echo "=== Release candidate tagged: ${RC_TAG} (${SHORT_SHA}) ==="

- name: build-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [tag-rc]
  # web/handler.go embeds web/public with //go:embed, so a bare `go build`
  # ships whatever elm.min.js was last COMMITTED — that is how v0.2.164-rc went
  # out with a stale UI bundle on 2026-07-17 (fixed by 46db7b9735). Regenerate
  # the frontend from source here so a stale commit can never reach the image.
  #
  # This mirrors Dockerfile.build's `frontend` stage — the day-to-day borg
  # chain gets the same guarantee by building that Dockerfile end to end. Keep
  # the two in sync. Dockerfile.build is not reused wholesale here because its
  # Go stage stamps only concourse.Version — this chain also stamps
  # JetBridgeVersion (the jetbridge_version in /api/v1/info and `concourse
  # --version`) — and would re-download the module graph that the
  # concourse-test-runner image already has warm. It does match its fly
  # full cross-compile set, since `fly sync` needs those archives
  # present in whatever image is actually deployed.
  - task: build-frontend
    attempts: 2
    config:
      platform: linux
      # Same image as Dockerfile.build stage 1. The elm npm package ships
      # x86_64 binaries only, so this must land on an amd64 node.
      rootfs_uri: docker:///node:22-bookworm-slim
      inputs:
      - name: repo
      outputs:
      - name: web-public
      # npm and the elm package registry are external egress, historically the
      # flakiest part of any frontend build here: the caches keep repeat runs
      # mostly offline and attempts: 2 absorbs a single bad fetch.
      caches:
      - path: yarn-global
      - path: elm-home
      run:
        path: sh
        args:
        - -exc
        - |
          # Keep every download inside cached task dirs (yarn 4 puts its cache
          # under globalFolder/cache; elm under ELM_HOME/0.19.1).
          export YARN_GLOBAL_FOLDER="$(pwd)/yarn-global"
          export ELM_HOME="$(pwd)/elm-home"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          # puppeteer is a wats-only devDependency whose postinstall pulls a
          # ~150MB Chrome build that `yarn run build` never touches.
          export PUPPETEER_SKIP_DOWNLOAD=1

          # Elm's built-in TLS needs system CA certificates to fetch package
          # metadata; the node slim images autoremove them (same reason
          # Dockerfile.build's frontend stage installs them).
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            rm -rf /var/lib/apt/lists/*
          fi

          cd repo
          # `corepack prepare` with no spec activates the version in the
          # checkout's package.json "packageManager" field, so the yarn pin
          # lives in exactly one place. (Dockerfile.build has to name it
          # explicitly — it runs corepack before COPY package.json.)
          corepack enable
          corepack prepare --activate
          yarn --version

          echo "=== Committed bundle (what a bare go build would have shipped) ==="
          sha256sum web/public/elm.min.js || true

          echo "=== Installing node dependencies ==="
          yarn install --immutable || yarn install

          echo "=== Building frontend (LESS -> css, Elm -> js, webpack) ==="
          yarn run build

          echo "=== Rebuilt frontend assets ==="
          sha256sum web/public/elm.min.js web/public/main.css web/public/bundle.js

          # Ship the whole merged directory: `yarn run build` regenerates
          # elm.js/elm.min.js/main.css/*bundle.js and the rest (images, fonts,
          # mdi-svg.min.js, graphviz) is committed source — the same set
          # Dockerfile.build's frontend stage hands to its Go stage.
          cp -a web/public/. ../web-public/
  - task: build-and-push-local
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: web-public
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force --prune --prune-tags origin

          SOURCE_COMMIT=$(git rev-parse HEAD)
          RC_RELEASE_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*-rc' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc$' || true)
          RC_RELEASE_COUNT=$(printf '%s\n' "${RC_RELEASE_TAGS}" | grep -c . || true)
          test "${RC_RELEASE_COUNT}" = 1
          RC_RELEASE_TAG=${RC_RELEASE_TAGS}
          NEXT_VERSION="${RC_RELEASE_TAG#v}"
          NEXT_VERSION="${NEXT_VERSION%-rc}"
          printf '%s\n' "${NEXT_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

          SHORT_SHA=$(git rev-parse --short HEAD)
          RC_IMAGE="registry.home/jetbridge:rc-${SOURCE_COMMIT}"
          echo "Version: ${NEXT_VERSION}-rc (${SHORT_SHA}, ${RC_IMAGE})"

          RC_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}-rc -X github.com/concourse/concourse.JetBridgeVersion=${NEXT_VERSION}-rc"
          FINAL_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION} -X github.com/concourse/concourse.JetBridgeVersion=${NEXT_VERSION}"

          # //go:embed in web/handler.go bakes web/public into the binary, so
          # the freshly built assets from build-frontend MUST land before
          # `go build` — otherwise the committed bundle ships (2026-07-17).
          echo "=== Installing freshly built frontend assets over web/public ==="
          if [ ! -s ../web-public/elm.min.js ]; then
            echo "FATAL: build-frontend produced no elm.min.js — refusing to ship a possibly stale bundle"
            exit 1
          fi
          cp -a ../web-public/. web/public/
          sha256sum web/public/elm.min.js

          echo "=== Building RC and final concourse binaries from the rebuilt frontend tree ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${RC_LDFLAGS}" -o concourse-linux-amd64 ./cmd/concourse
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${FINAL_LDFLAGS}" -o concourse-linux-amd64-final ./cmd/concourse
          ls -lh concourse-linux-amd64 concourse-linux-amd64-final
          echo "=== Building artifact-daemon binary ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o artifact-daemon-linux-amd64 ./cmd/artifact-daemon
          ls -lh artifact-daemon-linux-amd64

          # Cross-compile fly for every platform an operator might run, matching
          # the `release` job and Dockerfile.build. The web serves these at
          # /api/v1/cli, which is what `fly sync` fetches; shipping only
          # linux/amd64 made sync fail on a mac with "failed to open tgz
          # archive: .../fly-darwin-arm64.tgz: no such file or directory", and
          # since the cluster tracks rc images that break was permanent rather
          # than deferred to the next release.
          echo "=== Building fly CLI for all platforms ==="
          if ! command -v zip >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zip
            rm -rf /var/lib/apt/lists/*
          fi
          command -v unzip >/dev/null
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}-rc"
          mkdir -p fly-assets fly-bin
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            OS="${pair%%/*}"
            ARCH="${pair##*/}"
            echo "  fly-${OS}-${ARCH}"
            EXT=""
            if test "${OS}" = windows; then EXT=".exe"; fi
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags "${FLY_LDFLAGS}" -o "fly-bin/fly${EXT}" ./fly
            if test "${OS}" = windows; then
              zip -q -j "fly-assets/fly-${OS}-${ARCH}.zip" "fly-bin/fly${EXT}"
              test -s "fly-assets/fly-${OS}-${ARCH}.zip"
              unzip -Z1 "fly-assets/fly-${OS}-${ARCH}.zip" | grep -Fx 'fly.exe'
              unzip -p "fly-assets/fly-${OS}-${ARCH}.zip" fly.exe > /tmp/fly-windows-amd64.exe
              test -s /tmp/fly-windows-amd64.exe
              rm -f /tmp/fly-windows-amd64.exe
            else
              tar czf "fly-assets/fly-${OS}-${ARCH}.tgz" -C fly-bin fly
            fi
            rm -f "fly-bin/fly${EXT}"
          done
          rm -rf fly-bin
          ls -lh fly-assets/

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          BUILDER_POD="image-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=image-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: image-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying binaries to builder pod ==="
          kubectl cp concourse-linux-amd64 cicd/${BUILDER_POD}:/tmp/concourse-linux-amd64
          kubectl cp concourse-linux-amd64-final cicd/${BUILDER_POD}:/tmp/concourse-linux-amd64-final
          kubectl cp artifact-daemon-linux-amd64 cicd/${BUILDER_POD}:/tmp/artifact-daemon-linux-amd64
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Copying Dockerfile to builder pod ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile
          FROM ubuntu:22.04
          # Keep this package set identical to Dockerfile.build's runtime stage;
          # deploy/runtime_image_parity_test.go pins them together. git is not
          # optional: the repository/v1 and repository-change/v1 validators exec
          # it inside ATC, and the direct-Git publisher is pinned to the
          # image-owned /usr/bin/git. Omitting it here made every repository/v1
          # seal impossible on the deployed cluster while every test stayed
          # green on hosts that happen to have git.
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                ca-certificates \
                dumb-init \
                git=1:2.34.1-1ubuntu1.17 \
              && rm -rf /var/lib/apt/lists/*
          COPY concourse-linux-amd64 /usr/local/concourse/bin/concourse
          COPY concourse-linux-amd64-final /usr/local/concourse/bin/concourse-final
          COPY artifact-daemon-linux-amd64 /usr/local/concourse/bin/artifact-daemon
          COPY fly-assets /usr/local/concourse/fly-assets
          RUN chmod +x /usr/local/concourse/bin/concourse /usr/local/concourse/bin/concourse-final /usr/local/concourse/bin/artifact-daemon
          ENV PATH="/usr/local/concourse/bin:${PATH}"
          ENTRYPOINT ["dumb-init", "concourse"]
          DOCKERFILE
          kubectl cp /tmp/Dockerfile cicd/${BUILDER_POD}:/tmp/Dockerfile

          echo "=== Building Docker image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t "${RC_IMAGE}" \
              -t registry.home/jetbridge:latest \
              -t registry.home/jetbridge:v${NEXT_VERSION}-rc \
              -t ${REGISTRY}/jetbridge:latest \
              -t ${REGISTRY}/jetbridge:v${NEXT_VERSION}-rc \
              -f /tmp/Dockerfile /tmp/

          echo "=== Pushing the source-addressed RC image first ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push "${RC_IMAGE}"

          echo "=== Pushing mutable convenience tags to local registries ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:v${NEXT_VERSION}-rc
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:v${NEXT_VERSION}-rc

          echo "=== Image built and pushed to local registries: ${RC_IMAGE} ==="

# Builds the agent: step runner image (claude CLI + agent-runner supervisor)
# from deploy/agent-runner/Dockerfile with the repo as build context.
#
# Auto-triggers off tag-rc. It was previously a manual release gate, which made
# it the single point where the chain silently stalled: self-upgrade requires a
# repo version that passed BOTH build-image and this job, so a commit that only
# ever reached build-image left self-upgrade with no schedulable input and no
# failed build to show for it -- the pipeline simply stopped after build-image
# with everything green. The source-bound RC tag still supplies the runner
# version, and the exact repo version must still pass this job before
# self-upgrade can consume it; only the human gate is gone.
- name: build-agent-runner-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [tag-rc]
  - task: build-and-push-agent-runner
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      outputs:
      - name: runner-image-metadata
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force --prune --prune-tags origin

          SOURCE_COMMIT=$(git rev-parse HEAD)
          RC_RELEASE_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*-rc' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc$' || true)
          RC_RELEASE_COUNT=$(printf '%s\n' "${RC_RELEASE_TAGS}" | grep -c . || true)
          test "${RC_RELEASE_COUNT}" = 1
          RC_RELEASE_TAG=${RC_RELEASE_TAGS}
          NEXT_VERSION="${RC_RELEASE_TAG#v}"
          NEXT_VERSION="${NEXT_VERSION%-rc}"
          printf '%s\n' "${NEXT_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'

          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "Version: ${NEXT_VERSION} (${SHORT_SHA})"

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/agent-runner"
          LOCAL_IMAGE="registry.home/agent-runner:${SOURCE_COMMIT}"
          MIRROR_IMAGE="${GHCR}:${SOURCE_COMMIT}"
          BUILDER_POD="agent-runner-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=agent-runner-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: agent-runner-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done
          kubectl exec -n cicd "${BUILDER_POD}" -- docker info >/dev/null

          echo "=== Copying build context (repo, sans .git) to builder pod ==="
          tar czf /tmp/agent-runner-src.tgz --exclude=.git .
          kubectl exec -n cicd ${BUILDER_POD} -- mkdir -p /tmp/src
          kubectl cp /tmp/agent-runner-src.tgz cicd/${BUILDER_POD}:/tmp/agent-runner-src.tgz
          kubectl exec -n cicd ${BUILDER_POD} -- tar xzf /tmp/agent-runner-src.tgz -C /tmp/src

          echo "=== Building agent-runner image ==="
          kubectl exec -n cicd "${BUILDER_POD}" -- \
            docker build --platform linux/amd64 \
              --tag "${LOCAL_IMAGE}" \
              --tag registry.home/agent-runner:latest \
              --tag registry.home/agent-runner:v${NEXT_VERSION} \
              --tag "${MIRROR_IMAGE}" \
              --tag ${GHCR}:latest \
              --tag ${GHCR}:v${NEXT_VERSION} \
              --file /tmp/src/deploy/agent-runner/Dockerfile /tmp/src

          echo "=== Smoking the exact commit-tagged linux/amd64 image ==="
          kubectl exec -n cicd "${BUILDER_POD}" -- \
            docker run --rm --platform linux/amd64 \
              --entrypoint /usr/local/bin/agent-runner-image-smoke "${LOCAL_IMAGE}"

          echo "=== Pushing the in-cluster commit tag and resolving its registry digest ==="
          PUSH_OUTPUT=$(kubectl exec -n cicd "${BUILDER_POD}" -- docker push "${LOCAL_IMAGE}")
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST=$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
          if ! printf '%s\n' "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FATAL: registry.home push returned no exact lowercase sha256 digest"
            exit 1
          fi
          IMMUTABLE_IMAGE="registry.home/agent-runner@${DIGEST}"
          kubectl exec -n cicd "${BUILDER_POD}" -- docker pull --platform linux/amd64 "${IMMUTABLE_IMAGE}"
          PUSHED_PLATFORM=$(kubectl exec -n cicd "${BUILDER_POD}" -- docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMMUTABLE_IMAGE}")
          if test "${PUSHED_PLATFORM}" != "linux/amd64"; then
            echo "FATAL: pushed runner platform is ${PUSHED_PLATFORM}, want linux/amd64"
            exit 1
          fi
          kubectl exec -n cicd "${BUILDER_POD}" -- \
            docker run --rm --platform linux/amd64 \
              --entrypoint /usr/local/bin/agent-runner-image-smoke "${IMMUTABLE_IMAGE}"

          umask 077
          printf 'CONCOURSE_AGENT_STEP_IMAGE=%s\nSOURCE_COMMIT=%s\nRUNNER_VERSION=%s\n' \
            "${IMMUTABLE_IMAGE}" "${SOURCE_COMMIT}" "${NEXT_VERSION}" \
            > ../runner-image-metadata/verified-image.env
          grep -Eq '^CONCOURSE_AGENT_STEP_IMAGE=registry.home/agent-runner@sha256:[a-f0-9]{64}$' ../runner-image-metadata/verified-image.env
          grep -Eq '^SOURCE_COMMIT=[a-f0-9]{40}$' ../runner-image-metadata/verified-image.env
          grep -Eq '^RUNNER_VERSION=[0-9]+\.[0-9]+\.[0-9]+$' ../runner-image-metadata/verified-image.env
          echo "=== Pushing optional local convenience tags ==="
          kubectl exec -n cicd "${BUILDER_POD}" -- docker push registry.home/agent-runner:latest
          kubectl exec -n cicd "${BUILDER_POD}" -- docker push registry.home/agent-runner:v${NEXT_VERSION}

          echo "=== Best-effort GHCR runner mirror ==="
          set +x
          if printf '%s\n' "${GITHUB_TOKEN}" | kubectl exec -i -n cicd "${BUILDER_POD}" -- docker login ghcr.io -u tdmtrader --password-stdin; then
            set -x
            for mirror in "${MIRROR_IMAGE}" "${GHCR}:latest" "${GHCR}:v${NEXT_VERSION}"; do
              if ! kubectl exec -n cicd "${BUILDER_POD}" -- docker push "${mirror}"; then
                echo "WARNING: GHCR runner mirror push failed for ${mirror}; registry.home digest remains authoritative" >&2
              fi
            done
          else
            set -x
            echo "WARNING: GHCR runner mirror login failed; registry.home digest remains authoritative" >&2
          fi
          # The runbook captures this exact deployable, cluster-pullable
          # reference. GHCR remains an optional offsite mirror only.
          echo "CONCOURSE_AGENT_STEP_IMAGE=${IMMUTABLE_IMAGE}"
  - get: home-infra
    trigger: false
  - task: update-home-infra-agent-runner-image
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: home-infra
      - name: runner-image-metadata
      outputs:
      - name: home-infra-updated
      run:
        path: sh
        args:
        - -euc
        - |
          set +x
          test "$(wc -l < runner-image-metadata/verified-image.env | tr -d ' ')" = 3
          test "$(sed -n 's/^CONCOURSE_AGENT_STEP_IMAGE=//p' runner-image-metadata/verified-image.env | wc -l | tr -d ' ')" = 1
          test "$(sed -n 's/^SOURCE_COMMIT=//p' runner-image-metadata/verified-image.env | wc -l | tr -d ' ')" = 1
          test "$(sed -n 's/^RUNNER_VERSION=//p' runner-image-metadata/verified-image.env | wc -l | tr -d ' ')" = 1
          CONCOURSE_AGENT_STEP_IMAGE=$(sed -n 's/^CONCOURSE_AGENT_STEP_IMAGE=//p' runner-image-metadata/verified-image.env)
          SOURCE_COMMIT=$(sed -n 's/^SOURCE_COMMIT=//p' runner-image-metadata/verified-image.env)
          RUNNER_VERSION=$(sed -n 's/^RUNNER_VERSION=//p' runner-image-metadata/verified-image.env)
          printf '%s\n' "$CONCOURSE_AGENT_STEP_IMAGE" | grep -Eq '^registry.home/agent-runner@sha256:[a-f0-9]{64}$'
          printf '%s\n' "$SOURCE_COMMIT" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s\n' "$RUNNER_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$SOURCE_COMMIT" = "$(git -C repo rev-parse HEAD)"
          # This inline script and repo/deploy/write-agent-runner-home-infra.sh
          # enforce ONE contract between them, but they travel separately:
          # set-self rewrites this config from the branch tip while `repo` is
          # pinned by `passed:`, so the job can run a new inline script against
          # an older checkout. On 2026-08-02 that skew hit twice in an hour.
          # Build #18 ran the old config against the old tree and SUCCEEDED
          # while writing a ghcr.io reference the cluster cannot pull, breaking
          # every agent pod; #19 ran the new config against that same old tree
          # and failed closed only because that commit's copy of the script
          # happened to be the stricter half. Nothing detected the skew itself.
          #
          # The SOURCE_COMMIT check above passed in BOTH of those builds: the
          # metadata and the checkout always agree, because the same builder
          # produced them. The half that can disagree is this config versus the
          # checkout, so pin the exact script this config was written against.
          # deploy/write_agent_runner_home_infra_test.go keeps the pin honest,
          # so editing the script without updating the pin fails in unit tests
          # rather than mid-deployment.
          EXPECTED_WRITEBACK_SHA256=e9a457227cc254f8e7f61fe240068acc012cd551c27bfa647123345d349015c9
          ACTUAL_WRITEBACK_SHA256=$(sha256sum repo/deploy/write-agent-runner-home-infra.sh | cut -d' ' -f1)
          if test "${ACTUAL_WRITEBACK_SHA256}" != "${EXPECTED_WRITEBACK_SHA256}"; then
            echo "FATAL: pipeline config and repo checkout disagree."
            echo "  this config expects write-agent-runner-home-infra.sh ${EXPECTED_WRITEBACK_SHA256}"
            echo "  the ${SOURCE_COMMIT} checkout has                     ${ACTUAL_WRITEBACK_SHA256}"
            echo "Wait for set-self AND for this job's passed: gate to admit"
            echo "the same commit, then re-run. A build number from"
            echo "'fly trigger-job' proves neither has happened."
            exit 1
          fi

          # Output volumes survive an interrupted ATC task replay. Start from
          # the immutable input so stale Git locks or files cannot leak into
          # the next supervised push.
          find home-infra-updated -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -d home-infra/.git
          test ! -L home-infra/.git
          test -d home-infra-updated
          test ! -L home-infra-updated
          test -z "$(find home-infra-updated -mindepth 1 -maxdepth 1 -print -quit)"
          cp -a home-infra/. home-infra-updated/
          test -d home-infra-updated/.git
          test ! -L home-infra-updated/.git
          find home-infra-updated/.git -type f -name '*.lock' -exec rm -f -- {} +
          sh repo/deploy/write-agent-runner-home-infra.sh "$CONCOURSE_AGENT_STEP_IMAGE" "$SOURCE_COMMIT" "$RUNNER_VERSION" home-infra-updated
  - task: push-home-infra-agent-runner-image
    timeout: 5m
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: home-infra-updated
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -euc
        - |
          PUSH_REPO=$(mktemp -d)
          ASKPASS=$(mktemp)
          cleanup_push() {
            rm -rf "${PUSH_REPO}"
            rm -f "${ASKPASS}"
          }
          trap cleanup_push EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cp -a home-infra-updated/. "${PUSH_REPO}/"
          test -e "${PUSH_REPO}/.git"
          set +x
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" fetch --no-tags origin refs/heads/main
          git -C "${PUSH_REPO}" -c user.name="Concourse CI" -c user.email="ci@concourse.home" rebase --rebase-merges FETCH_HEAD
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" push origin HEAD:refs/heads/main

# Builds the pinned multi-harness broker companion for linux/amd64 and prints
# the registry-reported immutable digest. This remains manual because updating
# the operator profile catalog is a separate reviewed deployment decision.
- name: build-agent-broker-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: false
    params: {depth: 1}
    passed: [unit-tests]
  - task: build-and-push-agent-broker
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          # The in-cluster Service address is a push destination only. Broker
          # companion containers are pulled by the kubelet, which resolves
          # names with the node resolver rather than cluster DNS, so a
          # *.svc.cluster.local reference is unpullable on every node. Every
          # image this cluster actually pulls is registry.home/...
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          IMAGE="${REGISTRY}/agent-broker:${SHORT_SHA}"
          EXTERNAL_REPOSITORY="registry.home/agent-broker"
          EXTERNAL_IMAGE="${EXTERNAL_REPOSITORY}:${SHORT_SHA}"
          BUILDER_POD="agent-broker-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd "${BUILDER_POD}" --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT

          kubectl run -n cicd "${BUILDER_POD}" \
            --image=docker:26-dind \
            --restart=Never \
            --overrides='{"spec":{"containers":[{"name":"'"${BUILDER_POD}"'","image":"docker:26-dind","securityContext":{"privileged":true},"env":[{"name":"DOCKER_TLS_CERTDIR","value":""}],"args":["--host=unix:///var/run/docker.sock","--insecure-registry='"${REGISTRY}"'","--insecure-registry=registry.home"]}]}}'
          kubectl wait --for=condition=ready pod/"${BUILDER_POD}" -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd "${BUILDER_POD}" -- docker info >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl exec -n cicd "${BUILDER_POD}" -- docker info >/dev/null

          tar czf /tmp/agent-broker-src.tgz --exclude=.git .
          kubectl exec -n cicd "${BUILDER_POD}" -- mkdir -p /tmp/src
          kubectl cp /tmp/agent-broker-src.tgz "cicd/${BUILDER_POD}:/tmp/agent-broker-src.tgz"
          kubectl exec -n cicd "${BUILDER_POD}" -- tar xzf /tmp/agent-broker-src.tgz -C /tmp/src
          kubectl exec -n cicd "${BUILDER_POD}" -- \
            docker build --platform linux/amd64 \
              -t "${IMAGE}" \
              -t "${EXTERNAL_IMAGE}" \
              -f /tmp/src/deploy/agent-broker/Dockerfile /tmp/src
          PUSH_OUTPUT=$(kubectl exec -n cicd "${BUILDER_POD}" -- docker push "${IMAGE}")
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST=$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
          if ! printf '%s\n' "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FATAL: registry push returned no exact lowercase sha256 digest"
            exit 1
          fi

          echo "=== Mirroring to registry.home, the registry the kubelet can pull ==="
          EXTERNAL_PUSH_OUTPUT=$(kubectl exec -n cicd "${BUILDER_POD}" -- docker push "${EXTERNAL_IMAGE}")
          printf '%s\n' "${EXTERNAL_PUSH_OUTPUT}"
          EXTERNAL_DIGEST=$(printf '%s\n' "${EXTERNAL_PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
          if ! printf '%s\n' "${EXTERNAL_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FATAL: registry.home push returned no exact lowercase sha256 digest"
            exit 1
          fi
          # registry.home and the in-cluster Service are two registries, not
          # aliases. Content addressing is the only proof they hold the same
          # image, so refuse to hand out a reference we have not verified.
          if test "${DIGEST}" != "${EXTERNAL_DIGEST}"; then
            echo "FATAL: registry.home digest ${EXTERNAL_DIGEST} differs from in-cluster digest ${DIGEST}"
            exit 1
          fi

          AGENT_BROKER_IMAGE=${EXTERNAL_REPOSITORY}@${DIGEST}
          if ! printf '%s\n' "${AGENT_BROKER_IMAGE}" | grep -Eq '^registry.home/agent-broker@sha256:[a-f0-9]{64}$'; then
            echo "FATAL: refusing to print a broker reference the cluster cannot pull"
            exit 1
          fi
          echo "Use this exact worker_image in agentBroker.image and every profile:"
          echo "AGENT_BROKER_IMAGE=${AGENT_BROKER_IMAGE}"

- name: self-upgrade
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [build-image, build-agent-runner-image]
  - get: home-infra
    trigger: false
  - task: resolve-and-write-home-infra-web-image
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: home-infra
      outputs:
      - name: home-infra-updated
      - name: web-image-metadata
      run:
        path: sh
        args:
        - -euc
        - |
          cd repo
          SOURCE_COMMIT=$(git rev-parse HEAD)
          RC_IMAGE="registry.home/jetbridge:rc-${SOURCE_COMMIT}"
          PROBE_POD="jetbridge-image-probe-$(git rev-parse --short=12 HEAD)-$$"
          cleanup_probe() { kubectl delete pod -n cicd "${PROBE_POD}" --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_probe EXIT

          kubectl run "${PROBE_POD}" -n cicd --restart=Never \
            --image="${RC_IMAGE}" --image-pull-policy=Always --command -- sh -c 'sleep 300'
          kubectl wait --for=condition=ready "pod/${PROBE_POD}" -n cicd --timeout=180s
          IMAGE_ID=$(kubectl get pod "${PROBE_POD}" -n cicd -o jsonpath='{.status.containerStatuses[0].imageID}')
          DIGEST=$(printf '%s\n' "${IMAGE_ID}" | sed -n 's/.*@\(sha256:[a-f0-9]\{64\}\)$/\1/p')
          if ! printf '%s\n' "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FATAL: probe imageID did not resolve ${RC_IMAGE} to an exact lowercase sha256 digest: ${IMAGE_ID}" >&2
            exit 1
          fi
          WEB_IMAGE="registry.home/jetbridge@${DIGEST}"

          # Output volumes survive an interrupted ATC task replay. Start from
          # the immutable input so stale Git locks or files cannot leak into
          # the next supervised push.
          find ../home-infra-updated -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -d ../home-infra/.git
          test ! -L ../home-infra/.git
          test -d ../home-infra-updated
          test ! -L ../home-infra-updated
          test -z "$(find ../home-infra-updated -mindepth 1 -maxdepth 1 -print -quit)"
          cp -a ../home-infra/. ../home-infra-updated/
          test -d ../home-infra-updated/.git
          test ! -L ../home-infra-updated/.git
          find ../home-infra-updated/.git -type f -name '*.lock' -exec rm -f -- {} +
          sh deploy/write-web-image-home-infra.sh "${WEB_IMAGE}" "${SOURCE_COMMIT}" ../home-infra-updated
          umask 077
          printf 'CONCOURSE_WEB_IMAGE=%s\nSOURCE_COMMIT=%s\nRC_IMAGE=%s\n' \
            "${WEB_IMAGE}" "${SOURCE_COMMIT}" "${RC_IMAGE}" > ../web-image-metadata/verified-image.env
          grep -Eq '^CONCOURSE_WEB_IMAGE=registry.home/jetbridge@sha256:[a-f0-9]{64}$' ../web-image-metadata/verified-image.env
          grep -Eq '^SOURCE_COMMIT=[a-f0-9]{40}$' ../web-image-metadata/verified-image.env
          grep -Eq '^RC_IMAGE=registry.home/jetbridge:rc-[a-f0-9]{40}$' ../web-image-metadata/verified-image.env
  - task: push-home-infra-self-upgrade-image
    timeout: 5m
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: home-infra-updated
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -euc
        - |
          PUSH_REPO=$(mktemp -d)
          ASKPASS=$(mktemp)
          cleanup_push() {
            rm -rf "${PUSH_REPO}"
            rm -f "${ASKPASS}"
          }
          trap cleanup_push EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cp -a home-infra-updated/. "${PUSH_REPO}/"
          test -e "${PUSH_REPO}/.git"
          set +x
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" fetch --no-tags origin refs/heads/main
          git -C "${PUSH_REPO}" -c user.name="Concourse CI" -c user.email="ci@concourse.home" rebase --rebase-merges FETCH_HEAD
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" push origin HEAD:refs/heads/main
  - task: trigger-rollout
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: web-image-metadata
      run:
        path: sh
        args:
        - -exc
        - |
          test "$(wc -l < web-image-metadata/verified-image.env | tr -d ' ')" = 3
          WEB_IMAGE=$(sed -n 's/^CONCOURSE_WEB_IMAGE=//p' web-image-metadata/verified-image.env)
          SOURCE_COMMIT=$(sed -n 's/^SOURCE_COMMIT=//p' web-image-metadata/verified-image.env)
          RC_IMAGE=$(sed -n 's/^RC_IMAGE=//p' web-image-metadata/verified-image.env)
          printf '%s\n' "${WEB_IMAGE}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          printf '%s\n' "${SOURCE_COMMIT}" | grep -Eq '^[a-f0-9]{40}$'
          test "${RC_IMAGE}" = "registry.home/jetbridge:rc-${SOURCE_COMMIT}"

          echo "=== Waiting for GitOps to deploy ${WEB_IMAGE} from ${RC_IMAGE} ==="
          for i in $(seq 1 60); do
            web_image=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "concourse-web"}}{{.image}}{{end}}{{end}}')
            daemon_image=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "artifact-daemon"}}{{.image}}{{end}}{{end}}')
            web_source=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
            daemon_source=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
            web_digest=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
            daemon_digest=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
            if test "${web_image}" = "${WEB_IMAGE}" && test "${daemon_image}" = "${WEB_IMAGE}" && \
              test "${web_source}" = "${SOURCE_COMMIT}" && test "${daemon_source}" = "${SOURCE_COMMIT}" && \
              test "${web_digest}" = "${WEB_IMAGE}" && test "${daemon_digest}" = "${WEB_IMAGE}"; then
              kubectl rollout status deployment/concourse-web -n cicd --timeout=180s
              kubectl rollout status daemonset/concourse-artifact-daemon -n cicd --timeout=180s
              exit 0
            fi
            sleep 5
          done
          echo "FATAL: ArgoCD did not apply the immutable shared image and matching source annotations" >&2
          exit 1

- name: verify-upgrade
  serial_groups: [pipeline]
  plan:
  # Triggered once per upgraded commit. No settle timer: in-flight builds
  # survive the self-upgrade web rollout (engine drain releases job builds
  # and the task supervisor resumes them — build_survival track), and a
  # timer trigger would re-verify the same source-bound RC forever.
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [self-upgrade]
  - task: check-running-version
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force --prune --prune-tags origin
          SOURCE_COMMIT=$(git rev-parse HEAD)
          RC_RELEASE_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*-rc' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc$' || true)
          RC_RELEASE_COUNT=$(printf '%s\n' "${RC_RELEASE_TAGS}" | grep -c . || true)
          test "${RC_RELEASE_COUNT}" = 1
          RC_RELEASE_TAG=${RC_RELEASE_TAGS}
          EXPECTED="${RC_RELEASE_TAG#v}"
          printf '%s\n' "${EXPECTED}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc$'
          EXPECTED_RC_IMAGE="registry.home/jetbridge:rc-${SOURCE_COMMIT}"

          web_image=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "concourse-web"}}{{.image}}{{end}}{{end}}')
          daemon_image=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "artifact-daemon"}}{{.image}}{{end}}{{end}}')
          web_source=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          daemon_source=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          web_digest=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          daemon_digest=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          printf '%s\n' "${web_image}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          test "${web_image}" = "${daemon_image}"
          test "${web_source}" = "${SOURCE_COMMIT}"
          test "${daemon_source}" = "${SOURCE_COMMIT}"
          test "${web_digest}" = "${web_image}"
          test "${daemon_digest}" = "${daemon_image}"
          echo "=== Verified GitOps source/image coupling: ${EXPECTED_RC_IMAGE} -> ${web_image} ==="

          echo "=== Waiting for rollout to complete ==="
          kubectl rollout status deployment/concourse-web -n cicd --timeout=180s
          kubectl rollout status daemonset/concourse-artifact-daemon -n cicd --timeout=180s

          echo "=== Letting service endpoints settle (15s) ==="
          sleep 15

          CONCOURSE_URL="http://concourse-web.cicd.svc.cluster.local:8080"
          echo "=== Waiting for Concourse to report version ${EXPECTED} ==="
          echo ""

          for i in $(seq 1 60); do
            RUNNING=$(curl -sf "${CONCOURSE_URL}/api/v1/info" 2>/dev/null \
              | grep -o '"version":"[^"]*"' \
              | cut -d'"' -f4) || RUNNING="(unreachable)"
            echo "  attempt ${i}: running=${RUNNING} expected=${EXPECTED}"
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo ""
              echo "=== Verified: Concourse is running v${EXPECTED} ==="
              exit 0
            fi
            sleep 5
          done

          echo ""
          echo "=== FAILED: Concourse did not reach v${EXPECTED} within 5 minutes ==="
          echo "  Last seen version: ${RUNNING}"
          exit 1

- name: k8s-live-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [verify-upgrade]
  - get: home-infra
    trigger: false
  - task: k8s-live-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      outputs:
      - name: live-tested-image-metadata
      params:
        # The deployed artifact daemon's resolve key, so the init containers
        # these tests create sign capabilities the daemon will actually accept.
        # Mirrors the cicd Secret the chart mounts into web and the DaemonSet.
        ARTIFACT_RESOLVE_CAPABILITY_KEY_B64: ((artifact-resolve-capability-key))
      run:
        path: sh
        args:
        - -ec
        - |
          echo "=== Setting up kubeconfig for Go test client ==="
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          SA_TOKEN=$(cat "$SA_DIR/token")
          kubectl config set-cluster local --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" --certificate-authority="$SA_DIR/ca.crt" --embed-certs=true
          kubectl config set-credentials local --token="$SA_TOKEN"
          kubectl config set-context local --cluster=local --user=local --namespace=concourse
          kubectl config use-context local
          echo "Kubeconfig created, testing: $(kubectl get pods -n concourse --no-headers 2>&1 | wc -l) pods visible"

          export K8S_TEST_NAMESPACE=concourse
          echo "K8S_TEST_NAMESPACE=$K8S_TEST_NAMESPACE"

          echo "=== Cleaning up stale test pods from previous runs ==="
          for NS in concourse concourse-test; do
            kubectl get pods -n $NS --no-headers -o custom-columns=":metadata.name" 2>/dev/null \
              | { grep -E '^(live-|e2e-)' || true; } \
              | xargs -r kubectl delete pods -n $NS --grace-period=0 --force 2>/dev/null || true
          done
          echo ""

          # Fallbacks only. The suite reads the daemon's storage path, port,
          # service name and namespace from the deployed DaemonSet, so these
          # apply solely if it cannot. ARTIFACT_DAEMON_SERVICE is deliberately
          # not set: the deployed service is concourse-artifact-daemon, that
          # name is the SAN the daemon's certificate is verified against, and a
          # value guessed here breaks every ATC-side mTLS call while leaving
          # the init containers — which skip hostname verification — working.
          export ARTIFACT_DAEMON_HOST_PATH=/var/concourse/artifacts
          export ARTIFACT_DAEMON_PORT=7780
          # Exercise the helper this cluster actually deploys. The suite defaults
          # to alpine:latest on its own, so this is about testing what ships
          # rather than about making the tests pass.
          export ARTIFACT_HELPER_IMAGE=index.docker.io/library/alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

          cd repo
          SOURCE_COMMIT=$(git rev-parse HEAD)
          web_image=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "concourse-web"}}{{.image}}{{end}}{{end}}')
          daemon_image=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "artifact-daemon"}}{{.image}}{{end}}{{end}}')
          web_source=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          daemon_source=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          web_digest=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          daemon_digest=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          printf '%s\n' "${web_image}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          test "${web_image}" = "${daemon_image}"
          test "${web_source}" = "${SOURCE_COMMIT}"
          test "${daemon_source}" = "${SOURCE_COMMIT}"
          test "${web_image}" = "${web_digest}"
          test "${daemon_image}" = "${daemon_digest}"
          TESTED_IMAGE=${web_image}

          echo "=== Running jetbridge live integration tests ==="
          echo "These tests create real K8s pods against the live cluster."
          echo "Artifact daemon: hostPath=$ARTIFACT_DAEMON_HOST_PATH port=$ARTIFACT_DAEMON_PORT"
          echo ""
          go test -tags live -v -count=1 -timeout 15m ./atc/worker/jetbridge/...
          echo "=== Live integration tests passed ==="

          post_web_image=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "concourse-web"}}{{.image}}{{end}}{{end}}')
          post_daemon_image=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "artifact-daemon"}}{{.image}}{{end}}{{end}}')
          post_web_source=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          post_daemon_source=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          post_web_digest=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          post_daemon_digest=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          test "${post_web_image}" = "${TESTED_IMAGE}"
          test "${post_daemon_image}" = "${TESTED_IMAGE}"
          test "${post_web_source}" = "${SOURCE_COMMIT}"
          test "${post_daemon_source}" = "${SOURCE_COMMIT}"
          test "${post_web_digest}" = "${TESTED_IMAGE}"
          test "${post_daemon_digest}" = "${TESTED_IMAGE}"

          umask 077
          printf 'SOURCE_COMMIT=%s\nTESTED_IMAGE=%s\n' \
            "${SOURCE_COMMIT}" "${TESTED_IMAGE}" \
            > ../live-tested-image-metadata/attestation.env
  - task: write-home-infra-live-tested-image
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: home-infra
      - name: live-tested-image-metadata
      outputs:
      - name: home-infra-updated
      run:
        path: sh
        args:
        - -euc
        - |
          test "$(wc -l < live-tested-image-metadata/attestation.env | tr -d ' ')" = 2
          ATTESTED_SOURCE=$(sed -n 's/^SOURCE_COMMIT=//p' live-tested-image-metadata/attestation.env)
          TESTED_IMAGE=$(sed -n 's/^TESTED_IMAGE=//p' live-tested-image-metadata/attestation.env)
          test "$(sed -n '1p' live-tested-image-metadata/attestation.env)" = "SOURCE_COMMIT=${ATTESTED_SOURCE}"
          test "$(sed -n '2p' live-tested-image-metadata/attestation.env)" = "TESTED_IMAGE=${TESTED_IMAGE}"
          printf '%s\n' "${ATTESTED_SOURCE}" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s\n' "${TESTED_IMAGE}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          test "${ATTESTED_SOURCE}" = "$(git -C repo rev-parse HEAD)"
          # Output volumes survive an interrupted ATC task replay. Start from
          # the immutable input so stale Git locks or files cannot leak into
          # the next supervised push.
          find home-infra-updated -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -d home-infra/.git
          test ! -L home-infra/.git
          test -d home-infra-updated
          test ! -L home-infra-updated
          test -z "$(find home-infra-updated -mindepth 1 -maxdepth 1 -print -quit)"
          cp -a home-infra/. home-infra-updated/
          test -d home-infra-updated/.git
          test ! -L home-infra-updated/.git
          find home-infra-updated/.git -type f -name '*.lock' -exec rm -f -- {} +
          sh repo/deploy/write-live-tested-image-home-infra.sh \
            "${TESTED_IMAGE}" "${ATTESTED_SOURCE}" home-infra-updated
  - task: push-home-infra-live-tested-image
    timeout: 5m
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: home-infra-updated
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -euc
        - |
          PUSH_REPO=$(mktemp -d)
          ASKPASS=$(mktemp)
          cleanup_push() {
            rm -rf "${PUSH_REPO}"
            rm -f "${ASKPASS}"
          }
          trap cleanup_push EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cp -a home-infra-updated/. "${PUSH_REPO}/"
          test -e "${PUSH_REPO}/.git"
          set +x
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" fetch --no-tags origin refs/heads/main
          git -C "${PUSH_REPO}" -c user.name="Concourse CI" -c user.email="ci@concourse.home" rebase --rebase-merges FETCH_HEAD
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" push origin HEAD:refs/heads/main

- name: release
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-live-tests]
  - get: home-infra
    trigger: false
  - task: validate-live-tested-image
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: home-infra
      outputs:
      - name: release-tested-image
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -euc
        - |
          ASKPASS=$(mktemp)
          cleanup_askpass() {
            rm -f "${ASKPASS}"
          }
          trap cleanup_askpass EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          set +x
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C home-infra fetch --no-tags origin refs/heads/main
          git -C home-infra reset --hard FETCH_HEAD
          git -C home-infra clean -ffdqx

          ATTESTATION=home-infra/apps/concourse-live-tested-image.env
          test -f "${ATTESTATION}"
          test "$(wc -l < "${ATTESTATION}" | tr -d ' ')" = 2
          ATTESTED_SOURCE=$(sed -n 's/^SOURCE_COMMIT=//p' "${ATTESTATION}")
          TESTED_IMAGE=$(sed -n 's/^TESTED_IMAGE=//p' "${ATTESTATION}")
          test "$(sed -n '1p' "${ATTESTATION}")" = "SOURCE_COMMIT=${ATTESTED_SOURCE}"
          test "$(sed -n '2p' "${ATTESTATION}")" = "TESTED_IMAGE=${TESTED_IMAGE}"
          printf '%s\n' "${ATTESTED_SOURCE}" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s\n' "${TESTED_IMAGE}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          test "${ATTESTED_SOURCE}" = "$(git -C repo rev-parse HEAD)"
          umask 077
          cp "${ATTESTATION}" release-tested-image/attestation.env
  - task: tag-push-release
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: release-tested-image
      outputs:
      - name: release-image-metadata
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          ATTESTED_IMAGE=$(sed -n 's/^TESTED_IMAGE=//p' release-tested-image/attestation.env)
          ATTESTED_SOURCE=$(sed -n 's/^SOURCE_COMMIT=//p' release-tested-image/attestation.env)
          printf '%s\n' "${ATTESTED_IMAGE}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          printf '%s\n' "${ATTESTED_SOURCE}" | grep -Eq '^[a-f0-9]{40}$'

          cd repo
          git fetch --tags --force --prune --prune-tags origin

          SOURCE_COMMIT=$(git rev-parse HEAD)
          test "${ATTESTED_SOURCE}" = "${SOURCE_COMMIT}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "=== Binding release version to tags on tested source ${SOURCE_COMMIT} ==="
          STABLE_RELEASE_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          RC_RELEASE_TAGS=$(git tag --points-at "${SOURCE_COMMIT}" --list 'v0.2.*-rc' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc$' || true)
          STABLE_RELEASE_COUNT=$(printf '%s\n' "${STABLE_RELEASE_TAGS}" | grep -c . || true)
          RC_RELEASE_COUNT=$(printf '%s\n' "${RC_RELEASE_TAGS}" | grep -c . || true)
          test "${STABLE_RELEASE_COUNT}" -le 1
          test "${RC_RELEASE_COUNT}" -le 1
          STABLE_RELEASE_TAG=${STABLE_RELEASE_TAGS}
          RC_RELEASE_TAG=${RC_RELEASE_TAGS}
          if test "${STABLE_RELEASE_COUNT}" = 1; then
            NEXT_VERSION="${STABLE_RELEASE_TAG#v}"
            REUSE_PUBLISHED_RELEASE=true
          elif test "${RC_RELEASE_COUNT}" = 1; then
            RC_VERSION="${RC_RELEASE_TAG#v}"
            RC_VERSION="${RC_VERSION%-rc}"
            NEXT_VERSION="${RC_VERSION}"
            REUSE_PUBLISHED_RELEASE=false
          else
            echo "FATAL: tested source has neither one RC tag nor one stable release tag" >&2
            exit 1
          fi
          if test "${RC_RELEASE_COUNT}" = 1; then
            RC_VERSION="${RC_RELEASE_TAG#v}"
            RC_VERSION="${RC_VERSION%-rc}"
            test "${RC_VERSION}" = "${NEXT_VERSION}"
          fi
          printf '%s\n' "${NEXT_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1 && \
            test "$(git rev-parse "v${NEXT_VERSION}^{commit}")" != "${SOURCE_COMMIT}"; then
            echo "FATAL: v${NEXT_VERSION} already exists on a different source commit" >&2
            exit 1
          fi
          FINAL_TAG="registry.home/jetbridge:release-${SOURCE_COMMIT}"

          echo "Releasing: v${NEXT_VERSION} (${SHORT_SHA})"

          echo "=== Reading exact live-tested source and image authority ==="
          web_image=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "concourse-web"}}{{.image}}{{end}}{{end}}')
          daemon_image=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "artifact-daemon"}}{{.image}}{{end}}{{end}}')
          web_source=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          daemon_source=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
          web_digest=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          daemon_digest=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
          test "${web_source}" = "${SOURCE_COMMIT}"
          test "${daemon_source}" = "${SOURCE_COMMIT}"
          test "${web_image}" = "${daemon_image}"
          test "${web_image}" = "${web_digest}"
          test "${daemon_image}" = "${daemon_digest}"
          printf '%s\n' "${web_image}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          if test "${STABLE_RELEASE_COUNT}" = 0 && test "${web_image}" != "${ATTESTED_IMAGE}"; then
            echo "FATAL: current candidate ${web_image} is not the live-tested image ${ATTESTED_IMAGE}" >&2
            exit 1
          fi
          RC_IMMUTABLE_IMAGE="${ATTESTED_IMAGE}"

          # NOTE: the git tag and main publication are DEFERRED to the end
          # of this task, after the RC image is verified and the release image is
          # built and pushed. Previously they ran first, so a missing RC image
          # (or any image/build failure) left behind a phantom vX tag pointing at
          # an unbuilt version and published an unreleased commit to main.

          # --- 1. Build multi-platform fly + push to GHCR ---
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/jetbridge"
          BUILDER_POD="release-push-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=release-push --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD pod for GHCR push ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: release-push
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for push pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done

          UPSTREAM_VERSION=$(sed -n 's/^var ConcourseVersion = "\(.*\)"/\1/p' versions.go)
          if test -z "${UPSTREAM_VERSION}"; then
            echo "FATAL: could not read ConcourseVersion from versions.go"
            exit 1
          fi
          EXPECTED_FINAL_VERSION="JetBridge ${NEXT_VERSION} (Concourse ${UPSTREAM_VERSION})"

          if test "${REUSE_PUBLISHED_RELEASE}" = true; then
            echo "=== Reusing source-addressed release image for stable v${NEXT_VERSION} ==="
            PULL_OUTPUT=$(kubectl exec -n cicd ${BUILDER_POD} -- docker pull "${FINAL_TAG}")
            printf '%s\n' "${PULL_OUTPUT}"
            FINAL_DIGEST=$(printf '%s\n' "${PULL_OUTPUT}" | sed -n 's/.*Digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
            if ! printf '%s\n' "${FINAL_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
              echo "FATAL: source-addressed release pull returned no exact lowercase sha256 digest"
              exit 1
            fi
            FINAL_IMAGE="registry.home/jetbridge@${FINAL_DIGEST}"
          else
            echo "=== Building fly CLI for all platforms ==="
            if ! command -v zip >/dev/null 2>&1; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zip
              rm -rf /var/lib/apt/lists/*
            fi
            command -v unzip >/dev/null
            FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}"
            mkdir -p fly-assets fly-bin
            for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
              OS="${pair%%/*}"
              ARCH="${pair##*/}"
              echo "  fly-${OS}-${ARCH}"
              EXT=""
              if test "${OS}" = windows; then EXT=".exe"; fi
              CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags "${FLY_LDFLAGS}" -o "fly-bin/fly${EXT}" ./fly
              if test "${OS}" = windows; then
                zip -q -j "fly-assets/fly-${OS}-${ARCH}.zip" "fly-bin/fly${EXT}"
                test -s "fly-assets/fly-${OS}-${ARCH}.zip"
                unzip -Z1 "fly-assets/fly-${OS}-${ARCH}.zip" | grep -Fx 'fly.exe'
                unzip -p "fly-assets/fly-${OS}-${ARCH}.zip" fly.exe > /tmp/fly-windows-amd64.exe
                test -s /tmp/fly-windows-amd64.exe
                rm -f /tmp/fly-windows-amd64.exe
              else
                tar czf "fly-assets/fly-${OS}-${ARCH}.tgz" -C fly-bin fly
              fi
              rm -f "fly-bin/fly${EXT}"
            done
            rm -rf fly-bin
            ls -lh fly-assets/

            # --- 2. Pull the exact digest that self-upgrade deployed and live tests passed ---
            if ! kubectl exec -n cicd ${BUILDER_POD} -- docker pull "${RC_IMMUTABLE_IMAGE}"; then
              echo "FATAL: RC image ${RC_IMMUTABLE_IMAGE} not found."
              echo "Refusing to rebuild from an untested tag or publish v${NEXT_VERSION}."
              exit 1
            fi

            echo "=== Copying fly assets into builder pod ==="
            kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

            echo "=== Rebuilding image with all fly platform assets ==="
            cat <<'DOCKERFILE' > /tmp/Dockerfile.release
          FROM __RC_IMAGE__
          RUN mv /usr/local/concourse/bin/concourse-final /usr/local/concourse/bin/concourse
          COPY fly-assets /usr/local/concourse/fly-assets
          DOCKERFILE
            sed -i "s|__RC_IMAGE__|${RC_IMMUTABLE_IMAGE}|g" /tmp/Dockerfile.release
            kubectl cp /tmp/Dockerfile.release cicd/${BUILDER_POD}:/tmp/Dockerfile.release
            kubectl exec -n cicd ${BUILDER_POD} -- \
              docker build \
                -t "${FINAL_TAG}" \
                -t registry.home/jetbridge:v${NEXT_VERSION} \
                -t ${GHCR}:${SHORT_SHA} \
                -t ${GHCR}:v${NEXT_VERSION} \
                -t ${GHCR}:latest \
                -f /tmp/Dockerfile.release /tmp/

            echo "=== Verifying the exact final image before any push or release mutation ==="
            FINAL_VERSION_OUTPUT=$(kubectl exec -n cicd "${BUILDER_POD}" -- \
              docker run --rm --entrypoint /usr/local/concourse/bin/concourse \
                "${FINAL_TAG}" --version)
            printf '%s\n' "${FINAL_VERSION_OUTPUT}"
            if printf '%s\n' "${FINAL_VERSION_OUTPUT}" | grep -Fq -- "-rc"; then
              echo "FATAL: final image still reports an RC server version"
              exit 1
            fi
            if ! test "${FINAL_VERSION_OUTPUT}" = "${EXPECTED_FINAL_VERSION}"; then
              echo "FATAL: final image version is ${FINAL_VERSION_OUTPUT}; want ${EXPECTED_FINAL_VERSION}"
              exit 1
            fi

            echo "=== Pushing source-addressed release image and resolving its digest ==="
            PUSH_OUTPUT=$(kubectl exec -n cicd ${BUILDER_POD} -- docker push "${FINAL_TAG}")
            printf '%s\n' "${PUSH_OUTPUT}"
            FINAL_DIGEST=$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
            if ! printf '%s\n' "${FINAL_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
              echo "FATAL: release push returned no exact lowercase sha256 digest"
              exit 1
            fi
            FINAL_IMAGE="registry.home/jetbridge@${FINAL_DIGEST}"
          fi

          kubectl exec -n cicd ${BUILDER_POD} -- docker pull "${FINAL_IMAGE}"
          FINAL_VERSION_OUTPUT=$(kubectl exec -n cicd "${BUILDER_POD}" -- \
            docker run --rm --entrypoint /usr/local/concourse/bin/concourse \
              "${FINAL_IMAGE}" --version)
          printf '%s\n' "${FINAL_VERSION_OUTPUT}"
          if printf '%s\n' "${FINAL_VERSION_OUTPUT}" | grep -Fq -- "-rc"; then
            echo "FATAL: verified release image still reports an RC server version"
            exit 1
          fi
          if ! test "${FINAL_VERSION_OUTPUT}" = "${EXPECTED_FINAL_VERSION}"; then
            echo "FATAL: verified release image version is ${FINAL_VERSION_OUTPUT}; want ${EXPECTED_FINAL_VERSION}"
            exit 1
          fi

          if test "${REUSE_PUBLISHED_RELEASE}" = false; then
            kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:v${NEXT_VERSION}

            echo "=== Logging into GHCR ==="
            set +x
            printf '%s\n' "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin
            set -x

            echo "=== Pushing to GHCR ==="
            kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:${SHORT_SHA}
            kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:v${NEXT_VERSION}
            kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:latest
          fi

          # --- 3. Image published — NOW create the release tag ---
          # (Deferred from the top: only tag/push once the image actually exists.)
          git config --global user.email "ci@concourse.home"
          git config --global user.name "Concourse CI"
          set +x
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/tdmtrader/jetbridge.git"
          set -x
          echo "=== Tagging v${NEXT_VERSION} ==="
          if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1; then
            if test "$(git rev-parse "v${NEXT_VERSION}^{commit}")" != "${SOURCE_COMMIT}"; then
              echo "FATAL: existing v${NEXT_VERSION} does not identify tested source ${SOURCE_COMMIT}" >&2
              exit 1
            fi
            echo "Tag v${NEXT_VERSION} already identifies tested source — reusing it"
          else
            git tag -a "v${NEXT_VERSION}" -m "Release v${NEXT_VERSION}"
            git push origin "v${NEXT_VERSION}"
            echo "=== Tagged v${NEXT_VERSION} ==="
          fi

          # --- 4. Push to main (only after the release image + tag succeeded) ---
          echo "=== Pushing to main ==="
          sh deploy/push-jetbridge-main.sh .
          echo "=== Pushed ${SHORT_SHA} to main ==="

          umask 077
          printf 'CONCOURSE_WEB_IMAGE=%s\nSOURCE_COMMIT=%s\n' \
            "${FINAL_IMAGE}" "${SOURCE_COMMIT}" > ../release-image-metadata/verified-image.env
          grep -Eq '^CONCOURSE_WEB_IMAGE=registry.home/jetbridge@sha256:[a-f0-9]{64}$' ../release-image-metadata/verified-image.env
          grep -Eq '^SOURCE_COMMIT=[a-f0-9]{40}$' ../release-image-metadata/verified-image.env

          # Keep the source-bound RC tag as an immutable version reservation
          # and audit record. Later candidates allocate a new patch version;
          # they never move or recycle this tag.

          echo "=== Release complete: v${NEXT_VERSION} (${SHORT_SHA}) ==="
          echo "  Tagged: v${NEXT_VERSION}"
          echo "  Main:   pushed"
          echo "  GHCR:   ${GHCR}:v${NEXT_VERSION}"
          echo "  Local:  ${FINAL_IMAGE}"
  - task: update-home-infra-release-image
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: home-infra
      - name: release-image-metadata
      outputs:
      - name: home-infra-updated
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -euc
        - |
          test "$(wc -l < release-image-metadata/verified-image.env | tr -d ' ')" = 2
          WEB_IMAGE=$(sed -n 's/^CONCOURSE_WEB_IMAGE=//p' release-image-metadata/verified-image.env)
          SOURCE_COMMIT=$(sed -n 's/^SOURCE_COMMIT=//p' release-image-metadata/verified-image.env)
          printf '%s\n' "${WEB_IMAGE}" | grep -Eq '^registry.home/jetbridge@sha256:[a-f0-9]{64}$'
          printf '%s\n' "${SOURCE_COMMIT}" | grep -Eq '^[a-f0-9]{40}$'
          # Output volumes survive an interrupted ATC task replay. Start from
          # the immutable input so stale Git locks or files cannot leak into
          # the next supervised push.
          find home-infra-updated -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test -d home-infra/.git
          test ! -L home-infra/.git
          test -d home-infra-updated
          test ! -L home-infra-updated
          test -z "$(find home-infra-updated -mindepth 1 -maxdepth 1 -print -quit)"
          cp -a home-infra/. home-infra-updated/
          test -d home-infra-updated/.git
          test ! -L home-infra-updated/.git
          find home-infra-updated/.git -type f -name '*.lock' -exec rm -f -- {} +
          ASKPASS=$(mktemp)
          cleanup_askpass() {
            rm -f "${ASKPASS}"
          }
          trap cleanup_askpass EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C home-infra-updated fetch --no-tags origin refs/heads/main
          git -C home-infra-updated reset --hard FETCH_HEAD
          rm -f "${ASKPASS}"
          sh repo/deploy/write-web-image-home-infra.sh "${WEB_IMAGE}" "${SOURCE_COMMIT}" home-infra-updated
  - task: push-home-infra-release-image
    timeout: 5m
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: home-infra-updated
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -euc
        - |
          PUSH_REPO=$(mktemp -d)
          ASKPASS=$(mktemp)
          cleanup_push() {
            rm -rf "${PUSH_REPO}"
            rm -f "${ASKPASS}"
          }
          trap cleanup_push EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          cp -a home-infra-updated/. "${PUSH_REPO}/"
          test -e "${PUSH_REPO}/.git"
          set +x
          cat <<'ASKPASS_EOF' > "${ASKPASS}"
          #!/bin/sh
          case "${1-}" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "${GITHUB_TOKEN}" ;;
            *) exit 1 ;;
          esac
          ASKPASS_EOF
          chmod 700 "${ASKPASS}"
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" fetch --no-tags origin refs/heads/main
          git -C "${PUSH_REPO}" -c user.name="Concourse CI" -c user.email="ci@concourse.home" rebase --rebase-merges FETCH_HEAD
          GIT_ASKPASS="${ASKPASS}" GIT_TERMINAL_PROMPT=0 \
            git -C "${PUSH_REPO}" push origin HEAD:refs/heads/main
  - task: verify-release-rollout
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: release-image-metadata
      run:
        path: sh
        args:
        - -euc
        - |
          WEB_IMAGE=$(sed -n 's/^CONCOURSE_WEB_IMAGE=//p' release-image-metadata/verified-image.env)
          SOURCE_COMMIT=$(sed -n 's/^SOURCE_COMMIT=//p' release-image-metadata/verified-image.env)
          current_revision_ready() {
            state=$1
            printf '%s\n' "${state}" | grep -Eq '^[0-9]+:[0-9]+:[0-9]+:[0-9]+:[0-9]+:[0-9]+$' || return 1
            saved_ifs=$IFS
            IFS=:
            set -- ${state}
            IFS=$saved_ifs
            test "$3" -gt 0 && test "$1" = "$2" && test "$3" = "$4" && test "$5" -ge "$3" && test "$6" -ge "$3" || return 1
            printf '%s\n' "$3"
          }
          exact_ready_pods() {
            selector=$1
            container=$2
            desired=$3
            pod_json=$(kubectl get pods -n cicd -l "${selector}" -o json) || return 1
            printf '%s\n' "${pod_json}" | jq -e \
              --arg image "${WEB_IMAGE}" \
              --arg source "${SOURCE_COMMIT}" \
              --arg container "${container}" \
              --argjson desired "${desired}" '
                [
                  .items[]?
                  | select(.metadata.deletionTimestamp == null)
                  | select(.metadata.annotations["concourse.ci/source-commit"] == $source)
                  | select(.metadata.annotations["concourse.ci/image-digest"] == $image)
                  | select(any(.spec.containers[]?; .name == $container and .image == $image))
                  | select(any(.status.conditions[]?; .type == "Ready" and .status == "True"))
                ]
                | length >= $desired
              ' >/dev/null
          }
          for i in $(seq 1 120); do
            web_image=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "concourse-web"}}{{.image}}{{end}}{{end}}')
            daemon_image=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{range .spec.template.spec.containers}}{{if eq .name "artifact-daemon"}}{{.image}}{{end}}{{end}}')
            web_source=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
            daemon_source=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/source-commit"}}')
            web_digest=$(kubectl get deployment/concourse-web -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
            daemon_digest=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o go-template='{{index .metadata.annotations "concourse.ci/image-digest"}}')
            if test "${web_image}" = "${WEB_IMAGE}" && test "${daemon_image}" = "${WEB_IMAGE}" && test "${web_source}" = "${SOURCE_COMMIT}" && test "${daemon_source}" = "${SOURCE_COMMIT}" && test "${web_digest}" = "${WEB_IMAGE}" && test "${daemon_digest}" = "${WEB_IMAGE}"; then
              web_state=$(kubectl get deployment/concourse-web -n cicd -o jsonpath='{.metadata.generation}:{.status.observedGeneration}:{.spec.replicas}:{.status.updatedReplicas}:{.status.readyReplicas}:{.status.availableReplicas}')
              daemon_state=$(kubectl get daemonset/concourse-artifact-daemon -n cicd -o jsonpath='{.metadata.generation}:{.status.observedGeneration}:{.status.desiredNumberScheduled}:{.status.updatedNumberScheduled}:{.status.numberReady}:{.status.numberAvailable}')
              if web_desired=$(current_revision_ready "${web_state}") && \
                daemon_desired=$(current_revision_ready "${daemon_state}") && \
                exact_ready_pods 'app.kubernetes.io/component=web,app.kubernetes.io/name=concourse-jetbridge' 'concourse-web' "${web_desired}" && \
                exact_ready_pods 'app.kubernetes.io/component=artifact-daemon,app.kubernetes.io/name=concourse-jetbridge' 'artifact-daemon' "${daemon_desired}"; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "FATAL: ArgoCD did not apply the final immutable shared image" >&2
          exit 1
