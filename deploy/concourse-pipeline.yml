resources:
- name: repo
  type: git
  source:
    uri: https://github.com/tdmtrader/jetbridge.git
    branch: jetbridge
    # Docs-only churn must not trigger the self-release chain (every push
    # restarts web ~10-12 min later and double-spends in-flight dogfood
    # builds — see ci/dogfood/FINDINGS.md "Pushing to jetbridge mid-run").
    # Deliberately narrow: ci/** and deploy/** still trigger.
    ignore_paths:
    - docs/**
    - notes/**
    - forge/**
jobs:
# Apply this file to the live pipeline whenever it changes.
#
# Without this, deploy/concourse-pipeline.yml is inert until someone remembers
# `fly set-pipeline`, and the gap is silent: a job conversion sat committed and
# unapplied for a day while the old definition kept running, and pipeline-side
# edits (params, env) took effect immediately while the repo-side code they
# paired with waited on `passed:` gates, so half-applied fixes looked like
# partial progress.
#
# Deliberately outside serial_groups: [pipeline] and free of `passed:`
# constraints, so a definition change lands even while the release chain is
# busy or red — which is exactly when a fix to it is most likely.
#
# Note this does not make the chain use new code any sooner: jobs gated on
# `passed:` still only see repo versions that cleared those gates. It removes
# the manual step, not the gating.
- name: set-self
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
  - set_pipeline: self
    file: repo/deploy/concourse-pipeline.yml

- name: build-and-vet
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
  - task: build-and-vet
    # Retry transient k8s-runtime pod disruptions (single-node contention);
    # this task errors (not fails) when its pod is lost mid-run.
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Verifying full build ==="
          go build ./cmd/concourse
          go build ./cmd/artifact-daemon
          echo "=== Build successful ==="
          echo ""
          echo "=== Running go vet ==="
          go vet ./atc/worker/jetbridge/... ./vars/... ./tracing/... \
                 ./fly/commands/... ./fly/rc/... ./fly/eventstream/... \
                 ./atc/engine/... ./atc/resource/... \
                 ./atc/scheduler/... ./atc/metric/... ./atc/creds/... \
                 ./skymarshal/token/... ./skymarshal/skyserver/...
          echo "=== Vet passed ==="

# Native agent-review job — v3 durable workflow run (converted 2026-07-26).
# Replaces the retired v1 path (an untyped `agent: review` step writing
# review.json plus a curl POST to /api/v1/agent/reviews with a principal
# bearer token); both the untyped step and that endpoint are being deleted.
#
# The job now captures two immutable `repository/v1` snapshots of THIS
# pipeline's `repo` resource — the commit under review and its nearest
# ancestor that is itself a known resource version — and runs the
# `code-review` workflow function (agent/workflow/seeds/code-review-v3) over
# them. Nothing is published back into the build: the review is durable,
# typed evidence hanging off the workflow run, reachable from the UI.
#
# PREREQUISITES (see docs/agentic/V3_CUTOVER_DEPLOY.md for the runbook):
#   0. The web node must run with durable snapshots enabled and the agent
#      runtime pinned by digest (--agent-snapshot-enabled plus
#      --agent-step-image=...@sha256:...). Schema-v3 workflows and resource
#      captures fail closed without them.
#   1. The `code-review` workflow must be imported AND promoted live:
#        fly -t <target> agent workflows import agent/workflow/seeds/code-review-v3
#        fly -t <target> agent workflows set-live code-review <version>
#      This job binds the LIVE version (no --version pin), so promoting a new
#      version changes what the next build runs.
#   2. A platform Anthropic credential must be vaulted (admin):
#        fly -t <target> agent auth --platform
#      Workflow-run admission resolves the creating user's own credential
#      first and falls back to the platform credential, so the CI login user
#      below needs no personal token of its own.
#   3. Pipeline vars ((concourse-username)) / ((concourse-password)): a LOCAL
#      basic-auth user on this Concourse that belongs to this pipeline's team.
#      The v1 ((agent-review-principal-token)) secret is no longer used here.
- name: agent-review-native
  plan:
  - get: repo
    trigger: false
    # Deep enough to walk back to the previous *resource version*: docs-only
    # commits are filtered out by the resource's ignore_paths and never become
    # versions, so the nearest reviewed ancestor can be several commits back.
    params: {depth: 50}
  - task: run-code-review-workflow
    # Retry transient k8s-runtime pod disruptions. The idempotency key below
    # is stable across attempts, so a retry re-attaches to the SAME durable
    # workflow run instead of spending a second review.
    attempts: 2
    timeout: 45m
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        CONCOURSE_USERNAME: ((concourse-username))
        CONCOURSE_PASSWORD: ((concourse-password))
      run:
        path: sh
        args:
        - -ec
        - |
          # fly is built from the commit under review rather than downloaded:
          # it keeps the CLI in lockstep with the API it talks to (workflow
          # import/run flags are validated client-side), and an unstamped
          # build reports a dev version, which skips fly's major/minor
          # target-version gate.
          echo "=== Building fly from the repo input ==="
          ( cd repo && go build -o /usr/local/bin/fly ./fly )

          # Same in-cluster address the verify-upgrade job uses.
          CONCOURSE_URL="http://concourse-web.cicd.svc.cluster.local:8080"
          WORKFLOW="code-review"
          # Deterministic, writable fly config dir (HOME is not guaranteed).
          export FLY_HOME=/tmp/fly-home
          mkdir -p "$FLY_HOME"

          echo "=== fly login (team ${BUILD_TEAM_NAME}) ==="
          fly -t self login -c "$CONCOURSE_URL" -n "$BUILD_TEAM_NAME" \
            -u "$CONCOURSE_USERNAME" -p "$CONCOURSE_PASSWORD" >/dev/null

          HEAD_SHA=$(git -C repo rev-parse HEAD)
          echo "head: ${HEAD_SHA}"

          echo "=== Resolving the base commit ==="
          # capture-resource only accepts an already-known resource version,
          # so the base must be a version the resource actually produced —
          # not merely HEAD~1. Take the nearest ancestor of HEAD that is one.
          fly -t self resource-versions -r "${BUILD_PIPELINE_NAME}/repo" \
            --count 100 --json > /tmp/versions.json
          jq -r '.[] | select(.enabled) | .version.ref // empty' /tmp/versions.json \
            | sort -u > /tmp/known-refs
          git -C repo rev-list --max-count=50 "$HEAD_SHA" | tail -n +2 > /tmp/ancestors

          BASE_SHA=""
          while read -r candidate; do
            if grep -qx "$candidate" /tmp/known-refs; then
              BASE_SHA="$candidate"
              break
            fi
          done < /tmp/ancestors

          if [ -z "$BASE_SHA" ]; then
            echo "No ancestor of ${HEAD_SHA} is a known version of ${BUILD_PIPELINE_NAME}/repo"
            echo "(first build, or history older than the retained version window)."
            echo "Nothing to compare against — skipping the review."
            exit 0
          fi
          echo "base: ${BASE_SHA}"

          # capture-resource is idempotent per (resource, version, type): a
          # repeat call returns the same durable snapshot, it does not refetch.
          capture_snapshot() {
            fly -t self agent snapshots capture-resource \
              --pipeline="$BUILD_PIPELINE_NAME" \
              --resource=repo \
              --version="ref:$1" \
              --type=repository/v1 \
              --json > "$2"
            captured=$(jq -r '.snapshot.id // empty' "$2")
            if [ -z "$captured" ]; then
              { echo "capture of $1 returned no snapshot:"; cat "$2"; } >&2
              return 1
            fi
            echo "$captured"
          }

          echo "=== Capturing repository/v1 snapshots ==="
          BEFORE_ID=$(capture_snapshot "$BASE_SHA" /tmp/before.json)
          AFTER_ID=$(capture_snapshot "$HEAD_SHA" /tmp/after.json)
          echo "before=${BEFORE_ID} after=${AFTER_ID}"

          # One durable run per build. The key is stable across `attempts:`
          # retries of this task, so a lost pod re-attaches to the existing
          # run; it changes when a human re-triggers the job.
          IDEMPOTENCY_KEY="pipeline-review-build-${BUILD_ID}"

          echo "=== Creating the ${WORKFLOW} workflow run ==="
          fly -t self agent workflows run "$WORKFLOW" \
            --input=before="$BEFORE_ID" \
            --input=after="$AFTER_ID" \
            --idempotency-key="$IDEMPOTENCY_KEY" \
            --json > /tmp/run.json
          RUN_ID=$(jq -r '.workflow_run_id // empty' /tmp/run.json)
          if [ -z "$RUN_ID" ]; then
            echo "workflow run creation returned no run id:"; cat /tmp/run.json; exit 1
          fi
          RUN_URL="${ATC_EXTERNAL_URL}/agent/workflows/${WORKFLOW}/runs/${RUN_ID}"
          echo "workflow run ${RUN_ID}: ${RUN_URL}"

          # --follow streams status transitions but dies on the first HTTP
          # error, and a concurrent self-upgrade restarts web mid-wait. Treat
          # it as best effort; the poll below is the authority on the
          # terminal state.
          echo "=== Following run ${RUN_ID} ==="
          fly -t self agent workflows show-run "$WORKFLOW" "$RUN_ID" --follow \
            || echo "follow dropped (web restart?) — re-checking the run state"

          STATUS=""
          for _ in $(seq 1 180); do
            if fly -t self agent workflows show-run "$WORKFLOW" "$RUN_ID" --json \
                 > /tmp/detail.json 2>/tmp/detail.err; then
              STATUS=$(jq -r '.status // empty' /tmp/detail.json)
              case "$STATUS" in
                succeeded|failed|errored|aborted) break ;;
              esac
            else
              STATUS=""
              echo "transient: could not read run ${RUN_ID} — $(tail -1 /tmp/detail.err)"
            fi
            sleep 10
          done

          echo "=== Run ${RUN_ID} status: ${STATUS:-unknown} ==="
          if [ "$STATUS" != "succeeded" ]; then
            echo "The ${WORKFLOW} workflow run did not complete successfully."
            echo "  ${RUN_URL}"
            exit 1
          fi

          # Advisory only. The review's own conclusion (accept /
          # changes-required / inconclusive) NEVER fails this job: the sealed
          # review snapshot is the record and a human dispositions it. Every
          # command below is inside a failure-tolerant group.
          echo "=== Review verdict (advisory) ==="
          {
            REVIEW_ID=$(fly -t self agent workflows show-run "$WORKFLOW" "$RUN_ID" \
              --outputs --json | jq -r '.outputs[] | select(.port == "review") | .snapshot.id')
            if [ -n "$REVIEW_ID" ]; then
              echo "review snapshot ${REVIEW_ID}: ${ATC_EXTERNAL_URL}/agent/snapshots/${REVIEW_ID}"
              fly -t self agent snapshots download "$REVIEW_ID" --to /tmp/review.tar
              mkdir -p /tmp/review
              tar xf /tmp/review.tar -C /tmp/review
              RECORD=$(find /tmp/review -name record.json | head -1)
              if [ -n "$RECORD" ]; then
                jq -r '"conclusion: \(.body.conclusion)",
                       "summary: \(.body.summary)",
                       "findings: \((.body.findings // []) | length) (\((.body.findings // []) | map(select(.blocking)) | length) blocking)",
                       ((.body.findings // [])[] | "  [\(.severity)] \(.id): \(.title)")' "$RECORD"
              fi
            fi
          } || echo "(could not render the review body; the durable snapshot is authoritative)"

          echo "=== Review complete: ${RUN_URL} ==="

- name: unit-tests
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [build-and-vet]
  - task: unit-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running unit tests across the full codebase ==="
          echo "Excluding packages that require external infrastructure"
          echo ""
          PACKAGES=$(go list ./... \
            | grep -v /integration \
            | grep -v /testflight \
            | grep -v /topgun \
            | grep -v /fly/integration \
            | grep -v /atc/db \
            | grep -v /atc/gc \
            | grep -v /atc/postgresrunner \
            | grep -v /atc/scheduler/algorithm \
            | grep -v '/atc/worker$' \
            | grep -v /skymarshal/dexserver \
            | grep -v /cmd)
          echo "Testing packages:"
          echo "$PACKAGES" | head -20
          echo "... ($(echo "$PACKAGES" | wc -l | tr -d ' ') packages total)"
          echo ""
          go test -count=1 -timeout 10m $PACKAGES
          echo "=== All unit tests passed ==="

- name: k8s-runtime-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [unit-tests]
  - task: k8s-runtime-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          echo "=== Running jetbridge full test suite ==="
          go test -v -count=1 -timeout 5m ./atc/worker/jetbridge/...
          echo "=== All jetbridge tests passed ==="

- name: tag-rc
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-runtime-tests]
  - task: create-rc-tag
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing next version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No release tags found, starting at v0.1.0"
            NEXT_VERSION="0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            echo "Latest release: ${LATEST_TAG} -> next: v${NEXT_VERSION}"
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          RC_TAG="v${NEXT_VERSION}-rc"
          echo "=== Tagging ${RC_TAG} at ${SHORT_SHA} ==="

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/tdmtrader/jetbridge.git"
          git tag -f "${RC_TAG}"
          git push -f origin "${RC_TAG}"
          echo "=== Release candidate tagged: ${RC_TAG} (${SHORT_SHA}) ==="

- name: build-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [tag-rc]
  # web/handler.go embeds web/public with //go:embed, so a bare `go build`
  # ships whatever elm.min.js was last COMMITTED — that is how v0.2.164-rc went
  # out with a stale UI bundle on 2026-07-17 (fixed by 46db7b9735). Regenerate
  # the frontend from source here so a stale commit can never reach the image.
  #
  # This mirrors Dockerfile.build's `frontend` stage — the day-to-day borg
  # chain gets the same guarantee by building that Dockerfile end to end. Keep
  # the two in sync. Dockerfile.build is not reused wholesale here because its
  # Go stage stamps only concourse.Version — this chain also stamps
  # JetBridgeVersion (the jetbridge_version in /api/v1/info and `concourse
  # --version`) — and would re-download the module graph that the
  # concourse-test-runner image already has warm. It does match its fly
  # cross-compile set (minus windows), since `fly sync` needs those archives
  # present in whatever image is actually deployed.
  - task: build-frontend
    attempts: 2
    config:
      platform: linux
      # Same image as Dockerfile.build stage 1. The elm npm package ships
      # x86_64 binaries only, so this must land on an amd64 node.
      rootfs_uri: docker:///node:22-bookworm-slim
      inputs:
      - name: repo
      outputs:
      - name: web-public
      # npm and the elm package registry are external egress, historically the
      # flakiest part of any frontend build here: the caches keep repeat runs
      # mostly offline and attempts: 2 absorbs a single bad fetch.
      caches:
      - path: yarn-global
      - path: elm-home
      run:
        path: sh
        args:
        - -exc
        - |
          # Keep every download inside cached task dirs (yarn 4 puts its cache
          # under globalFolder/cache; elm under ELM_HOME/0.19.1).
          export YARN_GLOBAL_FOLDER="$(pwd)/yarn-global"
          export ELM_HOME="$(pwd)/elm-home"
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          # puppeteer is a wats-only devDependency whose postinstall pulls a
          # ~150MB Chrome build that `yarn run build` never touches.
          export PUPPETEER_SKIP_DOWNLOAD=1

          # Elm's built-in TLS needs system CA certificates to fetch package
          # metadata; the node slim images autoremove them (same reason
          # Dockerfile.build's frontend stage installs them).
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            rm -rf /var/lib/apt/lists/*
          fi

          cd repo
          # `corepack prepare` with no spec activates the version in the
          # checkout's package.json "packageManager" field, so the yarn pin
          # lives in exactly one place. (Dockerfile.build has to name it
          # explicitly — it runs corepack before COPY package.json.)
          corepack enable
          corepack prepare --activate
          yarn --version

          echo "=== Committed bundle (what a bare go build would have shipped) ==="
          sha256sum web/public/elm.min.js || true

          echo "=== Installing node dependencies ==="
          yarn install --immutable || yarn install

          echo "=== Building frontend (LESS -> css, Elm -> js, webpack) ==="
          yarn run build

          echo "=== Rebuilt frontend assets ==="
          sha256sum web/public/elm.min.js web/public/main.css web/public/bundle.js

          # Ship the whole merged directory: `yarn run build` regenerates
          # elm.js/elm.min.js/main.css/*bundle.js and the rest (images, fonts,
          # mdi-svg.min.js, graphviz) is committed source — the same set
          # Dockerfile.build's frontend stage hands to its Go stage.
          cp -a web/public/. ../web-public/
  - task: build-and-push-local
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      - name: web-public
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version: ${NEXT_VERSION}-rc (${SHORT_SHA})"

          LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}-rc -X github.com/concourse/concourse.JetBridgeVersion=${NEXT_VERSION}-rc"

          # //go:embed in web/handler.go bakes web/public into the binary, so
          # the freshly built assets from build-frontend MUST land before
          # `go build` — otherwise the committed bundle ships (2026-07-17).
          echo "=== Installing freshly built frontend assets over web/public ==="
          if [ ! -s ../web-public/elm.min.js ]; then
            echo "FATAL: build-frontend produced no elm.min.js — refusing to ship a possibly stale bundle"
            exit 1
          fi
          cp -a ../web-public/. web/public/
          sha256sum web/public/elm.min.js

          echo "=== Building concourse binary (linux/amd64 — the only platform this image runs on) ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o concourse-linux-amd64 ./cmd/concourse
          ls -lh concourse-linux-amd64
          echo "=== Building artifact-daemon binary ==="
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o artifact-daemon-linux-amd64 ./cmd/artifact-daemon
          ls -lh artifact-daemon-linux-amd64

          # Cross-compile fly for every platform an operator might run, matching
          # the `release` job and Dockerfile.build. The web serves these at
          # /api/v1/cli, which is what `fly sync` fetches; shipping only
          # linux/amd64 made sync fail on a mac with "failed to open tgz
          # archive: .../fly-darwin-arm64.tgz: no such file or directory", and
          # since the cluster tracks rc images that break was permanent rather
          # than deferred to the next release.
          echo "=== Building fly CLI for all platforms ==="
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}-rc"
          mkdir -p fly-assets fly-bin
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${pair%%/*}"
            ARCH="${pair##*/}"
            echo "  fly-${OS}-${ARCH}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags "${FLY_LDFLAGS}" -o fly-bin/fly ./fly
            tar czf fly-assets/fly-${OS}-${ARCH}.tgz -C fly-bin fly
            rm -f fly-bin/fly
          done
          rm -rf fly-bin
          ls -lh fly-assets/

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          BUILDER_POD="image-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=image-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: image-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying binaries to builder pod ==="
          kubectl cp concourse-linux-amd64 cicd/${BUILDER_POD}:/tmp/concourse-linux-amd64
          kubectl cp artifact-daemon-linux-amd64 cicd/${BUILDER_POD}:/tmp/artifact-daemon-linux-amd64
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Copying Dockerfile to builder pod ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile
          FROM ubuntu:22.04
          RUN apt-get update && \
              apt-get install -y ca-certificates dumb-init && \
              rm -rf /var/lib/apt/lists/*
          COPY concourse-linux-amd64 /usr/local/concourse/bin/concourse
          COPY artifact-daemon-linux-amd64 /usr/local/concourse/bin/artifact-daemon
          COPY fly-assets /usr/local/concourse/fly-assets
          RUN chmod +x /usr/local/concourse/bin/concourse /usr/local/concourse/bin/artifact-daemon
          ENV PATH="/usr/local/concourse/bin:${PATH}"
          ENTRYPOINT ["dumb-init", "concourse"]
          DOCKERFILE
          kubectl cp /tmp/Dockerfile cicd/${BUILDER_POD}:/tmp/Dockerfile

          echo "=== Building Docker image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/jetbridge:latest \
              -t registry.home/jetbridge:v${NEXT_VERSION}-rc \
              -t ${REGISTRY}/jetbridge:latest \
              -t ${REGISTRY}/jetbridge:v${NEXT_VERSION}-rc \
              -f /tmp/Dockerfile /tmp/

          echo "=== Pushing to local registries ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:v${NEXT_VERSION}-rc
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${REGISTRY}/jetbridge:v${NEXT_VERSION}-rc

          echo "=== Image built and pushed to local registries: v${NEXT_VERSION}-rc (${SHORT_SHA}) ==="

# Builds the agent: step runner image (claude CLI + agent-runner supervisor)
# from deploy/agent-runner/Dockerfile with the repo as build context.
# Manual trigger: the image changes rarely (claude-code pin bumps, agent-runner
# changes) and must not ride the per-commit release chain.
- name: build-agent-runner-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: false
    params: {depth: 0, fetch_tags: true}
    passed: [unit-tests]
  - task: build-and-push-agent-runner
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "Version: ${NEXT_VERSION} (${SHORT_SHA})"

          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/agent-runner"
          BUILDER_POD="agent-runner-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=agent-runner-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: agent-runner-builder
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for builder pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Copying build context (repo, sans .git) to builder pod ==="
          tar czf /tmp/agent-runner-src.tgz --exclude=.git .
          kubectl exec -n cicd ${BUILDER_POD} -- mkdir -p /tmp/src
          kubectl cp /tmp/agent-runner-src.tgz cicd/${BUILDER_POD}:/tmp/agent-runner-src.tgz
          kubectl exec -n cicd ${BUILDER_POD} -- tar xzf /tmp/agent-runner-src.tgz -C /tmp/src

          echo "=== Building agent-runner image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/agent-runner:latest \
              -t registry.home/agent-runner:v${NEXT_VERSION} \
              -t ${GHCR}:latest \
              -t ${GHCR}:v${NEXT_VERSION} \
              -f /tmp/src/deploy/agent-runner/Dockerfile /tmp/src

          echo "=== Pushing to local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/agent-runner:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/agent-runner:v${NEXT_VERSION}

          echo "=== Logging into GHCR ==="
          echo "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin

          echo "=== Pushing to GHCR ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:latest
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:v${NEXT_VERSION}

          echo "=== agent-runner image built and pushed: v${NEXT_VERSION} (${SHORT_SHA}) ==="

# Builds the pinned multi-harness broker companion for linux/amd64 and prints
# the registry-reported immutable digest. This remains manual because updating
# the operator profile catalog is a separate reviewed deployment decision.
- name: build-agent-broker-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: false
    params: {depth: 1}
    passed: [unit-tests]
  - task: build-and-push-agent-broker
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          IMAGE="${REGISTRY}/agent-broker:${SHORT_SHA}"
          BUILDER_POD="agent-broker-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd "${BUILDER_POD}" --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT

          kubectl run -n cicd "${BUILDER_POD}" \
            --image=docker:26-dind \
            --restart=Never \
            --overrides='{"spec":{"containers":[{"name":"'"${BUILDER_POD}"'","image":"docker:26-dind","securityContext":{"privileged":true},"env":[{"name":"DOCKER_TLS_CERTDIR","value":""}],"args":["--host=unix:///var/run/docker.sock","--insecure-registry='"${REGISTRY}"'"]}]}}'
          kubectl wait --for=condition=ready pod/"${BUILDER_POD}" -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd "${BUILDER_POD}" -- docker info >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl exec -n cicd "${BUILDER_POD}" -- docker info >/dev/null

          tar czf /tmp/agent-broker-src.tgz --exclude=.git .
          kubectl exec -n cicd "${BUILDER_POD}" -- mkdir -p /tmp/src
          kubectl cp /tmp/agent-broker-src.tgz "cicd/${BUILDER_POD}:/tmp/agent-broker-src.tgz"
          kubectl exec -n cicd "${BUILDER_POD}" -- tar xzf /tmp/agent-broker-src.tgz -C /tmp/src
          kubectl exec -n cicd "${BUILDER_POD}" -- \
            docker build --platform linux/amd64 \
              -t "${IMAGE}" \
              -f /tmp/src/deploy/agent-broker/Dockerfile /tmp/src
          PUSH_OUTPUT=$(kubectl exec -n cicd "${BUILDER_POD}" -- docker push "${IMAGE}")
          printf '%s\n' "${PUSH_OUTPUT}"
          DIGEST=$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
          if ! printf '%s\n' "${DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FATAL: registry push returned no exact lowercase sha256 digest"
            exit 1
          fi
          IMAGE_REPOSITORY=${IMAGE%:*}
          AGENT_BROKER_IMAGE=${IMAGE_REPOSITORY}@${DIGEST}
          echo "Use this exact worker_image in agentBroker.image and every profile:"
          echo "${AGENT_BROKER_IMAGE}"

# Builds the provider-neutral forge-pr polling resource and prints the exact
# digest reference operators must place in
# agentPublisher.pullRequests.resourceImage. This is manual because changing
# the configured digest remains an explicit release/deployment decision.
- name: build-forge-pr-resource-image
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: false
    params: {depth: 1}
    passed: [unit-tests]
  - task: build-and-push-forge-pr-resource
    privileged: true
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo

          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/forge-pr-resource"
          BUILDER_POD="forge-pr-resource-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=forge-pr-resource-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: forge-pr-resource-builder
          spec:
            containers:
            - name: dind
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          echo "=== Copying forge-pr build context ==="
          tar czf /tmp/forge-pr-resource-src.tgz --exclude=.git .
          kubectl exec -n cicd ${BUILDER_POD} -- mkdir -p /tmp/src
          kubectl cp /tmp/forge-pr-resource-src.tgz cicd/${BUILDER_POD}:/tmp/forge-pr-resource-src.tgz
          kubectl exec -n cicd ${BUILDER_POD} -- tar xzf /tmp/forge-pr-resource-src.tgz -C /tmp/src

          echo "=== Building forge-pr resource image ==="
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/forge-pr-resource:${SHORT_SHA} \
              -t ${GHCR}:${SHORT_SHA} \
              -f /tmp/src/deploy/forge-pr-resource.Dockerfile /tmp/src

          echo "=== Pushing to the local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/forge-pr-resource:${SHORT_SHA}

          echo "=== Logging into GHCR ==="
          set +x
          printf '%s\n' "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin
          set -x

          echo "=== Pushing to GHCR and resolving its immutable digest ==="
          PUSH_OUTPUT=$(kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:${SHORT_SHA})
          printf '%s\n' "${PUSH_OUTPUT}"
          RESOURCE_DIGEST=$(printf '%s\n' "${PUSH_OUTPUT}" | sed -n 's/.*digest: \(sha256:[a-f0-9]\{64\}\).*/\1/p' | tail -1)
          if ! printf '%s\n' "${RESOURCE_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "FATAL: GHCR push returned no exact lowercase sha256 digest"
            exit 1
          fi

          FORGE_PR_RESOURCE_IMAGE=${GHCR}@${RESOURCE_DIGEST}
          echo "=== forge-pr resource image contract ==="
          echo "FORGE_PR_RESOURCE_IMAGE=${FORGE_PR_RESOURCE_IMAGE}"

- name: self-upgrade
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [build-image]
  - task: trigger-rollout
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          IMAGE="registry.home/jetbridge:v${NEXT_VERSION}-rc"
          echo "=== Self-upgrade: deploying ${IMAGE} ==="
          echo "Triggering rollout and exiting immediately."
          echo ""

          kubectl set image deployment/concourse-web concourse-web=${IMAGE} -n cicd
          kubectl rollout restart deployment/concourse-web -n cicd
          kubectl rollout restart daemonset/concourse-artifact-daemon -n cicd

          echo "=== Rollout triggered. ==="

- name: verify-upgrade
  serial_groups: [pipeline]
  plan:
  # Triggered once per upgraded commit. No settle timer: in-flight builds
  # survive the self-upgrade web rollout (engine drain releases job builds
  # and the task supervisor resumes them — build_survival track), and a
  # timer trigger re-fires forever, failing after every release because
  # "latest tag + 1"-rc only exists once the NEXT commit builds it.
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [self-upgrade]
  - task: check-running-version
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          EXPECTED="${MAJOR}.${MINOR}.$((PATCH + 1))-rc"

          echo "=== Waiting for rollout to complete ==="
          kubectl rollout status deployment/concourse-web -n cicd --timeout=180s
          kubectl rollout status daemonset/concourse-artifact-daemon -n cicd --timeout=180s

          echo "=== Waiting for pods to be ready ==="
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=web -n cicd --timeout=120s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=artifact-daemon -n cicd --timeout=120s

          echo "=== Letting service endpoints settle (15s) ==="
          sleep 15

          CONCOURSE_URL="http://concourse-web.cicd.svc.cluster.local:8080"
          echo "=== Waiting for Concourse to report version ${EXPECTED} ==="
          echo ""

          for i in $(seq 1 60); do
            RUNNING=$(curl -sf "${CONCOURSE_URL}/api/v1/info" 2>/dev/null \
              | grep -o '"version":"[^"]*"' \
              | cut -d'"' -f4) || RUNNING="(unreachable)"
            echo "  attempt ${i}: running=${RUNNING} expected=${EXPECTED}"
            if [ "$RUNNING" = "$EXPECTED" ]; then
              echo ""
              echo "=== Verified: Concourse is running v${EXPECTED} ==="
              exit 0
            fi
            sleep 5
          done

          echo ""
          echo "=== FAILED: Concourse did not reach v${EXPECTED} within 5 minutes ==="
          echo "  Last seen version: ${RUNNING}"
          exit 1

- name: k8s-live-tests
  serial: true
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 1}
    passed: [verify-upgrade]
  - task: k8s-live-integration-tests
    attempts: 2
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        # The deployed artifact daemon's resolve key, so the init containers
        # these tests create sign capabilities the daemon will actually accept.
        # Mirrors the cicd Secret the chart mounts into web and the DaemonSet.
        ARTIFACT_RESOLVE_CAPABILITY_KEY_B64: ((artifact-resolve-capability-key))
      run:
        path: sh
        args:
        - -exc
        - |
          echo "=== Setting up kubeconfig for Go test client ==="
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          SA_TOKEN=$(cat "$SA_DIR/token")
          kubectl config set-cluster local --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" --certificate-authority="$SA_DIR/ca.crt" --embed-certs=true
          kubectl config set-credentials local --token="$SA_TOKEN"
          kubectl config set-context local --cluster=local --user=local --namespace=concourse
          kubectl config use-context local
          echo "Kubeconfig created, testing: $(kubectl get pods -n concourse --no-headers 2>&1 | wc -l) pods visible"

          export K8S_TEST_NAMESPACE=concourse
          echo "K8S_TEST_NAMESPACE=$K8S_TEST_NAMESPACE"

          echo "=== Cleaning up stale test pods from previous runs ==="
          for NS in concourse concourse-test; do
            kubectl get pods -n $NS --no-headers -o custom-columns=":metadata.name" 2>/dev/null \
              | { grep -E '^(live-|e2e-)' || true; } \
              | xargs -r kubectl delete pods -n $NS --grace-period=0 --force 2>/dev/null || true
          done
          echo ""

          # Fallbacks only. The suite reads the daemon's storage path, port,
          # service name and namespace from the deployed DaemonSet, so these
          # apply solely if it cannot. ARTIFACT_DAEMON_SERVICE is deliberately
          # not set: the deployed service is concourse-artifact-daemon, that
          # name is the SAN the daemon's certificate is verified against, and a
          # value guessed here breaks every ATC-side mTLS call while leaving
          # the init containers — which skip hostname verification — working.
          export ARTIFACT_DAEMON_HOST_PATH=/var/concourse/artifacts
          export ARTIFACT_DAEMON_PORT=7780
          # Exercise the helper this cluster actually deploys. The suite defaults
          # to alpine:latest on its own, so this is about testing what ships
          # rather than about making the tests pass.
          export ARTIFACT_HELPER_IMAGE=index.docker.io/library/alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b

          cd repo
          echo "=== Running jetbridge live integration tests ==="
          echo "These tests create real K8s pods against the live cluster."
          echo "Artifact daemon: hostPath=$ARTIFACT_DAEMON_HOST_PATH port=$ARTIFACT_DAEMON_PORT"
          echo ""
          go test -tags live -v -count=1 -timeout 15m ./atc/worker/jetbridge/...
          echo "=== Live integration tests passed ==="

- name: release
  serial_groups: [pipeline]
  plan:
  - get: repo
    trigger: true
    params: {depth: 0, fetch_tags: true}
    passed: [k8s-live-tests]
  - task: tag-push-release
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v5
      inputs:
      - name: repo
      params:
        GITHUB_TOKEN: ((github-token))
      run:
        path: sh
        args:
        - -exc
        - |
          cd repo
          git fetch --tags --force origin

          echo "=== Computing release version from tags ==="
          LATEST_TAG=$(git tag -l 'v0.2.*' --sort=-v:refname | grep -v '\-rc' | head -1)
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          SHORT_SHA=$(git rev-parse --short HEAD)

          echo "Releasing: v${NEXT_VERSION} (${SHORT_SHA})"

          git config --global user.email "ci@concourse.home"
          git config --global user.name "Concourse CI"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/tdmtrader/jetbridge.git"

          # NOTE: the git tag and the force-push to main are DEFERRED to the end
          # of this task, after the RC image is verified and the release image is
          # built and pushed. Previously they ran first, so a missing RC image
          # (or any image/build failure) left behind a phantom vX tag pointing at
          # an unbuilt version and force-moved main to an unreleased commit.

          # --- 1. Build multi-platform fly + push to GHCR ---
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          GHCR="ghcr.io/tdmtrader/jetbridge"
          BUILDER_POD="release-push-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=release-push --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD pod for GHCR push ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: release-push
          spec:
            containers:
            - name: dind
              # Pinned to 26.x (runc 1.1.x). The rolling docker:dind tag moved to
              # runc >=1.2, whose /proc masking (tmpfs nr_inodes=1) theborg's 5.4
              # kernel rejects with "can't mask dir /proc/acpi: invalid argument".
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
          PODEOF

          echo "Waiting for push pod to be ready..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=120s
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then break; fi
            sleep 2
          done

          echo "=== Building fly CLI for all platforms ==="
          LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION} -X github.com/concourse/concourse.JetBridgeVersion=${NEXT_VERSION}"
          FLY_LDFLAGS="-s -w -X github.com/concourse/concourse.Version=${NEXT_VERSION}"
          mkdir -p fly-assets fly-bin
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${pair%%/*}"
            ARCH="${pair##*/}"
            echo "  fly-${OS}-${ARCH}"
            CGO_ENABLED=0 GOOS=${OS} GOARCH=${ARCH} go build -ldflags "${FLY_LDFLAGS}" -o fly-bin/fly ./fly
            tar czf fly-assets/fly-${OS}-${ARCH}.tgz -C fly-bin fly
            rm -f fly-bin/fly
          done
          rm -rf fly-bin
          ls -lh fly-assets/

          # --- 2. Verify the RC image exists BEFORE any git mutation ---
          echo "=== Verifying RC image registry.home/jetbridge:v${NEXT_VERSION}-rc exists ==="
          if ! kubectl exec -n cicd ${BUILDER_POD} -- docker pull registry.home/jetbridge:v${NEXT_VERSION}-rc; then
            echo "FATAL: RC image v${NEXT_VERSION}-rc not found."
            echo "The RC pipeline (tag-rc/build-image) has not produced it — refusing"
            echo "to tag v${NEXT_VERSION} or push main. Fix the RC build, then re-run."
            exit 1
          fi

          echo "=== Copying fly assets into builder pod ==="
          kubectl cp fly-assets cicd/${BUILDER_POD}:/tmp/fly-assets

          echo "=== Rebuilding image with all fly platform assets ==="
          cat <<'DOCKERFILE' > /tmp/Dockerfile.release
          FROM registry.home/jetbridge:v__VERSION__-rc
          COPY fly-assets /usr/local/concourse/fly-assets
          DOCKERFILE
          sed -i "s/__VERSION__/${NEXT_VERSION}/g" /tmp/Dockerfile.release
          kubectl cp /tmp/Dockerfile.release cicd/${BUILDER_POD}:/tmp/Dockerfile.release
          kubectl exec -n cicd ${BUILDER_POD} -- \
            docker build \
              -t registry.home/jetbridge:v${NEXT_VERSION} \
              -t ${GHCR}:${SHORT_SHA} \
              -t ${GHCR}:v${NEXT_VERSION} \
              -t ${GHCR}:latest \
              -f /tmp/Dockerfile.release /tmp/

          echo "=== Pushing release to local registry ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push registry.home/jetbridge:v${NEXT_VERSION}

          echo "=== Logging into GHCR ==="
          echo "${GITHUB_TOKEN}" | kubectl exec -i -n cicd ${BUILDER_POD} -- docker login ghcr.io -u tdmtrader --password-stdin

          echo "=== Pushing to GHCR ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:${SHORT_SHA}
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:v${NEXT_VERSION}
          kubectl exec -n cicd ${BUILDER_POD} -- docker push ${GHCR}:latest

          # --- 3. Image published — NOW create the release tag ---
          # (Deferred from the top: only tag/push once the image actually exists.)
          echo "=== Tagging v${NEXT_VERSION} ==="
          if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEXT_VERSION} already exists — skipping"
          else
            git tag -a "v${NEXT_VERSION}" -m "Release v${NEXT_VERSION}"
            git push origin "v${NEXT_VERSION}"
            echo "=== Tagged v${NEXT_VERSION} ==="
          fi

          # --- 4. Push to main (only after the release image + tag succeeded) ---
          echo "=== Pushing to main ==="
          git push --force origin HEAD:refs/heads/main
          echo "=== Pushed ${SHORT_SHA} to main ==="

          # --- 5. Redeploy with final release version (includes all fly assets) ---
          echo "=== Redeploying with release image ==="
          IMAGE="registry.home/jetbridge:v${NEXT_VERSION}"
          kubectl set image deployment/concourse-web concourse-web=${IMAGE} -n cicd
          kubectl rollout restart deployment/concourse-web -n cicd

          # Clean up the RC tag
          git push origin --delete "v${NEXT_VERSION}-rc" 2>/dev/null || true

          echo "=== Release complete: v${NEXT_VERSION} (${SHORT_SHA}) ==="
          echo "  Tagged: v${NEXT_VERSION}"
          echo "  Main:   pushed"
          echo "  GHCR:   ${GHCR}:v${NEXT_VERSION}"
          echo "  Local:  ${IMAGE}"
