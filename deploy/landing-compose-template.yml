# The landing queue's compose template (ADR-0009). Install with
# fly set-pipeline -p landing-compose -c deploy/landing-compose-template.yml
# -v landing_image=<image with git>. The landing queue component admits a Run
# of it per candidate with the repository, trunk and entries as params.
#
# compose fetches the trunk and each entry's submit ref, rebuilds each entry
# on the trunk's head as one commit (author kept, committer fixed, dates the
# author's, an original: trailer) and publishes the tree as `candidate` and
# the facts the land step needs as `manifest`. One task publishes one result,
# so a second task republishes the manifest.
template: true
params:
  - name: repository
    type: string
    required: true
  - name: trunk
    type: string
    required: true
  - name: entries
    type: string
    required: true
jobs:
  - name: compose
    plan:
      - task: compose
        timeout: 10m
        task_id: 9eba7574-fde3-4527-b99c-ee265b8673eb
        run_result:
          name: candidate
          output: candidate
        config:
          platform: linux
          rootfs_uri: docker:///((landing_image))
          outputs:
            - name: candidate
            - name: manifest
          run:
            path: /bin/sh
            args:
              - -eu
              - -c
              - |
                # compose: rebuild the entries on the trunk's head.
                # $1 repository, $2 trunk, $3 entries (id=sha, comma separated)
                repo=$1 trunk=$2 entries=$3
                out=$PWD/candidate manifest=$PWD/manifest
                export GIT_COMMITTER_NAME=landing-queue GIT_COMMITTER_EMAIL=landing-queue@jetbridge
                export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
                git init -q work && cd work
                git fetch -q --no-tags "$repo" "refs/heads/$trunk"
                base=$(git rev-parse FETCH_HEAD)
                git checkout -q -b candidate "$base"
                head=$base
                for entry in $(printf '%s' "$entries" | tr ',' ' '); do
                  id=${entry%%=*} sha=${entry#*=}
                  git fetch -q --no-tags "$repo" "refs/queue/submit/$id"
                  [ "$(git rev-parse FETCH_HEAD)" = "$sha" ] || { echo "compose: submit ref $id is not at $sha" >&2; exit 1; }
                  git merge-base --is-ancestor "$sha" "$head" && { echo "compose: $id is already on the trunk" >&2; exit 1; }
                  git merge -q --no-ff --no-commit --no-edit "$sha" || { echo "compose: $id conflicts with the trunk" >&2; exit 1; }
                  tree=$(git write-tree)
                  export GIT_AUTHOR_NAME="$(git log -1 --format=%an "$sha")" GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$sha")"
                  export GIT_AUTHOR_DATE="$(git log -1 --format=%aD "$sha")" GIT_COMMITTER_DATE="$(git log -1 --format=%aD "$sha")"
                  { git log -1 --format=%B "$sha" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; printf '\noriginal: %s\n' "$sha"; } > ../message
                  head=$(git commit-tree "$tree" -p "$head" -F ../message)
                  git reset -q --hard "$head"
                done
                [ "$head" != "$base" ] || { echo "compose: no entries" >&2; exit 1; }
                git archive "$head" | tar -x -C "$out"
                {
                  echo "base=$base"
                  echo "head=$head"
                  echo "tree=$(git rev-parse "$head^{tree}")"
                  echo "entries=$entries"
                  echo "trunk=$trunk"
                } > "$manifest/manifest.env"
                printf '{"base":"%s","head":"%s","tree":"%s","entries":"%s","trunk":"%s","committer":"landing-queue <landing-queue@jetbridge>"}\n' \
                  "$base" "$head" "$(git rev-parse "$head^{tree}")" "$entries" "$trunk" > "$manifest/manifest.json"
                echo "compose: candidate $head on $trunk at $base"
              - compose
              - ((repository))
              - ((trunk))
              - ((entries))
      - task: manifest
        timeout: 2m
        task_id: 89d8a769-a75e-4c5a-bd6a-933aa6b38a7f
        run_result:
          name: manifest
          output: manifest
        config:
          platform: linux
          rootfs_uri: docker:///((landing_image))
          inputs:
            - name: manifest
          outputs:
            - name: manifest
          run:
            path: /bin/sh
            args:
              - -ec
              - cat manifest/manifest.env
