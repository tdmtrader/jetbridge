# The landing queue's compose template (ADR-0011). Install with
# fly set-pipeline -p landing-compose -c deploy/landing-compose-template.yml
# -v landing_image=<image with git>. The landing queue component admits a Run
# of it per candidate with the repository, trunk and entries as params.
#
# The queue never squashes: every commit of an entry lands as its own commit.
# An entry's commits are `git rev-list --reverse <base>..<sha>`, less any an
# earlier entry of the same candidate already carries. compose fetches the
# trunk and each entry's submit ref, refuses an entry with no commits (already
# on the trunk) or with a merge commit, and records each commit's sha, author,
# email, date and message under manifest/entries/<id>/commits/<NNNN>/, with
# their replay order in manifest/entries/<id>/order. It replays each commit on
# the trunk's head by the recipe both templates share: the commit's own change
# (cherry-pick, three-way against its parent), its author and message kept,
# committer fixed, both dates the author's, and an original: <sha> trailer. A
# commit that conflicts fails the entry, naming it. compose publishes one
# result, `composition`: the tree under candidate/ and the facts the land step
# needs under manifest/.
template: true
params:
  - name: repository
    type: string
    required: true
  - name: trunk
    type: string
    required: true
  - name: entries
    type: string
    required: true
jobs:
  - name: compose
    plan:
      - task: compose
        timeout: 10m
        task_id: 9eba7574-fde3-4527-b99c-ee265b8673eb
        run_result:
          name: composition
          output: composition
        config:
          platform: linux
          rootfs_uri: docker:///((landing_image))
          outputs:
            - name: composition
          run:
            path: /bin/sh
            args:
              - -eu
              - -c
              - |
                # compose: rebuild the entries on the trunk's head.
                # $1 repository, $2 trunk, $3 entries (id=sha, comma separated)
                repo=$1 trunk=$2 entries=$3
                out=$PWD/composition/candidate manifest=$PWD/composition/manifest
                mkdir -p "$out" "$manifest"
                export GIT_COMMITTER_NAME=landing-queue GIT_COMMITTER_EMAIL=landing-queue@jetbridge
                export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
                git init -q work && cd work
                git fetch -q --no-tags -- "$repo" "refs/heads/$trunk"
                base=$(git rev-parse FETCH_HEAD)
                git checkout -q -b candidate "$base"
                head=$base seen=$base
                for entry in $(printf '%s' "$entries" | tr ',' ' '); do
                  id=${entry%%=*} sha=${entry#*=}
                  git fetch -q --no-tags -- "$repo" "refs/queue/submit/$id"
                  [ "$(git rev-parse FETCH_HEAD)" = "$sha" ] || { echo "compose: submit ref $id is not at $sha" >&2; exit 1; }
                  # The entry's commits: reachable from its sha, not from the base or an earlier entry.
                  commits=$(git rev-list --reverse "$sha" --not $seen)
                  [ -n "$commits" ] || { echo "compose: $id is already on the trunk" >&2; exit 1; }
                  merge=$(git rev-list --reverse --merges "$sha" --not $seen | head -1)
                  [ -z "$merge" ] || { echo "compose: entry $id contains merge commit $merge; rebase it onto the trunk before submitting" >&2; exit 1; }
                  facts=$manifest/entries/$id
                  i=0
                  for c in $commits; do
                    i=$((i + 1)) && n=$(printf '%04d' "$i") && commit=$facts/commits/$n
                    mkdir -p "$commit"
                    echo "$c" > "$commit/sha"
                    git log -1 --format=%an "$c" > "$commit/author"
                    git log -1 --format=%ae "$c" > "$commit/email"
                    git log -1 --format=%aD "$c" > "$commit/date"
                    { git log -1 --format=%B "$c" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; printf '\noriginal: %s\n' "$c"; } > "$commit/message"
                    echo "$n" >> "$facts/order"
                  done
                  # recipe-begin: one entry's commits onto head in replay order, byte-identical in both templates
                  for n in $(cat "$facts/order"); do
                    commit=$facts/commits/$n original=$(cat "$facts/commits/$n/sha")
                    git cherry-pick --no-commit "$original" || { echo "rebuild: $id commit $original conflicts with the trunk" >&2; exit 1; }
                    tree=$(git write-tree)
                    head=$(GIT_AUTHOR_NAME="$(cat "$commit/author")" GIT_AUTHOR_EMAIL="$(cat "$commit/email")" GIT_AUTHOR_DATE="$(cat "$commit/date")" GIT_COMMITTER_DATE="$(cat "$commit/date")" git commit-tree "$tree" -p "$head" -F "$commit/message")
                    git reset -q --hard "$head"
                  done
                  # recipe-end
                  seen="$seen $sha"
                done
                [ "$head" != "$base" ] || { echo "compose: no entries" >&2; exit 1; }
                git archive "$head" | tar -x -C "$out"
                tree=$(git rev-parse "$head^{tree}")
                {
                  echo "base=$base"
                  echo "head=$head"
                  echo "tree=$tree"
                  echo "entries=$entries"
                } > "$manifest/manifest.env"
                printf '{"base":"%s","head":"%s","tree":"%s","entries":"%s","committer":"landing-queue <landing-queue@jetbridge>"}\n' \
                  "$base" "$head" "$tree" "$entries" > "$manifest/manifest.json"
                echo "compose: candidate $head on $trunk at $base"
              - compose
              - ((repository))
              - ((trunk))
              - ((entries))
