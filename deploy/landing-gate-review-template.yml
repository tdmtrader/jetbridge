# The landing queue's review gate (ADR-0011): the review worker reviews the
# change a candidate introduces, base to candidate, and the gate fails on any
# finding of severity high or blocker. Install with
#
#   fly -t <target> set-pipeline -p landing-gate-review -c deploy/landing-gate-review-template.yml \
#     -v change_image=registry.home/concourse-test-runner:v12 \
#     -v review_worker_image=<registry>/jb-review-worker@sha256:<digest> \
#     -v review_model=<Codex model, for example gpt-5.5>
#
# Install vars:
#   change_image         an image with /bin/sh, git, tar and a Go toolchain that
#                        can build this repository (the pipeline's test runner
#                        is one). It builds the review bundle.
#   review_worker_image  deploy/Dockerfile.review-worker built from a source
#                        that has `jb-review-worker --auth-file` and
#                        `jb-review-worker verdict`; pin it by digest.
#   review_model         the Codex model the review runs on.
# ((codex-auth)) is NOT an install var: leave it off set-pipeline, and the
# team's credential manager resolves it when the review task starts. On the
# Kubernetes credential manager it is the secret concourse-main/codex-auth,
# key `value`, holding a Codex auth.json. The ATC fills ((run_id)) per Run.
#
# Destroying this pipeline (destroy-pipeline --purge-run-history) never frees
# its task ids: a destroyed template keeps them, so reinstalling it needs new
# ones (any canonical UUIDs, distinct from every other template's).
#
# The queue admits a Run of it per candidate, binding the compose Run's
# composition as the `composition` run input and the queue's repository,
# trunk and entries as params.
#
# change. The worker reads a capture bundle (review-input/v1: base and head
# trees, the diff, a manifest), not a tree, and the compose image has git but
# not the Go capture code, so the bundle is built here rather than by compose.
# The task fetches the trunk to get the base the manifest names, proves the
# candidate is the tree compose composed (every file and mode, by git's tree
# hash), commits that tree on the base as a stand-in head ("landing candidate
# <head>"; the tree is compose's exactly, the commit's identity is fixed), and
# runs `jb review capture` from the base's own source -- the trunk's reviewed
# code, never the change under review -- over base..head. The review sees the
# whole change the entry introduces, as one diff, whatever its commit count.
#
# review. The credential reaches only this task, as a param, and is written to
# an owner-only file on /dev/shm (a tmpfs) that never leaves the container;
# the worker removes it the moment it holds it open, the trap removes it if the
# worker never ran, and nothing echoes it (no `set -x`). Codex may refresh its
# tokens during a review and cannot write them back to the secret, so the
# stored copy goes stale as the subscription's refresh token rotates. When
# reviews start failing to authenticate, refresh the secret from a machine
# that is logged in, from its ~/.codex/auth.json.
#
# verdict. The review task publishes the worker's review.json and review.md
# as its `review` result and prints review.md to the build log; it decides
# nothing. A Run result producer's outputs are never build artifacts, so the
# decision is a task of its own: verdict takes `review` as an in-Run result
# input, runs `jb-review-worker verdict --block-at high`, and writes
# gate/passed to its own output, which the last step loads. The Run's status
# carries the answer to the queue:
#
#   passed      no finding at or above high in a complete review. verdict
#               writes gate/passed, the last step loads it and the Run
#               succeeds, publishing the report as its `review` result.
#   failed      a finding of severity high or blocker, complete review or
#               not, each listed by id, severity and title. verdict fails,
#               so the Run fails and the queue ejects the entry. This is the
#               only way the review gate rejects a candidate.
#   no verdict  the review could not run (an empty or stale codex-auth
#               secret, a worker or model error, a bundle change could not
#               build) or did not complete (an incomplete review with nothing
#               at or above high). Each task says why and exits 0, verdict
#               writes no gate/passed, and the last step errors the Run. The
#               queue counts an errored Run as no verdict: it retries the gate
#               once, then pauses until `fly resume-landing-queue`.
#
# A failed or errored Run publishes no result, so the report of a review that
# was not passed is in its Run's build log, which the entry's eject or pause
# reason names.
#
# Budgets: change 20m, review 35m (the worker's own session cap is 30m),
# verdict 5m. Give the gate a wait above their sum, for example `wait: 65m`.
template: true
params:
  - name: repository
    type: string
    required: true
  - name: trunk
    type: string
    required: true
  - name: entries
    type: string
    required: true
jobs:
  - name: review
    plan:
      - task: change
        timeout: 20m
        task_id: ff7c9f67-69a5-48b6-a697-46dc4390b59a
        run_inputs:
          - name: composition
            input: composition
        run_result:
          name: change
          output: change
        config:
          platform: linux
          rootfs_uri: docker:///((change_image))
          inputs:
            - name: composition
          outputs:
            - name: change
          run:
            path: /bin/sh
            args:
              - -eu
              - -c
              - |
                # change: the review bundle of base..candidate.
                # $1 repository, $2 trunk; input composition/: manifest/ and candidate/
                # A bundle that cannot be built is no verdict, not a failed review:
                # the task says why and exits 0 with no change/bundle, so the review
                # task has nothing to review and the Run errors at its verdict step.
                set +e
                (
                set -e
                repo=$1 trunk=$2
                top=$PWD candidate=$PWD/composition/candidate
                val() { grep "^$1=" composition/manifest/manifest.env 2>/dev/null | head -1 | cut -d= -f2-; }
                base=$(val base) head=$(val head) tree=$(val tree)
                [ -n "$base" ] && [ -n "$head" ] && [ -n "$tree" ] || { echo "change: the composition's manifest.env names no base, head or tree" >&2; exit 1; }
                [ -d "$candidate" ] || { echo "change: the composition has no candidate/" >&2; exit 1; }
                export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
                export GIT_AUTHOR_NAME=landing-queue GIT_AUTHOR_EMAIL=landing-queue@jetbridge GIT_COMMITTER_NAME=landing-queue GIT_COMMITTER_EMAIL=landing-queue@jetbridge
                export GIT_AUTHOR_DATE=2000-01-01T00:00:00+0000 GIT_COMMITTER_DATE=2000-01-01T00:00:00+0000
                git init -q "$top/work"
                git -C "$top/work" fetch -q --no-tags -- "$repo" "refs/heads/$trunk"
                git -C "$top/work" cat-file -e "$base^{commit}" 2>/dev/null || git -C "$top/work" fetch -q --no-tags -- "$repo" "$base"
                # Every file, ignored ones too, with its mode, into a scratch index.
                got=$(cd "$candidate" && GIT_DIR=$top/work/.git GIT_INDEX_FILE=$top/candidate.index git add -A -f . && GIT_DIR=$top/work/.git GIT_INDEX_FILE=$top/candidate.index git write-tree)
                [ "$got" = "$tree" ] || { echo "change: the candidate's tree is $got, but compose composed $tree; not reviewing it" >&2; exit 1; }
                change=$(printf 'landing candidate %s\n\nThe tree compose composed on %s, as one commit.\n' "$head" "$base" | git -C "$top/work" commit-tree "$tree" -p "$base")
                git -C "$top/work" checkout -q "$change"
                # jb from the base's own source: the trunk's reviewed code, never the change's.
                mkdir "$top/tools"
                git -C "$top/work" archive "$base" | tar -x -C "$top/tools"
                (cd "$top/tools" && go build -o "$top/jb" ./cmd/jb)
                "$top/jb" review capture --repo "$top/work" --base "$base" --head "$change" --output "$top/change/bundle"
                echo "change: bundle of $base..$change, the candidate $head"
                )
                status=$?
                set -e
                [ "$status" -eq 0 ] || echo "change: no verdict: the review bundle was not built (exit $status)" >&2
              - change
              - ((repository))
              - ((trunk))
      - task: review
        timeout: 35m
        task_id: c46482ec-61fd-4641-9017-7577d8ee39fe
        run_inputs:
          - name: change
            input: change
            result: change
        run_result:
          name: review
          output: result
        params:
          CODEX_AUTH: ((codex-auth))
        config:
          platform: linux
          rootfs_uri: docker:///((review_worker_image))
          inputs:
            - name: change
          outputs:
            - name: result
          run:
            path: /bin/sh
            args:
              - -eu
              - -c
              - |
                # review: the worker on the bundle; the report is the result.
                # $1 model, $2 --run-id=<Run ID>; CODEX_AUTH the owner's Codex auth.json
                # It decides nothing: a review that cannot run says why and exits 0
                # with no report, which verdict counts as no verdict.
                umask 077
                auth=/dev/shm/jb-review-auth.json
                trap 'rm -f "$auth"' EXIT
                set +e
                (
                set -e
                [ -n "${CODEX_AUTH:-}" ] || { echo "review: no verdict: the codex-auth credential is empty; set the codex-auth secret for this team" >&2; exit 0; }
                [ -d change/bundle ] || { echo "review: no verdict: change built no review bundle" >&2; exit 0; }
                printf '%s' "$CODEX_AUTH" > "$auth"
                unset CODEX_AUTH
                mkdir -p /dev/shm/jb-review
                /usr/local/bin/jb-review-worker \
                  --input change/bundle --output result/report \
                  --runtime-dir /dev/shm/jb-review \
                  --auth-file "$auth" \
                  --model "$1" "$2"
                mv result/report/review.json result/report/review.md result/
                rmdir result/report
                cat result/review.md
                )
                status=$?
                set -e
                [ "$status" -eq 0 ] || echo "review: no verdict: the review did not run to its report (exit $status)" >&2
              - review
              - ((review_model))
              - --run-id=((run_id))
      - task: verdict
        timeout: 5m
        task_id: 01f80e99-7605-40e0-8f84-9feb26d10c32
        run_inputs:
          - name: review
            input: review
            result: review
        config:
          platform: linux
          rootfs_uri: docker:///((review_worker_image))
          inputs:
            - name: review
          outputs:
            - name: gate
          run:
            path: /bin/sh
            args:
              - -eu
              - -c
              - |
                # verdict: only a finding at or above high fails this task, which
                # rejects the candidate. A passed review writes gate/passed; anything
                # else is no verdict, and without gate/passed the last step errors.
                [ -f review/review.json ] || { echo "review: no verdict: the review published no report" >&2; exit 0; }
                status=0
                /usr/local/bin/jb-review-worker verdict --report review/review.json --block-at high || status=$?
                case $status in
                  0) : > gate/passed ;;
                  1) exit 1 ;;
                  *) echo "review: no verdict: verdict exited $status; the Run errors at its last step" >&2 ;;
                esac
              - verdict
      # The review's verdict: present only when the review passed. Its absence
      # (no verdict) errors the Run here, which the queue counts as no verdict.
      - load_var: review-passed
        file: gate/passed
