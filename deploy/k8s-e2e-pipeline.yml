# K8s E2E Pipeline — KinD-based integration and behavioral tests
#
# These tests create ephemeral KinD clusters inside the task pod,
# deploy Concourse via Helm, and run the full topgun test suites.
# Requires privileged tasks for Docker-in-Docker.

resources:
- name: trigger
  type: time
  source:
    interval: 24h
# Source under test, fetched fresh each run. The kind-runner image provides only
# the toolchain (go, docker, kubectl, helm); the source is NOT taken from the
# image's baked /src — that goes stale when the worker serves a cached image tag.
- name: repo
  type: git
  icon: git
  source:
    uri: https://github.com/tdmtrader/jetbridge.git
    branch: core

jobs:
- name: build-kind-runner
  serial: true
  plan:
  - get: trigger
    trigger: true
  - get: repo
    trigger: true
  - task: build-kind-runner-image
    timeout: 45m
    privileged: true
    config:
      platform: linux
      rootfs_uri: docker:///registry.home/concourse-test-runner:v4
      run:
        path: sh
        args:
        - -exc
        - |
          REGISTRY="registry-docker-registry.cicd.svc.cluster.local:5000"
          IMAGE_TAG="v35"
          IMAGE="${REGISTRY}/concourse-kind-runner:${IMAGE_TAG}"
          BUILDER_POD="kind-runner-builder-$$"

          cleanup_builder() { kubectl delete pod -n cicd ${BUILDER_POD} --grace-period=0 --force 2>/dev/null || true; }
          trap cleanup_builder EXIT
          kubectl delete pod -n cicd -l app=kind-runner-builder --grace-period=0 --force 2>/dev/null || true

          echo "=== Creating DinD builder pod ==="
          cat <<PODEOF | kubectl apply -n cicd -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${BUILDER_POD}
            namespace: cicd
            labels:
              app: kind-runner-builder
          spec:
            containers:
            - name: dind
              image: docker:26-dind
              securityContext:
                privileged: true
              env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
              command: ["dockerd", "--host=unix:///var/run/docker.sock", "--mtu=1450", "--insecure-registry=${REGISTRY}", "--insecure-registry=registry.home"]
              resources:
                requests:
                  memory: "4Gi"
                  cpu: "2"
          PODEOF

          echo "Waiting for builder pod..."
          kubectl wait --for=condition=ready pod/${BUILDER_POD} -n cicd --timeout=180s

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done

          echo "=== Downloading helm binary (get.helm.sh reachable from task pod) ==="
          curl --retry 3 -fsSL https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /tmp linux-amd64/helm

          echo "=== Cloning fresh source ==="
          git clone --depth 1 --branch core https://github.com/tdmtrader/jetbridge.git /tmp/fresh-src

          echo "=== Verifying clone has critical directories ==="
          ls -d /tmp/fresh-src/cmd/oom-trigger /tmp/fresh-src/cmd/concourse /tmp/fresh-src/cmd/artifact-daemon
          echo "Clone OK — all critical dirs present"

          echo "=== Copying source + Dockerfile + helm to builder ==="
          kubectl exec -n cicd ${BUILDER_POD} -- mkdir -p /build
          cd /tmp/fresh-src
          cp /tmp/helm ./helm
          cp deploy/Dockerfile.kind-runner Dockerfile
          tar cf - --exclude=.git . | kubectl exec -i -n cicd ${BUILDER_POD} -- sh -c 'tar xf - -C /build'

          echo "=== Verifying build context on builder pod ==="
          kubectl exec -n cicd ${BUILDER_POD} -- ls -d /build/cmd/oom-trigger /build/cmd/concourse /build/cmd/artifact-daemon
          echo "Build context OK"

          echo "=== Building kind-runner image (no cache) ==="
          kubectl exec -n cicd ${BUILDER_POD} -- docker build --no-cache -t ${IMAGE} -f /build/Dockerfile /build

          echo "=== Pushing to in-cluster registry (with retry) ==="
          for attempt in 1 2 3 4 5; do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker push ${IMAGE}; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
            if [ "$attempt" -eq 5 ]; then
              echo "All push attempts failed"
              exit 1
            fi
          done

          echo "=== Also pushing to registry.home (used by rootfs_uri) ==="
          EXTERNAL_IMAGE="registry.home/concourse-kind-runner:${IMAGE_TAG}"
          kubectl exec -n cicd ${BUILDER_POD} -- docker tag ${IMAGE} ${EXTERNAL_IMAGE}
          for attempt in 1 2 3 4 5; do
            if kubectl exec -n cicd ${BUILDER_POD} -- docker push ${EXTERNAL_IMAGE}; then
              echo "Push to registry.home succeeded on attempt $attempt"
              break
            fi
            echo "Push to registry.home failed (attempt $attempt/5), retrying in 10s..."
            sleep 10
            if [ "$attempt" -eq 5 ]; then
              echo "Push to registry.home failed — continuing (in-cluster push succeeded)"
              break
            fi
          done

          echo "=== kind-runner image built and pushed ==="

# The Hangar generated-Pod contract lists the cluster's Nodes and relabels one
# (concourse.dev/artifact-cache, concourse.dev/hangar-v1) so the strict Pod it
# generates has somewhere to schedule. That is cluster-scope mutation, which is
# why live_scope_guard_test.go bars it from the `live` tier -- that tier runs
# against the deployed cluster under a namespaced ServiceAccount -- and why it
# carries its own `hangar_live` tag. This job is its CI home: a K3s cluster
# created here, reached through a cluster-admin kubeconfig, and thrown away with
# the task.
#
# It needs no Hangar store and no deployed artifact daemon, so there is no
# artifactDaemon.hangar.* chart value to set here, no capability-key Secret to
# mint and nothing to point at GCS. The contract plants its own daemon stand-in
# -- a hostNetwork BusyBox Pod that writes the strict tree onto the node and
# answers POST /hangar/v1/materializations on 31780 with an exact empty 204 --
# and signs its own materialization grants with a key it holds in process. What
# is under test is the Pod the runtime GENERATES and the tree the init container
# will accept, not the store behind the daemon.
- name: hangar-generated-pod-contract
  serial: true
  serial_groups: [k8s-tests]
  plan:
  - get: trigger
    trigger: true
    passed: [build-kind-runner]
  - get: repo
    passed: [build-kind-runner]
  - task: hangar-generated-pod-contract
    privileged: true
    timeout: 40m
    attempts: 2
    config:
      platform: linux
      inputs:
      - name: repo
      rootfs_uri: docker:///registry.home/concourse-kind-runner:v35
      run:
        path: sh
        args:
        - -exc
        - |
          # Build from the freshly-fetched git resource, NOT the image's baked
          # /src (which goes stale behind a cached image tag).
          cd repo
          K3S_IMAGE="rancher/k3s:v1.31.6-k3s1"
          CLUSTER="hangar-contract-k3s"
          KUBECONFIG_PATH=/tmp/hangar-contract-kubeconfig

          echo "=== Pre-compiling the contract before Docker (avoids CPU contention with containerd) ==="
          go mod download
          go test -c -tags hangar_live -o /dev/null ./atc/worker/jetbridge/

          echo "=== Starting Docker daemon (DinD) ==="
          killall -9 dockerd containerd 2>/dev/null || true
          sleep 1
          rm -rf /var/run/docker.pid /var/run/docker /var/run/containerd /run/containerd 2>/dev/null || true
          mkdir -p /var/lib/docker /run/containerd
          mount -t tmpfs -o size=8G tmpfs /var/lib/docker 2>/dev/null || true
          # --dns=8.8.8.8 ensures the nested K3s container can resolve external
          # hostnames for pulling its system images.
          /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --mtu=1450 \
                  --dns=8.8.8.8 \
                  --log-level=warn &
          DOCKERD_PID=$!

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              break
            fi
            sleep 2
          done
          docker info >/dev/null

          echo "=== Pulling images ==="
          docker pull ${K3S_IMAGE}
          docker pull busybox:latest

          echo "=== Creating the disposable K3s cluster ==="
          # Same container shape testcontainers' k3s module uses (privileged,
          # host cgroup namespace, tmpfs /run and /var/run), which is what the
          # rest of this tier already runs on. The API server is published on
          # loopback only: the kubeconfig K3s writes already names
          # https://127.0.0.1:6443, so it needs no rewriting.
          docker rm -f ${CLUSTER} >/dev/null 2>&1 || true
          docker run -d --name ${CLUSTER} \
            --privileged --cgroupns=host \
            --tmpfs /run --tmpfs /var/run \
            -e K3S_KUBECONFIG_MODE=644 \
            -p 127.0.0.1:6443:6443 \
            ${K3S_IMAGE} \
            server --disable=traefik --disable=metrics-server --tls-san=127.0.0.1

          echo "Waiting for the node controller to sync..."
          READY=0
          for i in $(seq 1 90); do
            if docker logs ${CLUSTER} 2>&1 | grep -q "Node controller sync successful"; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "${READY}" -ne 1 ]; then
            echo "K3s never reported a synced node controller:"
            docker logs ${CLUSTER} 2>&1 | tail -80
            docker rm -f ${CLUSTER} >/dev/null 2>&1 || true
            kill $DOCKERD_PID 2>/dev/null || true
            exit 1
          fi

          docker cp ${CLUSTER}:/etc/rancher/k3s/k3s.yaml ${KUBECONFIG_PATH}
          chmod 600 ${KUBECONFIG_PATH}
          kubectl --kubeconfig ${KUBECONFIG_PATH} get nodes -o wide

          echo "=== Loading busybox into the cluster's containerd ==="
          # Both Pods the contract creates run busybox:latest, and the
          # generated Pod's containers are PullIfNotPresent. Importing the
          # image the task already pulled keeps the contract off the public
          # registry once the cluster is up.
          docker save busybox:latest -o /tmp/busybox.tar
          docker cp /tmp/busybox.tar ${CLUSTER}:/tmp/busybox.tar
          docker exec ${CLUSTER} ctr -n=k8s.io images import --all-platforms /tmp/busybox.tar

          # The contract reads exactly two variables: KUBECONFIG (it must be a
          # single file, not a list) and K8S_TEST_NAMESPACE. It does NOT read
          # the ARTIFACT_DAEMON_* trio the live job exports -- it plants its own
          # host root under /tmp and pins the daemon port to 31780 itself, so
          # exporting those here would describe a daemon that is not involved.
          export KUBECONFIG=${KUBECONFIG_PATH}
          export K8S_TEST_NAMESPACE=default
          echo "KUBECONFIG=$KUBECONFIG K8S_TEST_NAMESPACE=$K8S_TEST_NAMESPACE"

          echo "=== Running the Hangar generated-Pod contract ==="
          STATUS=0
          go test -tags hangar_live -v -count=1 -timeout 5m \
            -run '^TestLiveHangarGeneratedPodMaterializesStrictTree$' \
            ./atc/worker/jetbridge/... || STATUS=1

          if [ "${STATUS}" -ne 0 ]; then
            echo "=== CONTRACT FAILED -- dumping diagnostics ==="
            kubectl --kubeconfig ${KUBECONFIG_PATH} get pods -A -o wide || true
            kubectl --kubeconfig ${KUBECONFIG_PATH} get nodes --show-labels || true
            kubectl --kubeconfig ${KUBECONFIG_PATH} get events -A --sort-by=.lastTimestamp | tail -40 || true
            docker logs ${CLUSTER} 2>&1 | tail -80 || true
            echo "--- End diagnostics ---"
          else
            echo "=== Hangar generated-Pod contract passed on K3s ==="
          fi

          docker rm -f ${CLUSTER} >/dev/null 2>&1 || true
          kill $DOCKERD_PID 2>/dev/null || true
          exit "${STATUS}"

- name: k8s-integration-tests
  serial: true
  serial_groups: [k8s-tests]
  plan:
  # Gated on the Hangar contract rather than straight off the image build. That
  # job stands up its own K3s cluster and finishes in about three minutes, so
  # chaining keeps two DinD workloads off the same worker and puts the cheap
  # signal ahead of the hour-long one.
  - get: trigger
    trigger: true
    passed: [hangar-generated-pod-contract]
  - get: repo
    passed: [hangar-generated-pod-contract]
  - task: k8s-integration
    privileged: true
    timeout: 60m
    attempts: 2
    config:
      platform: linux
      inputs:
      - name: repo
      rootfs_uri: docker:///registry.home/concourse-kind-runner:v35
      run:
        path: sh
        args:
        - -exc
        - |
          # Build from the freshly-fetched git resource, NOT the image's baked
          # /src (which goes stale behind a cached image tag). repo is a real
          # checkout, so tests resolve the repo root via git rev-parse directly.
          cd repo

          echo "=== Pre-compiling everything before Docker (avoids CPU contention with containerd) ==="
          GOOS=linux GOARCH=amd64 go build -o concourse-linux-amd64 ./cmd/concourse
          GOOS=linux GOARCH=amd64 go build -o artifact-daemon-linux-amd64 ./cmd/artifact-daemon
          go build -o /tmp/fly ./fly
          go test -c -o /tmp/integration.test ./topgun/k8s/integration/
          go mod download

          echo "=== Starting Docker daemon (DinD) ==="
          # Thorough cleanup of stale Docker/containerd state from previous runs.
          killall -9 dockerd containerd 2>/dev/null || true
          sleep 1
          rm -rf /var/run/docker.pid /var/run/docker /var/run/containerd /run/containerd 2>/dev/null || true
          mkdir -p /var/lib/docker /run/containerd
          mount -t tmpfs -o size=8G tmpfs /var/lib/docker 2>/dev/null || true
          # --dns=8.8.8.8 ensures nested containers (K3s) can resolve
          # external hostnames for pulling system images (CoreDNS, etc.)
          /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --mtu=1450 \
                  --dns=8.8.8.8 \
                  --log-level=warn &
          DOCKERD_PID=$!

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              docker info | grep "Storage Driver"
              break
            fi
            sleep 2
          done

          echo "=== Building concourse Docker image ==="
          # Stage only the needed binaries to avoid sending the full repo (~315MB)
          # as Docker build context — that causes OOM/eviction in constrained pods.
          mkdir -p /tmp/docker-build
          cp concourse-linux-amd64 artifact-daemon-linux-amd64 /tmp/docker-build/
          cat <<'DOCKERFILE' > /tmp/docker-build/Dockerfile
          FROM debian:bookworm-slim
          RUN apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends ca-certificates dumb-init && rm -rf /var/lib/apt/lists/*
          COPY concourse-linux-amd64 /usr/local/concourse/bin/concourse
          COPY artifact-daemon-linux-amd64 /usr/local/concourse/bin/artifact-daemon
          RUN chmod +x /usr/local/concourse/bin/concourse /usr/local/concourse/bin/artifact-daemon
          ENV PATH="/usr/local/concourse/bin:${PATH}"
          ENTRYPOINT ["dumb-init", "concourse"]
          DOCKERFILE
          docker build -t concourse-local:latest /tmp/docker-build/
          echo "=== Image built ==="

          echo "=== Pre-pulling K3s image (after Docker build to avoid layer corruption from shim disconnects) ==="
          docker pull rancher/k3s:v1.31.6-k3s1

          echo "=== Running K8s integration tests (pre-compiled, KinD cluster) ==="
          FLY_PATH=/tmp/fly /tmp/integration.test -test.v -test.timeout 30m -test.count 1 || {
            echo "=== TEST FAILED — dumping diagnostics ==="
            echo "--- Docker containers ---"
            docker ps -a 2>/dev/null || true
            echo "--- kubeadm.conf from KinD node ---"
            docker cp concourse-integration-control-plane:/kind/kubeadm.conf /tmp/kubeadm-debug.conf 2>&1 && cat /tmp/kubeadm-debug.conf || echo "(container not available)"
            echo "--- End diagnostics ---"
            kill $DOCKERD_PID 2>/dev/null || true
            exit 1
          }
          echo "=== K8s integration tests passed (plain HTTP) ==="

          echo "=== Running artifact daemon mTLS verification (ARTIFACT_DAEMON_TLS=true) ==="
          # Redeploys the suite with the daemon TLS-hardened (chart auto-generates
          # the CA + server/client certs; web pod + init containers wire HTTPS
          # automatically) and re-runs the Artifact* specs — daemon mTLS
          # enforcement, artifact passing (stream-in/out), and read-after-reap
          # (peer fetch) — so the mTLS data path is exercised end-to-end.
          ARTIFACT_DAEMON_TLS=true FLY_PATH=/tmp/fly /tmp/integration.test \
            -test.v -test.timeout 25m -test.count 1 -ginkgo.focus 'Artifact' || {
            echo "=== mTLS VERIFICATION FAILED — dumping diagnostics ==="
            docker ps -a 2>/dev/null || true
            kill $DOCKERD_PID 2>/dev/null || true
            exit 1
          }
          echo "=== Artifact daemon mTLS verification passed ==="

          kill $DOCKERD_PID 2>/dev/null || true

- name: k8s-behavioral-tests
  serial: true
  plan:
  - get: trigger
    trigger: true
    passed: [k8s-integration-tests]
  - get: repo
    passed: [k8s-integration-tests]
  - task: k8s-behavioral
    privileged: true
    timeout: 4h
    attempts: 2
    config:
      platform: linux
      inputs:
      - name: repo
      rootfs_uri: docker:///registry.home/concourse-kind-runner:v35
      run:
        path: sh
        args:
        - -exc
        - |
          # Build from the freshly-fetched git resource, NOT the image's baked
          # /src (which goes stale behind a cached image tag). repo is a real
          # checkout, so tests resolve the repo root via git rev-parse directly.
          cd repo

          echo "=== Pre-compiling everything before Docker (avoids CPU contention with containerd) ==="
          GOOS=linux GOARCH=amd64 go build -o concourse-linux-amd64 ./cmd/concourse
          GOOS=linux GOARCH=amd64 go build -o artifact-daemon-linux-amd64 ./cmd/artifact-daemon
          go build -o /tmp/fly ./fly
          go test -c -o /tmp/behavioral.test ./topgun/k8s_behavioral/

          echo "=== Starting Docker daemon (DinD) ==="
          # Thorough cleanup of stale Docker/containerd state from previous runs.
          killall -9 dockerd containerd 2>/dev/null || true
          sleep 1
          rm -rf /var/run/docker.pid /var/run/docker /var/run/containerd /run/containerd 2>/dev/null || true
          mkdir -p /var/lib/docker /run/containerd
          mount -t tmpfs -o size=8G tmpfs /var/lib/docker 2>/dev/null || true
          # --dns=8.8.8.8 ensures nested containers (K3s) can resolve
          # external hostnames for pulling system images (CoreDNS, etc.)
          /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --mtu=1450 \
                  --dns=8.8.8.8 \
                  --log-level=warn &
          DOCKERD_PID=$!

          echo "Waiting for Docker daemon..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              docker info | grep "Storage Driver"
              break
            fi
            sleep 2
          done

          echo "=== Building concourse Docker image ==="
          # Stage only the needed binaries to avoid sending the full repo (~315MB)
          # as Docker build context — that causes OOM/eviction in constrained pods.
          mkdir -p /tmp/docker-build
          cp concourse-linux-amd64 artifact-daemon-linux-amd64 /tmp/docker-build/
          cat <<'DOCKERFILE' > /tmp/docker-build/Dockerfile
          FROM debian:bookworm-slim
          RUN apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends ca-certificates dumb-init && rm -rf /var/lib/apt/lists/*
          COPY concourse-linux-amd64 /usr/local/concourse/bin/concourse
          COPY artifact-daemon-linux-amd64 /usr/local/concourse/bin/artifact-daemon
          RUN chmod +x /usr/local/concourse/bin/concourse /usr/local/concourse/bin/artifact-daemon
          ENV PATH="/usr/local/concourse/bin:${PATH}"
          ENTRYPOINT ["dumb-init", "concourse"]
          DOCKERFILE
          docker build -t concourse-local:latest /tmp/docker-build/
          echo "=== Image built ==="

          echo "=== Building oom-trigger image ==="
          # Inline the oom-trigger source — the kind-runner image from
          # registry.home may not include cmd/oom-trigger due to registry
          # sync issues between in-cluster and external registries.
          mkdir -p /tmp/oom-src
          cat <<'OOMSRC' > /tmp/oom-src/main.go
          package main
          func main() {
            var s [][]byte
            for { s = append(s, make([]byte, 10<<20)) }
          }
          OOMSRC
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/oom-trigger /tmp/oom-src/main.go
          printf 'FROM scratch\nCOPY oom-trigger /oom-trigger\nENTRYPOINT ["/oom-trigger"]\n' > /tmp/Dockerfile.oom
          docker build -f /tmp/Dockerfile.oom -t oom-trigger:latest /tmp/
          echo "=== oom-trigger image built ==="

          echo "=== Pre-pulling K3s image (after Docker builds to avoid layer corruption from shim disconnects) ==="
          docker pull rancher/k3s:v1.31.6-k3s1

          echo ""
          echo "=== Running K8s behavioral tests (pre-compiled, 2 parallel KinD clusters) ==="
          echo "This will take 2-3 hours."
          echo ""
          # Run with 1 process — concurrent K3s cluster creation overwhelms
          # Docker's containerd with image layer lock contention in DinD.
          # Single-process mode is slower but reliable.
          FLY_PATH=/tmp/fly ginkgo --procs=${K8S_PROCS:-1} -v --timeout=4h /tmp/behavioral.test
          echo "=== K8s behavioral tests passed ==="

          kill $DOCKERD_PID 2>/dev/null || true
