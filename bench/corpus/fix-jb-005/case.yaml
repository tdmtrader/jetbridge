curation:
  quality: 5
  learnings: >-
    The best fix cases are ones where the naive fix is wrong. Here the symptom
    ("every web restart errors all in-flight builds") points straight at two
    lines of code, and deleting those two lines makes the symptom go away while
    silently reintroducing a production defect (the in-flight check-tracking
    leak) that was fixed three months earlier. That gives the case a real
    discriminator: passing requires reading the history to learn *why* the
    current behavior exists, then finding the narrower predicate. Regression-of-
    a-regression commits are therefore a high-yield mining pattern — grep for
    fixes whose body cites an earlier fix by SHA.
    Second lesson: the trigger and the root cause must be separated by hand.
    The in-tree track spec written *after* this fix opens with a perfectly good
    work-item narrative (the WHY section) and then names the exact files, the
    causing commit and the exact predicate two paragraphs later. Harvesting the
    spec wholesale would have produced a case that grades an agent's ability to
    apply a patch it was handed. Only the pre-investigation half is admissible.
    Third: verify environment claims instead of inheriting them. The curation
    hand-off asserted PostgreSQL was required; running the two packages against
    an unreachable PostgreSQL showed it is not, which upgrades this case from
    "needs a database fixture" to a pure-Go hermetic gate.
    Fourth (fixup 2026-07-25): a repo that writes its history down is a repo
    that partially answers its own benchmark. The archived track records for the
    causing fix are exactly what a good engineer would find, so withholding them
    would test a fake codebase — the honest move is to keep them, price the
    difficulty down, and tell the judge to score causal reasoning rather than
    quotation. Fifth: when a task asks the agent to write tests, a mechanical
    overlay that overwrites those same files silently erases the behavior being
    graded; run and snapshot the submission's suite before overlaying. Sixth:
    "read the history" belongs in the rubric, not in the work item — an
    instruction to investigate converts the discriminator into a checklist.
