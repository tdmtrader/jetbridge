        routed to the judge (ground_truth/rubric.md must-have 3), not scored as
        an automatic fail. Any failure of the job-build assertions is a real
        fail.
    - id: overlay-compile-coupling
      note: >-
        The post-state test files compile against pre-state package internals.
        A submission that renames or restructures symbols those tests touch can
        break the overlay build; treat a compile failure of the overlay as
        judge-adjudicated, not as a behavioral fail.
