curation:
  quality: 5
  learnings: >-
    The first feedback-loop case in the corpus, and it establishes the shape:
    a review that landed as a COMMITTED DOCUMENT, answered by ONE commit that
    appends its own per-finding resolution log to that same document. Both
    halves matter. Because the review is in-tree at the cut, the task input is
    verbatim rather than reconstructed — no scrubbing judgement is needed on
    the trigger at all, which is the opposite of every fix-shaped case. Because
    the response records a per-finding disposition, the ground truth is
    finding-granular instead of diff-granular, which is what makes a judge
    rubric scoreable. Mine for review documents whose answering commit writes a
    resolution table; a review answered by scattered commits, or by a commit
    whose message says "review fixes", backs out into nothing gradeable.
    The property that makes this case worth its size is that the correct
    response is HETEROGENEOUS on purpose. Nine findings want a change to the
    plans' scripts; two (F2, F12) were REFUTED by the review's own verification
    pass and must be answered with prose, because the mechanism each claimed
    does not exist; one (F11) is "partly-confirmed" and still needs the code
    change with only its severity framing walked back. So the severity label
    and the verification paragraph point in opposite directions twice, in
    opposite directions from each other. An agent that keys off "BLOCKER" fixes
    F2's non-existent race; an agent that keys off "partly-confirmed" leaves
    F11's real bug. Neither failure shows up in coverage — only in disposition.
    That is the discriminator the corpus was missing, and it argues for hunting
    specifically for review rounds that ARGUED BACK, not ones where every
    finding was accepted. A review with no refutations makes a much weaker case.
    Two construction lessons. (1) The precision oracle came free here and is
    unusually strong: §6 explicitly defers all of §4's ~20 polish items, and the
    reference leaves six whole plan files untouched — so "what a correct answer
    does NOT touch" is derived from artifacts rather than inferred, which
    review-jb-001 could not do. When a review ranks and defers its own findings,
    the deferral list is the precision oracle; take it. (2) A doc-only case can
    still be mechanically VALIDATED even when it cannot be mechanically GRADED.
    Fourteen textual anchors that are absent at the parent and present at the
    child prove the SHAs and the diff are what the case claims, in a second, on
    a tree that needs no toolchain at all — and the same anchors are useless for
    scoring an agent, because they encode one author's identifiers. Keeping
    those two uses separated (ground_truth_validation vs rubric) is the thing to
    carry forward; the temptation to promote a cheap grep into a grader is
    exactly how a corpus starts rewarding mimicry.
    (3) Added by the 2026-07-25 fixup, and it generalises: when the curator
    writes the rubric and the task in the same sitting, the rubric's axes leak
    into the task as well-meant advice. Three of six axes here had a matching
    bullet in task.md ("read what each finding actually concluded" for
    disposition, "do not widen the blast radius" for restraint, a pointer at the
    review document for record-keeping) — none of which the real trigger (a
    spoken "apply the review") contained. Nothing was factually false and no
    answer was named, so a leakage audit scanning for answers finds nothing; the
    damage is that a judgement axis quietly becomes a compliance axis. Write the
    task from the trigger alone, then diff it against the rubric and delete
    every sentence that exists only because you knew what you were going to
    score. Where a hint must stay because the deliverable genuinely requires it
    (here: the scope boundary and the ask for a per-finding record), annotate
    that point in the rubric as compliance rather than deleting the requirement.
    Residual worry: size. The exposed surface is 2.15 MB of plan markdown across
    18 documents (verified at the pinned ref: 18 files, 2,153,243 bytes) and the
    correct response touches 11 of them. If pilot runs fail
    on budget rather than judgement, the fix is a companion case scoped to one
    wave (F3+F4+F5 are a natural wave-1/2 slice with the same disposition
    trap) — not a looser rubric.
