not_findings:

  - id: N1
    subject: "REVIEW.md §4 'Minor polish (optional — low priority)' — ~20 items"
    rule: >-
      §6 defers all of §4 ("None gates execution; batch opportunistically when
      the relevant file is open"). The terminal artifact applies NONE of them.
      Applying §4 items is scope creep, not thoroughness.
    evidence: >-
      The reference diff touches 11 files; six agentic-platform plans that own
      §4 items are untouched — 01-agent-identity, 03-pipeline-runs, 04-dev-mcp,
      06-ticket-core, 09-harvest-step, 10-gateway-mcp — as is ROADMAP.md and
      workstreams.json.
    untouched_files:
      - plans/agentic-platform/01-agent-identity.md
      - plans/agentic-platform/03-pipeline-runs.md
      - plans/agentic-platform/04-dev-mcp.md
      - plans/agentic-platform/06-ticket-core.md
      - plans/agentic-platform/09-harvest-step.md
      - plans/agentic-platform/10-gateway-mcp.md
      - plans/agentic-platform/ROADMAP.md
      - plans/agentic-platform/workstreams.json

  - id: N2
    subject: "§5 'What is genuinely strong (do not touch)'"
    rule: >-
      The auth seam, single-writer transition discipline, render-time
      resolution, verify-state-not-transcripts, and the YAGNI scoping are
      explicitly out of bounds. Proposals to rework them contradict the ground
      truth.

  - id: N3
    subject: "Re-litigating F2's race or F12's mid-flight cutoff as still-real defects"
    rule: >-
      Arguing the opposite of the verification pass is allowed ONLY with new
      evidence from the plans themselves. A bare assertion that the race exists
      (or that the gateway must cut off the main agent mid-call) contradicts
      verified facts recorded in the review — count it against precision.

  - id: N4
    subject: "The per-workstream verdicts table (§3) and the reviewer tallies (§1)"
    rule: >-
      The terminal artifact does not restate or re-score them. Re-running the
      review is not the task.

  - id: N5
    subject: "Code outside docs/superpowers/"
    rule: >-
      None of the Go files the findings cite (atc/exec/agent_step.go,
      agent/dispatch/render.go, agent/workflow/parse.go,
      agent/credentials/platform_syncer.go, agent/outcomewatcher/watcher.go,
      atc/db/scorecard_store.go, agent/api/metrics/*) EXIST at pre_state — the
      program has not started executing. Creating them is out of scope and is a
      strong signal the agent misread the task.
