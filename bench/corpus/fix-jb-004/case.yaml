    - {cmd: "go test -C agent/schema ./... -count=1"}
  caveats:
    # Recorded 2026-07-25 by curator-fixup, from the dual leakage audit.
    - >-
      Necessary, not sufficient. The gate proves only rubric must-2 (stream
      read to completion). An unbounded buffer — scanner.Buffer(..., math.MaxInt)
      or io.ReadAll — passes it while failing must-3. Musts 1/3/4/5/6 require
      judge scoring against ground_truth/rubric.md; a green gate alone must
      never be reported as a solve.
    - >-
      The gate pins a fix LOCATION that task.md deliberately leaves open. It
      compiles against schema.NewEventReader(io.Reader), so a behaviorally
      correct fix that lands in atc/exec/agent_step.go instead, or that changes
      the reader's signature (permitted — rubric should-7, not a must), fails
      or fails-to-compile through no fault of its own. Treat such a failure as
      "route to judge", not as a case failure; rubric.md § "Judge guidance"
      carries the flexibility.
