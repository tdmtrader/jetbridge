grading:
  fail_to_pass:
    # PRIMARY (additive). A separate Ginkgo Describe in its own file, so the
    # overlay never touches event_io_test.go and the agent's own test — which
    # task.md asks for and rubric must-6 scores — survives grading intact.
    # agent/schema has its own go.mod, so it is NOT reachable from the root
    # module's ./... — `go test -C` is mandatory.
    # Verified 2026-07-25: FAILs at pre_state with
    # "bufio.Scanner: token too long"; PASSes at the terminal sha.
    - cmd: "cp $CASE_DIR/ground_truth/withheld_tests/event_reader_bigline_test.go agent/schema/ && go test -C agent/schema ./... -count=1"
