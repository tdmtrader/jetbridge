    # fails to COMPILE (e.g. the agent converted the package's test style, as
    # 3294f724ef does later upstream). Also validated 2026-07-25.
    - cmd: "git show 6e113b067b10bc6b426108fffac8297dd75e6151:agent/schema/event_io_test.go > agent/schema/event_io_test.go && go test -C agent/schema ./... -count=1"
      withheld_test_paths: [agent/schema/event_io_test.go]
      role: fallback-only
      destructive: true
      note: >-
        Overwrites the agent's own edits to event_io_test.go, destroying the
        test rubric must-6 scores. If this form is used, score must-6 from the
