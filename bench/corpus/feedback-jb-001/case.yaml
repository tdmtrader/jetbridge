  notes: notes.md#validation
leakage_audit:
  - auditor: opus
    verdict: borderline
    notes: "Case exposure is clean — the review IS the input by construction, task.md cites only pre_state artifacts, no in-tree doc names the wave, and the pre_state contracts create friction rather than help (00-shared-contracts describes the state machine WITHOUT the failed→abandoned edge). Curator must act on: the verified auto-memory contamination naming F1/F2/F4/F9 and the elm.js item, the terminal/ground_truth reachability, and two scrub gaps where F13's reflection mechanism and F11's cadence are stated as mechanism rather than behaviour."
  - auditor: sonnet
    verdict: borderline
    notes: "task/ is clean on the case's own terms — file:line anchors match the pre_state blobs verbatim, no post-cut names, the scrubbed fix vocabulary really is absent, and the three withheld-for-grading test files exist at pre_state encoding only the OLD expectations. Flag: the injected MEMORY.md names the fix summaries for F1/F2/F4/F9 and 'elm.js dropped from git', an environment-side spoiler independent of the package."
  - auditor: curator-fixup
    verdict: pass
    notes: "Auto-memory contamination declared as known_leak_channels:[project-auto-memory] (unfixable in-package, run-invalidating); terminal-reachability was already mitigated by pre_state.materialize and ground_truth/ is harness-side per the exposure contract, so both dissolve; the two scrub gaps are fixed in task/ (F13 no longer says 'by reflection', F11 no longer prescribes the surviving subscription) with rubric A13/A11 widened to match; also fixed three grading defects the audits did not reach — the withheld-spec overlays clobbered the very tests the task asks for (grading.protocol + renamed F13 negative control), the delivery gate could be greened by deleting the stale spec (pass_condition), and C5's commit-message-only channel was unreachable under git-archive materialization (MERGE_GATE_RESPONSE.md fallback)."
curation:
  quality: 5
  learnings: >-
    The corpus's first feedback-loop case, and it is deliberately the mirror of
    review-jb-001: same pre_state, same terminal artifact, opposite exposure.
    What that case withholds as its answer key — the thirteen findings — this
    case hands over as the task. Four lessons.
    (1) One terminal artifact can seed two cases with genuinely different
    difficulty profiles, and building the pair is cheaper than building either
    alone because the provenance walk, the anchors and the reference diff are
    shared. But the pair is only worth it if the two workflows are actually
    testing different things, and here they measurably are: review-jb-001 asks
    "can you find thirteen defects in 31 files", this one asks "given thirteen
    correct diagnoses, can you land all of them without breaking the neighbours".
    The second turns out to be dominated by TYPE FAN-OUT, not by diagnosis —
    three of the fixes change a shared model field or a message constructor and
    reach modules and specs the findings never mention. That is a distinct
    capability and it is where a weak run will fail. Never pool results from the
    pair as independent samples, and never run them in the same session.
    (2) Feedback cases invert the usual scrubbing rule, and the inversion needs
    stating explicitly or the extractor will over-scrub. Naming file:line IS the
    task here. What still must go is the fix MECHANISM: the source findings
    (reconstructed from a commit that had already chosen its implementation)
    said "store a Maybe Bool", "key by build id + plan id", "use the scrollToId
    port", "move to the OneMinute tick". Every one of those was rewritten to the
    behavior it achieves, because leaving them in converts the case from
    engineering into transcription. The rubric then had to be written to accept
    the alternatives that the scrub opened up — a scrub that the rubric does not
    match is worse than no scrub at all, because it punishes the agent for
    taking the freedom the task gave it.
    (3) Run the environment before you claim it. Two things fell out of actually
    executing the suites at both refs that no amount of reading would have
    produced. The Elm suite is RED at pre_state (3128/1) — a stale spec the wave
    itself broke — which is simultaneously a fail-to-pass signal, a delivery
    gate, and a trap (an agent can green it by deleting the spec), and it is now
    a scored rubric item instead of an invisible surprise for the first
    validation run. And the withheld AgentBadge/BuildStep specs turn out to be
    the corpus's cleanest Elm oracle so far (7 red → 0) precisely because they
    test a pure function and a decoder; the sibling specs the same commit
    touched (AgentPageTests pins the literal key "100:plan-abc") are
    mechanism-coupled and would have punished a correct-but-different fix. The
    general rule: when harvesting withheld tests, sort them into
    behavior-coupled and mechanism-coupled before promoting any of them to a
    grading command.
    (4) Added by the 2026-07-25 fixup, and it generalises past this case: when a
    task asks the agent to WRITE tests, the grading overlay becomes a hazard
    rather than a convenience. All four of this case's withheld grading specs
    live at paths that already exist at pre_state and are the natural home for
    the coverage the task demands — restoring them destroys the C3 evidence,
    and for F13, whose entire remedy IS a test at that path, the overlay would
    have graded the reference's test as if it were the agent's. The rule:
    judge the delivered tree first, overlay on a scratch copy, and never let a
    grading command restore a file the task asked the agent to author. The same
    fixup found the mirror-image defect in the delivery gate — an expected pass
    COUNT is a spurious-pass gate whenever the cheapest route to green is
    deleting a spec — and a delivery channel (C5's "commit message") that a
    git-archive materialization makes unreachable. All three are grading bugs
    that only surface when you ask "what does a lazy solver do to this number".
    Residual worry: thirteen fixes plus a bundle rebuild is a large single turn.
    If pilot runs stall on budget rather than capability, split by surface
    (AgentBadge+Concourse decoder / AgentTicket page / Agent console / cadence)
    rather than loosening the rubric.
