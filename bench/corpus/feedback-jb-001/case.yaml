# RUN CONSTRAINT: this case declares known_leak_channels: [project-auto-memory].
# A hand-run on the curation machine is INVALID unless project memory, session
# context and conversation history are suppressed for the solver. See
# notes.md#leakage-analysis and README's "Operator-environment leakage".
schema: benchmark-case/v1
id: feedback-jb-001
title: Address 13 merge-gate review findings on the agentic-UX wave — Elm view logic, a Go state machine, polling cadence and a test gap
workflow: feedback-loop
signature:
  inputs:
    repository: repository/v1
    review: review/v1
    work-item: work-item/v1
  outputs:
    change: repository-change/v1
source:
  system: git-commit
  repo: jetbridge
  terminal: e366c29a1352b27a6537694ead2ae2e2f9779c91
information_cut: 2026-07-19T06:54:10-07:00
pre_state:
  repository:
    repo: jetbridge
    ref: 171148fd77232d46d183834c9f2e172073c44805
    # MUST be materialized detached, with no other refs and no reflog. The
    # terminal artifact e366c29a13 is a DIRECT CHILD of this ref and its commit
    # body enumerates the eleven fixes verbatim; it is reachable from the branch
    # tips agentic-ux-wave-2, jetbridge and main. See notes.md#leakage-analysis.
    materialize: "git archive 171148fd77232d46d183834c9f2e172073c44805 | tar -x -C <dir>"
  review:
    path: task/review-findings.md
    # The merge-gate review deliverable, reconstructed from the terminal
    # artifact's commit body and from review-jb-001's ground truth. This is the
    # case's DEFINING ASYMMETRY with review-jb-001: what that case withholds as
    # its answer key, this case exposes as its task input. Scrubbed of fix
    # mechanisms — see notes.md#what-was-scrubbed.
  work-item:
    path: task/task.md
ground_truth:
  outcome: merged
  reference_change: ground_truth/reference.diff
  # 19 files, +383/-116 (generated bundles excluded). Generated by:
  #   git diff 171148fd77232d46d183834c9f2e172073c44805
  #     e366c29a1352b27a6537694ead2ae2e2f9779c91 --
  #     . ':(exclude)web/public/elm.js' ':(exclude)web/public/elm.min.js'
  # Byte-identical to review-jb-001/ground_truth/reference.diff — the two cases
  # share a terminal artifact and use it for opposite purposes.
rubric: judge
grading:
  judge_checklist: ground_truth/rubric.md
  secondary_rubric: mechanical
  # PRIMARY SCORE is the judge checklist in ground_truth/rubric.md: three axes
  # (13 remedies × 2pts, 8 discipline pass/fail, 5 delivery pass/fail). The
  # mechanical commands below cover 2 of the 13 remedies end-to-end (F1, F8),
  # 1 partially (F9's server half), and the delivery gate — they are a floor,
  # not the score. Do not collapse the three axes into one number.
  protocol: >-
    GRADING ORDER IS LOAD-BEARING, because this case's task asks the agent to
    write tests and every withheld grading spec lives at a path that ALREADY
    EXISTS at pre_state (agent/api/tickets/types_test.go,
    atc/public_plan_test.go, web/elm/tests/AgentBadgeTests.elm,
    web/elm/tests/BuildStepTests.elm — all four verified present at
    171148fd77). A naive `cp` of the withheld specs therefore deletes the
    agent's own regression coverage (rubric C3) and, for F13, replaces the very
    artifact the finding asked for (rubric A13) with the reference's. Run in
    this order:
    (1) archive the agent's delivered tree UNTOUCHED — this copy is what the
    judge scores for Axes A, B and C, and it is the only evidence for C3/A13;
    (2) on a second, scratch copy, run the pass_to_pass commands with NO
    overlay (they are regression guards on the agent's tree);
    (3) still on the scratch copy, apply each fail_to_pass `restore` and run
    that command. Overlays are for measuring the agent's SOURCE change, never
    its tests.
    Never apply an overlay to the archived copy from (1).
  fail_to_pass:
    - cmd: "go test ./agent/api/tickets/ -run TestValidTransitionMatrix -count=1"
      withheld_test_paths:
        - agent/api/tickets/types_test.go
      grades: [F9]
      restore: >-
        cp ground_truth/withheld_tests/agent/api/tickets/types_test.go
        agent/api/tickets/types_test.go
      note: >-
        Restore the withheld post-fix spec over whatever the agent produced —
        ON THE SCRATCH COPY ONLY, see grading.protocol; this path exists at
        pre_state and the agent may well have extended it — then run. At
        pre_state: "ValidTransition(failed, abandoned) = false,
        want true" (and the same for errored). Verified by the extractor in the
        real module — see notes.md#validation. Covers only F9's SERVER half;
        the Elm mirror is judge-scored (rubric A3).
    - cmd: "cd web/elm && elm-test tests/AgentBadgeTests.elm tests/BuildStepTests.elm"
      withheld_test_paths:
        - web/elm/tests/AgentBadgeTests.elm
        - web/elm/tests/BuildStepTests.elm
      grades: [F1, F8]
      restore: >-
        cp ground_truth/withheld_tests/web/elm/tests/AgentBadgeTests.elm
        ground_truth/withheld_tests/web/elm/tests/BuildStepTests.elm
        web/elm/tests/
      note: >-
        Both specs exercise BEHAVIOR through a pure function (AgentBadge.runOutcome)
        and a decoder (Concourse.decodeBuildPlan), so they are implementation-
        agnostic and fair as an oracle. Both paths exist at pre_state and are
        the natural home for the agent's own C3 coverage, so this restore is
        SCRATCH-COPY-ONLY (see grading.protocol). Verified: 7 failed / 98 passed at
        pre_state, 0 failed / 105 passed at the terminal artifact. The 5
        AgentBadge failures are exactly F1's two halves; the 2 BuildStep
        failures are F8 (the third BuildStep case, the bare {"id":…} fallback,
        passes at pre_state — that is the catch-all the review REFUTED removing).
  pass_to_pass:
    - cmd: "go test ./agent/api/tickets/ -count=1"
      note: >-
        Run WITHOUT the withheld spec restored. Guards the frozen state machine:
        TerminalStates() must stay exactly {merged, merged_with_fixes,
        abandoned, concluded} and failed/errored must stay NON-terminal even
        after gaining the abandoned edge. Verified ok at both refs.
    - cmd: "go test ./atc/ -count=1"
      note: >-
        Regression guard around F13. Run WITHOUT any overlay, on the agent's
        own tree: F13's remedy IS a test at this very path, so restoring the
        withheld atc/public_plan_test.go here would both destroy the agent's
        A13 artifact and grade the reference's test instead of the agent's.
        Verified ok at both refs. Runs without Postgres.
  negative_control:
    - cmd: "go test ./atc/ -count=1"
      restore: >-
        cp ground_truth/withheld_tests/atc/public_plan_test.go
        atc/reference_public_plan_exhaustiveness_test.go
      grades: []
      note: >-
        Curation evidence, not a score. Confirms F13 is a missing regression
        guard rather than a live defect: the reference exhaustiveness spec
        passes at BOTH refs (verified). Restore under the RENAMED path shown so
        the agent's own atc/public_plan_test.go survives. The withheld file is
        the whole 1162-line suite, not just the new Describe, so under a second
        name its other specs simply run twice — harmless, and neither file
        declares a package-level identifier beyond `var _ = Describe` (checked),
        so there is nothing to collide. If a future agent's file does collide,
        drop this control rather than overwriting the agent's file. Scratch copy
        only.
  delivery_gate:
    - cmd: "cd web/elm && elm-test"
      expect_at_ground_truth: "3138 passed, 0 failed"
      pass_condition: >-
        0 failed AND BuildAgentReviewTests still covers the id-less-observation
        case rather than having dropped it. The reference kept the spec's name
        ("id-less observations show their body read-only, no controls",
        verified identical at both refs) and corrected its assertion; a rename
        is fine, a deletion is not, and neither is deleting any other
        pre-existing spec to reach green. The 3138 is the REFERENCE's count and
        must not be required of the agent — a correct change adds its own specs
        and lands on a different total. Grading only the number is a spurious
        pass: the cheapest way to reach "0 failed" is to delete the stale spec.
      note: >-
        THE PRE-STATE SUITE IS RED: 3128 passed / 1 failed
        (BuildAgentReviewTests > "id-less observations show their body
        read-only, no controls"), a spec left stale by the wave's own
        short-list-auto-opens default. Discovering and CORRECTING it is
        rubric C2 + B8 — an agent that deletes the spec to get a green bar
        fails B8. Technically fail-to-pass, but listed here rather than above
        because the failure is trivially removable and so is a weak oracle on
        its own. Run on the agent's tree with NO overlay.
  environment:
    postgres_required: false
    cluster_required: false
    elm_toolchain_required: true
    notes: >-
      Go side: agent/api/tickets and atc are both in the main module
      (github.com/concourse/concourse, go 1.25.6) with no Postgres, cluster or
      network dependency, but the whole repository must be materialized for the
      module to resolve. Elm side: needs elm 0.19.1 + elm-test on PATH (both
      present on the curation machine) and a warm ELM_HOME package cache or
      network for the first build; the C4 bundle rebuild additionally needs
      uglify-js (hack/build-web.sh). All four commands above were run by the
      extractor at both refs.
