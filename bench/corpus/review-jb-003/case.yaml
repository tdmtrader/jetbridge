schema: benchmark-case/v1
id: review-jb-003
title: Adversarial review of the agentic UX wave — three time-dependent bugs in a 1.8k-line Elm branch
workflow: code-review
signature:                    # matches the platform's code-review-v3 seed exactly
  inputs:
    before: repository/v1
    after: repository/v1
  outputs:
    review: review/v1
source:
  system: git-commit
  repo: jetbridge
  terminal: 20b808a92e977f38c9b903f3c103a76c389c912d
information_cut: "2026-07-18T21:55:30-07:00"
pre_state:
  # code-review-v3 has no work-item port: the review request is carried by the
  # workflow's own prompt, not by an input snapshot. task/task.md is exposed as
  # that framing. See notes.md "Schema fit".
  before: {repo: jetbridge, ref: 54b541a81e6235ca74256dfbd50666ec45a18d2c}
  after: {repo: jetbridge, ref: 199ab7497399aa157065b660537caa652373791c}
ground_truth:
  outcome: merged             # all three findings were accepted and fixed in the terminal commit
  expected_findings: ground_truth/expected_findings.yaml
  reference_change: ground_truth/reference.diff   # the fix the findings produced — context, not the graded output
  rubric_checklist: ground_truth/rubric.md
rubric: reference
grading:
  # The graded artifact is a review, so there is no fail-to-pass transition for
  # the agent. Recall/ranking against expected_findings.yaml is the primary
  # score; rubric.md is the judge checklist for intent and scoping.
  ranked_recall:
    findings: ground_truth/expected_findings.yaml
    must_find: [F1]
    should_find: [F2, F3]
    scoping_item: D1          # report AND mark pre-existing / follow-up
    ranking_constraint: "F1 must outrank F3"
  judge_checklist: ground_truth/rubric.md
  # Grading caveat (2026-07-25): task/task.md asks for per-finding attribution
  # ("introduced here or pre-existing") but no longer prescribes how a
  # pre-existing finding should be handled — that sentence restated the D1
  # scoping criterion verbatim and was removed as leading text. The flexibility
  # now lives in ground_truth/rubric.md: a correctly attributed D1 is full credit
  # regardless of wording, an unattributed D1 report is partial credit, and the
  # full scoping signal requires report + attribution + not blocking the branch.
  # These commands do NOT grade the agent. They prove the ground truth is real:
  # each of F1-F3 is pinned by a regression test that fails at the reviewed state
  # and passes with the fix. Run from a materialized tree; elm + elm-test on PATH
  # (elm 0.19.1, elm-test 0.19.1-revision12). No Postgres, no network.
  ground_truth_validation:
    - cmd: "cd web/elm && elm-test tests/AgentBadgeTests.elm tests/AgentPageTests.elm tests/AgentTicketPageTests.elm"
      tree: "199ab7497399aa157065b660537caa652373791c with the three test files replaced by their 20b808a92e version"
      expect: "TEST RUN FAILED — 59 passed, 4 failed"
      failing_specs:
        - "a PARKED run shows Waiting on you even though its build is still 'started'   (F2)"
        - "a parked run whose build later succeeded still shows Waiting on you, not OK  (F2)"
        - "expanding a ledger row reveals the full run summary                          (F3)"
        - "a periodic self-heal refetch does not clobber an open edit form              (F1)"
    - cmd: "cd web/elm && elm-test tests/AgentBadgeTests.elm tests/AgentPageTests.elm tests/AgentTicketPageTests.elm"
      tree: "20b808a92e977f38c9b903f3c103a76c389c912d"
      expect: "TEST RUN PASSED — 63 passed"
    - cmd: "cd web/elm && elm-test"
      tree: "199ab7497399aa157065b660537caa652373791c"
      expect: "TEST RUN PASSED — 3123 passed (the reviewed state is green; passing tests are not evidence of correctness)"
  needs_postgres: false
withheld: []                  # nothing at either ref describes these findings; see notes.md
difficulty: moderate           # unchanged: neither auditor contested it; 31 files /
                               # +1798 lines of Elm with three time-dependent
                               # defects, two of them argued against by in-source
