validation:
  status: validated
  notes: notes.md#validation
leakage_audit:
  - auditor: opus
    verdict: borderline
    notes: "No leak in task/: it names no module, function or mechanism, cites no post-cut artifact, and no in-tree doc — including the branch's own scope doc — contains the findings. Curator items: bullet 5 restates the D1 scoping criterion almost verbatim (coaching the discriminative judgement), the Go build_status sentence signposts F2's seam, and case.yaml's grading.ground_truth_validation.failing_specs enumerates F1/F2/F3 in plain English outside ground_truth/."
  - auditor: sonnet
    verdict: borderline
    notes: "task.md is clean (grepped for clobber/ordinal/parked/waiting-on-you — nothing), and the two in-source comments that ease F3 and D1 are genuine developer-authored code under review, with D1's verified byte-identical at the base ref. Only issue: case.yaml's grading.ground_truth_validation.failing_specs and curation.learnings embed near-verbatim spoilers for F1/F2/F3 and D1 outside the access-controlled ground_truth/ tree."
  - auditor: curator-fixup
    verdict: pass
    notes: "Fixed the two task/ items (bullet 5 no longer restates the D1 scoping criterion; the Go-slice sentence no longer names build_status) and moved D1's grading flexibility into rubric.md; added a judge instruction to credit causal reasoning over doc-quotation for the two deliberately-exposed docs. Both auditors' remaining items — failing_specs and curation.learnings spelling out F1-F3/D1 — are dissolved by the exposure contract: case.yaml and notes.md are harness-side and never exposed. Declared project-auto-memory as a known leak channel (memory names runOutcome's parked precedence)."
curation:
  quality: 5
  learnings: >-
    The first review case in the corpus, and it settles three format questions.
    (1) A review case needs TWO repository refs, not a parent/child pair: the
    platform's code-review-v3 signature is (before, after) -> review, and the
    honest pre-state is "the branch tip the reviewer actually saw" — here the
    bundle-rebuild commit immediately before the fix, NOT the merge commit, which
    would have dragged the fix in. Backing out from the FIX commit and taking its
    parent as `after` is the reliable recipe.
    (2) A review case is not mechanically gradable, but its GROUND TRUTH is —
    every finding here is pinned by a regression test in the fix commit, and
    running those tests against the reviewed state (4 targeted failures, 3123
    unrelated specs green) converts "the human said these are bugs" into "these
    are bugs". Prefer review terminal artifacts that ship tests; it is the
    difference between a graded opinion and a graded fact.
    (3) The scoping item is what makes the case discriminative. Recall alone is
    cheap to game by listing everything; this case also asks whether the agent
    reports the pre-existing blank-finding-id collision AND declines to fold it
    into the branch's bill. That is judgement, and it is only gradable because
    the human left a paper trail — the deferral is in the commit message and the
    follow-up landed separately (9e1fbf99e1).
    Two cautions this case surfaced. The human's own commit message is not a
    reliable oracle for detail: it describes the /agent ledger as refetching
    every 5s when that page is on the one-minute clock, so the rubric has to
    explicitly forgive the correct answer. And the severity labels are the
    ranking rubric here only because the reviewer wrote them down — most review
    artifacts do not, which is a strong selection criterion for future review
    candidates.
