memorization_risk: none
known_leak_channels: [project-auto-memory]
  # This dev machine's project auto-memory states F2's answer: MEMORY.md's
  # "Agentic UX wave 2 (impl)" line names "runOutcome worst-truth-wins", and
  # project_agentic_ux_wave_2.md spells out the settled precedence
  # ("terminal-bad build -> then parked -> ..."). That is post-cut knowledge of
  # this exact branch. A hand-run of this case on this machine is invalid unless
  # project memory / session context is suppressed; the memory itself is correct
