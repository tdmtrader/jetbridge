leakage_audit:
  - auditor: opus
    verdict: borderline
    notes: "task/ is clean — no post-cut vocabulary, the diff reproduces exactly, both required findings need crossing OUT of the diff (handler.go, Header.elm) so diff-skimming cannot solve it, and no in-tree doc carries the answers. Curator items: lens 2's 'out-of-order or late responses' names a bonus finding's mechanism, lens 5 has a single target (the F3-encoding spec), and case.yaml's self-describing finding slugs plus ground_truth_validation prose form an answer key that must never be surfaced."
  - auditor: sonnet
    verdict: fail
    notes: "task/task.md and change.diff are well-built — generic review lenses, no post-cut names, and F1's discovery path is fair (pre-existing doc comments adjacent to, not inside, the diff). Fails on case.yaml: source.terminal names the remediation SHA, the finding slugs state each defect outright, ground_truth_validation prose describes the withheld assertions including the scrubbed agent-ticket-7/main-team hint, and curation.learnings is a prose walkthrough."
  - auditor: curator-fixup
    verdict: pass
    notes: "Sonnet's FAIL and opus's answer-key item are entirely case.yaml/ground_truth content — harness-side under the exposure contract, so nothing was renamed or retitled. Fixed the two genuinely exposed items in task/task.md: lens 2 no longer enumerates 'out-of-order or late responses' (F2b's mechanism) and lens 5 no longer describes F3's shape; also dropped 'unattended' from the lifecycler orientation line. rubric.md gained an 'Evidence, not quotation' section so the kept in-tree deflators (F30 doc comments, 11-dispatch.md naming convention) cannot be cashed in by quotation. Added known_leak_channels: [project-auto-memory] — memory states both required findings verbatim. Difficulty stays hard; dates verified consistent with the pre_state commit."
curation:
  quality: 5
  learnings: >-
    Review cases back out of a *pair* of commits, not one: the terminal artifact
    is the remediation commit, and the thing under review is everything between
    the remediation's parent-of-parent and its parent. The commit body of the
    remediation is the oracle, which makes review cases unusually cheap to ground
    — but it is also the single worst leak in the corpus, because it states both
    findings in prose. Withholding it means withholding the commit AND every
    descendant; the pre_state ref must be the reviewed tip, never the branch head.

    This repo's habit of writing the *reason* into doc comments is what makes the
    security finding discoverable rather than psychic: `RunBelongsToPipeline` and
    `TicketBelongsToRun` sit twenty lines above the new code and both say, in
    prose, that these ids are attacker-writable. That is not leakage — it is the
    codebase being reviewable, and a review that misses F1 with that precedent in
    view has genuinely under-read. Curators should look for this shape
    deliberately: a defect whose evidence is *adjacent to* but not *inside* the
    diff is exactly the discrimination a review benchmark wants, because
    diff-only skimming cannot reach it. Both findings here have that shape (F1's
    write path is in `agent/api/tickets`; F2's cause is in `Header.elm`, a file
    the diff never touches).

    Two more curation notes. (1) The reviewed change's own tests *assert the bug*
    for F3 ("the template itself never runs builds, so it archives right away") —
    a green suite is not evidence, and an oracle should record which specs
    encoded the wrong invariant so a judge can reward the reviewer who
    disbelieved them. (2) The task text is where review cases leak most easily:
    an honest adversarial-review request naturally wants to say "check
    authorization" and "watch for stale client state", which maps 1:1 onto the two
    findings. I generalized the ask into a five-lens checklist that covers the
    findings without pointing at them, and dropped an early draft's pointers to
    the build header module and the main-team naming convention. Anyone writing a
    review case should draft the trigger, then re-read it asking "could I find the
    bugs from this text alone?"

    Finally: review cases are not mechanically gradable as agent output (findings,
    not a diff), but they ARE mechanically *validatable* — the remediation shipped
    tests, so `fail-at-pre / pass-at-post` proves the ground truth is real without
    proving anything about the agent. Recording those as
    `ground_truth_validation` rather than `fail_to_pass` keeps the distinction
    honest and stops a future harness from mistaking them for a grading gate.

    Fixup lesson (2026-07-25): the dual audit split on *where* the answer key is
    allowed to live. Both auditors correctly saw that this manifest states both
    defects outright — finding slugs, `source.terminal`, the
    `ground_truth_validation` prose, these learnings — and one voted FAIL on that
    basis. Under the schema's exposure contract that is not a leak: the solver
    sees pre_state minus `withheld` plus `task/`, and never `case.yaml`,
    `notes.md`, or `ground_truth/`. The real obligation the audit surfaces is
    operational, not editorial — a hand-run must materialize `task/` into a
    neutrally-named directory and must not let the manifest into the solver's
    context. Review cases are the sharpest instance of this because their oracle
    IS prose; a curator who scrubs the manifest to satisfy an audit only makes the
    case harder to grade without making it harder to cheat.

    The channel that IS real here is operator-environment leakage: this machine's
    project auto-memory writes up the remediation commit and names both required
    findings in the same words the oracle uses. That is unfixable from inside the
    corpus (memory is not ours to edit), so it is declared in
    `known_leak_channels` and any local hand-run without memory suppression is
    invalid. Cases harvested from this repo's own recent incidents should be
    assumed contaminated on this host until checked.
