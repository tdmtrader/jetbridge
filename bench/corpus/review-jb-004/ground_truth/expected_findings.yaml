schema: expected-findings/v1
case: review-jb-004
oracle:
  source: git-commit
  sha: 793659c7fad09135eabb44420006414d1f1b0c5f
  note: >-
    A human-authored oracle is a strong recall signal and a weak precision
    signal. An agent finding that does not appear here may still be true; judge
