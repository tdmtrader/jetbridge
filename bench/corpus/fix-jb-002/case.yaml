pre_state:
  repository: {repo: jetbridge, ref: a5b1cf267f7ec88b56ee6cd4fd3eb136b9a84187}
  work-item: {path: task/task.md}
ground_truth:
  outcome: merged
  reference_change: ground_truth/reference.diff
  rubric_checklist: ground_truth/rubric.md
rubric: mechanical
grading:
  protocol: >-
    Mechanical is the PRIMARY leg but it is not complete on its own; two
    documented caveats decide when to fall back to judge grading against
    ground_truth/rubric.md.
    (1) LAYER CAVEAT. fail_to_pass pins the behaviour at llm.ExtractJSON /
    llm.ParseCLIEnvelope, but task.md only requires that "whatever ci-agent
    hands to publish must be valid JSON" — a producer-side fix at the
    phaserunner artifact boundary (runner.go: `output := cr.Result` →
    writeArtifact → os.WriteFile) is equally legitimate and would leave the
    withheld llm specs failing. A submission that changes phaserunner (or any
    producer layer other than ci-agent/llm) and does NOT change ci-agent/llm
    must NOT be scored from the fail_to_pass leg — run pass_to_pass plus the
    agent's own tests, then grade by judge against ground_truth/rubric.md
    ("Localization" now grants full credit for the boundary fix). Only a
    submission that fixes inside ci-agent/llm is decided mechanically.
    (2) DECOY CAVEAT. The pre-state suite has no spec pinning the json.Valid
    guard in ci-agent/publish/publish.go (publish_test.go's six plain-Go tests
    never feed Publish an unparseable file), so an agent that fixes the producer
    AND relaxes that guard passes both legs. The rubric's "MUST NOT weaken the
    publish guard" must be checked by reading the submitted diff for
    publish.go and ci/tasks/ci-agent-review.yml. See rubric.md
    "Scoring guidance for the grader".
  fail_to_pass:
    - cmd: "cd ci-agent && go test ./llm/"
      withheld_tests:
        - source: ground_truth/withheld_tests/ci-agent/llm/client_test.go
          destination: ci-agent/llm/client_test.go
      note: >-
        client_test.go exists at pre_state with 12 passing specs; the reference
        commit ADDS 3 specs to it. Grading replaces the file with the post-state
        version (obtainable as `git show d21437fd10:ci-agent/llm/client_test.go`).
        At pre_state that file yields 3 failures / 12 passes; at post_state 15/15.
        Because the agent under test may also edit this file, grade with the
        withheld version overwriting whatever the agent wrote.
      failing_specs:
        - 'ExtractJSON extracts bare JSON preceded by prose (no code fence)'
        - 'ExtractJSON extracts bare JSON followed by trailing prose (no code fence)'
        - 'ParseCLIEnvelope extracts valid JSON when the result field wraps it in prose'
  pass_to_pass:
    - cmd: "cd ci-agent && go test ./..."
      note: >-
        Full ci-agent module, ~25s, hermetic (no Postgres, no network, no Claude
        CLI). Verified green at both pre_state and post_state. Run with the
        agent's own test file, not the withheld one.
  needs_postgres: false
withheld: []
