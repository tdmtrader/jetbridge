leakage_audit:
  - auditor: opus
    verdict: pass
    notes: "No post-cut refs; the one nearby doc (09-harvest-step.md) reimplements the BUGGY fence-only extractJSON, so it is an anti-leak, and withheld:[] is correct. Strongest steer is constraint 2 telling the solver bare+fenced already round-trip. Grading risks: fail_to_pass pins the fix at llm.ExtractJSON though task.md permits a phaserunner/publish-side fix, and publish_test.go has no json.Valid guard spec."
  - auditor: sonnet
    verdict: pass
    notes: "task.md gives symptom plus two evidence shapes without naming the function; the fix is derivable by ordinary reading of a 6-line helper, and no in-tree doc describes it (09-harvest-step.md mirrors the buggy version). case.yaml's curation and fail_to_pass name the decoy and the three spec titles but are curator-only."
  - auditor: curator-fixup
    verdict: pass
    notes: "Both grading gaps fixed, not dissolved: grading.protocol now routes a phaserunner-boundary fix to judge grading (rubric.md Localization grants it full credit) and flags that no publish_test.go spec pins the json.Valid guard, so the decoy MUST NOT needs diff inspection. Answer-key flags (case.yaml/curation/spec titles) dissolve under the exposure contract; no operator-environment leak (grep of project auto-memory finds no ExtractJSON/prose-wrapped/ParseCLIEnvelope fix statement), so known_leak_channels stays absent. difficulty moderate and validation evidence unchanged."
curation:
  quality: 4
  learnings: >-
    Strong shape for a small-fix case: a user-visible symptom (empty agent-review
    panel) whose whole causal chain is inside one hermetic Go module, with a
    decoy fix one hop away. The publish-side `json.Valid` guard is the loudest
    thing in the evidence and is NOT where the fix belongs — that decoy is what
    makes the case discriminative, so the task must hand over the error message
    (real diagnostic input) while the rubric explicitly denies credit for
    relaxing it. Two other lessons. (1) Fail-to-pass on a MODIFIED test file, not
    a new one: the withheld artifact is a replacement, and grading must overwrite
    whatever the agent wrote there, otherwise an agent that rewrites the file
    grades itself. (2) The pre-state contains a design doc that reimplements the
    BUGGY function verbatim (09-harvest-step.md's judge `extractJSON` mirrors the
    fence-only version). That is anti-leakage — it biases toward the wrong answer
    — and it is faithful to what the repo actually looked like, so it stays.
    Leaving it in is the honest choice; scrubbing it would have made the case
    easier than reality.
