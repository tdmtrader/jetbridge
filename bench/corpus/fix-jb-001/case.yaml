  - auditor: sonnet
    verdict: pass
    notes: "task.md and pre_state are clean and honestly hard (one unrecovered goroutine among the server's paths; recover() is standard Go idiom and the in-repo prior art sits in the unimportable main module). case.yaml title/notes/learnings spoil it completely but are curator/grading-only, and no spoiler vocabulary bled into task.md."
  - auditor: curator-fixup
    verdict: pass
    notes: "Both auditors' only flag (case.yaml title/focus_spec/learnings state the remedy) is dissolved by the exposure contract — harness-side, nothing renamed. Fixed two real grading defects instead: the overlay silently clobbers the regression spec task.md asks for (capture-before-restore + move agent-added test files aside, or a symbol collision false-fails a correct fix) and the withheld spec pins the message substring 'panicked' that task.md leaves open (both now caveated in grading and in rubric.md § Mechanical caveats). 04-dev-mcp.md kept exposed as a priced deflator with a rubric line crediting evidence over doc quotation; difficulty stays moderate; project auto-memory checked and does not state this answer, so no known_leak_channels."
curation:
  quality: 5
  learnings: >-
    Near-ideal mechanical case shape: a two-file defect (8 lines of production
    code, one spec) in a standalone Go module with no Postgres, no cluster and a
    sub-second suite, whose fail-at-pre signal is unambiguous — the pre-state
    binary dies with a raw `panic: tool exploded` rather than merely reporting a
    red spec. Three lessons for corpus building. (1) A crash-shaped fail_to_pass
    is the strongest possible pre-state signal but breaks spec-count parsing;
    graders must key on process exit code. (2) The symptom is fully statable
    without the fix — "a panicking tool takes the sidecar down; it should return
    an error frame and keep serving" — which is the property that made this
    candidate survivable; the temptation to paste the panic stack trace into
    task.md would have collapsed it to trivial, because the trace names the
    exact goroutine. Withholding naturally-available triage evidence is a real
    curation lever, and it must be recorded (see notes.md) rather than done
    silently. (3) `memorization_risk: none` is about *this repo* being private
    post-cutoff, which is true here; it does not mean the case is hard. The
    remedy — recover() in a spawned goroutine — is one of the most idiomatic
    patterns in public Go, so a strong model may localize it from the symptom
    alone. Expect this case to discriminate on localization (finding the one
    unrecovered goroutine among the server's paths) rather than on insight, and
    do not read a pass here as evidence about hard defects.
