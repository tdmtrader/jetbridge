grading:
  # Grading restores the withheld spec file verbatim over whatever the agent
  # wrote, then runs the ci-agent module's devmcp package. No Postgres, no
  # cluster, no network beyond the Go module cache. Whole suite ~0.5s.
  #
  # Restore step (either form is equivalent):
  #   git checkout a1af1068c9cc1b231315e676b80f92be7277b31c -- ci-agent/devmcp/server_test.go
  #   cp ground_truth/withheld_tests/ci-agent/devmcp/server_test.go ci-agent/devmcp/server_test.go
  #
  # NOTE: at pre_state the failure mode is a hard process panic, not a spec
  # failure — `go test` exits 1 with `panic: tool exploded` and the remaining
  # specs never report. Grade on the exit code, not on parsed spec counts.
  #
  # CAVEAT 1 — the overlay collides with a deliverable task.md asks for.
  # task.md requires the agent to add its own regression spec to the existing
  # devmcp suite; the restore step above overwrites that file wholesale. Before
  # restoring, capture the agent's tree:
  #   cp ci-agent/devmcp/server_test.go <capture>/server_test.go
  #   git status --porcelain ci-agent/devmcp   # note NEW *_test.go files too
  # and move any agent-added files in package `devmcp_test` aside for the
  # fail_to_pass leg — a new file that redeclares a helper the restored spec
  # already defines is a compile error, i.e. a FALSE fail against a correct fix.
  # The agent's own spec is scored from the capture against
  # ground_truth/rubric.md item 6, never by this overlay run.
  #
  # CAVEAT 2 — the withheld spec pins message wording that task.md leaves open.
  # It asserts ContainSubstring("panicked"); task.md asks only for a message
  # "diagnosable from the agent transcript" and never names the failure mode.
  # If that substring is the ONLY failing assertion while the -32603 code, the
  # echoed request id, the SSE error frame and the follow-up ping all hold, the
  # fix is correct: score it a pass and record the deviation (rubric.md
  # § "Mechanical caveats"). Do not edit the withheld spec — it is the human
  # artifact the validation run in notes.md was measured against.
  fail_to_pass:
    - cmd: "cd ci-agent && go test ./devmcp/ -count=1"
      withheld_test_paths:
        - ci-agent/devmcp/server_test.go
      focus_spec: "survives a panicking tool handler on the SSE path and keeps serving"
  pass_to_pass:
    # Run WITHOUT the withheld spec restored, on the agent's tree as delivered;
    # guards the pre-existing devmcp behavior (JSON path, error taxonomy, SSE
    # progress heartbeats, runner). This leg also executes the agent's own
    # regression spec: if it is the thing that goes red, that is a rubric item-6
    # judgment about the agent's test, not a regression in existing behavior —
    # say which in the score.
    - cmd: "cd ci-agent && go test ./devmcp/ ./runner/... -count=1"
  environment:
    postgres_required: false
    cluster_required: false
    notes: >-
      ci-agent is a separate Go module (github.com/concourse/ci-agent, go
      1.25.1). devmcp/repoconfig_test.go reads the repo-root dev-mcp.yml via
      ../../dev-mcp.yml, so the whole repository must be materialized, not just
      the ci-agent subtree.
