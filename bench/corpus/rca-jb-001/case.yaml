pre_state:
  repository:
    repo: jetbridge
    ref: 1127c59301e2f865b4d2420e909ae5344e05661f
    # MUST be materialized with ancestors-only history and NO refs, NO reflog.
    # Reading git history is part of the intended solution path (the agent has
    # to find 8b5476828f), so `git archive` is NOT usable here. But the terminal
    # artifact 7c59cbbfa6 is a direct child of this ref and its commit message
    # is a verbatim answer key, reachable from the branch tips `jetbridge` and
    # `main`. Strip everything not reachable from HEAD:
    materialize: |
      git clone --no-hardlinks <src> <dir>
      cd <dir>
      git checkout --detach 1127c59301e2f865b4d2420e909ae5344e05661f
      git for-each-ref --format='%(refname)' | xargs -r -n1 git update-ref -d
      git reflog expire --expire=now --all
      git gc --prune=now
      # verify: `git cat-file -e 7c59cbbfa6^{commit}` must FAIL,
      #         `git cat-file -e 8b5476828f^{commit}` must SUCCEED.
