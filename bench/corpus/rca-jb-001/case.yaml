curation:
  quality: 5
  learnings: >-
    This case is the corpus's first diagnosis-shaped case, and it was built from
    a terminal artifact that already backs a fix case (fix-jb-005, same terminal
    commit, same pre_state ref). That overlap is the first lesson: one terminal
    artifact can legitimately yield two cases of different workflow shapes, but
    the results are NOT independent samples and must never be aggregated as
    though they were. Recorded prominently in notes.md; a corpus roll-up needs a
    "shares terminal with" column.
    Second lesson: a diagnosis case lives or dies on what the trigger withholds.
    fix-jb-005's task.md states the architectural intent in full ("upstream's
    engine releases in-flight builds on shutdown; the build stays started and
    the next ATC re-attaches"), which is fine when the deliverable is a patch
    but would hand over the answer when the deliverable is the diagnosis. The
    same source material therefore had to be re-scrubbed to a strictly tighter
    cut for this case — the correct-behavior essay, the requirements list, and
    the check-build/job-build distinction are all absent here. Cases derived
    from shared sources need per-case scrubbing, not a shared task file.
    Third: the seductive wrong answer was in the real record, so it could be
    exposed rather than invented. The team's first hypothesis (the runtime
    deletes pods on cancel) is stated in the task as a standing hypothesis to
    confirm or refute. That converts a distractor into a gradable item — the
    rubric scores whether it was refuted AND whether the refuting evidence was
    the right one (direct-mode vs exec-mode wiring, not "pods have no
    OwnerReferences"). Anchoring the agent on a wrong hypothesis is realistic
    (that is how the incident actually went) and it makes the case much harder
    without adding any unfairness.
    Fourth, a platform gap: this case needs two port types the v3 signature set
    does not have — an evidence/log bundle input and a prose analysis output.
    The harvest adapter will need `evidence-bundle/v1` and `analysis/v1` (or the
    diagnosis has to be modelled as a degenerate review). Until then this case
    is hand-run only. Related gap: there is no runnable log-diagnosis workflow
    on the platform yet, so this case currently measures a model, not a product.
    Fifth, on honesty of evidence: the real 2026-07-04 web logs were never
    captured, so task/evidence.md is operator field notes reconstructed from
    artifacts that provably existed at T (two commit bodies, the pipeline YAML,
    and log strings that are literal `logger.Error` action names in the
    pre-state tree) rather than a captured log file. Synthesising a plausible
    log dump would have been easy and would have quietly become the answer key —
    the drain path's error text ("build released during drain") is written to
    the web's lager log, so a "realistic" log bundle would have contained the
    answer verbatim. Reconstructed evidence must be labelled as such in notes.md
    and kept to things whose existence can be shown.
