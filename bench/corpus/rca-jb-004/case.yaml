schema: benchmark-case/v1
id: rca-jb-004
title: >-
  `nodes "100.68.228.107" not found` on every resource-cache hit — an
  artifact-daemon pod IP smuggled through a field that means Node name
workflow: log-diagnosis
signature:
  inputs:
    repository: repository/v1
    work-item: work-item/v1
    log-bundle: log-bundle/v1
  outputs:
    diagnosis: diagnosis/v1
    change: repository-change/v1
  # NOTE: log-bundle/v1 and diagnosis/v1 are PROPOSED types — the platform's v3
  # seed has no log-diagnosis function and therefore no such snapshot types yet.
  # Same gap recorded by rca-jb-002; not invented convention.
source:
  system: git-commit
  repo: jetbridge
  terminal: fc36f66737469bf63c8aa85f2e1c7edf5837a06d
  # The terminal artifact is the last commit of a five-commit remediation chain
  # (febae10233, 638c2a8b00, b19a0fb2bc, 04eade3c88, fc36f66737) preceded by
  # three TDD test commits (12b0743df1, 1389a73877, ec489efaa8). Companion
  # artifacts, both AFTER the cut: efc827aec0 (the ArtifactLocator.Record caller
  # audit, transcribed into ground_truth/answer.md) and 8574f59bea (the track
  # spec, scaffolded retrospectively, which states the root cause and names the
  # regressing commit outright).
information_cut: 2026-04-23T07:00:35-07:00
# T is the instant the work began: the timestamp of the first investigation
# commit (12b0743df1), which is the first artifact of the graded work and is
# itself NOT exposed. Everything exposed predates it — the repository at
# 3b00cbb7b8 (2026-04-18T12:40:03-07:00) and the task/evidence, whose
# observations run 19–23 April and whose report is dated 23 April.
# Corrected 2026-07-25: T previously carried the pre_state COMMIT timestamp
# (2026-04-18T12:40:03-07:00), which contradicted the exposed task's own dates.
# Moving T forward exposes no additional repository content: 3b00cbb7b8 is the
# direct parent of 12b0743df1, i.e. the branch head throughout the whole
# 18–23 April window, so the pre_state pin below is unchanged.
pre_state:
  repository:
    repo: jetbridge
    ref: 3b00cbb7b8c0ec0e41b94d7f1215f4e66e9d47dd
    # Direct parent of the first investigation commit (12b0743df1). Nothing from
    # the investigation, the fix chain, or the track directory exists here.
    # MUST NOT be materialized as a plain clone or worktree: the fix chain is a
    # straight-line DESCENDANT reachable from `jetbridge`, `main` and ~20 other
    # branch tips, and every one of its commit messages is an answer key.
    # See notes.md#leakage-analysis.
    #
    # PREFERRED — ancestors only. Fetching by SHA into an empty repo brings the
    # commit and its ancestors and nothing else: no refs, no branches, no
    # descendants. This keeps `git log`/`git log -S` archaeology available,
    # which rubric item A-4 (provenance) depends on. Verified: `git cat-file -e`
    # on the fix chain fails, while `git log -S` correctly returns 864eba169f
    # for the bad write and dc5c936532 for the activating change.
    materialize: |
      git init <dir> && cd <dir>
      git remote add origin <jetbridge repo>
      git fetch --no-tags origin 3b00cbb7b8c0ec0e41b94d7f1215f4e66e9d47dd
      git checkout --detach FETCH_HEAD
    # FALLBACK — no history at all, if the source cannot serve a fetch-by-SHA:
    #   git archive 3b00cbb7b8c0ec0e41b94d7f1215f4e66e9d47dd | tar -x -C <dir>
    # Safe, but it makes commit-level provenance unanswerable; grade A-4 on the
    # content-level description only ("the change that made FindResourceCache
    # return a daemon pod IP") and record which form was used with the result.
  work-item:
    path: task/task.md
  log-bundle:
    paths:
      - task/evidence/build-output.md
      - task/evidence/cluster-observations.md
    # RECONSTRUCTED, not captured. No CI/build log from the incident survives.
    # Every load-bearing string is grounded in an artifact that exists: the
    # error text and the IP 100.68.228.107 are verbatim from the track spec
    # (8574f59bea); `INFO: found existing resource cache` is verbatim from
    # atc/exec/get_step.go:382 at pre_state; the hostPath /var/concourse/artifacts
    # and the probe endpoint HEAD /resource-caches/<key> are from the chart and
    # daemon_client.go at pre_state. Cluster topology (single node `theborg`,
    # pod CIDR) and build numbers are reconstructed. Every claim's sourcing —
    # and the two observations deliberately WITHHELD from the bundle — is
    # itemized in notes.md#the-evidence-bundle.
ground_truth:
  outcome: merged
  answer: ground_truth/answer.md
  reference_change: ground_truth/reference.diff
  # generated_by: git diff 3b00cbb7b8c0ec0e41b94d7f1215f4e66e9d47dd
  #               fc36f66737469bf63c8aa85f2e1c7edf5837a06d
  #               -- atc/worker/jetbridge/{worker,storage,storage_daemonset,
  #                  node_ip_resolver,resource_cache_key}.go
  # 5 files, +63/-9. Test files are split into ground_truth/test.diff and
  # ground_truth/withheld_tests/ so the production change can be shown to a
  # judge without handing over the grading specs.
rubric: judge
grading:
  judge_checklist: ground_truth/rubric.md
  # The diagnosis is the deliverable and is judge-graded. The mechanical
  # transition below is real and was observed by the extractor (notes.md#validation);
  # it corroborates the CHANGE half only. Do not score on it alone: fail_to_pass[0]
  # can be made green by the translation-layer fix the rubric disqualifies (D-2),
  # and fail_to_pass[1] is precisely the spec that catches that shape.
  overlay_protocol: >-
    MANDATORY, and the reason this block is not simply "run the tests":
    task.md item 3 asks the agent to write its own regression test in
    atc/worker/jetbridge, and the natural home for it is worker_test.go — the
    very file the fail_to_pass restore overwrites. Grading therefore runs on a
    COPY: snapshot the agent's finished tree, record the diff it produced
    (`git status`/`git diff` or a file listing of *_test.go in the package),
    and apply the restore only to the copy. Part B-3 is judged from the
    agent's own pre-overlay test, never from the post-overlay tree, and the
    agent may put its regression test in any file in the package.
  caveat: >-
    The withheld specs are the HUMANS' specs and encode the humans' solution
    shape: focus_specs[1] ("writes nothing to the ArtifactLocator") is
    rubric B-1's shape, and the file compiles against pre_state signatures.
    A correct solution is allowed to differ — rubric B-2 lists three accepted
    shapes, and the humans' own change altered an internal signature
    (WrapVolumeForLookup gained a ctx). So: (a) a red or non-compiling overlay
    against a solution that satisfies rubric B-1+B-2 is "overlay incompatible",
    resolved by the judge, NOT scored as a mechanical failure; (b) a green
    overlay is corroboration of the change half only and never overrides a
    wrong diagnosis. Record which of the two happened alongside the result.
  fail_to_pass:
    - cmd: "go test ./atc/worker/jetbridge/ -count=1"
      withheld_test_paths:
        - atc/worker/jetbridge/worker_test.go
      restore: >-
        cp ground_truth/withheld_tests/atc/worker/jetbridge/worker_test.go
        atc/worker/jetbridge/worker_test.go
      focus_specs:
        - "StreamOut on the wrapped artifact succeeds without resolving the daemon IP as a node name"
        - "writes nothing to the ArtifactLocator for the cache key"
      note: >-
        Restoring this ONE file over the agent's tree is enough; it is a pure
        superset of the pre_state file (+134 lines, 0 deletions) and compiles
        against pre_state production code. At pre_state the suite runs 319 specs
        and exactly these 2 fail, the first with the operator's verbatim error
        (`resolve node IP for 127.0.0.1: get node 127.0.0.1: nodes "127.0.0.1"
        not found`). Spec 2 is solution-shape-constraining by design — see the
        grading note above.
  pass_to_pass:
    - cmd: "go test ./atc/worker/jetbridge/ -count=1"
      note: >-
        WITHOUT the withheld file restored. Green at pre_state (317 specs,
        ~18s wall) and green with the reference change. Guards the node-name
        flows the task says must not regress: RecordOutputs, the reaper, and
        affinity scheduling all live in this package.
  do_not_restore:
    - path: atc/worker/jetbridge/node_ip_resolver_test.go
      why: >-
        The post-fix version references `ErrNodeNameIsIP`, which is production
        code added by 04eade3c88. Dropping it onto a tree that lacks the
        sentinel is a COMPILE error, which takes the whole package — including
        fail_to_pass — down with it. It is kept in withheld_tests/ for the judge
        to read, and the guard it pins is scored as bonus, not as a requirement.
  environment:
    postgres_required: false
    cluster_required: false
    notes: >-
      `atc/worker/jetbridge` uses `fake.NewSimpleClientset` and `httptest`
      throughout; no Postgres, no Docker, no cluster, no network. Whole package
      ~18s wall (~4s of specs). The main module must be materialized in full
      (the package imports atc/db, atc/runtime, atc/compression), but nothing
      outside it needs to build.
