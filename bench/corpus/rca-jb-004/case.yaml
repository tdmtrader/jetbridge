validation:
  status: validated
  notes: notes.md#validation
leakage_audit:
  - auditor: opus
    verdict: pass
    notes: "Clean: task/ carries zero code identifiers, the four failure summaries and both quoted log strings resolve to pre_state source, and no in-tree doc names the defect. The case's best property is that the obvious one-line delete is insufficient at this pre_state. Curator actions: retitle case.yaml (its title is a one-line answer key), enforce the fetch-by-SHA detached materialization, and record that the archived behavioral spec is authentic history rather than a plant."
  - auditor: sonnet
    verdict: borderline
    notes: "task/ and a correctly-materialized pre_state do not leak — independently verified that the fetch-by-SHA recipe makes the whole fix chain unreachable while leaving the two legitimate ancestor commits visible. Flags: case.yaml's title states the mechanism ('an artifact-daemon pod IP smuggled through a field that means Node name'), and the same-day forge track route_artifact_reads_through_daemonset_…_20260418 is an unusually convenient dated paper trail for the 'activating change' sub-deliverable."
  - auditor: curator-fixup
    verdict: pass
    notes: "Both title flags dissolved by the exposure contract (case.yaml is harness-side; nothing renamed or retitled). Fixed: the grading overlay clobbered the very test task item 3 asks the agent to write — added grading.overlay_protocol (run the restore on a copy; judge B-3 from the agent's pre-overlay tree) and grading.caveat (the withheld specs encode the humans' shape, so an incompatible overlay is judge-resolved, not a mechanical fail); information_cut moved from the pre_state commit timestamp to the instant the work began (2026-04-23T07:00:35-07:00), since the exposed evidence is dated 19-23 April and the pre_state pin is unchanged; task.md gained the missing deliverable channel (RCA.md at the repo root, matching rca-jb-001) and lost the 'all read the same bookkeeping' clue from its constraints; rubric gained a judge preamble crediting causal reasoning over doc-quotation, plus A-4/B-3 wording to match. Forge track 20260418 KEPT as authentic history. known_leak_channels: [project-auto-memory] declared on the curator's own check - project memory states the read-path wrap and the 04-18 routing date (A-2/A-4) but never the defect (A-1)."
curation:
  quality: 5
  learnings: >-
    A type-confusion-across-a-seam RCA, and the corpus's first case where the
    extractor could actually run the whole pre→post transition by hand. Four
    lessons.
    (1) The cleanest possible cut is a terminal artifact whose investigation
    began at a direct child of a quiet commit. Here `git rev-parse 12b0743df1^`
    landed exactly on the pre_state, five days of wall-clock earlier, with zero
    intervening commits — so there is no "which parent do I take" judgement to
    make and no partial fix chain to withhold. When mining, prefer candidates
    where the FIRST commit of the work (usually a `test(...)` commit in this
    repo's TDD flow) has a parent that predates the whole investigation. The
    mining pass's suggested pre-state (parent of the fix, 04eade3c88) would have
    exposed both reproduction tests and the defence-in-depth guard and reduced
    the case to "delete one line the tests already point at".
    (2) Reconstructing a log bundle is legitimate and is a difficulty dial, but
    only if every turn of the dial is written down. Two real observations were
    withheld: the web pod's info-level lager lines, which name
    `find-daemon-resource-cache` and log
    `probe-resource-cache.cache-found daemon_ip=<the IP>` — that pair is the
    answer, printed. What was KEPT is the operator-level equivalent
    (`kubectl get pods -o wide` showing the IP belongs to the daemon pod), which
    establishes the same fact as an observation while leaving the inference —
    who writes it, into which field, and why that field is read as a node name —
    entirely to the agent. Generalize: when a real bundle contains a line that
    names the buggy function, cut the line and keep the ground-level observation
    it was derived from.
    (3) Verify that the obvious fix is insufficient before you write the rubric.
    Deleting the offending `Record` call — the whole content of the terminal
    commit, and what the commit message reads as — leaves the downstream-read
    spec RED at this pre_state, because the compensating read-side re-probe
    landed one commit earlier in the chain (b19a0fb2bc). A rubric written from
    the terminal commit alone would have scored a correct-but-incomplete answer
    as complete. Cases backed out of a chain must be validated against the chain
    ROOT, not the tip.
    (4) A case is much stronger when a plausible wrong fix exists AND a withheld
    spec discriminates it. Here the tempting move is a translation layer
    ("if sourceNode parses as an IP, use it as sourceIP") which turns the
    headline spec green while preserving the type confusion; the humans' second
    spec ("writes nothing to the ArtifactLocator") is red for it. That pairing —
    one spec that measures the symptom, one that measures the resolution — is
    what lets a mechanical signal and a judge disagree productively instead of
    the mechanical signal simply overruling the judge.
    (5) Added by the 2026-07-25 fixup pass, and the most transferable of the
    five: when a task asks the agent to WRITE a test, the withheld grading
    test will land on the same file. This case restored
    `worker_test.go` over the agent's tree — deleting the artifact that rubric
    item B-3 grades before it could be read. Any case whose task item says
    "with a regression test" needs an overlay protocol (grade on a copy;
    score the agent's test from the pre-overlay tree) and needs to say what
    happens when the humans' spec will not compile against a
    differently-shaped-but-correct solution. Corollary for the whole corpus:
    a mechanical leg built from the humans' specs measures the humans' shape,
    so it corroborates a judge, never outranks one.
    Platform gaps surfaced: same as rca-jb-002 — no log-diagnosis workflow in
    the v3 seed, so no `log-bundle/v1` / `diagnosis/v1` to bind to, and no
    archived build logs anywhere, which is why this bundle had to be rebuilt
    from a retrospective spec plus the pre_state source. Additionally: the
    repo's forge tracks were scaffolded AFTER this fix landed, so unlike
    rca-jb-002 there is no pre-answer diagnostic record to expose. A workflow
    that persisted its investigation notes as it went would have produced a
    strictly better case for free — twice now.
