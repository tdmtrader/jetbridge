  - auditor: curator-fixup
    verdict: pass
    notes: "Dissolved sonnet's FAIL and opus's curator-side items by the exposure contract (case.yaml/grading/withheld filenames are never exposed — no renames). Fixed: softened the task.md 'empty read_stage' bullet to drop the mechanism restatement (kept the symptom; the mechanism stays derivable from in-tree cgx); moved the wire-form flexibility into rubric.md (ReleaseChannels `At Out#` and unspecified ceiling N now first-class alternatives, split reporting mandated) and recorded the caveat in grading; added overlay-collision and pass_to_pass-ordering rules; told the judge to credit causal reasoning over doc-quotation. withheld stays [] (in-tree track docs point at the buggy design, not the fix); no operator-memory leak found for this case."
curation:
  quality: 5
  learnings: >-
    A bug that only exists against real hardware backs out into an unusually clean
    case: the pre-state test suite is fully green, so the agent gets no free signal
    from the repo, and the whole difficulty sits in reasoning from an operator
    symptom to "this code path must not depend on a read". The trigger had to be
    reconstructed from a cgx note written one commit AFTER the fix (8d464dd) —
    worth knowing that in forge-style repos the honest symptom text usually lives
    in the post-hoc track log, and must be split from the root-cause text that sits
    beside it in the same paragraph. The mechanical test is prescriptive about the
    wire form ("Chan 1 Thru N At 0#"), so a correct-but-different fix (per-channel
    sweep, a Sneak/fade) fails it; pairing mechanical with the judge rubric is the
    mitigation, and cases like this argue for the schema allowing a rubric list
    rather than one value. Sharpened at fixup: the strongest counter-example is not
    hypothetical — the repo already ships ReleaseChannels ("Chan <spec> At Out#"), so
    the most idiomatic read-free fix available to the agent fails the oracle on a
    suffix. Rule of thumb this case yields: when the trigger deliberately leaves a
    form open, the mechanical oracle is one accepted witness, not the definition of
    correct; the accepted-alternatives list belongs in rubric.md with split (never
    averaged) reporting. Second fixup lesson: both v0 auditors spent most of their
    verdict on case.yaml, test names and withheld filenames — text the exposure
    contract dissolves — so auditors must be given the exposure boundary up front or
    they burn budget on harness-side strings and under-audit task/. Platform note:
    this case needs no database and no
    network, which makes it a good smoke case for a hermetic non-jetbridge runner.
