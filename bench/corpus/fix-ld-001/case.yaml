grading:
  # Setup: materialize pre_state, then copy the withheld test file into
  # internal/eos/ BEFORE running fail_to_pass. The withheld test is delivered as a
  # standalone file (package eos_test) rather than as a patch to the existing
  # internal/eos/look_test.go, so it can be dropped in without conflicting with
  # whatever the agent writes. Do NOT also apply it on top of the terminal SHA —
  # that commit already contains the same function inside look_test.go.
  #
  # Collision rule: the task asks the agent to write its own failing test, so the
  # overlay can in principle clash with it (same function name, or the same file
  # path). If injecting the overlay produces a redeclaration/compile error, rename
  # the INJECTED copy (file and function) and re-run. That is a harness collision,
  # never a fail_to_pass failure, and the agent's own test must never be deleted or
  # overwritten to make room for the overlay.
  #
  # Overlay ordering: pass_to_pass is evaluated on the tree WITHOUT the overlay
  # copied in. With it present, `go test ./internal/eos/` and `go test -race ./...`
  # fail at pre_state by construction (the overlay IS the fail_to_pass test), which
  # would read as a spurious regression. Run the guards before injecting, or inject
  # into a separate copy of the tree.
  #
  # CAVEAT — the mechanical oracle is prescriptive about a form the task leaves open.
  # fail_to_pass asserts the literal `Chan 1 Thru <N> At 0#` ordered before the target
  # set. task.md asks only for a fix; it names no wire form and no ceiling, and the
  # repo already ships an equally read-free primitive (ReleaseChannels ->
  # `Chan <spec> At Out#`, internal/eos/levels.go). A read-free clear written that way
  # is CORRECT and fails this test. Grade such runs with ground_truth/rubric.md
  # ("Accepted alternatives to the reference wire form") and report the mechanical and
  # rubric results separately — never average them, never record a rubric-passing run
  # as a plain fail.
  fail_to_pass:
    - cmd: "go test ./internal/eos/ -run '^TestSetLookBlackoutIsReadFree$' -count=1"
      withheld_tests:
        - source: ground_truth/withheld_tests/look_readfree_blackout_test.go
          destination: internal/eos/look_readfree_blackout_test.go
  pass_to_pass:
    - {cmd: "go test ./internal/eos/ -count=1"}
    - {cmd: "go test ./internal/mcp/ ./internal/osctest/ -count=1"}
    - {cmd: "go test -race ./..."}   # project's `make test`; hermetic, ~12s, no services
