    notes: "Solver channel is clean — no post-cut vocabulary, and the in-tree pre_state docs point AWAY from the fix (cgx.md endorses the ActiveChannels read that IS the bug). Mild hint: the 'other observations' block pairs the empty-stage flakiness with its mechanism, most of the analytic leap. Real risks are curator-side: fail_to_pass names TestSetLookBlackoutIsReadFree, the withheld filename is look_readfree_blackout_test.go, and learnings quote the exact wire form; grading may pin a form the task leaves open (At 0# vs the in-repo ReleaseChannels 'At Out#' precedent, and N unspecified)."
