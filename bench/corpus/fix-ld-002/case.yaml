    # trailing fragment. Passes at pre_state AND with the reference change.
    - cmd: "go test ./internal/eos/ -run '^TestActiveChannelsMidSelectionGarbageStillErrors$' -count=1"
      withheld_test_paths: [ground_truth/withheld_tests/stage_truncated_selection_test.go]
    - {cmd: "go test ./internal/eos/ ./internal/mcp/ -count=1"}
    - {cmd: "go test -race ./... -count=1"}   # project's `make test`; hermetic, ~15s, no services
