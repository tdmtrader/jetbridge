grading:
  # Setup: materialize pre_state, then copy the withheld test file into
  # internal/eos/ BEFORE running fail_to_pass. The withheld test is a purpose-written
  # black-box test (package eos_test) that drives the field-captured truncated string
  # through the mock transport and asserts on the EXPORTED seam, eos.Client.ActiveChannels.
  # It is deliberately NOT the humans' own test: theirs calls the unexported
  # parseChannelList with the reference's new 3-value signature, so it fails to COMPILE
  # at pre_state and forces one specific internal API shape. Never grade with it.
  #
  # Reproducing the reference state (validation only, NOT part of grading): apply BOTH
  # ground_truth/reference.diff AND ground_truth/withheld_tests/human_stage_internal_test.diff.
  # reference.diff alone does not compile at pre_state — it changes parseChannelList's
  # arity, and the pre-existing internal/eos/stage_internal_test.go calls it with the old
  # two-value signature. Do not apply either diff on top of the terminal SHA; that commit
  # already contains both.
  #
  # Overlay-collision rule (the task ASKS the agent to write its own truncation test, so
  # the graded overlay can collide with the solver's work):
  #   - copy the withheld file in under a bench-reserved basename,
  #     internal/eos/bench_stage_truncated_selection_test.go, never over a path the solver
  #     may have authored (e.g. stage_truncated_selection_test.go). Package stays eos_test.
  #   - the two graded function names (TestActiveChannelsSalvagesTruncatedSelection,
  #     TestActiveChannelsMidSelectionGarbageStillErrors) are RESERVED by this case. If the
  #     solver's tree happens to declare either, rename the solver's declaration (and record
  #     that you did) rather than dropping the overlay — a name clash is a harness event,
  #     not a solver failure, and dropping the overlay would grade a spurious pass.
  #   - helper names in the overlay (truncatedActiveChan, startSelectionResponder,
  #     connectedFakeClient) are reserved on the same terms.
  #
  # Ordering: the `go test -race ./... -count=1` pass_to_pass guard is meaningful on the
  # tree AS MATERIALIZED. Run the pre_state leg WITHOUT the overlay (with it, pre_state
  # fails by construction — fail_to_pass lives in internal/eos); run the post/solver leg
  # with the overlay present.
  #
  # Mechanical caveat (flexibility lives in ground_truth/rubric.md): fail_to_pass asserts
  # exactly 38 salvaged channels and partial=true on the exported seam. A correct-in-intent
  # but conservative fix that also drops the last COMPLETE group (32 channels) fails
  # mechanically; rubric.md §"Mechanical caveat" tells the judge to score that as a
  # near-miss on salvage scope, not as a missed root cause. The diagnostic half of this case
  # (why the missing bytes are unrecoverable) is judged from ground_truth/rubric.md; the
  # mechanical verdict alone does not cover it.
  fail_to_pass:
    - cmd: "go test ./internal/eos/ -run '^TestActiveChannelsSalvagesTruncatedSelection$' -count=1"
      withheld_test_paths: [ground_truth/withheld_tests/stage_truncated_selection_test.go]
  pass_to_pass:
