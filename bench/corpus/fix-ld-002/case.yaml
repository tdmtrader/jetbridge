curation:
  quality: 4
  learnings: >-
    The lesson of this case is that the mechanical anchor should sit on the widest
    exported seam that still discriminates. The humans' own tests exercised the
    unexported parseChannelList and, in the same commit, changed its arity — so shipping
    them as the grading artifact would have made "fail at pre_state" a compile error and
    silently required one specific internal signature. Re-anchoring on
    eos.Client.ActiveChannels (unchanged signature, black-box via the existing mock
    transport) buys a real behavioral fail-to-pass and leaves the agent free to put the
    truncation flag wherever it likes. Rule of thumb: if the reference commit changes a
    signature the withheld test touches, move the test outward until it stops seeing the
    change. A corollary the extraction turned up the hard way: a production-only
    reference.diff is not necessarily a compiling state. Because the fix changes an
    unexported signature, applying reference.diff alone to pre_state breaks the
    pre-existing internal test's build — so the convention "reference.diff = production
    change, tests split out" needs a companion rule: keep the humans' test diff and state
    that reproducing the reference requires both. Second lesson, about triggers: the
    honest field report ("read_stage is
    throwing a parse error on busy looks") sat in an UNTRACKED session-notes file, so it
    was never in the exposure manifest — but the same sentence named the root cause in
    its parenthetical, which had to be cut. Operator symptom in, diagnosis out. Third:
    including the pasted error string is unavoidable (without hardware it is the only
    reproducible evidence) and it does hand over part of the diagnosis — the residual
    difficulty is the inference that the missing bytes do not exist anywhere on our side,
    which mechanical grading cannot see. That half is graded by rubric.md, which is why
    this case wants mechanical AND judge; the schema's single-valued `rubric` field is
    the second case in a row to want a list. Two more from the 2026-07-25 fixup. (a)
    A trigger reconstructed from a real report inherits that report's date, and when the
    subject repo was idle between the snapshot and the report, that date silently
    contradicts information_cut. The cut is the pre_state commit instant; re-stamp the
    exposed trigger to the cut and keep the true report date in the provenance walk —
    changing the manifest to chase the trigger would mis-state what the pins mean.
    (b) When the task asks the agent to write a test AND grading copies a withheld test
    into the same package, the overlay can clobber or collide with the solver's own work.
    Every such case needs an explicit collision rule: a bench-reserved destination
    basename, reserved test/helper identifiers, and "rename the solver's declaration,
    never drop the overlay" — silently dropping it grades a spurious pass.
