curation:
  quality: 4
  learnings: >-
    Deliberate trivial calibration case — built as a low-difficulty anchor, not
    as a discriminating test. It must NEVER be cited as capability evidence, on
    its own or as part of an aggregate score: the task discloses both graded
    error strings and names the validation layer, so it measures execution, not
    problem-solving. Its only legitimate use is as a floor/smoke signal — a run
    that fails it indicates a harness or environment problem, and a run that
    passes it has proved only that the harness works. Report it separately from
    scored cases. Four transferable lessons. (1) Exact-string fail-to-pass is the
    trivial case's hidden hazard: the withheld spec asserts the reference's
    literal error text, so a semantically correct fix with different wording
    fails mechanically. The task therefore states the expected message shape
    ("e.g. `run_retention.keep_last must not be negative`") — legitimate for this
    repo, whose contracts docs pin exact user-visible strings — and rubric.md
    exists so a judge can catch mechanical-vs-intent disagreement. (2) A focused
    Ginkgo run vacuously PASSES when the withheld spec is absent, which would
    silently invert fail-at-pre; `-ginkgo.fail-on-empty` closes that hole and
    should be standard for every focused-spec grading command in this corpus.
    (3) The historical trigger was a code-review comment on the pipeline-runs
    wave, not a bug report; reframing it symptom-first as a work item is what
    makes it a small-fix case at all. That reframing had to add one constraint
    the real trigger never needed ("fix at validation time, not in the archival
    query") because the symptom alone admits a clamp-in-SQL solution that the
    mechanical grader would reject — a reminder that reframing a review finding
    into a work item can require inventing scope constraints, and those must be
    declared (see notes.md) rather than smuggled in. (4) Grading overlays must
    be ADDITIVE whenever the task asks the agent to write a test. The original
    grading recipe restored the terminal commit's whole `validate_test.go`,
    which would have silently deleted the spec task.md demands and rubric must-8
    scores — and, worse, an un-namespaced `-ginkgo.focus` could then have graded
    the agent's own spec instead of the withheld oracle. Ship the oracle as a
    self-contained new file with a namespaced spec name; keep reference.diff as
    the historical record only.
