    verdict: pass
    notes: "Opus's two open items closed with evidence: repo-README.md / verification.md mtimes (2026-06-25T14:04:03 and 14:05:14 -0700, unwritten since) prove the send_command-less tool surface is a pre-T uncommitted edit, not post-cut state sealed in; AGENTS.md and .agents/ are post-cut (2026-07-20) and augment3d/ is pre-T but derivative of the already-withheld channel-hookup.csv — all three added to withheld. Real defect fixed: task.md's 'several of them repeat the same warning / each one stands alone' telegraphed the §C hoisting move and was softened without weakening the trigger. Grading defect fixed: show-map-README.md does plant the update_cue reversal, so §D3 no longer reads a reversal as evidence of copying (caps at 2/5, no extra deduction). Dissolved by the exposure contract: case.yaml's curation naming the synthesis moves and the reference defect is harness-side and never exposed. Difficulty hard→moderate per the sonnet auditor and the case's own verification finding. DECLARED known_leak_channels: [project-auto-memory] — the LightingDesign project memory states C1, R2, R3, R4 and the D3 bonus answer verbatim."
curation:
  quality: 4
  learnings: >-
    This is the corpus's first triage case and its second non-code one, and the useful
    thing it proves is that the triage signature — ambiguous work items in, an ordered
    executable plan out — is exercisable with a real human reference and a mechanically
    checkable core. The workflow does not exist on the platform yet, so the case is also a
    specification of what it would have to produce.

    The curation lesson is a correction, and it is the one worth carrying forward. The
    mining pass described the input as "raw operator deltas" and the case as
    "resolve symbolic references to concrete identifiers". It is not. cue-notes-20260626.md
    is itself a worked-up capture — it already decodes white booms 3/4 to ch 64+67, already
    resolves "spots" to the Lone Stars, already marks 14.2 blocked, and its body is already
    in ascending show order. Verification killed roughly half the claimed difficulty. What
    survives is a different and narrower skill: hoisting scattered per-item warnings into
    standing rules, collapsing three repeated "confirm the sign" notes into one calibration
    step, completing a nine-row table from a rule stated with two examples, grounding every
    step in a real tool surface, and applying a scope exclusion the input argues against.
    That is still worth measuring — but only because expected_items.yaml tags every
    expectation carried | synth | given, so the judge cannot award discovery credit for
    preservation. **Every derived case should carry that tagging.** Without it the reported
    score is dominated by copying, and the case silently stops measuring anything.

    A structural find worth reusing: the sharpest discriminator here was created by the
    scope exclusion, not by the content. The live-show-safety rule appears in the notes
    exactly once, inside the End-of-Song-8 section — the section task.md tells the agent to
    delete. An agent that drops Song 8 mechanically loses the rule unless it also reads
    verification.md. That kind of interaction between a constraint and the input's
    structure is worth looking for deliberately when deriving a task, and it costs nothing.

    Third: the human reference is wrong about something checkable — it describes update_cue
    and record_cue with their semantics reversed — so the rubric has to award points for
    disagreeing with the oracle. That is the second case in a row (see review-ld-001's
    also_true set) where bounding the oracle's error was necessary to avoid penalising a
    better-than-human answer. Treat "where is the reference wrong?" as a required step in
    deriving ground truth, not an optional one.

    Platform notes. No runtime, no services, six text files, ~55 KB — runs anywhere and is a
    good hermetic non-Go smoke case. Its output port is `execution-plan/v1`, a type that
    does not exist; combined with review-ld-001's `review-findings/v1`, two of the corpus's
    first three non-code cases produce documents rather than repository changes, which the
    harvest adapter will have to represent. And like fix-ld-001 and review-ld-001 it wants
    two rubrics at once: judge for the plan as a whole, plus a mechanical assertion
    (derive_channel_table.py --check) for the channel table. Third case in a row arguing
    benchmark-case/v1's single-valued `rubric` field should become a list.

    Curator-fixup addendum, 2026-07-25. Two lessons the audit produced, both generalisable.

    First: **the operator's own environment is part of the exposure surface.** This case's
    subject repo has a project auto-memory directory whose files hand over the case's
    single highest-weighted rubric item (`live-console-safety-guardrails.md` IS rule R6 /
    §C1) and the answer to the "beat the oracle" bonus (`eos-cue-editing-method.md` states
    the correct update_cue/record_cue semantics, the +30% bump and the bounce-verify
    workflow). Nothing in the case leaks; the machine does. `known_leak_channels:
    [project-auto-memory]` is declared and a hand-run here is invalid unless memory is
    suppressed. Generalise the check: for every case, ask what the *dev machine* knows,
    not only what the case directory contains.

    Second: **check whether an exposed file independently plants the oracle's error before
    scoring "beats the oracle".** Here it does — `show-map-README.md`'s execution recipe
    stores a full target look with `update_cue`, the reference's exact reversal. The bonus
    survives, but the deduction had to be capped and the "reproducing the reversal implies
    copying" inference had to be withdrawn. A bonus for disagreeing with the reference is
    only sound once you know every path in the pre-state that leads to the reference's
    reading.

    Difficulty was recalibrated `hard` → `moderate` here rather than in a later pass. The
    mechanical proxies (~420 lines in, 19 tasks out, nine applications of an inverted
    index) measure volume, and this file already concedes that verification killed about
    half the claimed difficulty: the resolutions, the ordering, the disambiguation and the
    blocked-item detection are all carried. What is left is competent long-context
    transformation plus a small number of traps, one of which (§C1) is genuinely sharp but
    unvalidated. `moderate` is the defensible label until an end-to-end run shows models
    failing the Song-8 exclusion or losing the safety rule; the honest `hard` variant is
    triage-ld-002 (expose only the 22 verbatim quotes — see notes.md#open-questions).
