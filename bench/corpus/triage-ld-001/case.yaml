    verdict: pass
    notes: "task/ is clean and self-consistent: every date is at or before the cut, the two hyperlinked withheld docs are explicitly flagged as unresolvable-and-flag-them, and the tracked tree at the ref concerns only the MCP software, not the show. Difficulty is narrower than 'hard' because the notes are already resolved, but that is honest source material; noting that case.yaml's curation names the synthesis moves and the reference's update_cue/record_cue error, and that show-map-README's update_cue advice may plant that same error."
