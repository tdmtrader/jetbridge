schema_version: 1
name: code-review
description: Review one repository change and produce an anchored review/v1 record
# repository is now the real repository/v1: the deployed web image carries git,
# so the validator's `git` execs succeed and the type seals. That closes the
# first of the two gaps recorded in FIRST-USER-FINDINGS.md (F3, F7) and gives
# the reviewer a navigable history instead of an opaque directory.
#
# change SHOULD be repository-change/v1 and still cannot be: that type's seal
# gate binds a base repository as a declared input, and `fly agent snapshots
# create` has no way to declare one. A standalone reviewed diff therefore has
# no honest typed home, and travels as opaque/v1.
inputs:
  - {name: repository, type: repository/v1}
  - {name: change, type: opaque/v1}
  - {name: work-item, type: work-item/v1}
outputs:
  - {name: review, type: review/v1}
parameters:
  - {name: MINIMUM_SEVERITY, default: low}
step:
  agent: review
  prompt_file: prompts/review.md
  # "claude-sonnet" (the guide example) is not a real model ID — the API answers
  # 404 not_found_error. The CLI alias "sonnet" resolves per CLI version.
  model: sonnet
  max_turns: 80
  # Restored once the agent-runner CLI pin moved to a version implementing
  # --max-budget-usd (F12/F12b). A review of a large tree is the shape most
  # likely to run away, so it gets a real cap.
  budget_slice_usd: 5.0
