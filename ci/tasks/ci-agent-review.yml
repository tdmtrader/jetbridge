---
platform: linux

rootfs_uri: docker:///golang:1.25-bookworm

inputs:
- name: repo
- name: review-config
  optional: true

outputs:
- name: review

params:
  AGENT_CLI: claude
  AGENT_MODEL: ""
  REVIEW_CONFIG: ""
  SCORE_THRESHOLD: "7.0"
  FAIL_ON_CRITICAL: "false"
  REVIEW_DIFF_ONLY: "false"
  BASE_REF: "main"
  AGENT_REVIEW_PRINCIPAL_TOKEN: ""
  AGENT_COST_PRINCIPAL_TOKEN: ""
  AGENT_COST_USER: ""

run:
  path: sh
  args:
  - -exc
  - |
    echo "=== CI Agent Review ==="

    # Build the unified ci-agent binary from source.
    cd repo/ci-agent
    go build -o /usr/local/bin/ci-agent ./cmd/ci-agent/
    cd ../..

    # Set up paths.
    export REPO_DIR="$(pwd)/repo"
    export OUTPUT_DIR="$(pwd)/review"

    # Use review config if provided.
    if [ -f review-config/review.yml ]; then
      export REVIEW_CONFIG="$(pwd)/review-config/review.yml"
    fi

    echo "Repo: $REPO_DIR"
    echo "Output: $OUTPUT_DIR"
    echo "Threshold: $SCORE_THRESHOLD"
    echo "Fail on critical: $FAIL_ON_CRITICAL"
    echo ""

    ci-agent --phase "$(pwd)/repo/ci-agent/phases/review.yaml"

    echo "=== Review complete ==="
    echo "Review output:"
    cat "$OUTPUT_DIR/review.json" | head -50

    set +x
    if [ -z "${AGENT_REVIEW_PRINCIPAL_TOKEN:-}" ]; then
      echo "AGENT_REVIEW_PRINCIPAL_TOKEN is not set"
      exit 1
    fi
    has_cost_principal=false
    [ -n "${AGENT_COST_PRINCIPAL_TOKEN:-}" ] && has_cost_principal=true
    set -x

    set -- --review "$OUTPUT_DIR/review.json"
    if [ "$has_cost_principal" = true ]; then
      set -- "$@" --costs "$OUTPUT_DIR/costs.json"
    else
      echo "AGENT_COST_PRINCIPAL_TOKEN not set; skipping cost publish"
    fi

    echo ""
    echo "=== Publishing review to ATC ==="
    if ci-agent publish "$@"; then
      echo "Published for build ${BUILD_ID:-unknown}"
    else
      echo "WARNING: failed to publish review to ATC (results still available as artifact)"
    fi
