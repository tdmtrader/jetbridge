# The privilege spec's one-off task (fly execute -p, runtime_switch_test.go).
# atc/configvalidate/k8s_behavioral_configs_test.go validates this file.
# The marker is built by the shell: fly prints the command line before it
# runs, so a literal marker would show up although the command never ran.
platform: linux
image_resource: {type: registry-image, source: {repository: busybox}}
run:
  path: sh
  args: ["-c", "echo privileged-one-off-$(echo ran)"]
