schema_version: 3
name: version-upgrade
signature_version: 1
disposition_output: change
description: Upgrade a declared component, validate it, and return an approved durable change.
inputs:
  - name: repository
    type: repository/v1
    description: Clean immutable base repository.
  - name: request
    type: upgrade-request/v1
    description: Exact component and target version request.
outputs:
  - name: change
    type: repository-change/v1
    from: approved-change
    description: Tested repository change relative to the repository input.
  - name: report
    type: upgrade-report/v1
    from: report
    description: Structured upgrade summary and version transition.
plan:
  - agent: upgrade
    budget_slice_usd: 10
    max_turns: 200
    function_id: upgrade
    prompt_file: prompts/upgrade.md
    inputs: [repository, request]
    outputs: [candidate-change, report]
    input_types:
      repository: {type: repository/v1}
      request: {type: upgrade-request/v1}
    output_types:
      candidate-change: repository-change/v1
      report: upgrade-report/v1
  - agent: review
    budget_slice_usd: 3
    max_turns: 60
    function_id: review
    prompt: >-
      Review candidate-change against the immutable repository and exact upgrade
      request. Inspect breaking API and migration risks and fix only defects
      required for this upgrade. Write repository-change/v1 to
      $AGENT_OUTPUT_REVIEWED_CHANGE/record.json with repository as its exact base
      subject and its payload beneath content/. Copy all platform authority
      values exactly. Do not contact any live system.
    inputs: [repository, request, candidate-change, report]
    outputs: [reviewed-change]
    input_types:
      repository: {type: repository/v1}
      request: {type: upgrade-request/v1}
      candidate-change: {type: repository-change/v1}
      report: {type: upgrade-report/v1}
    output_types:
      reviewed-change: repository-change/v1
  - agent: validate-and-ask
    budget_slice_usd: 2
    max_turns: 40
    function_id: validate-and-ask
    prompt: >-
      Validate the exact sealed reviewed-change, run the relevant focused and
      broader tests, and write validation/v1 to
      $AGENT_OUTPUT_VALIDATION/record.json. The subjects array is sorted
      lexicographically by id, never by role, so declare them in exactly this
      order: report with role context, repository with role context, request
      with role context, then reviewed-change with role primary. Sort the checks
      array lexicographically by check id as well; unsorted or duplicate ids are
      rejected when the output is sealed. Preserve all retry
      attempts and platform authority values. Write a question/v1 value beneath
      $AGENT_OUTPUT_APPROVAL_QUESTION asking whether this exact sealed change may
      be opened as a pull request. Do not contact any live system.
    inputs: [repository, request, report, reviewed-change]
    outputs: [validation, approval-question]
    input_types:
      repository: {type: repository/v1}
      request: {type: upgrade-request/v1}
      report: {type: upgrade-report/v1}
      reviewed-change: {type: repository-change/v1}
    output_types:
      validation: validation/v1
      approval-question: question/v1
  - await_snapshot: approval
    question: approval-question
    type: human-answer/v1
    on_timeout: fail
    timeout: 72h
  - agent: enforce-approval
    budget_slice_usd: 1
    max_turns: 20
    function_id: enforce-approval
    prompt: >-
      Read the sealed human-answer/v1 input. Only when it explicitly approves
      release of this exact upgrade for external delivery, copy reviewed-change into a fresh
      repository-change/v1 value at $AGENT_OUTPUT_APPROVED_CHANGE. Preserve its
      base and content exactly. If it rejects or changes the request, submit no
      output so Jetbridge fails closed. Do not contact a live system.
    inputs: [repository, reviewed-change, approval]
    outputs: [approved-change]
    input_types:
      repository: {type: repository/v1}
      reviewed-change: {type: repository-change/v1}
      approval: {type: human-answer/v1}
    output_types:
      approved-change: repository-change/v1
