schema_version: 1
name: code-review
description: Review one immutable repository state relative to another.
inputs:
  - name: before
    type: repository/v1
    description: Repository state used as the comparison base.
  - name: after
    type: repository/v1
    description: Repository state to review.
outputs:
  - name: review
    type: review/v1
    description: Structured findings and an overall disposition.
parameters:
  - name: MINIMUM_SEVERITY
    default: medium
capabilities:
  dev-mcp:
    contract: dev-mcp/v1
    sidecar:
      name: dev-mcp
      image: registry.example/dev-mcp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      command: [/usr/local/bin/dev-mcp]
      ports:
        - {containerPort: 8080, protocol: TCP}
step:
  agent: review
  function_id: review
  # budget_slice_usd is a valid per-run cap, but the agent-runner image's
  # currently pinned Claude CLI (deploy/agent-runner/Dockerfile) does not
  # implement --max-budget-usd at all, so this step fails outright against
  # that pin ("error: unknown option '--max-budget-usd'") until the pin
  # moves. See FIRST-USER-FINDINGS.md (F12, F12b).
  budget_slice_usd: 5
  prompt_file: prompts/review.md
  # "claude-sonnet" is not a real model identifier (the API answers 404);
  # use one of the runtime CLI's aliases instead. See FIRST-USER-FINDINGS.md
  # (F17).
  model: sonnet
  skills: [review]
  capabilities: [dev-mcp]
