schema_version: 3
name: small-fix
signature_version: 1
disposition_output: change
description: Implement, test, review, and prepare an approved bounded change.
inputs:
  - name: repository
    type: repository/v1
    description: Clean immutable base repository.
  - name: work-item
    type: work-item/v1
    description: Captured request to implement.
outputs:
  - name: change
    type: repository-change/v1
    from: approved-change
    description: Validated change relative to the repository input.
  - name: report
    type: opaque/v1
    from: report
    description: Human-readable implementation, test, and review notes.
plan:
  - agent: implement-and-test
    budget_slice_usd: 10
    max_turns: 200
    function_id: implement-and-test
    prompt_file: prompts/implement.md
    inputs: [repository, work-item]
    outputs: [candidate-change]
    input_types:
      repository: {type: repository/v1}
      work-item: {type: work-item/v1}
    output_types:
      candidate-change: repository-change/v1
  - agent: validate
    budget_slice_usd: 2
    max_turns: 40
    function_id: validate
    prompt: >-
      Validate the exact sealed candidate-change against repository and the
      captured work-item. Re-run the relevant checks without modifying any
      input. Write validation/v1 to $AGENT_OUTPUT_VALIDATION/record.json. The
      subjects array is sorted lexicographically by id, never by role, so
      declare candidate-change with role primary, then repository with role
      context, then work-item with role context. Sort the checks array
      lexicographically by check id as well; unsorted or duplicate ids are
      rejected when the output is sealed. Preserve every retry attempt and copy
      all platform-provided type, digest, and schema values exactly.
    inputs: [repository, work-item, candidate-change]
    outputs: [validation]
    input_types:
      repository: {type: repository/v1}
      work-item: {type: work-item/v1}
      candidate-change: {type: repository-change/v1}
    output_types:
      validation: validation/v1
  - agent: review
    budget_slice_usd: 3
    max_turns: 60
    function_id: review
    prompt: >-
      Review candidate-change against repository and validation. Re-run or inspect
      the relevant tests, fix only defects required by the captured work item, and
      write the accepted repository-change/v1 to $AGENT_OUTPUT_FINAL_CHANGE. Write
      a concise report.md with implementation, tests, risks, and review disposition
      to $AGENT_OUTPUT_REPORT. Write a strict question/v1 value beneath
      $AGENT_OUTPUT_APPROVAL_QUESTION asking whether this exact sealed change may
      be opened as a pull request. Do not push, merge, comment, or contact live systems.
    inputs: [repository, work-item, candidate-change, validation]
    outputs: [final-change, report, approval-question]
    input_types:
      repository: {type: repository/v1}
      work-item: {type: work-item/v1}
      candidate-change: {type: repository-change/v1}
      validation: {type: validation/v1}
    output_types:
      final-change: repository-change/v1
      report: opaque/v1
      approval-question: question/v1
  - await_snapshot: approval
    question: approval-question
    type: human-answer/v1
    on_timeout: fail
    timeout: 72h
  - agent: enforce-approval
    budget_slice_usd: 1
    max_turns: 20
    function_id: enforce-approval
    prompt: >-
      Read the sealed human-answer/v1 input. Only when it explicitly approves
      release of this exact change for external delivery, copy final-change into a fresh
      repository-change/v1 value at $AGENT_OUTPUT_APPROVED_CHANGE. Preserve its
      base and content exactly. If it rejects or changes the request, submit no
      output so Jetbridge fails closed. Do not contact a live system.
    inputs: [repository, final-change, approval]
    outputs: [approved-change]
    input_types:
      repository: {type: repository/v1}
      final-change: {type: repository-change/v1}
      approval: {type: human-answer/v1}
    output_types:
      approved-change: repository-change/v1
